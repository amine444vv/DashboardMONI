    { id: 39, date: '2026-08-13', category: 'Politics & Governance', country: 'Senegal', tier: 'confirmed', platformIntegrity: false,
      headline: "Faye validates government amendment extending asset-declaration rules to the PM and Assembly president, exposing a Pastef rift",
      summary: "In the parliamentary committee reviewing the Article 37 constitutional amendment on presidential asset declarations, Justice Minister Moussa Sarr introduced a government amendment extending the same declare-on-entry-and-exit, publish-via-Constitutional-Council regime to the Prime Minister and the National Assembly president; President Faye has since validated it. The move split the Pastef-led majority before passing committee: MP Guy Marius Sagna called it a possible 'piège' aimed at Sonko and PM-adjacent figures, and bill author Amadou Ba voiced reservations, before Me Abdoulaye Tall argued the majority should accept it to demonstrate openness; the opposition abstained rather than back either side, and opposition MP Abdou Mbow accused Pastef and Kiiraay of using state institutions for score-settling. The amendment now awaits a plenary vote.",
      whyItMatters: "The fight over who must disclose secret/political funds (ids 30, 33, 34, 38) has moved from rhetoric into a concrete legislative mechanism that would bind Sonko's own office alongside Faye's — a sign the institutional rupture is being resolved through binding transparency rules rather than one side simply prevailing, which the Client should track for how it reshapes regulatory-continuity risk around ARTP leadership and digital-taxation decisions.",
      source: 'Dakaractu', url: 'https://www.dakaractu.com/Declaration-de-patrimoine-Article-37-Diomaye-Faye-fait-elargir-la-mesure-au-Premier-ministre-et-au-president-de-l_a274932.html' },
    { id: 40, date: '2026-08-11', reportedDate: '2026-08-13', category: 'Conflict & Security', country: 'DR Congo', tier: 'confirmed', platformIntegrity: false,
      headline: "FARDC repels expanded RDF-AFC/M23 attacks into Kabare territory as Kalehe fighting continues; woman and two children killed",
      summary: "FARDC military spokesman Major Dieudonné Kasereka said the army repelled simultaneous RDF-AFC/M23 attacks on 11 August in Kabulungu/Mbayo (Bugorhe grouping, Kabare territory) and in Katale and Mpanama (Kalehe territory), Sud-Kivu, marking an expansion of the fighting reported on 11 August (id 37) into a new territory. He said the coalition used heavy artillery against both FARDC positions and civilian villages, killing a woman and her two children, and that fresh clashes continued into 12-13 August in Katoyi, Katale and Mpanama before a precarious calm took hold Wednesday afternoon.",
      whyItMatters: "An official military source now corroborates and expands the picture first flagged in id 37, with the fighting spreading to a second territory and producing confirmed civilian deaths — reinforcing the near-term Platform Integrity and Network Disruption watch level in DR Congo the program flagged when this conflict re-escalated.",
      source: 'MediaCongo (Radio Okapi)', url: 'https://www.mediacongo.net/article-actualite-166443_sud_kivu_l_armee_nationale_repousse_des_attaques_de_la_coalition_rdf_afc_m23_contre_leurs_positions.html' },
    { id: 41, date: '2026-08-12', category: 'Business & Economy', country: 'Senegal', tier: 'confirmed', platformIntegrity: false,
      headline: "World Bank Group's IFC invests $25M in Jumia to expand e-commerce infrastructure across Africa, including two tracked markets",
      summary: "The International Finance Corporation (IFC), the World Bank Group's private-sector arm, announced a $25 million equity investment in Jumia Technologies AG (NYSE: JMIA), Africa's largest public e-commerce platform, as part of a larger $50 million capital raise also anchored by Axian Telecom. The funding is meant to strengthen Jumia's marketplace, logistics and payments infrastructure across its eight African markets — which include two of the program's tracked countries, Senegal and Côte d'Ivoire — and is projected to support roughly 60,000 active annual sellers, about 1,800 direct jobs, and income opportunities for over 100,000 independent sales agents. Closing is expected in the second half of August 2026.",
      whyItMatters: "Jumia's marketplace, logistics and payments infrastructure sits in the same digital-commerce space the Client is pushing into via WhatsApp Business catalogs and Instagram Shops in Senegal and Côte d'Ivoire — a capital-strengthened competitor is a useful business/competitive-landscape signal on how fast that space is developing and who else is funding it, tracked here as a Business & Economy item rather than a risk item.",
      source: 'IFC (World Bank Group)', url: 'https://www.ifc.org/en/pressroom/2026/world-bank-group-invests-in-africa-s-digital-commerce-infrastructure-to-support-jobs-and-small-businesses' },
    { id: 42, date: '2026-08-13', category: 'Conflict & Security', country: 'Mali', tier: 'confirmed', platformIntegrity: false,
      headline: "Mali's army announces release of 82 FAMa soldiers held by JNIM/FLA since the 25 April attacks",
      summary: "Mali's general army staff said in a communiqué that 82 Malian armed forces (FAMa) personnel captured during the 25 April 2026 JNIM/FLA coalition attacks (which hit Bourem, Bamako, Kati, Sévaré, Senou and Mopti) have been released and are now safe and receiving care. The staff described the release as the outcome of a process launched immediately after the soldiers' capture. The story was independently reported the same evening by Seneweb, Bamada, ActuNiger, Alwihdainfo, NetAfrique, Afrikinfos-Mali and Guineematin, all citing the same official communiqué.",
      whyItMatters: "A resolution to one strand of the April JNIM/FLA offensive against Bamako-area targets is a modest de-escalation signal for the security backdrop the Client already tracks in Mali (JNIM's fuel blockade, tri-border kidnapping risk) — worth watching whether it's followed by any prisoner-related platform content (hostage videos, proof-of-life posts) that has featured in past JNIM messaging.",
      source: 'Seneweb', url: 'http://www.seneweb.com/fr/news/Afrique/mali-82-soldats-liberes-par-les-groupes-armes-terroristes_n_501279.html' },
    { id: 43, date: '2026-08-13', reportedDate: '2026-08-14', category: 'Business & Economy', country: 'DR Congo', tier: 'reported', platformIntegrity: false,
      headline: "DR Congo's digital economy ministry signs financial-inclusion partnership with Equity BCDC, citing AI and digital identity",
      summary: "Digital Economy Minister Augustin Kibassa Maliba signed a cooperation agreement with banking group Equity BCDC on 13 August aimed at accelerating financial inclusion in DR Congo. The deal commits the two sides to integrating 'citizen digital identity' and AI tools into the banking ecosystem, building on the country's 2019 National Digital Plan and 2023 Digital Code; Equity BCDC's director-general framed AI as a way to free up staff time for customer service rather than replace it.",
      whyItMatters: "A government-bank push to pair digital identity with AI-driven financial services is a useful competitive/digital-economy signal for how fast identity-verification and mobile-banking infrastructure is developing in DR Congo, a market the program only began tracking 11 Aug 2026 with no dedicated entities yet — relevant background as the Client's own commerce and identity-adjacent products consider the market.",
      source: 'Digital Business Africa', url: 'https://www.digitalbusiness.africa/transformation-numerique-rdc-le-grand-pas-de-linclusion-financiere/' },
    { id: 44, date: '2026-08-13', reportedDate: '2026-08-14', category: 'Digital Regulation & Compliance', country: 'Senegal', tier: 'reported', platformIntegrity: false,
      headline: "Senegal's digital ministry presents a critical-infrastructure and cybersecurity bill creating a national cyber authority, mandatory incident reporting and local data-hosting rules",
      summary: "Senegal's Ministry of Telecommunications and Digital Affairs presented a draft law on protecting critical information infrastructure (IIC) and digital security to the National Assembly's joint Culture/Communication and Law committees on 13 August. The bill would grade obligations by risk level, require critical operators to run risk analyses, encryption and business-continuity plans, and creates (or consolidates) a national cybersecurity authority, a national CERT, sector CERTs and Security Operations Centers, alongside mandatory incident notification and a requirement that public-sector data be hosted locally.",
      whyItMatters: "Mandatory incident reporting, encryption mandates and local-hosting requirements for critical infrastructure are the kind of compliance regime that tends to expand toward large platforms over time — directly relevant to the Client's data-request and data-localization exposure in Senegal, and a concrete next step in the digital-sovereignty agenda the program already tracks via ADIE/Sénégal Numérique S.A. and the New Deal Technologique.",
      source: 'Leral', url: 'https://www.leral.net/Cybersecurite-le-Senegal-muscle-son-arsenal-juridique-pour-proteger-ses-infrastructures-critiques_a404091.html' },
    { id: 45, date: '2026-08-13', reportedDate: '2026-08-14', category: 'Platform Integrity', country: 'DR Congo', tier: 'confirmed', platformIntegrity: true,
      headline: "DR Congo's audiovisual regulator threatens to shut down TikTok, demands removal of ~2,000 accounts",
      summary: "CSAC (Conseil Supérieur de l'Audiovisuel et de la Communication) president Christian Bosembe said on 13 August that TikTok could be suspended in DR Congo over a wave of insults and hate speech targeting First Lady Denise Nyakeru Tshisekedi, after the NGO Telema Mwana ya Mampinga filed a formal memorandum. Bosembe said a list of roughly 2,000 accounts had already been sent to TikTok for removal and suggested other platforms could face similar measures. Separately, the Justice Ministry said arrests and fast-tracked prosecutions were already under way nationwide under DRC's Digital Code over TikTok-based defamation of officials; TikTok remained accessible in DRC as of this reporting, with no formal shutdown order issued.",
      whyItMatters: "A named regulator publicly floating a TikTok shutdown alongside a concrete 2,000-account takedown list is a live platform-compliance and content-removal-request risk signal for the Client in a market added to this program just days ago (11 Aug) — DR Congo's first Platform Integrity item, and a marker of how far the country's social-media crackdown (formalized in a March 2026 presidential directive) has escalated.",
      source: 'Trends.cd (also reported by Africactu.net, Congo-Press/MediaCongo Press, Reporter.cd)', url: 'https://www.trends.cd/tiktok-en-rdc-le-csac-durcit-le-ton-et-demande-la-suppression-de-2000-comptes/' },
    { id: 46, date: '2026-08-15', category: 'Politics & Governance', country: 'DR Congo', tier: 'confirmed', platformIntegrity: false,
      headline: "Opposition coalition C64 announces nationwide march for 15 September against constitutional change and a possible Tshisekedi third term",
      summary: "The Coalition Article 64 (C64), an opposition-aligned civil society/political bloc, announced on 15 August a peaceful national march for 15 September to oppose any revision of the constitution and a possible referendum enabling a third presidential term for Félix Tshisekedi. The announcement follows the expiry of a C64 ultimatum set for 15 August demanding Tshisekedi convene an inclusive national dialogue, and comes days after Tshisekedi asked Parliament (10 August) for a fresh deliberation on the referendum-organization law once the Constitutional Court had validated it 'with reservations.' C64 argues the process risks circumventing Article 220 (locked constitutional provisions) and neutralizing Article 70's presidential term limits.",
      whyItMatters: "A renewed, dated opposition mobilization against a possible third-term referendum raises the near-term likelihood of protest-related unrest and associated platform-content and connectivity risk in a market the Client added to this program just days ago.",
      source: 'MediaCongo (also congoquotidien, afrik.com, Infos-Express)', url: 'https://www.mediacongo.net/article-actualite-166514_la_c64_annonce_une_marche_nationale_le_15_septembre_contre_tout_changement_de_la_constitution.html' },
    { id: 47, date: '2026-08-14', reportedDate: '2026-08-15', category: 'Digital Innovation & Connectivity', country: 'DR Congo', tier: 'confirmed', platformIntegrity: false,
      headline: "Airtel Africa and Starlink launch Africa's first commercial satellite-to-mobile service, in DR Congo",
      summary: "Airtel Africa and Starlink announced in Kinshasa on 14 August the commercial launch of a direct satellite-to-mobile connectivity service, the first such commercial deployment in Africa. The service lets Airtel customers with a compatible smartphone send SMS and use WhatsApp via Starlink's satellite constellation in areas outside terrestrial network coverage without extra equipment, building on a partnership announced in December 2025 and piloted in Kenya in March 2026.",
      whyItMatters: "A named connectivity partner explicitly marketing WhatsApp access as the flagship use case for satellite-extended coverage signals growing telecom-partner reliance on the Client's platform to reach previously unconnected users — worth tracking for service-quality and data-request implications as coverage expands.",
      source: 'Nairametrics (also TechMoran, MediaCongo, Africa News Agency)', url: 'https://nairametrics.com/2026/08/15/airtel-starlink-launch-satellite-to-phone-service-in-drc-first-in-africa/' },
    { id: 48, date: '2026-08-15', category: 'Business & Economy', country: 'Senegal', tier: 'confirmed', platformIntegrity: false,
      headline: "Senegal raises fuel prices as Middle East-driven oil shock blows out subsidy costs",
      summary: "Senegal's government raised pump prices on 15 August — petrol to 990 CFA/liter and diesel to 755 CFA/liter — reversing a December 2025 cut, after global oil prices jumped (diesel +69%, petrol +61%) since the Middle East conflict began in late February. Downstream fuel subsidies have already topped 245 billion CFA ($432M) this year and were on track to add another 47 billion CFA between mid-August and mid-September without the adjustment.",
      whyItMatters: "Renewed fiscal strain from subsidy overruns is the same pressure that has previously pushed Senegal toward new digital-services taxation and could similarly sharpen government interest in platform-revenue measures, while higher living costs add to the social-unrest backdrop this program already tracks via labor and constitutional disputes.",
      source: 'Africanews (also Bloomberg, Ecofin Agency)', url: 'https://www.africanews.com/2026/08/15/senegal-hikes-fuel-prices-amid-surge-in-global-oil-markets/' },
    { id: 49, date: '2026-08-11', category: 'Politics & Governance', country: 'Senegal', tier: 'confirmed', platformIntegrity: false,
      headline: "OFNAC reports just 56% compliance with Senegal's asset-declaration requirement",
      summary: "Anti-corruption body OFNAC said only 1,695 of a provisional list of 3,023 officials required to declare their assets had actually done so, leaving 1,328 declarations outstanding. OFNAC president Moustapha Ka cautioned the list is still provisional and could both wrongly include some people and omit others, while warning that continued non-compliance after formal notice can trigger administrative sanctions, partial withholding of pay, and prison terms of six months to four years.",
      whyItMatters: "Adds a concrete enforcement dimension to the Assembly's own asset-declaration and secret-funds push already tracked in this feed (ids 30, 32-34, 38-39) — real sanctions (fines, pay withholding, prison terms) signal the transparency drive is more than rhetorical, keeping regulatory-continuity questions live for the Client's Senegal relationships.",
      source: 'APS', url: 'https://aps.sn/lutte-contre-la-corruption-lofnac-revele-que-1-695-assujettis-ont-declare-leur-patrimoine-sur-3-023-attendus/' },
    { id: 50, date: '2026-08-13', category: 'Business & Economy', country: 'Senegal', tier: 'confirmed', platformIntegrity: false,
      headline: "Senegal's 2027 draft budget cuts ministry spending ceilings by nearly 288 billion FCFA",
      summary: "The Ministry of Economy, Finance and Planning set indicative 2027 spending ceilings for ministries and state institutions at 2.451 trillion FCFA (~$4.34bn), down almost 288 billion FCFA (~$510M) from the initial 2026 ceilings. The figures exclude personnel costs, public-debt interest and externally financed spending, and the ministry said the ceilings could still be revised later in the budget process.",
      whyItMatters: "A fresh round of fiscal tightening reinforces the same debt/IMF pressure this feed already tracks (ids 5, 10, 48) as a driver of Senegal's push toward new digital-sector revenue measures — worth watching for a 2027 platform or digital-services tax angle as the budget process continues.",
      source: 'APS', url: 'https://aps.sn/projet-de-loi-de-finances-2027-une-baisse-de-pres-de-288-milliards-de-francs-cfa/' },
    { id: 51, date: '2026-08-14', category: 'Business & Economy', country: 'Senegal', tier: 'confirmed', platformIntegrity: false,
      headline: "Senegal clears a regional bond sale but pays yields near 8% amid tight fiscal conditions",
      summary: "Senegal's Treasury raised 77 billion FCFA (~$136M) on the UEMOA regional securities market, above its initial 70 billion FCFA target, after investors bid a total of 110.08 billion FCFA — a 157% coverage rate. Weighted yields came in at 8.04% on 364-day bills, 7.73% on three-year bonds and 8.20% on five-year bonds.",
      whyItMatters: "Strong investor demand shows Senegal can still access regional financing despite its frozen IMF program, but yields near 8% keep domestic borrowing costs high — continuing the same fiscal pressure that has previously pushed the government toward new digital-economy taxation the Client should keep watching.",
      source: 'UMOA-Titres', url: 'https://www.umoatitres.org/wp-content/uploads/2026/07/Annonce-au-MTP-SN-ES-14.08.2026.pdf' },
    { id: 52, date: '2026-08-13', category: 'Digital Innovation & Connectivity', country: 'Senegal', tier: 'confirmed', platformIntegrity: false,
      headline: "Senegal launches national rollout of its digital-education ecosystem, targeting 105,000 teachers",
      summary: "Meeting in Saly Portudal, National Education Minister Moustapha Mamba Guirassy opened a three-day workshop launching national deployment of core platforms including PLANETE, EDUSTAT, SENKALA, TAGGATU and RAMATU. Officials linked the program to training 105,000 teachers, extending high-speed internet to thousands of schools, free access to education platforms, and fully digitizing school enrollment starting the 2026-2027 academic year.",
      whyItMatters: "A state-led push to extend internet connectivity to thousands of schools and digitize enrollment nationwide signals Senegal's own digital-infrastructure priorities and could shape future data-localization or platform-interoperability expectations relevant to the Client's connectivity products.",
      source: 'PressAfrik', url: 'https://www.pressafrik.com/Digitalisation-de-l-Ecole-senegalaise-vers-la-formation-de-105-000-enseignants-et-la-dematerialisation-des-inscriptions_a309851.html' },
    { id: 53, date: '2026-08-12', category: 'Digital Regulation & Compliance', country: 'Senegal', tier: 'confirmed', platformIntegrity: false,
      headline: "Senegal advances private-copy remuneration scheme covering digital storage and cloud services",
      summary: "Senegal's Private Copy Commission, copyright body SODAV, and cultural-sector representatives met in Dakar to work out implementation of a private-copy remuneration levy, following a government instruction issued in January. Discussions covered how the scheme would apply to digital storage, cloud services, and evolving media-consumption habits.",
      whyItMatters: "A remuneration levy reaching into cloud and digital-storage services is an early sign of Senegal expanding content-related fees onto digital infrastructure — worth tracking for whether the scope could eventually touch platforms that host or store user media.",
      source: 'RTS', url: 'https://www.rts.sn/actualite/detail/general/remuneration-pour-copie-privee-le-senegal-accelere-la-mise-en-place-du-dispositif' },
    { id: 54, date: '2026-08-13', category: 'Conflict & Security', country: 'Senegal', tier: 'confirmed', platformIntegrity: false,
      headline: "Senegal and Guinea-Bissau agree a 12-month joint border-patrol calendar",
      summary: "Meeting in Ziguinchor, Senegalese Military Zone No. 5 commander Colonel Cheikh Gueye announced a 12-month framework for joint patrols along the Senegal-Guinea-Bissau border, involving the armed forces, gendarmerie, police, customs and forestry services on both sides. Officials cited armed groups, trafficking and other cross-border offenses as the rationale, without yet naming priority sectors or a start date.",
      whyItMatters: "General border-security cooperation relevant to the Casamance-area operating environment this feed already tracks; no direct platform implication identified, but worth monitoring for any resulting content or communications-surveillance measures tied to the new patrol framework.",
      source: 'APS', url: 'https://aps.sn/dakar-et-bissau-etablissent-un-calendrier-de-patrouilles-conjointes-pour-mieux-securiser-leurs-frontieres/' },
    { id: 55, date: '2026-08-13', category: 'Conflict & Security', country: 'Senegal', tier: 'confirmed', platformIntegrity: false,
      headline: "Senegal and Mauritania launch joint river patrols on the Senegal River border",
      summary: "Senegalese and Mauritanian forces launched joint river patrols along their shared Senegal River border, involving Military Zone No. 2, marine units, police and gendarmerie on the Senegalese side. The patrols cover several river sectors and focus on surveillance and preventing illicit cross-border activity; sources did not confirm a formal link to the separate Guinea-Bissau patrol framework announced the same day.",
      whyItMatters: "Another border-security cooperation initiative announced the same week as the Guinea-Bissau patrol agreement, adding to the general security-context picture this feed tracks for Senegal's operating environment; no direct platform implication identified.",
      source: 'RTS', url: 'https://www.rts.sn/actualite/detail/a-la-une/senegal-mauritanie-lancement-de-patrouilles-fluviales-conjointes-a-la-frontiere' },
    { id: 56, date: '2026-08-16', reportedDate: '2026-08-17', category: 'Politics & Governance', country: 'DR Congo', tier: 'confirmed', platformIntegrity: false,
      headline: "Tshisekedi announces a dedicated national address on DR Congo's proposed political dialogue, as churches flag format concerns",
      summary: "During a working visit to Libreville (15-16 August), President Félix Tshisekedi announced he would soon deliver a formal address to the nation dedicated to a proposed 'national dialogue for peace, cohesion and refoundation of the state,' saying it would be 'different from every dialogue this country has known.' Congolese press (ACP, Actualite.cd, 7sur7.cd, Le Phare, La Tempête des Tropiques, Le Potentiel) reported that a special commission is already negotiating the dialogue's format and calendar, though the Catholic (CENCO) and Protestant (ECC) church bodies have already voiced reservations about the proposed format. The announcement follows opposition coalition C64's 15 August call for a 15 September national march against any constitutional revision (id 46) and comes after Tshisekedi asked Parliament for a second deliberation on the referendum-organization law to address the Constitutional Court's reservations on 13 articles.",
      whyItMatters: "A formal presidential dialogue process — even one already contested on format by major church bodies — signals DR Congo's leadership is trying to manage the third-term/constitutional-revision standoff through negotiation rather than confrontation, a dynamic the Client should track for its effect on the protest, platform-content and connectivity risk already flagged around the 15 September opposition march (id 46).",
      source: 'Radio Okapi', url: 'https://www.radiookapi.net/2026/08/17/actualite/politique/tshisekedi-et-oligui-nguema-actent-lexemption-reciproque-de-visas' },
    { id: 57, date: '2026-08-16', reportedDate: '2026-08-17', category: 'Platform Integrity', country: 'DR Congo', tier: 'confirmed', platformIntegrity: true,
      headline: "CSAC president sharpens TikTok ultimatum, invoking AFC-M23/Nangaa propaganda and Israel/Trump-ban precedents",
      summary: "In a weekend interview with Top Congo FM's 'Top7' program (reported 17 August by La Prospérité, Journal de Kinshasa and allAfrica), CSAC president Christian Bosembe delivered his most explicit ultimatum yet on TikTok: unless the platform removes the roughly 2,000 accounts CSAC has flagged as spreading AFC-M23 rebel leader Corneille Nangaa's propaganda, 'we will close your network in the DRC.' He invoked Israel's blocking of 23 million accounts and the US suspension of Donald Trump from several platforms as precedents for account removal, cited Gabon's outright TikTok shutdown as a fallback option, and — addressing talk of a rift with Communications Minister Patrick Muyaya — insisted CSAC alone, not the ministry, has jurisdiction over social-platform content moderation in DRC.",
      whyItMatters: "The regulator is now anchoring its threat to concrete foreign precedents for mass account removal and outright platform bans, while explicitly asserting sole regulatory authority over content moderation — sharpening both the near-term shutdown risk for TikTok in DRC (id 45) and the read on how the same logic could later be extended to WhatsApp or Facebook if security concerns are raised there.",
      source: 'La Prospérité (also Journal de Kinshasa, allAfrica via Top Congo FM)', url: 'https://www.laprosperite.cd/sur-top-congo-fm-christian-bosembe-le-reseau-tiktok-pourrait-etre-ferme-si-les-comptes-dangereux-pour-la-securite-nationale-de-la-rdc-ne-sont-pas-fermes/' },
    { id: 58, date: '2026-08-17', category: 'Platform Integrity', country: 'Senegal', tier: 'confirmed', platformIntegrity: true,
      headline: "DSC dismantles TikTok-advertised fake produce-vendor fraud, 121 victims",
      summary: "Senegal's cybercrime police (DSC) arrested the operator of a TikTok account, \"MinimarchéSn,\" that advertised discounted vegetable and food packs, then moved buyers to WhatsApp to close the sale before disappearing once a second payment cleared. Investigators identified 121 victims and roughly 4.52 million FCFA in losses since the scheme began 30 July.",
      whyItMatters: "Another entry in the recurring TikTok-to-WhatsApp fraud pipeline this feed already tracks — the platforms form the full transaction funnel (advertising, trust-building, payment), building the public record cited in Senegalese cybercrime enforcement.",
      source: 'Seneweb', url: 'https://www.seneweb.com/fr/news/Societe/arnaque-a-grande-echelle-sur-tiktok-la-proprietaire-du-mini-marche-sn-arretee-par-la-dsc_n_501148.html' },
    { id: 59, date: '2026-08-18', category: 'Platform Integrity', country: 'Senegal', tier: 'reported', platformIntegrity: true,
      headline: "Mbour tribunal weighs verdict in 8.2bn-FCFA WhatsApp-enabled fraud case",
      summary: "The Mbour high court was scheduled to rule on 18 August on the case of a Ngaparou currency-exchange manager who wired roughly 8.223 billion FCFA after a WhatsApp caller impersonating a client's relative sent forged bank-transfer receipts requesting he forward funds; the money-transfer point manager who received part of the funds is on trial, denying knowing complicity. No outlet had reported the actual ruling as of this run.",
      whyItMatters: "One of the largest WhatsApp-enabled fraud sums this feed has tracked in Senegal — the scale alone makes the eventual verdict, and any commentary on how the platform was used to build trust, worth a direct manual follow-up next run rather than letting it drop for lack of a same-day resolution.",
      source: 'Dakarposte', url: 'https://www.dakarposte.com/Escroquerie-presumee-de-8223-milliards-de-FCFA-a-Ngaparou-un-prevenu-place-au-coeur-d-un-vaste-montage-frauduleux_a86884.html' },
    { id: 60, date: '2026-08-18', category: 'Business & Economy', country: 'Senegal', tier: 'confirmed', platformIntegrity: false,
      headline: "IMF confirms full staff visit to Senegal, 19 Aug–1 Sept, signaling progress toward a new program",
      summary: "The IMF announced a two-week staff visit to Senegal from 19 August to 1 September for technical talks on policies that could underpin a new lending arrangement, following the debt-misreporting dispute that froze the prior $1.8bn program. The Fund described the visit as reflecting genuine progress rather than a routine check-in.",
      whyItMatters: "A forward signal, not just a status report — the IMF publicly scheduling a full staff visit suggests both sides see a resolvable path, relevant to whether fiscal pressure keeps pushing Senegal toward new digital-services taxation as tracked elsewhere in this feed.",
      source: 'CNBC Africa / TimesLIVE', url: 'https://www.cnbcafrica.com/2026/imf-staff-to-visit-senegal-this-week-reflecting-progress-toward-new-program' },
    { id: 61, date: '2026-08-12', category: 'Business & Economy', country: "Côte d'Ivoire", tier: 'confirmed', platformIntegrity: false,
      headline: "Jumia raises $50M (IFC-anchored) toward Q4 profitability, across markets including Côte d'Ivoire and Senegal",
      summary: "The IFC anchored a $50M equity raise for Jumia with a $25M investment, aimed at strengthening the e-commerce platform's marketplace and logistics network and supporting its push toward adjusted-EBITDA breakeven in Q4 2026. Jumia operates in eight African markets including two tracked here — Côte d'Ivoire and Senegal — alongside Egypt, Ghana, Kenya, Morocco, Nigeria and Uganda. The World Bank Group estimates the funding could support roughly 60,000 active local sellers and about 1,800 direct jobs.",
      whyItMatters: "Falls under this feed's widened digital-economy lens: a well-funded e-commerce/logistics competitor scaling up across the Client's own tracked markets is a competitive-landscape data point, even though the deal itself carries no platform-policy angle.",

    { id: 62, date: '2026-08-17', category: 'Platform Integrity', country: "Côte d'Ivoire", tier: 'reported', platformIntegrity: true,
      headline: "Quipux Afrique warns of a WhatsApp-distributed fake traffic-fine phishing site targeting Ivorian drivers",
      summary: "Digital-services provider Quipux Afrique publicly warned that a WhatsApp number was mass-messaging drivers with a fake 50%-off traffic-fine offer, directing them to a lookalike site (radarci.org) that harvests personal data via an unfiltered license-plate lookup with no actual connection to Quipux's systems.",

      source: 'Quipux Afrique (via Yeclo.com)', url: 'https://www.yeclo.com/amendes-routieres-quipux-afrique-alerte-sur-un-site-frauduleux/' },
    { id: 63, date: '2026-08-18', reportedDate: '2026-08-15', category: 'Digital Regulation & Compliance', country: 'Cameroon', tier: 'confirmed', platformIntegrity: false,
      headline: "Cameroon's 2026 Internet Governance Forum opens in Yaoundé, focused on data as public digital-infrastructure backbone",
      summary: "Cameroon's national Internet Governance Forum runs 18–20 August in Yaoundé under the theme \"From fragmentation to interoperability: making data the backbone of public digital infrastructure.\" The forum brings together government, regulators and industry to discuss data-governance frameworks underpinning the country's digital services.",
      whyItMatters: "A recurring venue where Cameroonian officials signal upcoming data-governance and platform-oversight priorities — worth monitoring over the three-day run for any announcement touching platform data requests or content rules.",
