    { id: 186, date: '2026-09-03', category: 'Politics & Governance', country: 'Mali', tier: 'confirmed', platformIntegrity: false,
      headline: "Mali's Cybercrime Tribunal sentences whistleblower Colonel Alpha Yaya Sangaré to 20 years over army-abuses book",
      summary: "The Criminal Chamber of Mali's Pôle National de Lutte contre la Cybercriminalité sentenced former senior gendarmerie officer Alpha Yaya Sangaré to 20 years in prison on 3 September 2026, on charges including dissemination of false news, damaging state credit, and content affecting FAMa (armed forces) discipline. The prosecution stemmed from Sangaré's self-published 2023 book documenting army counterterrorism abuses; he was arrested in 2024 after the Defense Ministry objected to its publication, and the Public Ministry had sought a far harsher sentence during the case's history.",
      whyItMatters: "A cybercrime tribunal — rather than a military or ordinary court — handing a lengthy sentence to a whistleblowing officer over a printed book signals Bamako is willing to stretch its cybercrime/false-news statutes to reach non-digital dissent, a relevant precedent for how the same legal toolkit could be applied to online platform content or foreign-owned services operating in Mali.",
      source: 'Bamada.net', url: 'https://bamada.net/mali-alpha-yaya-sangare-condamne-a-20-ans-de-prison-ferme-par-le-pole-national-de-lutte-contre-la-cybercriminalite' },
    { id: 187, date: '2026-09-01', category: 'Digital Innovation & Connectivity', country: "Côte d'Ivoire", tier: 'confirmed', platformIntegrity: false,
      headline: "Côte d'Ivoire deepens Mistral AI partnership to deploy AI across public administration, health, education and agriculture",
      summary: "Côte d'Ivoire's Ministry of Digital Transition (MTNIT) announced on 1 September 2026 a strategic partnership, signed 17 August in Abidjan, with French AI firm Mistral AI. The deal starts with a strategic audit of Ivorian data/infrastructure to identify high-impact AI use cases in public administration, health, education, agriculture and citizen services, feeding a joint roadmap under the AI pillar of the country's 2026-2028 Digital Roadmap (40 structuring projects) and the 9-11 September 'IMPACT IA' conference in Abidjan.",
      whyItMatters: "A government-to-government AI deployment partnership spanning core public-service sectors is a significant connectivity/digital-economy investment signal for Côte d'Ivoire, one of the three Meta countries without a dedicated Inoreader feed, and worth watching for any platform-competition or data-governance implications as the audit phase concludes.",
      source: 'Agence Ecofin (also AIP, RTI Info, We Are Tech Africa)', url: 'https://www.agenceecofin.com/actualites/0309-141271-la-cote-d-ivoire-noue-un-partenariat-avec-mistral-pour-deployer-l-ia-dans-les-secteurs-prioritaires' },
    { id: 188, date: '2026-09-03', category: 'Digital Regulation & Compliance', country: 'Burkina Faso', tier: 'confirmed', platformIntegrity: false,
      headline: "ANTIC: Burkina Faso logged 17,500 cybercrime complaints worth 5.8bn FCFA in damages in 2025, led by predatory microloan apps",
      summary: "Prosper Pagou of Burkina Faso's national cybersecurity response agency ANTIC disclosed that the agency recorded 17,500 cybercrime complaints in 2025 totaling 5.8 billion FCFA in reported damages, with a new modus operandi — predatory mobile microloan apps harvesting contacts and photo galleries for blackmail — identified as a major driver. ANTIC said it neutralized 33 fraudulent apps from the national network and reiterated that companies victimized by cybercrime are legally required to report immediately to the agency.",

    { id: 189, date: '2026-09-02', category: 'Network Disruption & Cybersecurity', country: 'Togo', tier: 'confirmed', platformIntegrity: false,
      headline: "Togo's cybersecurity agency ANCy opens national call for cyber talent as threats intensify",
      summary: "Togo's National Cybersecurity Agency (ANCy) published a call for expressions of interest dated 27 August, made public 2 September 2026, seeking to build a national pool of cybersecurity professionals, researchers and self-taught specialists across offensive/defensive security, penetration testing, application/cloud/network security, with applications due 30 October. The initiative follows ANCy's 2025 national Capture-the-Flag competition and comes amid what regional outlets describe as intensifying hacking, ransomware and phishing threats across Togo.",

    { id: 190, date: '2026-09-02', category: 'Business & Economy', country: 'Senegal', tier: 'confirmed', platformIntegrity: false,
      headline: "French health-insurance unicorn Alan acquires Dakar healthtech Tanel in its first African market entry",

    { id: 191, date: '2026-09-01', reportedDate: '2026-09-03', category: 'Business & Economy', country: 'Senegal', tier: 'confirmed', platformIntegrity: false,
      headline: "Senegal's $5bn Eurobond restructuring starts formal default countdown, Bloomberg reports",
      summary: "Bloomberg reported that Senegal's government, in a Tuesday 1 September announcement of an IMF-backed rescue program, opened the door to restructuring roughly $5bn (~2,830bn FCFA) in outstanding Eurobonds, making some form of payment moratorium look almost inevitable. A decisive test comes 13 September, when an interest payment falls due on one of the bonds; Senegal's 2048 Eurobonds have nonetheless risen for a second straight session on short-covering rather than any fundamental improvement. The restructuring also revives the unresolved question of how Senegal treats controversial total-return-swap debt held by First Abu Dhabi Bank and Africa Finance Corp.",
      whyItMatters: "A formal Eurobond restructuring process, with a concrete 13 September default test date, sharply raises Senegal's near-term political-instability profile — a backdrop the Client should track for any read-through to internet-governance or platform-policy continuity, especially as former PM Sonko (dismissed in May over his opposition to restructuring) used Facebook to publicly demand a 'sain debate' on Senegal's commitments after the announcement.",

    { id: 192, date: '2026-09-02', reportedDate: '2026-09-04', category: 'Network Disruption & Cybersecurity', country: "Côte d'Ivoire", tier: 'reported', platformIntegrity: false,
      headline: "Orange Côte d'Ivoire threatens legal action after roadworks sever fibre cables in Cocody, cutting over 1,100 customers",

      source: 'TechAfrica News', url: 'https://techafricanews.com/2026/09/04/orange-cote-divoire-warns-legal-action-after-telecom-cables-damaged-cocody/' },
    { id: 193, date: '2026-08-31', reportedDate: '2026-09-03', category: 'Politics & Governance', country: 'Niger', tier: 'reported', platformIntegrity: false,
      headline: "Radio Télévision Saraounia director Moussa Kaka feared forcibly disappeared in Niamey days after failed coup",
      summary: "Moussa Kaka, director-general of Radio Télévision Saraounia and a former RFI correspondent, left his office in Niamey around 7pm on 31 August 2026 and has not been heard from since; RSF and Human Rights Watch have called for an urgent investigation into his disappearance. Kaka was one of six journalists arrested in October 2025 on cybercrime-law charges after the station announced a press briefing via social media — the same case that saw newsroom manager Ibro Chaibou released just days earlier (28 August, tracked as item 132).",

      source: 'RSF (also Human Rights Watch, France 24)', url: 'https://rsf.org/fr/niger-rsf-pr%C3%A9occup%C3%A9e-par-la-disparition-de-moussa-kaka-directeur-de-radio-t%C3%A9l%C3%A9vision-saraounia' },
    { id: 194, date: '2026-08-31', category: 'Digital Regulation & Compliance', country: 'Guinea', tier: 'confirmed', platformIntegrity: false,
      headline: "Guinea's Justice Minister calls social networks 'vectors of disinformation and cybercrime' as Conakry takes 2-year UEMOA platform-regulators lead",
      summary: "At the 12th General Assembly of the Platform of Audiovisual Regulators of UEMOA Member States (plus Guinea), held in Conakry on 31 August 2026, Justice Minister Ibrahima Sory Tounkara said social networks have become 'vectors of disinformation, hate speech and cybercrime' and called for sanctioning abuse without weakening free expression. The two-day assembly coincided with Guinea assuming the platform's rotating two-year leadership.",

      source: 'Avenir Guinée (also Guinée 114)', url: 'https://www.avenirguinee.org/2026/08/31/les-reseaux-sociaux-sont-devenus-des-vecteurs-de-desinformation-de-discours-de-haine-et-de-cybercriminalite-regrette-le-ministre-de-la-justice/' },
    { id: 195, date: '2026-09-01', category: 'Digital Regulation & Compliance', country: 'Cameroon', tier: 'confirmed', platformIntegrity: false,
      headline: 'Cameroon begins blocking non-customs-cleared phones on MTN, Orange and Camtel networks',
      summary: "As of 1 September 2026, MTN Cameroon, Orange Cameroun and Camtel began blocking network access for mobile handsets that have not been customs-cleared, per a directive from Finance Minister Louis Paul Motaze originally set for 25 May but delayed. Roughly 700,000 devices were reportedly in authorities' sights, though any phone that had already connected to a network before 16 March 2026 is automatically deemed cleared.",

    { id: 196, date: '2026-08-30', reportedDate: '2026-09-03', category: 'Platform Integrity', country: 'DR Congo', tier: 'reported', platformIntegrity: true,
      headline: 'DRC TikTok influencer Denise Dusauchoy placed under arrest warrant over alleged pro-M23/AFC content',

    { id: 197, date: '2026-08-28', reportedDate: '2026-08-29', category: 'Platform Integrity', country: 'DR Congo', tier: 'confirmed', platformIntegrity: true,
      headline: 'DRC Council of Ministers advances inter-ministerial task force to police TikTok after 2,000 flagged accounts went unactioned',
      summary: "On 28 August 2026 DRC's Council of Ministers reviewed a note from Communication Minister Patrick Muyaya on 'protecting the information space,' recommending a new inter-ministerial task force, led by his ministry, to permanently monitor platforms and set terms for cooperation, transparency and legal representation of major platforms in DRC. The move follows disclosure that regulator CSAC had asked TikTok to remove over 2,000 flagged accounts without result; CSAC officials have publicly floated a possible TikTok suspension if dangerous accounts aren't addressed.",

    { id: 198, date: '2026-09-02', category: 'Digital Regulation & Compliance', country: 'Mali', tier: 'reported', platformIntegrity: false,
      headline: 'Mali convenes AES ministers to weigh a joint Sahel-wide social-media regulatory framework',
      summary: "Mali's Ministry of Communication, Digital Economy and Modernization of Administration held a meeting on 2 September 2026, chaired by Secretary General Alkaidi Touré, to examine whether the Alliance of Sahel States (Mali, Burkina Faso, Niger) should adopt a harmonized regulatory framework for social networks. Participants included the online press association APPEL, data-protection authority APDP, the national cybercrime unit, and telecom/media regulator HAC, who framed social media as a sovereignty and security issue tied to the bloc's information space. No decision was reached; officials described it as an early-stage discussion.",
      whyItMatters: "A move toward AES-wide rather than Mali-only social-media regulation would extend platform-regulatory risk simultaneously across three tracked countries (Mali, Burkina Faso, Niger) rather than one, and is worth close tracking as a potential joint licensing or data-request regime.",

    { id: 199, date: '2026-09-05', category: 'Conflict & Security', country: 'DR Congo', tier: 'confirmed', platformIntegrity: false,
      headline: 'RSF investigation: AFC/M23 systematically seizes homes, offices and a radio station from Kinshasa-aligned dignitaries around Goma',
      summary: "Reporters Without Borders (RSF) published an investigation on 5 September 2026 documenting how AFC/M23, which has controlled Goma since January 2025, has confiscated and repurposed buildings belonging to Kinshasa-aligned politicians and officials. Cases include Nyiragongo Musisimuke Radio-Television — owned by former deputy Mutuelle Moromoro, now transformed into an AFC/M23 intelligence office and civilian detention site — and multiple properties of senator Bahati Lukwebo, including the five-star Serena hotel on Lake Kivu. RSF describes a systematic pattern of occupying homes and offices of officials, state agents and security personnel who fled the city, converting them into rebel administrative headquarters.",
      whyItMatters: "The rebel administration's institutionalized seizure of state and media infrastructure signals a deepening fragmentation of Kinshasa's regulatory reach in the east, a governance-continuity risk relevant to how any future platform-data-request or content-moderation channel would function in AFC/M23-held territory.",
      source: 'Actualite.cd (also Reporter.cd, Jeune Afrique)', url: 'https://actualite.cd/2026/09/05/est-de-la-rdc-rsf-alerte-sur-la-confiscation-et-le-controle-des-batiments-appartenant' },
    { id: 200, date: '2026-09-03', reportedDate: '2026-09-04', category: 'Platform Integrity', country: 'Senegal', tier: 'confirmed', platformIntegrity: true,
      headline: 'Three Senegalese TikTok personalities placed under detention order after a WhatsApp group dispute escalates into a criminal case',
      summary: "Senegalese TikTok personalities Khadidiatou Kébé ('Jessica'), Rokhaya Fall ('Rox la Chancelière') and Nafissatou Fall ('Narou') were taken into custody on 3 September 2026 and placed under a formal detention order (mandat de dépôt) by the Pikine-Guédiawaye prosecutor. The dispute began in a WhatsApp group Jessica created to share photos, escalated into cross-complaints of death threats, defamation and disclosure of personal data (including images of Jessica's children), and spilled onto TikTok livestreams. Despite the women later withdrawing their complaints against each other, the prosecutor pressed forward; they are due before the Pikine-Guédiawaye flagrant-offenses court on 9 September on charges of indecent public statements and public insult.",
      whyItMatters: "A named WhatsApp group is the documented origin of a criminal case now proceeding through a Senegalese court with a cross-platform WhatsApp-to-TikTok fact pattern — a direct data point on platform-linked prosecution risk, with the 9 September court date worth a follow-up next run.",
      source: 'Seneweb (also Xalima, Pulse.sn, Xibaaru)', url: 'https://www.seneweb.com/en/news/Justice/en-garde-a-vue-a-la-dsc-les-tiktokeuses-rox-jessica-et-narou-enterrent-la-hache-de-guerre_n_503188.html' },
    { id: 201, date: '2026-09-04', reportedDate: '2026-09-04', category: 'Platform Integrity', country: 'DR Congo', tier: 'confirmed', platformIntegrity: true,
      headline: "DRC formalizes arrest warrant for TikTok influencer Dusauchoy as government warns it will pursue online critics 'even from abroad'",
      summary: "Following her arrest in Tanzania on 30 August (item 196), pro-M23/AFC TikTok influencer Denise Dusauchoy (Denise Mukendi) was presented to the Kinshasa-Gombe prosecutor's office on 2 September and placed under a formal provisional arrest warrant on 3 September, suspected of glorifying AFC/M23 'subversive activities' on social media. The next day, Communications Minister Patrick Muyaya publicly warned that the government would pursue anyone spreading online insults or defamation 'even from abroad,' explicitly citing the Dusauchoy case as the trigger.",
      whyItMatters: "A formal warrant plus an on-record ministerial threat to pursue diaspora social-media users extraterritorially escalates platform-content prosecution risk beyond the initial arrest, and reinforces the TikTok-compliance pressure already building via CSAC's takedown threat (item 197).",
      source: 'Radio Okapi', url: 'https://www.radiookapi.net/2026/09/04/actualite/politique/rdc-le-gouvernement-met-en-garde-contre-les-auteurs-dinsultes-sur' },
    { id: 202, date: '2026-09-05', category: 'Network Disruption & Cybersecurity', country: 'Burkina Faso', tier: 'reported', platformIntegrity: false,
      headline: "Burkina Faso's cybercrime unit arrests five over fraudulent SIM pre-registration scheme",
      summary: "Burkina Faso's cybercrime unit (BCLCC) announced the arrest of five individuals for identity theft, forgery and use of forged documents, tied to a scheme in which agents registered SIM cards under invented or stolen identities and resold them — a practice barred under the country's telecom-identification rules. Single-source reporting; no telecom operator or ARCEP comment cited yet.",
      whyItMatters: "SIM-registration fraud undermines the subscriber-identity verification that both telecom regulators and platforms rely on for account KYC — a relevant cybercrime/account-integrity data point in a market with otherwise thin dedicated coverage.",
      source: 'Wakat Séra', url: 'https://www.wakatsera.com/burkina-cinq-individus-interpelles-pour-usurpation-didentite-faux-et-usage-de-faux/' },
    { id: 203, date: '2026-09-04', reportedDate: '2026-09-05', category: 'Conflict & Security', country: 'Niger', tier: 'confirmed', platformIntegrity: false,
      headline: "Niger's Council of Ministers formally accuses France of orchestrating August mutiny, threatens international legal action",
      summary: "Niger's Council of Ministers, meeting Friday 4 September under General Abdourahamane Tiani, escalated the earlier single-officer testimony (item 148) into a formal government accusation, stating the 28-29 August mutiny attempt was orchestrated by a \"vast network of collusion\" headed by \"the French regime of Mr. Macron,\" and describing unnamed African neighbors as \"gateways\" for France's destabilization efforts. The government said it has compiled \"substantial documentation\" on the events and reserves the right to pursue international legal action. Benin's government spokesman again publicly denied any hostile intent toward Niger.",
      whyItMatters: "A formal state-level accusation against France, rather than a single officer's unverified testimony, materially raises the diplomatic stakes and the odds of retaliatory measures — including against French-linked digital infrastructure or connectivity providers — in a country already central to the Client's connectivity and platform-risk watch list.",
      source: 'Bamada.net (via APA; also Hespress, citing French denial)', url: 'https://bamada.net/niamey-denonce-un-vaste-reseau-pilote-par-la-france' },
    { id: 204, date: '2026-09-04', category: 'Business & Economy', country: 'Senegal', tier: 'confirmed', platformIntegrity: false,
      headline: "S&P downgrades Senegal deeper into junk territory (CCC+ to CC) on debt-restructuring default risk",
      summary: "S&P Global Ratings downgraded Senegal's long-term foreign-currency sovereign rating from CCC+ to CC with a negative outlook on 4 September, and its local-currency rating from CCC+ to CCC, directly citing the 1 September announcement of Senegal's debt-restructuring plan (PTDS). S&P called the looming restructuring of Senegal's roughly $5bn in foreign-currency commercial debt (117% of GDP as of end-2025) a \"distressed debt exchange\" and judged a default on that debt \"extremely probable,\" while warning some creditors could contest the exclusion of CFA-denominated debt (about a third of the total) from the restructuring.",
      whyItMatters: "A ratings-agency judgment that default on Senegal's foreign-currency debt is \"extremely probable\" is a sharper, more independent read on sovereign risk than the government's own \"for the moment\" payment pledges (items 13-14 on BP, item 10 on OCP), directly relevant to the fiscal-continuity backdrop for Senegal's platform/regulatory posture as Meta's most-tracked market.",
      source: 'S&P Global Ratings (via 24heureinfo, also africaintel/African Business)', url: 'https://24heureinfo.com/afrique/lagence-sp-degrade-la-note-du-senegal-a-cc-en-raison-du-plan-de-traitement-de-la-dette/' },
    { id: 205, date: '2026-09-01', category: 'Business & Economy', country: 'Senegal', tier: 'confirmed', platformIntegrity: false,
      headline: "IMF reaches staff-level agreement with Senegal on $2.2bn Extended Credit Facility program",
      summary: "Following talks in Dakar from 19 August to 1 September, the IMF and Senegalese authorities reached a staff-level agreement on a 36-month Extended Credit Facility arrangement worth about $2.2bn (SDR 1,537.1m, 475% of quota) to support a 2026-29 reform program. The program targets macroeconomic stability, debt sustainability and reduced fiscal/external vulnerabilities, but still needs IMF Executive Board approval plus a waiver tied to Senegal's prior debt-misreporting case and financing assurances from partners. Senegalese commentary (e.g. Xibaaru, citing analyst Pape Fall) cautioned the announced figure is a multi-year ceiling, not an immediate disbursement.",
      whyItMatters: "A $2.2bn IMF program still pending Board approval and a misreporting-case waiver is a fresh, concrete marker in the fiscal-continuity story already being tracked via the Eurobond coupon and S&P downgrade (items 203-204) — its approval, delay or collapse will shape the government's room to manage debt and social spending alongside its platform/regulatory agenda.",
      source: 'IMF', url: 'https://www.imf.org/en/news/articles/2026/09/01/pr26282-senegal-imf-reaches-sla-ecf-arrangement' },
    { id: 206, date: '2026-09-05', category: 'Conflict & Security', country: 'Niger', tier: 'confirmed', platformIntegrity: false,
      headline: "French Foreign Minister denies Niger's accusation that Paris orchestrated the August mutiny",
      summary: "French Foreign Minister Jean-Noël Barrot told RFI that Niger's 4 September accusation — a Council of Ministers statement alleging a \"vast network of collusion\" led by President Macron behind the 28-29 August mutiny attempt in Niamey (already tracked, item 203) — amounts to \"pure slander,\" and that France had neither the intent nor the means to incite such a rebellion. The denial was reported independently by Al-Akhbar (Mauritania) and Hespress (Morocco), both citing the same RFI interview.",
      whyItMatters: "France's on-record rejection sharpens rather than resolves the diplomatic rupture already flagged in item 203, keeping Niger's junta-France standoff — and by extension the posture of France-aligned telecom/security interests in the country — an open flashpoint for Meta's regional political-risk picture.",
      source: 'Al-Akhbar (Mauritania) / Hespress, citing RFI', url: 'https://www.hespress.com/%D9%81%D8%B1%D9%86%D8%B3%D8%A7-%D8%AA%D9%86%D9%81%D9%8A-%D8%A7%D9%84%D8%B6%D9%84%D9%88%D8%B9-%D9%81%D9%8A-%D8%AA%D9%85%D8%B1%D8%AF-%D8%A7%D9%84%D9%86%D9%8A%D8%AC%D8%B1-1802248.html' },
    { id: 207, date: '2026-09-04', category: 'Platform Integrity', country: 'Senegal', tier: 'confirmed', platformIntegrity: true,
      headline: "Three Senegalese TikTok streamers placed in pre-trial detention over live-streamed insults and child images",
      summary: "Rokhaya Fall (\"Rox\"), Khadidiatou Kébé (\"Jessica\") and Nafissatou Fall (\"Narou\") were arrested by the Special Cybersecurity Division (DSC) following a series of live TikTok broadcasts featuring mutual insults, obscene remarks and photos of children, then placed under a pre-trial detention order (mandat de dépôt) by the Pikine-Guédiawaye prosecutor. Prosecutor Saliou Dicko has since added a criminal-association charge; the three are due before the flagrant-offense tribunal on 9 September 2026 for public-morality offenses and public insults. Corroborated by Xalima, Seneweb, Senego, Public.sn and Exclusif.net.",
      whyItMatters: "A named-platform (TikTok) prosecution involving a specialized cyber unit and an escalating criminal-association charge is a direct Platform Integrity signal — it shows Senegalese authorities treating TikTok livestream content as a serious criminal-justice matter, relevant to data-request and takedown-pressure risk; the 9 September hearing is a concrete follow-up date.",

    { id: 208, date: '2026-09-05', category: 'Politics & Governance', country: 'Guinea', tier: 'reported', platformIntegrity: false,
      headline: "Former Supreme Court prosecutor Algassimou Diallo removed from Coyah prison to an unknown location, lawyers allege forced disappearance",
      summary: "Algassimou Diallo — a former attorney general at Guinea's Supreme Court dismissed from the magistracy after an audio clip circulated on social media allegedly showing him exchanging communitarian remarks with exiled opposition figure Cellou Dalein Diallo — was extracted from Coyah prison on the morning of 5 September 2026 and taken to an undisclosed destination, according to his defense team. His lawyers say judicial authorities claim no knowledge of his whereabouts; the TLP-Guinée rights coalition has published an urgent statement calling it a potential enforced disappearance and demanding answers. He had appeared in good health at a 4 September hearing.",

    { id: 209, date: '2026-09-03', category: 'Politics & Governance', country: 'Mali', tier: 'confirmed', platformIntegrity: false,
      headline: "Mali's specialized anti-cybercrime court sentences army colonel to 20 years over book on terrorism",
      summary: "Mali's specialized anti-cybercrime court sentenced Colonel Alpha Yaya Sangaré to 20 years in prison on 3 September 2026, following a closed-door trial in which prosecutors had sought the death penalty (retained in Mali's legal code but not applied in practice). The case reportedly stemmed from Sangaré's published essay on terrorism in Mali, which is said to have drawn the ire of junta intelligence chief Modibo Koné. Reported by Malian outlet Le Soft and corroborated by The Africa Report.",
      whyItMatters: "A serving colonel handed a 20-year sentence by a cybercrime-specialized tribunal over a published book underscores how far Mali's junta is willing to stretch digital/speech-adjacent judicial tools against perceived internal rivals — a civic-space and regulatory-environment signal relevant to Meta's Mali risk picture.",

    { id: 210, date: '2026-09-04', category: 'Conflict & Security', country: 'Niger', tier: 'reported', platformIntegrity: false,
      headline: "Niger's Council of Ministers formally accuses France of orchestrating late-August mutiny, cites 'international legal action'",
      summary: "Meeting in Council of Ministers on 4 September 2026, Niger's government issued its first official statement on the 28-29 August 2026 events in Niamey, describing them as an attempted 'destabilization' and 'aggression' against the state and again naming Emmanuel Macron's France as responsible. The government said it has compiled 'substantial documentation' toward possible action before international courts, and separately thanked AES-confederation partners, Russia and Algeria for their solidarity. The statement follows French Foreign Minister Jean-Noël Barrot's denial the same day (item 206), calling Niger's accusation 'pure slander.'",

    { id: 211, date: '2026-09-06', category: 'Politics & Governance', country: 'Guinea', tier: 'confirmed', platformIntegrity: false,
      headline: "Prison administration confirms Algassimou Diallo's transfer to Macenta, 700km from Conakry, as defense disputes its legality",
      summary: "Guinea's penitentiary administration broke its silence on 6 September 2026 to confirm what had been reported as a 'forced disappearance' the day before: former Supreme Court prosecutor Algassimou Diallo was transferred on 5 September from Coyah prison to the Macenta detention facility, roughly 700km east of Conakry, rather than having vanished as his lawyers initially alleged. His defense team says it received no official notification of the transfer or its legal basis, and is demanding he be returned to Conakry ahead of a 8 September Supreme Court hearing. The update was corroborated across multiple independent Guinean outlets (Guinee360, Guineenews, Mediaguinee, Seneweb, Courrier Régional).",
      whyItMatters: "Confirms Diallo is alive and in custody, resolving the immediate disappearance alarm from item 208, but the unexplained, undisclosed transfer of a former state prosecutor to a remote prison — without notice to his counsel — keeps the rule-of-law and civic-space signal live heading into his 8 September hearing.",

    { id: 212, date: '2026-09-05', category: 'Politics & Governance', country: 'Guinea', tier: 'confirmed', platformIntegrity: false,
      headline: "Finance minister names 36 new financial-affairs division heads (DAF) across presidency, PM's office, ministries and constitutional bodies",
      summary: "Guinea's Minister of Economy, Finance and Budget, Mariama Ciré Sylla, signed an order — read on national television overnight 4-5 September — naming 36 new heads of Financial and Administrative Affairs Divisions (DAF) across the Presidency, the Prime Minister's Office, line ministries (Territorial Administration, Security, Justice, Foreign Affairs, Agriculture, Energy, Mines, Infrastructure and others) and constitutional institutions including the National Assembly, Supreme Court, Court of Accounts and the High Authority of Communication (HAC). The reshuffle was reported the same week as separate coverage of PM Bah Oury pushing to overhaul government administrative performance.",
      whyItMatters: "DAF posts control budget execution and financial administration inside every ministry and constitutional body, so a coordinated, government-wide reshuffle of these positions is a genuine governance-continuity and leadership-change signal for the client to track, not routine paperwork — new financial gatekeepers can affect how quickly public contracts, disbursements and data requests move through the bureaucracy.",
      source: 'Africa Guinée', url: 'https://www.africaguinee.com/guinee-presidence-primature-ministeresvoici-les-36-daf-nommes-par-la-ministre-mariama-cire-sylla/' },
    { id: 213, date: '2026-09-05', category: 'Politics & Governance', country: 'Guinea', tier: 'confirmed', platformIntegrity: false,
      headline: "Doumbouya marks 5th coup anniversary: 'not a day of triumph... a day of mourning'",
      summary: "In a Facebook statement on 5 September 2026, President Mamadi Doumbouya marked the fifth anniversary of the September 2021 coup by calling it a day of mourning and memory rather than celebration, paying tribute to security forces and victims who died in the takeover and calling for a moment of national silence. He credited the post-coup period with reducing 'ethnocentrism' between Guineans and reaffirmed his intent to keep governing through the transition.",
      whyItMatters: "The president's own choice to frame the coup anniversary as solemn rather than triumphant, alongside a pointed reaffirmation of his hold on power, is a direct read on regime messaging and legitimacy strategy as Guinea's referendum/electoral transition continues under close ECOWAS and Western scrutiny.",

    { id: 214, date: '2026-09-03', reportedDate: '2026-09-05', category: 'Politics & Governance', country: 'Guinea', tier: 'confirmed', platformIntegrity: false,
      headline: "Doumbouya sets five 'non-negotiable' demands for ministers, explicitly tied to Simandou 2040 delivery",
      summary: "Meeting his cabinet on 3 September 2026, President Doumbouya laid out five binding requirements for ministers: monthly project-progress tracking, a ban on financing any project without a completed feasibility study, a hard line against wasteful or off-procedure spending, quarterly reporting on local-content commitments (jobs, training, skills transfer), and regular field visits to project sites. Several outlets tied the directive explicitly to execution of the 'Simandou 2040' national development program built around the mining project.",
      whyItMatters: "A presidential mandate for stricter execution discipline and local-content reporting, explicitly framed around Simandou 2040, is a direct signal of how closely Conakry is tying its own governing credibility to visible delivery on the Simandou-linked infrastructure program — relevant to Meta's broader West Africa governance-continuity tracking beyond Rio Tinto's own operational lens.",
      source: 'Guinee360.com', url: 'https://www.guinee360.com/05/09/2026/chaque-franc-guineen-engage-doit-produire-un-resultat-visible-les-cinq-exigences-non-negociables-de-mamadi-doumbouya' },
    { id: 215, date: '2026-09-05', category: 'Platform Integrity', country: 'Senegal', tier: 'reported', platformIntegrity: true,

    { id: 216, date: '2026-09-06', category: 'Politics & Governance', country: 'Mali', tier: 'confirmed', platformIntegrity: false,

    { id: 217, date: '2026-08-31', category: 'Digital Innovation & Connectivity', country: 'Senegal', tier: 'confirmed', platformIntegrity: false,
      headline: "Senegal and Gambia advance digital-cooperation MoU on connectivity, cybersecurity and roaming",
      summary: "Senegal's Minister of Telecommunications and Digital Affairs, Samba Diouf, visited Banjul to work through implementation of a June 2026 memorandum of understanding with Gambia covering telecoms, IT and the digital economy. Regulators ARTP (Senegal) and PURA (Gambia) agreed to deepen cooperation on frequency coordination, service quality and cross-border roaming, with cybersecurity and connectivity named as priority workstreams; Gambia remains reliant on the ACE submarine cable with limited terrestrial redundancy via Senegal.",

    { id: 218, date: '2026-08-28', reportedDate: '2026-09-06', category: 'Politics & Governance', country: 'Burkina Faso', tier: 'confirmed', platformIntegrity: false,
      headline: "Former education minister Lionel Bilgo jailed pending trial over illegal land-subdivision sales",

    { id: 219, date: '2026-09-02', category: 'Politics & Governance', country: 'Togo', tier: 'confirmed', platformIntegrity: false,
      headline: "Ex-Defense Minister Marguerite Gnakadé nears one year in detention, on hunger strike since late July",
      summary: "Togo's former Minister of Armed Forces, Marguerite Gnakadé — arrested in September 2025 after publicly calling for President Faure Gnassingbé's departure and charged with harming state security and inciting the army to revolt — remains in an undisclosed detention location approaching a year later. Reporting on her conditions describes a total hunger strike she began on 27 July 2026 after seeing no improvement in her treatment; the national human rights commission (CNDH) has reportedly been refused access to her place of detention.",

    { id: 220, date: '2026-09-04', category: 'Politics & Governance', country: 'Togo', tier: 'confirmed', platformIntegrity: false,
      headline: "Togolese jurists and political actors debate scope of ECOWAS Court ruling against 2024 constitutional reform",
      summary: "Togo's National Framework for Consultation on Change (CNCC) convened jurists and political actors on 4 September to debate the implications of the ECOWAS Court of Justice's ruling (issued January, made public in June 2026) that Togo's March 2024 constitutional reform — which replaced direct presidential elections with parliamentary selection — amounted to an unconstitutional change of government. A rival civil-society network accused the opposition of exploiting the ruling for political gain, while the CNCC was reported the next day as maintaining a contested reading of the judgment's scope.",

    { id: 221, date: '2026-09-03', category: 'Politics & Governance', country: 'Togo', tier: 'reported', platformIntegrity: false,
      headline: "Detained French filmmakers authorized to return to France, closing out month-long detention saga",
      summary: "The two French filmmakers detained in Togo since late July — already reported provisionally released on medical/judicial grounds in items tracked through early September — were authorized on Thursday 3 September to return to France, according to Togolese press. This appears to close out the immediate custody phase of a case that had drawn attention partly for its ties to exiled investigative journalist Ferdinand Ayité's reporting network.",

      source: 'Icilome', url: 'https://icilome.com/2026/09/togo-les-deux-realisateurs-francais-detenus-autorises-a-rentrer-en-france-ce-jeudi/' },
    { id: 222, date: '2026-09-04', category: 'Politics & Governance', country: 'Togo', tier: 'reported', platformIntegrity: false,
      headline: "Togolese opposition and civil society rally behind exiled journalist Ferdinand Ayité after fresh death threats",
      summary: "Investigative journalist Ferdinand Ayité — the 2023 CPJ press-freedom award laureate who leads outlet L'Alternative and has lived in exile in Paris — used a 1 September livestream to say he feared for his life. Togolese opposition figures and civil-society groups publicly denounced the threats and voiced support for him on 4 September, framing it as part of a broader pattern of pressure on Ayité and people connected to his reporting.",

    { id: 223, date: '2026-09-03', reportedDate: '2026-09-04', category: 'Conflict & Security', country: 'Niger', tier: 'confirmed', platformIntegrity: false,
      headline: "Nigeria's foreign ministry denies Abuja or ECOWAS backed Niger's failed August mutiny",
      summary: "Nigeria's Ministry of Foreign Affairs issued a 3 September statement rejecting social-media claims that Abuja or ECOWAS had a hand in the 28-29 August mutiny attempt in Niamey, with Minister of State for Foreign Affairs Sola Enikanolaiye calling the claims \"baseless, irresponsible\" and a deliberate attempt to tarnish Nigeria's image. The ministry reaffirmed Nigeria's commitment to the ECOWAS Protocol on Democracy and Good Governance and said it would never support a military coup or unconstitutional change of government. The denial was reported independently by Vanguard and multiple allAfrica-syndicated Nigerian outlets on 4 September.",

    { id: 224, date: '2026-09-02', category: 'Network Disruption & Cybersecurity', country: 'Cameroon', tier: 'reported', platformIntegrity: false,
      headline: "Cameroonian cybersecurity officials disclose 2025 cybercrime scale and warn of active hacker-group threat",
      summary: "Cameroon's national cybersecurity agency ANTIC disclosed on 2 September that it recorded 17,500 cybercrime complaints in 2025 representing 5.8 billion FCFA in losses, dominated by social-engineering scams and phishing, alongside 21,280 domestic machines compromised into botnets. The same day, ANTIC official Beverly Muriele Ndzodoum Diboundje separately warned that Cameroon is being actively targeted by a hacker group, calling for closer public-private-audit coordination to harden critical digital infrastructure.",
      whyItMatters: "An official, quantified disclosure of cybercrime scale paired with an active hacker-group warning is a direct Network Disruption & Cybersecurity data point for Cameroon and a useful baseline for the regulator's enforcement posture and the country's exposure to platform-adjacent fraud.",
      source: 'Digital Business Africa', url: 'https://www.digitalbusiness.africa/le-cameroun-est-cible-par-un-groupe-de-hackers-alerte-beverly-muriele-ndzodoum-diboundje/' },
    { id: 225, date: '2026-09-07', category: 'Digital Innovation & Connectivity', country: 'Cameroon', tier: 'confirmed', platformIntegrity: false,
      headline: "Canadian telecom-tower operator NuRAN's cash reserves collapse 80% despite continued Cameroon buildout",
      summary: "NuRAN Wireless, which builds and operates telecom sites for Orange and MTN in Cameroon under a network-as-a-service model, ended Q2 2026 with just CAD 388,724 in cash (~159 million FCFA), down 80% from CAD 1.93 million three months earlier. Auditors flagged that short-term liabilities now exceed short-term resources by 4.43 billion FCFA, more than double the gap six months prior, and explicitly warned this creates material uncertainty about the group's ability to continue as a going concern.",
      whyItMatters: "A near-collapse in cash at a vendor building shared telecom infrastructure for Cameroon's two largest mobile operators is a direct connectivity-continuity risk signal, since a NuRAN funding failure could stall or reverse network-expansion commitments Orange and MTN are relying on.",
      source: 'Investir au Cameroun', url: 'https://www.investiraucameroun.com/gestion-publique/0709-23753-telecoms-le-canadien-nuran-voit-sa-tresorerie-chuter-de-80-au-t2-malgre-ses-deploiements-au-cameroun' },
    { id: 226, date: '2026-08-06', reportedDate: '2026-09-03', category: 'Business & Economy', country: 'DR Congo', tier: 'reported', platformIntegrity: false,
      headline: "Analysts warn DR Congo's copper/cobalt concentrate export ban risks fueling smuggling",
      summary: "DR Congo's government banned exports of unprocessed copper and cobalt concentrates on 6 August 2026 (with a one-year ministerial-waiver window) to force local processing and capture more value domestically. Business press analysis picked up broadly from 3 September onward warns that if the legal export channels close faster than domestic processing capacity can absorb output, a share of the sector risks shifting into informal-economy channels and reinforcing smuggling networks already active in the country's east.",
      whyItMatters: "A resource-nationalist policy with a credible risk of pushing part of DR Congo's mining economy into informal/smuggling channels is a business-environment and governance signal for Meta's DR Congo footprint, one of the client's least-covered tracked countries.",
      source: 'Financial Afrik', url: 'https://www.financialafrik.com/2026/09/03/rdc-linterdiction-des-exportations-minieres-pourrait-paradoxalement-alimenter-la-contrebande/' },
    { id: 227, date: '2026-08-20', reportedDate: '2026-09-06', category: 'Business & Economy', country: 'DR Congo', tier: 'confirmed', platformIntegrity: false,
      headline: "President Tshisekedi promulgates law paving way for a Kinshasa Stock Exchange, first listings targeted for 2027",
      summary: "President Félix Tshisekedi promulgated law n°26/034 on capital markets on 20 August 2026 (published in the Official Journal 2 September), creating the legal basis for a Kinshasa Stock Exchange with a securities compartment (equities/bonds) and a commodities compartment for agricultural, mining and industrial products. The law also creates a Financial Markets Regulatory Authority (ARMF), a central securities depositary and settlement banks; government officials are targeting first listings and trading between June and December 2027, with mining companies specifically flagged as intended early issuers.",
      whyItMatters: "A functioning domestic capital market with mining companies as anticipated early issuers is a medium-term business-environment development for DR Congo, one of Meta's least-covered tracked countries, and a signal of the government's broader push (alongside the copper/cobalt export-processing rules, item 226) to capture more value domestically from its resource sector.",
      source: 'Agence Ecofin', url: 'https://www.agenceecofin.com/actualites-finance/0609-141333-rdc-la-bourse-de-kinshasa-vise-ses-premieres-cotations-entre-juin-et-decembre-2027' },
    { id: 228, date: '2026-09-05', category: 'Conflict & Security', country: 'Senegal', tier: 'confirmed', platformIntegrity: false,
      headline: "Dakar cost-of-living protest spawns month-long social-media campaign against high prices",
      summary: "Several dozen to 200+ people, organized by the apolitical citizen/influencer collective \"30 Jours pour le Juste Prix,\" marched from Castors to the Grand-Dakar Jet d'eau roundabout on Saturday 5 September carrying empty baskets to protest rising food and living costs (meat prices up ~30% year-on-year; a basic thieboudienne now costing up to 10,000 FCFA). Organizers say the campaign will continue online throughout September, and outlets reported the online mobilization visibly growing in the days immediately following the physical march.",
      whyItMatters: "A cost-of-living protest that is deliberately organized and sustained through social-media mobilization is a Platform-adjacent civil-unrest signal for Meta in Senegal, and a leading indicator of the same household-affordability pressure sitting behind Senegal's sovereign-debt distress already tracked elsewhere in this dashboard.",
      source: 'APS / RFI (via Yahoo Actualités)', url: 'https://fr.news.yahoo.com/s%C3%A9n%C3%A9gal-apr%C3%A8s-manifestation-%C3%A0-dakar-010637184.html' },
    { id: 229, date: '2026-09-02', category: 'Digital Regulation & Compliance', country: 'Cameroon', tier: 'reported', platformIntegrity: false,
      headline: "MINPOSTEL says Cameroon's digital-administration and open-data bill has reached the Prime Minister's office",
      summary: "Speaking at an Internet Governance Forum roundtable on national digital-public-infrastructure governance, MINPOSTEL's Dr Pauline Tsafack said a draft law on open access to public information and digitalization of government administrations has been transmitted to the Prime Minister's services, and urged forum participants to press for swift examination given the legal framework's urgency for Cameroon's digital-public-infrastructure rollout.",
      whyItMatters: "A pending open-data/digitalization bill reaching the Prime Minister's desk is an early-stage Digital Regulation & Compliance signal for Cameroon worth tracking through to introduction and passage, alongside this run's other Cameroon items on cybercrime disclosure (224) and telecom-infrastructure financial risk (225).",
      source: 'Digital Business Africa', url: 'https://www.digitalbusiness.africa/dr-pauline-tsafack-minpostel-le-projet-de-loi-sur-la-digitalisation-des-administrations-est-desormais-sur-la-table-du-premier-ministre/' },
    { id: 230, date: '2026-09-07', category: 'Platform Integrity', country: 'Senegal', tier: 'reported', platformIntegrity: true,
      headline: "Kédougou man jailed after claiming a killing and asking for 'wealth sacrifice' advice during a TikTok live",
      summary: "Yahya Sidibé, 20, was placed under a formal detention order (mandat de dépôt) after telling a TikTok live audience hosted by a self-styled mystic that he had killed someone in Kaffrine and asking what \"sacrifices\" he needed to make to become rich. Arrested by Kédougou's Section de recherches and questioned, he said the claim was a staged performance, but prosecutors in Kaffrine charged him with spreading false news and glorifying crime rather than homicide, since no killing was substantiated.",
      whyItMatters: "A TikTok livestream serious enough to trigger a criminal false-news/apologie-du-crime prosecution is a fresh, concrete Platform Integrity data point for Senegal, reinforcing the pattern (alongside the Touba TikTok case, item 215) of Senegalese authorities treating platform livestreams as prosecutable public-order events.",

    { id: 231, date: '2026-09-06', reportedDate: '2026-09-07', category: 'Conflict & Security', country: 'Niger', tier: 'reported', platformIntegrity: false,
      headline: "Russia's ambassador publicly confirms Africa Corps role in crushing Niamey mutiny as new arrest wave targets special-forces soldiers",
      summary: "Russia's ambassador to Niger, Viktor Voropaev, publicly confirmed that Russian Africa Corps personnel (estimated 200-300 in-country) directly helped loyalist forces retake Air Base 101 from mutinous soldiers during the 28-29 August affair, according to the BBC. Separately, Niger's authorities carried out a fresh wave of arrests on 5-6 September targeting soldiers — especially special-forces personnel — suspected of involvement, including an officer detained roughly 100km from Niamey, with an investigation committee led by an officer close to junta chief Tiani; some reports point to possible mass desertions among the units implicated.",
      whyItMatters: "Moving from the junta's own claim (item 135) to Russia's own ambassador officially owning Africa Corps' combat role, alongside a second, broader arrest wave specifically inside special-forces ranks, is a material escalation in how deeply Niger's security establishment is now entangled with — and dependent on — Russian military support.",
      source: 'BBC News / Radio France Internationale (via Al Akhbar)', url: 'https://www.bbc.com/news' },
    { id: 232, date: '2026-09-07', category: 'Politics & Governance', country: 'Guinea', tier: 'reported', platformIntegrity: false,
      headline: "Algassimou Diallo's lawyers dispute newly aired prison footage and renew demands ahead of 8 September Supreme Court hearing",
      summary: "A day before the Supreme Court is due to examine the defense's request to have his case referred elsewhere, Algassimou Diallo's lawyers responded to national-television footage showing their client alive and unshackled inside a detention facility by saying the images prove nothing: they show neither the location nor the filming date, omit any extract from the prison register, and no family or defense visit has yet been authorized. The defense also disputes the prison administration's account that the transfer to Macenta followed the referral request itself, and is renewing calls for the registry extract, an immediate visit, disclosure of the transfer's legal basis, and Diallo's return to Conakry to appear at the hearing.",
      whyItMatters: "New, disputed facts surfacing the day before a closely watched Supreme Court hearing on a former senior magistrate's detention keep this a live judicial-transparency and rule-of-law signal for Guinea, worth resolving one way or another once the 8 September hearing concludes.",
      source: 'Guinee7.com', url: 'https://guinee7.com' },
    { id: 233, date: '2026-09-03', reportedDate: '2026-09-07', category: 'Politics & Governance', country: 'Togo', tier: 'reported', platformIntegrity: false,
      headline: "Three Togolese tax officials held in custody over alleged 150-million-FCFA extortion scheme at OTR",
      summary: "Three officials in the debt-recovery section of Togo's Direction Générale des Impôts (part of the Office Togolais des Recettes) have been in police custody at Lomé's judicial police headquarters for four days, accused of extorting a 150-million-FCFA payoff from a business under audit in exchange for burying its tax liabilities; the operator reportedly paid two of three agreed installments before the officials began threatening him over the delayed final payment, prompting him to alert the Finance Ministry. The case follows an earlier, separate OTR corruption scandal involving other named officials.",
      whyItMatters: "A second discrete corruption case inside Togo's revenue authority in quick succession is a Politics & Governance signal about institutional integrity at the agency responsible for tax and customs collection from businesses operating in Togo.",
      source: 'Togo Actualite', url: 'https://icilome.com' },
    { id: 234, date: '2026-09-06', reportedDate: '2026-09-07', category: 'Conflict & Security', country: 'Mali', tier: 'reported', platformIntegrity: false,
      headline: "FAMa strikes militant positions across Bandiagara, Mopti and Kidal regions in coordinated intelligence-led operations",
      summary: "Mali's armed forces (FAMa) conducted operations on Sunday 6 September 2026 against armed groups in three regions, per the Army General Staff: in Berdossou (Bandiagara region), forces located and struck sites described as sheltering several hundred fighters, war materiel and roughly 200 motorcycles; near Sofara (Mopti region), a group involved in cattle theft was located and neutralized; and south of Aguelhoc (Kidal region), vehicles and war materiel belonging to armed groups were identified and struck. The Staff frames the operations as part of the intelligence-led offensive it has sustained in recent weeks.",

      source: 'Maliweb.net', url: 'https://www.maliweb.net/insecurite/mali-les-fama-frappent-plusieurs-positions-terroristes-dans-trois-regions-3119735.html' },
    { id: 235, date: '2026-09-07', category: 'Politics & Governance', country: 'Mali', tier: 'reported', platformIntegrity: false,
      headline: "Le Témoin publisher Abderrahmane Keïta appears before Mali's Cybercrime Tribunal after three-month pretrial detention",
      summary: "Abderrahmane Keïta, publication director of the newspaper Le Témoin and a collaborator with Renouveau TV, was due to appear on 7 September 2026 before Mali's Pôle National de Lutte contre la Cybercriminalité (the same cybercrime tribunal that sentenced whistleblower Alpha Yaya Sangaré to 20 years — item 186) after being held in pretrial detention since 9 June and two prior hearing postponements. Available reporting is limited to the appearance itself; the specific charges and the hearing's outcome are not yet detailed.",

    { id: 236, date: '2026-09-07', category: 'Platform Integrity', country: 'Senegal', tier: 'reported', platformIntegrity: true,
      headline: "Three Senegalese TikTok influencers face flagrant-délit trial after cyberharassment campaign targeting rivals' children",
      summary: "Senegal's Cybersecurity Special Division (DSC) placed TikTok personalities Rokhaya Fall ('Rox La Chancelière'), Khadidiatou Kébé ('Jessy-cas') and Nafissatou Fall ('Narou Karma') in custody on 1 September after a WhatsApp tontine dispute escalated into months of TikTok Live feuds involving blackmail threats, hacking and the circulation of photos of minors, including a false claim that a 2-year-old had HIV. The three women tearfully reconciled and withdrew their complaints during a police-mediated confrontation, but prosecutors kept the cybercrime and public-order charges alive, referring the file to the Pikine-Guédiawaye prosecutor for a flagrant-délit trial due 9 September. Separately, Fall was pulled from prison again on 7 September for further DSC questioning over a distinct personal-data-distribution allegation.",

    { id: 237, date: '2026-09-07', category: 'Platform Integrity', country: 'Senegal', tier: 'reported', platformIntegrity: true,
      headline: "Touba gendarmerie extends custody for two TikTokers over insults to Mouride religious dignitary, releases a third",
      summary: "Following a religious-family complaint over TikTok videos deemed offensive toward Serigne Sidy Mbacké Abdou Lahat — stemming from a controversial visit by Sokhna Aïda Diallo, widow of Serigne Cheikh Béthio Thioune — Touba's gendarmerie brigade released TikToker 'Leukh Leukh' without charge on 7 September after he denied wrongdoing, while extending custody for two other TikTokers, 'Oumar Wass' and 'Khelcom,' who were due before the Diourbel prosecutor the next day.",

    { id: 238, date: '2026-09-07', category: 'Digital Regulation & Compliance', country: 'Senegal', tier: 'reported', platformIntegrity: false,
      headline: "Senegal's Supreme Court suspends Starlink's operating license pending abuse-of-power appeal",
      summary: "Senegal's Supreme Court, sitting in référé (interim-relief) proceedings, ordered the suspension of SpaceX subsidiary Starlink's telecom license on 7 September pending full review of an 'excès de pouvoir' appeal challenging the authorization; the ruling does not prejudge the underlying case. The service launched in February 2026 with state backing (a 5,000-kit preferential deal aiming to connect a million Senegalese) but had already drawn repeated ARTP regulatory friction over unauthorized resale and informal 'community wifi' schemes.",

    { id: 239, date: '2026-09-07', category: 'Digital Regulation & Compliance', country: 'Senegal', tier: 'confirmed', platformIntegrity: false,
      headline: "Senegal's data-protection authority hosts week-long African peer-learning summit on data governance",
      summary: "Senegal's Commission de Protection des Données Personnelles (CDP) opened a 7-11 September study visit in Dakar for African data-protection authorities, held with the African Union's AUDA-NEPAD and Germany's GIZ, drawing delegations from Chad, Comoros, Côte d'Ivoire, Cameroon, Gabon, DR Congo and Madagascar to discuss data-governance cooperation.",
      whyItMatters: "A multi-country forum on data-protection governance touching several Meta-tracked countries signals coordinated African regulatory capacity-building that could shape future data-request and compliance frameworks.",

    { id: 240, date: '2026-09-07', category: 'Politics & Governance', country: 'Mali', tier: 'reported', platformIntegrity: false,
      headline: "Prosecutors seek 3-year sentence (2 firm) against Le Témoin publisher Abderrahmane Keïta at Cybercrime Tribunal",
      summary: "At Le Témoin publisher Abderrahmane Keïta's first hearing on the merits before Mali's national cybercrime tribunal (item 235), following nearly three months of pretrial detention, prosecutors requested a three-year prison sentence, two years of it firm. The defense contested the charges; a verdict is expected within days.",

    { id: 241, date: '2026-09-07', category: 'Politics & Governance', country: 'Guinea', tier: 'reported', platformIntegrity: false,
      headline: "Algassimou Diallo's defense seeks October postponement after describing blindfolded, medication-free transfer to Macenta",
      summary: "Ex-prosecutor Algassimou Diallo told his lawyers by phone and in-person visit that he was transferred blindfolded from Coyah to Macenta prison (700km from Conakry) overnight without his glasses or medication, fearing for his life en route. His now eight-lawyer defense team has asked the Supreme Court to postpone the 8 September hearing to October for more preparation time, and says it has no confirmation he will even be produced for the hearing, which is legally mandatory in criminal matters.",

      source: 'RFI', url: 'https://www.rfi.fr/fr/afrique/20260907-guin%C3%A9e-vers-un-report-du-proc%C3%A8s-de-l-ex-magistrat-algassimou-diallo' },
    { id: 242, date: '2026-09-08', category: 'Politics & Governance', country: 'Senegal', tier: 'confirmed', platformIntegrity: false,
      headline: "PM Al Aminou Lô delivers General Policy Declaration under open PASTEF motion-de-censure threat",
      summary: "Prime Minister Ahmadou Al Aminou Lô delivered his Déclaration de Politique Générale (DPG) before a largely hostile National Assembly on 8 September, defending his roadmap on cost-of-living, power cuts and the IMF program. PASTEF deputies, who hold 130 of 165 seats, publicly floated a motion of censure as a symbolic sovereignty gesture over rising prices and outages, even though some in the party reportedly view collapsing the government as a strategic risk (President Faye could immediately reappoint Lô and dissolve the Assembly).",

    { id: 243, date: '2026-09-07', category: 'Politics & Governance', country: 'Senegal', tier: 'reported', platformIntegrity: false,
      headline: "Journalist alleges intelligence-gathering device found on Sonko-linked land in Sébikotane; Sonko camp denies and blames rival journalist",
      summary: "Journalist Madiambal Diagne reported that an intelligence-gathering device was discovered on a field belonging to Ousmane Sonko in Sébikotane, tying the claim to a separate complaint by Mouride religious dignitaries over remarks attributed to Sonko about Touba, with an investigation opened and complainants expected before the Sébikotane urban police. Sonko spokesman Cheikh Oumar Talla publicly denied the claim the same day and accused Diagne of fabricating it.",

    { id: 244, date: '2026-09-07', category: 'Business & Economy', country: 'Senegal', tier: 'confirmed', platformIntegrity: false,
      headline: "Senegal opens week-long IAEA-aligned workshop to launch nuclear-power program governance (NEPIO)",
      summary: "Senegal's Energy and Petroleum Minister Dr El Hadji Abdourahmane Diouf opened a 7-11 September workshop in Dakar to establish a Strategic Committee and National Implementation Body (NEPIO) for a future civil nuclear-power program, following the IAEA's milestone approach. The workshop is meant to clarify inter-institutional governance, planning, skills development and infrastructure preparation for eventual nuclear-origin electricity generation.",
      whyItMatters: "A concrete institutional step toward nuclear power is a significant long-horizon energy-infrastructure and investment-climate signal for Senegal, relevant background for Meta's own connectivity/business-landscape monitoring in the country.",

    { id: 245, date: '2026-09-07', category: 'Politics & Governance', country: 'Cameroon', tier: 'confirmed', platformIntegrity: false,
      headline: "NGO accuses Cameroon of 'complicit silence' over 36 African asylum-seekers deported from the US since January",
      summary: "Mandela Center International (MCI) said in a 7 September statement that Cameroon has never publicly responded to repeated appeals over 36 asylum-seekers from nine African countries (including DR Congo and Senegal) deported from the US to Cameroon on four flights between January and May 2026 under a bilateral arrangement with Washington. MCI says the deportees lack identity documents or clear legal status and is asking Yaoundé to guarantee non-refoulement and process asylum claims; Human Rights Watch has separately documented Cameroonian authorities detaining some deportees without legal basis.",
      whyItMatters: "A documented pattern of secretive US-Cameroon deportation flights and alleged unlawful detention is a rule-of-law and reputational signal for Cameroon's government, one of Meta's 9 tracked countries.",
      source: 'Dakaractu (citing Mandela Center International)', url: 'https://www.dakaractu.com/Migrants-africains-expulses-des-Etats-Unis-une-ONG-denonce-le-silence-du-Cameroun-et-interpelle-l-UA_a275747.html' },
    { id: 246, date: '2026-09-08', category: 'Business & Economy', country: 'Senegal', tier: 'reported', platformIntegrity: false,
      headline: "Wave's holdout from BCEAO's mandatory PI-SPI payment platform sharpens ahead of 30 September compliance deadline",
      summary: "Wave, the dominant mobile-money operator in Senegal and Côte d'Ivoire, has still not joined the BCEAO's Interoperable Instant Payment Platform (PI-SPI), launched across the eight-country UEMOA zone in September 2025 to guarantee real-time, cross-institution payments. The BCEAO has made PI-SPI participation mandatory for all banks and e-money issuers, with a compliance deadline of 30 September 2026, but analysts note Wave has few commercial incentives to open its dominant, captive user base to smaller competitors and may instead pursue a bank-charter route (Wave Bank Africa) to join on its own terms.",
      whyItMatters: "A stand-off between the region's dominant mobile-money platform and a binding central-bank interoperability mandate is a live competitive/regulatory-compliance story for any digital-platform player operating in Senegal, with the 30 September deadline forcing a resolution one way or another.",
      source: 'OSIRIS / Jeune Afrique', url: 'https://www.osiris.sn/wave-face-a-la-plateforme-pi-spi-et-l-interoperabilite-refus-ou-dilemme.html' },
    { id: 247, date: '2026-09-08', category: 'Business & Economy', country: 'Senegal', tier: 'confirmed', platformIntegrity: false,
      headline: "PM Al Aminou Lô confirms 'hidden debt' claims and 1,956bn FCFA in arrears to businesses during DPG, citing need for IMF program",
      summary: "During his 8 September Déclaration de Politique Générale, PM Ahmadou Al Aminou Lô confirmed Ousmane Sonko's earlier claims about undisclosed ('hidden') debt and acknowledged Senegal has entered a period of structural adjustment, including a halt to some public projects. He cited 1,956 billion FCFA in state arrears owed to businesses as a key reason the government needed an IMF-backed program, alongside the separately reported 1,243 billion FCFA fiscal exposure already facing the government.",
      whyItMatters: "An on-the-record prime-ministerial confirmation of hidden debt and a concrete arrears figure sharpens the fiscal-transparency and IMF-conditionality risk picture already flagged for Senegal, with direct relevance to state payment reliability for any commercial or investment partner.",
      source: 'Dakaractu', url: 'https://www.dakaractu.com/Dette-1956-milliards-d-arrieres-aux-entreprises-Pourquoi-il-fallait-un-programme-avec-le-FMI-selon-Al-Aminou-Lo_a275762.html' },
    { id: 248, date: '2026-09-08', category: 'Politics & Governance', country: 'Guinea', tier: 'reported', platformIntegrity: false,
      headline: "Guinea's Supreme Court postpones Algassimou Diallo trial to 15 October over defendant's absence",
      summary: "Guinea's Supreme Court postponed the trial of ex-prosecutor Algassimou Diallo to 15 October 2026 after he did not appear at the bar for the scheduled 8 September hearing. The postponement follows his defense team's request last week for more preparation time and its concerns about his condition after a blindfolded, medication-free overnight transfer to Macenta prison.",
      whyItMatters: "A confirmed postponement — rather than the forced hearing his defense feared — is a small but concrete due-process signal worth tracking alongside the broader rule-of-law concerns already flagged for Guinea.",
      source: 'Mosaiqueguinee.com', url: 'https://mosaiqueguinee.com/2026/09/cour-supreme-laffaire-algassimou-diallo-renvoyee-au-15-octobre/' },
    { id: 249, date: '2026-09-07', reportedDate: '2026-09-08', category: 'Politics & Governance', country: 'Senegal', tier: 'confirmed', platformIntegrity: false,
      headline: "Senegal's Constitutional Council strikes down automatic loss of parliamentary mandate for absent deputies",
      summary: "Ruling on a referral the President filed on 27 August, the Constitutional Council upheld the procedure used to adopt the National Assembly's revised internal rules but struck down the specific clause stripping deputies of their seats after ten consecutive absences from plenary sessions. The Council held that the Constitution alone fixes the grounds for losing a parliamentary mandate (party resignation mid-term, a final criminal conviction), so an internal-rules reform could not add a new one.",
      whyItMatters: "A top court checking the Assembly's own disciplinary reach — even on a narrow procedural point — is a governance-continuity signal worth tracking as parliamentary rule-making and executive-legislative tension continue to play out around the DPG debate.",
      source: 'SenePlus', url: 'https://www.seneplus.com/article/le-conseil-constitutionnel-censure-la-decheance-automatique-des-deputes-absenteistes' },
    { id: 250, date: '2026-09-08', category: 'Politics & Governance', country: 'Senegal', tier: 'confirmed', platformIntegrity: false,
      headline: "PM Al Aminou Lô sets Senegal's local elections for 17 January 2027, legislative elections for 2029",
      summary: "During his General Policy Declaration before the National Assembly, PM Ahmadou Al Aminou Lô ended months of uncertainty by fixing municipal and departmental elections for 17 January 2027 — the deadline PASTEF had publicly pressed the government to respect, given sitting mayors and departmental councillors elected in January 2022 are now past term. He also confirmed legislative elections for 2029, giving the full electoral calendar in one statement.",
      whyItMatters: "A confirmed electoral calendar removes a live source of PASTEF-government friction and gives Meta a fixed near-term window (local campaign period into January 2027) to watch for the platform-fraud, disinformation and civic-mobilization activity that typically accompanies Senegalese election cycles.",
      source: 'Senego', url: 'https://senego.com/al-aminou-lo-fixe-les-elections-locales-au-17-janvier-2027_2000901.html' },
    { id: 251, date: '2026-09-08', category: 'Network Disruption & Cybersecurity', country: 'Niger', tier: 'reported', platformIntegrity: false,
      headline: "Automated monitoring detects a critical-severity internet connectivity drop in Niger",
      summary: "The IODA (Internet Outage Detection and Analysis) monitoring system, run by Georgia Tech's Internet Intelligence Lab, flagged a critical-severity connectivity anomaly in Niger on 8 September 2026, with a measurable drop across its tracked measurements. No Nigerien regulator, operator or mainstream outlet had published an explanation for the drop — cause (fibre cut, deliberate restriction, technical fault) and duration are both unconfirmed as of this run.",
      whyItMatters: "Niger has no dedicated Inoreader coverage and is chronically under-represented in Network Disruption & Cybersecurity reporting; even an unconfirmed automated detection is worth flagging early so a follow-up can confirm cause once local/regional press picks it up.",
      source: 'IODA (Georgia Tech Internet Intelligence Lab)', url: 'https://ioda.inetintel.cc.gatech.edu/dashboard' },
    { id: 252, date: '2026-09-08', category: 'Politics & Governance', country: 'Senegal', tier: 'confirmed', platformIntegrity: false,
      headline: "PM Al Aminou Lô accuses predecessor Sonko's team of $55M Yakaar-Teranga loss during DPG; Thierno Alassane Sall demands accounting",
      summary: "During his 8 September General Policy Declaration, PM Ahmadou Al Aminou Lô said Senegal lost roughly $55M (about 33bn FCFA) because the previous government withdrew the Yakaar-Teranga gas permit from Kosmos Energy too hastily, arguing the state could have secured penalties/fines had it waited three more months. Opposition deputy and former minister Thierno Alassane Sall publicly challenged the PM to clarify whether this was 'incompetence or a deliberate arrangement, and in exchange for what,' escalating the dispute into a direct blame exchange with former PM Ousmane Sonko's camp. Corroborated across Dakaractu (two separate articles) and Seneweb.",
      whyItMatters: "A sitting PM publicly quantifying a $55M state loss and blaming his own coalition predecessor deepens the intra-PASTEF Sonko-Faye/Al Aminou Lô rift already tracked (items 242-243, 249-250) and keeps the Yakaar-Teranga/GTA-adjacent gas dossier — an area of direct platform-adjacent business relevance — a live source of governance instability.",
      source: 'Dakaractu', url: 'https://www.dakaractu.com/Yakaar-Teranga-perte-de-55-millions-de-dollars-Thierno-Alassane-Sall-decele-une-grave-accusation-du-PM-contre-son_a275804.html' },
    { id: 253, date: '2026-09-08', category: 'Platform Integrity', country: 'Senegal', tier: 'reported', platformIntegrity: true,
      headline: "New complainant 'Ramz Yago' emerges in tiktokeuses saga; Rox counter-files over WhatsApp view-once video",
      summary: "A new front opened in the ongoing Rox/Jessica/Narou tiktokeuses saga (items already tracked around their 9 September flagrant-délit trial): a Dubai-based hair vendor using the alias 'Ramz Yago' (real name reported as Rama Diaw) filed a complaint against Rox (Rokhaya Fall) accusing her of publishing a video showing Ramz Yago's intimate parts, which Ramz Yago says she originally sent via a WhatsApp 'view-once' message. While in DSC custody, Rox filed a counter-complaint against Ramz Yago with supporting evidence for alleged unauthorized collection/distribution of personal data. Corroborated across Seneweb, Dakarposte and Sunugal24; Jessica was separately extracted from Liberté 6 detention the same day for further DSC questioning.",
      whyItMatters: "A named allegation that a WhatsApp 'view-once' image was captured and redistributed adds a distinct platform-mechanics data point (view-once circumvention) to the already-tracked tiktokeuses Platform Integrity thread, and lands the same week as the trio's own 9 September trial date — worth watching for how it affects that case's outcome.",
      source: 'Seneweb (also Dakarposte, Sunugal24, sanslimitesn.com)', url: 'https://www.seneweb.com/fr/news/Exclusif/exclusif-apres-ses-aveux-rox-porte-plainte-contre-son-accusatrice-ramz-yago-jessica-extraite-de-prison_n_503712.html' },
    { id: 254, date: '2026-09-09', category: 'Platform Integrity', country: 'Senegal', tier: 'reported', platformIntegrity: true,
      headline: "Tiktokeuses trial postponed as prosecution seeks arrest of 'Rams Yango', Jessica faces new DSC complaint",
      summary: "The Pikine-Guédiawaye trial of Rox (Rokhaya Fall), Jessica (Khadidiatou Kébé) and Nafissatou Fall, initially set for 9 September, was postponed. Rox remained in DSC custody, questioned over criminal-association and illegal personal-data collection/storage/disclosure charges, while prosecutors sought the arrest of 'Rams Yango' (Rama Diaw), the original complainant against Rox. Separately, Kébé was pulled from detention and placed in further DSC custody after a new complaint from a woman using the alias Anita, who accuses Kébé of obtaining an intimate video and passing it to another TikToker who made it public.",
      whyItMatters: "The postponement and expanding charge list (now including a second, unrelated intimate-image complaint against Kébé) show this Platform Integrity case continuing to widen rather than resolve, keeping WhatsApp/TikTok-linked prosecutions in the Senegalese news cycle and delaying any read on how DSC/prosecutors will ultimately treat platform-mediated personal-data offenses.",
      source: 'Dakaractu (also Libération, Senego)', url: 'https://www.dakaractu.com/Association-de-malfaiteurs-collecte-et-diffusion-illicites-de-donnees-Ce-que-risquent-les-Tik-Tokeuses-mises-en-cause_a275808.html' },
    { id: 255, date: '2026-09-08', category: 'Digital Innovation & Connectivity', country: 'Niger', tier: 'confirmed', platformIntegrity: false,
      headline: "Algérie Télécom and Niger Télécom sign partnership for 100Gbps Ngezam-Agadez fibre link",
      summary: "Algérie Télécom signed two partnership agreements in Niamey on 8 September 2026: one with Niger Télécom, including a donation of transmission equipment to establish a fibre-optic connection between Ngezam and Agadez with an initial capacity of 100 gigabits, expanding Niger Télécom's national backbone, plus a second convention on training Niger Télécom staff; and a separate agreement with telecoms school ESCEP-Niger to set up a skills centre. Corroborated across Le Sahel, Agence Nigérienne de Presse, Agence Ecofin and Niger Télécom's own site.",
      whyItMatters: "A concrete cross-border fibre-capacity expansion and operator-training partnership strengthens Niger's telecom backbone and digital-infrastructure resilience, a direct Digital Innovation & Connectivity data point for the Client's Niger risk picture.",
      source: 'Agence Nigérienne de Presse (also Le Sahel, Agence Ecofin)', url: 'https://anp.ne/cooperation-algerie-telecom-signe-deux-conventions-de-partenariat-avec-niger-telecom-et-escep-niger/' },
    { id: 256, date: '2026-09-08', reportedDate: '2026-09-09', category: 'Politics & Governance', country: 'Senegal', tier: 'reported', platformIntegrity: false,
      headline: "New reporting on Yakaar-Teranga dispute: PM alleges someone 'substituted themselves for the State' to waive the $55M claim, citing a contested 1 June letter",
      summary: "Deeper reporting on PM Al Aminou Lô's 8 September DPG remarks (already tracked as item 252) added detail: Lô grounded the $55M claim in Article 19 of the Petroleum Code, covering unexecuted contractual obligations owed to the state when a license lapses, and alleged that an unnamed party — with reporting pointing toward Petrosen and/or Kosmos — had improperly decided to waive Senegal's entitlement to that sum. He said a 1 June letter from the outgoing energy minister to Petrosen's director-general had already contested that waiver decision as exceeding its author's authority. Opposition figure Thierno Alassane Sall separately called the episode a 'grave accusation' against former PM Sonko.",
      whyItMatters: "The allegation has moved from a simple opportunity-cost figure to a specific, unresolved claim that an official overstepped their authority to waive money owed to the Senegalese state on a strategic gas asset — a governance-accountability dispute inside the ruling coalition bearing on the credibility and continuity of decision-making around Senegal's hydrocarbon sector, an area of direct platform-adjacent business relevance for the Client.",
      source: 'Dakaractu', url: 'https://www.dakaractu.com/Yaakaar-Teranga-Sonko-annoncait-le-retrait-de-Kosmos-Al-Aminou-Lo-revele-un-contentieux-—-qu-est-il-reellement-advenu_a275805.html' },
    { id: 257, date: '2026-09-08', category: 'Politics & Governance', country: 'Cameroon', tier: 'confirmed', platformIntegrity: false,
      headline: "Maurice Kamto resigns as MRC president after 13 years, deputy Mamadou Mota follows minutes later",
      summary: "Maurice Kamto, founder and 13-year president of Cameroon's main opposition party MRC (Mouvement pour la Renaissance du Cameroun), resigned on 8 September 2026 in a letter to the party's National Directory, citing the 'superior interest' of the party and its activists. First vice-president Mamadou Mota, his closest lieutenant, resigned minutes later. The dual departure follows months of internal contestation over Kamto's leadership mandate and comes weeks after Cameroon's electoral body ELECAM rejected his 2025 presidential candidacy. Tiriane Balbine Nadège Noah, who has served as interim president during prior Kamto absences, has taken over party leadership.",
      whyItMatters: "A sudden leadership vacuum atop Cameroon's principal opposition force ahead of the 2027 electoral cycle could reshape which political and civil-society voices gain prominence on Meta's platforms in Cameroon, and is worth tracking for any successor faction's own platform/regulatory posture.",
      source: 'AllAfrica', url: 'https://fr.allafrica.com/stories/202609090164.html' },
    { id: 258, date: '2026-09-08', category: 'Politics & Governance', country: 'Guinea', tier: 'confirmed', platformIntegrity: false,
      headline: "Morocco and Guinea sign 25 cooperation agreements at 8th Joint Commission, Rabat endorses Simandou 2040 vision",
      summary: "Guinean Foreign Minister Morissanda Kouyaté and Moroccan Foreign Minister Nasser Bourita co-chaired the 8th Morocco-Guinea Joint Commission in Conakry on 8 September 2026, concluding 25 cooperation instruments spanning agriculture, energy, health, justice, education, vocational training, transport, port infrastructure, tourism and culture. Morocco formally recognized Guinea's Simandou 2040 development vision as a framework for the partnership.",
      whyItMatters: "A deepening Morocco-Guinea diplomatic and technical partnership broadens Conakry's set of external backers for its post-coup transition, a governance-continuity signal relevant to the stability of the regulatory and platform environment under Doumbouya.",
      source: 'Africa Guinée', url: 'https://www.africaguinee.com/guinee-maroc-25-accords-strategiques-signes-a-conakry-pour-dynamiser-la-cooperation-bilaterale/' },
