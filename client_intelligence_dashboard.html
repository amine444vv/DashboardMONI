      summary: "Worker representatives at SETER, the operator of Dakar's Regional Express Train, lodged a 30-day strike notice on 11 September 2026 after what they describe as repeated rounds of consultation and negotiation that produced no concrete answers to their claims on purchasing power, career progression and pay equity. The notice was filed with management and with the labour authorities. It lands the same evening as a separate strike-notice announcement by the STDS-SYNATRACS inter-union at the airport operator AIBD, indicating broader labour friction across Senegal's state-linked transport infrastructure companies.",
      whyItMatters: "Industrial action building across Senegal's state-adjacent infrastructure operators is an early read on how much fiscal room the Faye government has under its IMF programme, which is the same constraint that shapes its appetite for digital-services taxation and telecom levies.",
      source: 'Senego', url: 'https://senego.com/pouvoir-dachat-carrieres-equite-les-travailleurs-de-la-seter-reclament-des-reponses-et-deposent-un-preavis-de-greve-de-30-jours_2001952.html' },
    { id: 308, date: '2026-09-11', reportedDate: '2026-09-12', category: 'Business & Economy', country: 'Senegal', tier: 'confirmed', platformIntegrity: false,
      headline: "Senegal raises 101.3bn FCFA on the UMOA regional market as it keeps funding the budget outside the IMF programme",
      summary: "Senegal's Direction generale des financements et de la dette mobilised 101.339 billion FCFA (about 182 million dollars) from investors on the UEMOA regional financial market on Friday 11 September 2026, through a treasury-bond issue raised to cover the state's budget needs. The operation was reported by Financial Afrik and Lejecos on 12 September. It comes while the roughly 2.2 billion dollar Extended Credit Facility agreed with the IMF at staff level on 1 September still awaits board approval, and while Dakar's debt-treatment talks with private creditors remain open.",
      whyItMatters: "Every large regional-market raise while the IMF programme is unapproved tightens the debt-service arithmetic that determines how aggressively the Faye government pursues new revenue lines, and digital-services taxation and telecom levies sit near the top of that list for a state looking for quick, collectable receipts.",
      source: 'Financial Afrik (also Lejecos)', url: 'https://www.financialafrik.com/2026/09/12/le-senegal-leve-101339-milliards-de-fcfa-sur-le-marche-financier-de-lumoa/' },
    { id: 309, date: '2026-09-11', category: 'Politics & Governance', country: 'Senegal', tier: 'confirmed', platformIntegrity: false,
      headline: "Mamadou Kasse resigns from Macky Sall's APR, widening the drift out of the former ruling party",
      summary: "Mamadou Kasse, president of the Tambacounda departmental council and a former director general of SICAP and of SN HLM, announced in a statement on Friday 11 September 2026 that he is leaving the Alliance pour la Republique, the party of former president Macky Sall, after years of membership. He framed the decision as the end of a long period of reflection, thanked Sall for their political companionship, and said he intends to open a new chapter in his public and political engagement without yet naming a destination. The resignation was carried the same evening by Seneweb, Dakaractu, PressAfrik, Senego, Senegal7 and Xibaaru.",
      whyItMatters: "Continued senior departures from the APR reduce the chance of a coherent opposition bloc forming against Pastef before the next electoral cycle, which in turn lowers the political friction the Client should expect around the government's digital-regulation and platform-accountability agenda.",
      source: 'Seneweb (also Dakaractu, PressAfrik, Senego, Senegal7)', url: 'https://www.seneweb.com/fr/news/Politique/mamadou-kasse-quitte-lapr-et-annonce-louverture-dun-nouveau-chapitre-de-son-engagement-politique_n_504029.html' },
    { id: 310, date: '2026-09-11', reportedDate: '2026-09-12', category: 'Politics & Governance', country: 'Niger', tier: 'confirmed', platformIntegrity: false,
      headline: "Tiani removes armed-forces chief of staff Barmou two weeks after the Niamey mutiny, promoting Kiaou and reshuffling the army command",
      summary: "Brigadier General Moussa Salaou Barmou left his post as chief of staff of Niger's armed forces on Friday 11 September 2026, replaced by presidential decree with Brigadier General Mahaman Sani Kiaou, until then head of the army general staff; General Abdourahmane Abou Zataka takes Kiaou's former post, so both of the top two rungs of the military hierarchy changed in a single day. Barmou had held the job since August 2023, days after the coup that removed Mohamed Bazoum, and previously commanded Niger's special forces. The reshuffle follows the 28-29 August mutiny in which dissident soldiers seized air base 101 next to Niamey's Diori Hamani airport and moved on the presidential palace and national television before the presidential guard retook the site with support from the Russian Africa Corps; arrests of soldiers and political figures, including a former defence minister, continued in the following days.",
      whyItMatters: "A change at the top of the security apparatus two weeks after an armed challenge to the junta is the clearest read yet on how contested Niamey's internal power balance is, and it matters for the Client because Niger's communications, licensing and shutdown decisions are made by a government whose stability is now visibly in question. Resolves the open question carried since item 304 on General Barmou's fate.",
      source: 'La Nouvelle Tribune (citing Agence Nigerienne de Presse; also Channels TV, Benin Web TV)', url: 'https://lanouvelletribune.info/2026/09/niger-le-general-barmou-figure-du-putsch-de-2023-limoge-par-tiani-apres-la-mutinerie/' },
    { id: 311, date: '2026-09-10', reportedDate: '2026-09-11', category: 'Digital Innovation & Connectivity', country: "Côte d'Ivoire", tier: 'confirmed', platformIntegrity: false,
      headline: "Abidjan clears the way for 5G spectrum awards and publishes a 2026-2028 digital acceleration plan built on seven pillars",
      summary: "Digital Transition and Technological Innovation Minister Djibril Ouattara announced on Thursday 10 September 2026, opening the second national artificial-intelligence conference Impact IA 2026 in Abidjan, that the government has formally authorised the allocation of frequencies to operators ahead of a 5G launch. The ministry has adopted a 2026-2028 acceleration plan organised around seven pillars including structuring internet connectivity, strengthening cybersecurity and deploying an ethical national AI capability, with public administration, agriculture, health, education and the private sector named as the five priority application sectors between 2026 and 2030. The Agence ivoirienne de gestion des frequences radioelectriques, headed by Yacouba Coulibaly, handles spectrum planning, allocation and control for the rollout.",
      whyItMatters: "Côte d'Ivoire moving from 5G consultation to an actual spectrum award, inside a plan that also names cybersecurity and AI governance as pillars, sets the bandwidth and policy baseline the Client's services will run on in one of the region's largest markets — and flags where the next licensing and data-governance rules are likely to originate.",
      source: 'OSIRIS (citing APAnews)', url: 'https://www.osiris.sn/rci-feu-vert-de-l-etat-pour-l-octroi-des-frequences-5g.html' },
    { id: 312, date: '2026-09-10', reportedDate: '2026-09-11', category: 'Digital Innovation & Connectivity', country: 'Cameroon', tier: 'confirmed', platformIntegrity: false,
      headline: "Cameroon's regulator presses MTN and Orange on rural coverage, with a quarter of the population still outside 4G and 5G",
      summary: "Cameroon's telecoms regulator ART held a working session on Thursday 10 September 2026, chaired by director general Philemon Zoo Zame and attended by MTN Cameroon's Wanda Matandela and Orange Cameroun's Patrick Benon, at which operators were asked to keep extending network coverage into underserved areas. ITU data cited in the reporting put roughly 75% of Cameroonians inside 3G and 4G footprints in 2025, with about 12.2% of the 29.9 million population uncovered by 2G and 25% outside 4G and 5G; 5G has not been commercially deployed in the country. DataReportal figures for end-2025 give 12.6 million internet users, a 41.9% penetration rate, against 29 million mobile subscriptions. Service quality — dropped calls, unstable connections, falling throughput — was flagged as a parallel concern alongside coverage.",
      whyItMatters: "A quarter of Cameroon's population sitting outside 4G is a direct ceiling on the Client's addressable audience and on data-heavy product use, and a regulator now publicly tying coverage obligations to quality-of-service complaints is the kind of pressure that tends to precede licence conditions or universal-service levies.",
      source: 'OSIRIS (citing Agence Ecofin)', url: 'https://www.osiris.sn/cameroun-les-operateurs-telecoms-invites-a-poursuivre-l-extension-du-reseau.html' },
    { id: 313, date: '2026-09-08', reportedDate: '2026-09-10', category: 'Digital Innovation & Connectivity', country: 'Niger', tier: 'confirmed', platformIntegrity: false,
      headline: "Algeria and Niger agree a 100 Gb terrestrial fibre link from In Guezzam to Agadez, closing a gap in the Trans-Saharan backbone",
      summary: "Agreements signed in Niamey on Tuesday 8 September 2026 between Algerie Telecom and Niger Telecom provide for a terrestrial fibre-optic link between the two countries with an initial capacity of 100 Gb, including a donation of transmission equipment by the Algerian operator to connect In Guezzam on the Algerian side to Agadez in northern Niger. The link is one segment of the Dorsale transsaharienne a fibre optique, a regional project intended to connect Algeria to Niger, Nigeria, Chad, Mali and Mauritania and improve landlocked states' access to international networks. Algeria has already laid roughly 2,600 km of fibre from Algiers to In Guezzam, and the Nigerien side of the project was reported 97% complete at the start of 2026. A second agreement covers a vocational training centre.",
      whyItMatters: "A new northbound terrestrial route gives Niger international capacity that does not depend on the coastal subsea systems whose cuts have repeatedly degraded West African connectivity — a structural resilience gain for the Client's services in a market where outages have been a recurring risk, and one that also shifts transit dependence toward Algiers.",
      source: 'Agence Ecofin (also Journal du Niger, Agence Nigerienne de Presse)', url: 'https://www.agenceecofin.com/actualites-numerique/1009-141451-fibre-optique-l-algerie-et-le-niger-bientot-relies-par-une-liaison-terrestre-de-100-gb' },
    { id: 314, date: '2026-09-10', reportedDate: '2026-09-11', category: 'Politics & Governance', country: 'Togo', tier: 'confirmed', platformIntegrity: false,
      headline: "Togo's opposition calls for general mobilisation after a fuel price rise takes petrol to 817 FCFA a litre",
      summary: "The Togolese government announced new pump prices on 10 September 2026 taking unleaded premium petrol to 817 FCFA a litre, with diesel at 766, kerosene at 1,056 and two-stroke mix at 896; the petrol increase of 92 FCFA is about 12.7% in one step. In a joint statement the opposition movements DMK-Originale, DMP, LDP and 'Touche Pas A Ma Constitution' described the rise as a 'financial asphyxiation' of households, noting it amounts to more than 20% in four months, and called on the population to prepare for a peaceful general mobilisation.",
      whyItMatters: "An opposition coalition converting a pump-price decision into a call for nationwide mobilisation is the kind of cost-of-living trigger that in this region has repeatedly produced street protest organised on the Client's platforms — and, in Togo specifically, connectivity restrictions around periods of unrest.",
      source: 'Icilome (also Afreepress, Actu Togo, Matin Libre)', url: 'https://icilome.com/2026/09/hausse-du-carburant-au-togo-lopposition-denonce-une-asphyxie-financiere-des-menages/' },
    { id: 315, date: '2026-09-11', reportedDate: '2026-09-12', category: 'Politics & Governance', country: 'Senegal', tier: 'confirmed', platformIntegrity: false,
      headline: "Sonko rules out a lasting institutional confrontation and calls for 'loyal dialogue' with Faye as the extraordinary session closes",
      summary: "Closing the National Assembly's extraordinary session after Prime Minister Ahmadou Al Aminou Lo's general policy declaration, Speaker Ousmane Sonko set aside the prospect of a durable clash between institutions and called for loyal dialogue with President Bassirou Diomaye Faye, while defending parliament's autonomy and arguing that differences between the presidency, the government and the parliamentary majority must respect the Constitution and each institution's legitimacy. He also insisted on parliament's scrutiny role, saying it should back measures in the national interest, improve them where needed and oppose those it judges contrary to the country's priorities. Social affairs minister Maimouna Dieye separately called for cohesion around the Sonko-Faye 'tandem', describing herself as a bridge between the two men. No confidence vote was sought after the 8 September declaration, and Pastef deputies have voiced reservations on debt management and relations with the IMF.",
      whyItMatters: "The most explicit de-escalation signal yet from the side of the Pastef rift that controls the legislature, which lowers the near-term odds of an institutional crisis disrupting the budget and regulatory calendar the Client tracks in Senegal — though the underlying disagreement over debt and the IMF programme is unresolved.",
      source: 'Senego', url: 'https://senego.com/ousmane-sonko-appelle-a-un-dialogue-loyal-avec-bassirou-diomaye-faye_2002008.html' },
    { id: 316, date: '2026-09-08', reportedDate: '2026-09-12', category: 'Business & Economy', country: 'Senegal', tier: 'confirmed', platformIntegrity: false,
      headline: "Press digest of the DPG puts consolidated public-sector debt near 132% of GDP and domestic revenue at 56.9% of target",
      summary: "A press review of Prime Minister Ahmadou Al Aminou Lo's roughly twelve-hour general policy declaration of Tuesday 8 September 2026, published on 12 September, sets out the fiscal numbers behind it: consolidated public-sector debt of about 132% of GDP at end-2024, more than 23,500 billion FCFA, or 25,583 billion and 128.6% of GDP on another perimeter; parastatal debt up from 816 billion FCFA in 2019 to 1,917 billion in 2024; the 2024 budget deficit revised to 13.7% of GDP; non-hydrocarbon growth of just 2.2% in 2025 with the deficit at 6.4%. Against that, the government is banking on a 6,166 billion FCFA Economic and Social Recovery Plan, while domestic revenue to end-August 2026 stood at 172.5 billion FCFA against a 303.3 billion target, a 56.9% realisation rate. State payment arrears were put at 1,956 billion FCFA across 5,425 files at end-March 2025, and a fuel-subsidy reform was announced on the basis that 65% of roughly 800 billion FCFA in subsidies accrues to the richest fifth of households.",
      whyItMatters: "These are the numbers against which the supplementary budget and the IMF programme will be judged, and a revenue line running at 57% of target while debt sits near 132% of GDP points to continued fiscal squeeze — the backdrop for any digital-services tax, licence-fee or spectrum-revenue measure the Client could face in Senegal.",
      source: 'Senego (press review of APS-received dailies)', url: 'https://senego.com/dpg-dette-autour-de-132-du-pib-pres-a-6-166-milliards-et-recettes-a-569_2001968.html' },
    { id: 317, date: '2026-09-12', category: 'Platform Integrity', country: 'Senegal', tier: 'reported', platformIntegrity: true,
      headline: "Prosecutor keeps the 'Ramz Yago' case alive after her DSC confrontation with Rox: detention order despite withdrawn complaints, eight counts listed against Rox",
      summary: "After her confrontation with Rokhaya Fall ('Rox la Chancelière') at the Division spéciale de cybersécurité, the complainant-turned-suspect known as 'Ramz Yago' (Ramatoulaye Diaw) was placed under a detention order by the Dakar prosecutor, Saliou Dicko, Senegalese outlets reported on 12 September 2026. The two women withdrew their complaints against each other after the confrontation, but the prosecutor chose to keep the case going on the ground of a manifest disturbance to public order and morality; the charges concern public insults and remarks contrary to good morals aimed at Rox's late mother, including a video filmed at the Yoff cemetery that Ramz Yago denies having made. Dakaractu lists eight counts under discussion against Rox herself, and Senego reports that a trial date has been fixed. Both strands of the case remain pending (Dakaractu, Senego, Seneweb, Exclusif, Dakarposte).",
      whyItMatters: "A prosecutor overriding withdrawn private complaints to keep prosecuting a dispute that began as TikTok content and WhatsApp messaging signals that Senegal's cyber-prosecution track now runs on public-order grounds rather than on victims' wishes — widening the range of platform-mediated speech that can produce detention orders and, with it, the volume of data-preservation and account-identification requests the Client should expect (follow-through on items 253-254 and 266).",
      source: 'Dakaractu (also Senego, Seneweb, Exclusif, Dakarposte)', url: 'https://www.dakaractu.com/Affaire-Rox-Ramz-Yago-mandat-de-depot-pour-Ramz-Yago-huit-chefs-d-inculpation-evoques-contre-Rox_a275934.html' },
    { id: 318, date: '2026-09-12', category: 'Politics & Governance', country: 'Senegal', tier: 'confirmed', platformIntegrity: false,
      headline: "Former minister Abdoulaye Seydou Sow leaves the APR and launches 'Pacte Républicain', a day after Mamadou Kassé's exit",
      summary: "Abdoulaye Seydou Sow — former Urban Planning minister under Macky Sall, mayor of Kaffrine and secretary-general of the Senegalese football federation — announced on Saturday 12 September 2026 that he was leaving the Alliance pour la République and unveiled a new political formation, Pacte Républicain, presenting its identity, emblem and orientations before elected officials and party figures from several regions. He said he was no longer listened to or involved in the party's decisions, and told the press he would answer within fifteen days the call from Kiiraay's Aminata Touré to join the presidential camp. The move follows Mamadou Kassé's departure from the APR on 11 September (item 309) (Senego, Dakaractu, Rewmi, Exclusif, Africtelegraph).",
      whyItMatters: "Two senior APR departures in two days, one of them into a new vehicle openly weighing a Kiiraay alliance, show the former ruling party being cannibalised by the presidential camp rather than consolidating as an opposition pole — reinforcing the read in item 309 that Faye's side, not Pastef, is accumulating the political capital that will shape Senegal's regulatory and digital-policy agenda into 2027.",
      source: 'Senego (also Dakaractu, Rewmi, Exclusif, Africtelegraph)', url: 'https://senego.com/abdoulaye-seydou-sow-quitte-lapr-et-lance-le-pacte-republicain_2002157.html' },
    { id: 319, date: '2026-09-12', category: 'Business & Economy', country: 'Senegal', tier: 'confirmed', platformIntegrity: false,
      headline: "Mid-year budget execution: tax revenue at 2,458.7bn FCFA, 45.7% of the annual target and up 17.6% year on year; spending at 40.1% of the budget",
      summary: "Senegal's budget-execution report for the second quarter of 2026, relayed by Le Soleil and Seneweb on 12 September, puts tax revenue at end-June 2026 at 2,458.7 billion FCFA — 45.7% of the 5,384.8 billion annual target and 97.9% of the half-year target of 2,510.7 billion — an increase of 368.2 billion FCFA (17.6%) on a year earlier, driven mainly by direct taxes. Non-tax revenue reached 124.2 billion FCFA, 112.9% of its half-year target of 110 billion. Total general-budget expenditure was executed at 2,874.7 billion FCFA, a 40.1% execution rate against the initial 2026 budget law.",
      whyItMatters: "A revenue line slightly behind its half-year target while spending runs at 40% is the arithmetic the supplementary budget due at the National Assembly by 15 September has to close — and the pressure to find new collectable receipts is what keeps digital-services levies, telecom fees and spectrum revenue on the table in the Client's largest tracked market (see item 316 for the Prime Minister's own figures).",
      source: 'Le Soleil (also Seneweb, Sanslimitesn)', url: 'https://lesoleil.sn/actualites/economie/execution-budgetaire-2e-trimestre-2026-les-recettes-fiscales-ont-atteint-2-458-milliards-de-fcfa/' },
    { id: 320, date: '2026-09-12', category: 'Business & Economy', country: 'Senegal', tier: 'confirmed', platformIntegrity: false,
      headline: "Doctors' union SAMES calls a second 48-hour nationwide strike for 16-17 September, citing the state's 'guilty silence'",
      summary: "The Syndicat autonome des médecins, pharmaciens et chirurgiens-dentistes du Sénégal (SAMES) announced a new 48-hour strike across the country on Wednesday 16 and Thursday 17 September 2026, with emergency care maintained, in a statement issued after its extraordinary session of 10 September and relayed on 12 September. The union calls its 8-9 September strike 'massive, disciplined and exemplary' and says no verifiable commitment or serious opening of dialogue has followed; its long-standing demands cover the status of hospital practitioners, working conditions, career security and allowances (Senego, Dakaractu, Seneweb, Ndarinfo).",
      whyItMatters: "A second strike wave in the public health system within ten days, alongside the SETER and AIBD notices (item 307), points to state-sector labour friction spreading under the fiscal squeeze the IMF programme imposes — the same constraint that shapes how hard the government leans on telecom and digital revenue, and a mobilisation that will be organised and contested on the Client's platforms.",
      source: 'Seneweb (also Senego, Dakaractu, Ndarinfo)', url: 'https://www.seneweb.com/fr/news/Sante/secteur-sanitaire-le-sames-annonce-une-nouvelle-greve-de-48h-les-16-et-17-septembre_n_504042.html' },
    { id: 321, date: '2026-09-10', category: 'Politics & Governance', country: 'Senegal', tier: 'confirmed', platformIntegrity: false,
      headline: "Financial-crimes pool reports a two-year tally of 750 cases, 1,391 people arrested and more than 100bn FCFA seized or secured",
      summary: "In an interview with RTS on Thursday 10 September 2026, relayed by Le Soleil, Senego and Dakaractu over the following days, the prosecutor of the Pool judiciaire financier, El Hadji Alioune Abdoulaye Sylla, set out the body's record as it approaches its second anniversary: 750 files handled, of which 610 are still before investigating judges; 1,391 people arrested and brought before the pool, producing more than 1,000 detention orders; 114 files closed and sent for trial, 83 of them already judged; and more than 100 billion FCFA seized in cash, movable and immovable assets or posted as bail, including 40.6 billion FCFA deposited with the Caisse des Dépôts et Consignations.",
      whyItMatters: "The PJF is the body that handles Senegal's large financial-crime, cyber-fraud and asset-recovery cases, so its scale — more than 1,300 arrests in two years, most still at the investigation stage — is a direct read on the volume of judicial requests for account, transaction and messaging data the Client's platforms will keep receiving from Dakar.",
      source: 'Le Soleil (also Senego, Dakaractu, Seneweb)', url: 'https://lesoleil.sn/actualites/societe-fait-divers/2-ans-pool-judiciaire-financier-1-391-personnes-deferees-plus-de-100-milliards-de-fcfa-saisis-en-especes-et-en-biens/' },
    { id: 322, date: '2026-09-11', reportedDate: '2026-09-13', category: 'Business & Economy', country: 'DR Congo', tier: 'confirmed', platformIntegrity: false,
      headline: "Kinshasa adopts a 57,500bn FC ($24.8bn) draft budget for 2027, up 12%, days before the constitutional filing deadline",
      summary: "At its 98th meeting on Friday 11 September 2026, chaired by President Félix Tshisekedi, the Council of Ministers adopted the draft finance law for 2027 presented by Deputy Prime Minister and Budget Minister Adolphe Muzito: a balanced budget of 57,500 billion Congolese francs, about 24.8 billion dollars, 12% above the 2026 supplementary budget of roughly 22 billion dollars and one of the largest in the country's recent history. The text must be filed with the National Assembly by the constitutional deadline of 15 September, when the parliamentary session opens (Actualite.cd, Congo Quotidien, Reporter.cd, Zoom Eco).",
      whyItMatters: "The 2027 budget is where DR Congo sets the excise, licence-fee and digital-tax assumptions that fall on telecom operators and, increasingly, on platform services, so its arrival in parliament on 15 September opens the window in which any new levy on the Client's activity in its largest francophone market would be written.",

function countFlagged(list) {
  return list.filter(x => x.flag).length;
}

function renderSidebar(activeId) {
  const el = document.getElementById('clientList');
  el.innerHTML = CLIENTS.map(c => {
    const newsCount = c.id === 'meta' ? (MONITORING_FEED.meta || []).length : (NEWS[c.id] || []).length;
    return `<button class="client-btn ${c.id === activeId ? 'active' : ''}" data-id="${c.id}">
      <span class="client-swatch" style="background:${c.color}"></span>
      <span class="name">${c.name}</span>
      <span class="count">${newsCount}</span>
    </button>`;
  }).join('');
  el.querySelectorAll('.client-btn').forEach(btn => {
    btn.addEventListener('click', () => renderClient(btn.dataset.id));
  });
}

function groupBy(list, key) {
  const groups = {};
  list.forEach(item => {
    const k = item[key] || 'Other';
    if (!groups[k]) groups[k] = [];
    groups[k].push(item);
  });
  return groups;
}

function renderStakeholders(clientId) {
  const list = STAKEHOLDERS[clientId] || [];
  if (!list.length) return `<div class="empty-state">No stakeholders recorded yet.</div>`;
  const multiCountry = new Set(list.map(s => s.country)).size > 1;
  if (!multiCountry) {
    return list.map(s => stakeItemHtml(s)).join('');
  }
  const groups = groupBy(list, 'country');
  return Object.keys(groups).map(country => `
    <div class="stake-group-title">${country}</div>
    ${groups[country].map(s => stakeItemHtml(s)).join('')}
  `).join('');
}

function stakeItemHtml(s) {
  return `<div class="stake-item">
    <div class="top">
      <span class="stake-name">${s.name}</span>
      <span class="stake-type">${s.type}</span>
    </div>
    <div class="stake-note">${s.note}${s.flag ? ` <em>(${s.flag})</em>` : ''}</div>
  </div>`;
}

function newsItemHtml(n) {
  return `<div class="news-item" data-search="${(n.headline + ' ' + n.summary + ' ' + n.country).toLowerCase()}">
    <div class="news-meta">
      <span class="news-date">${n.date}</span>
      <span class="news-country">${n.country}</span>
    </div>
    <p class="news-headline">${n.headline}</p>
    <p class="news-summary">${n.summary}</p>
    <div class="news-footer">
      <span class="news-source"><a href="${n.url}" target="_blank" rel="noopener">${n.source} ↗</a></span>
      ${n.flag ? `<span class="flag-badge">⚠ ${n.flag}</span>` : ''}
    </div>
  </div>`;
}

function tierPill(tier) {
  const map = { confirmed: 'Confirmed', reported: 'Reported', assessment: 'Assessment' };
  const label = map[tier] || tier || '';
  return label ? `<span class="tier-pill ${tier}">${label}</span>` : '';
}

function feedItemHtml(item) {
  const country = item.country || 'Senegal';
  const isPI = item.category === 'Platform Integrity';
  return `<div class="feed-item ${item.platformIntegrity ? 'pi-flag' : ''}" data-id="${item.id}" data-category="${item.category}" data-country="${country}" data-search="${(item.headline + ' ' + item.summary + ' ' + country).toLowerCase()}">
    <div class="feed-meta">
      <span class="feed-date">Event: ${item.date}</span>
      ${item.reportedDate && item.reportedDate !== item.date ? `<span class="feed-date-reported">Reported: ${item.reportedDate}</span>` : ''}
      <span class="feed-country">${country}</span>
      <span class="feed-category ${isPI ? 'pi' : ''}">${item.category}</span>
      ${tierPill(item.tier)}
    </div>
    <p class="feed-headline">${item.headline}</p>
    <p class="feed-summary">${item.summary}</p>
    <div class="feed-why"><strong>Why it matters for the Client:</strong> ${item.whyItMatters}</div>
    ${item.url ? `<div class="news-source" style="margin-top:6px;"><a href="${item.url}" target="_blank" rel="noopener">${item.source || 'Source'} ↗</a></div>` : ''}
  </div>`;
}

function formatEventDate(ev) {
  if (ev.endDate && ev.endDate !== ev.startDate) return `${ev.startDate} → ${ev.endDate}`;
  return ev.startDate;
}

function eventItemHtml(ev) {
  return `<div class="feed-item" data-id="ev-${ev.id}">
    <div class="feed-meta">
      <span class="feed-date">${formatEventDate(ev)}</span>
      <span class="feed-country">${ev.location}</span>
    </div>
    <p class="feed-headline">${ev.name}</p>
    <p class="feed-summary"><strong>Organizer:</strong> ${ev.organizer}</p>
    <div class="feed-why"><strong>Why it matters for the Client:</strong> ${ev.whyItMatters}</div>
    ${ev.url ? `<div class="news-source" style="margin-top:6px;"><a href="${ev.url}" target="_blank" rel="noopener">Event site ↗</a></div>` : ''}
  </div>`;
}

function entityGroupHtml(entities) {
  const groups = {};
  entities.forEach(e => { (groups[e.category] = groups[e.category] || []).push(e); });
  return Object.keys(groups).map(cat => `
    <div class="entity-group-title">${cat}</div>
    ${groups[cat].map(e => `<div class="entity-item"><div class="entity-name">${e.name}</div><div class="entity-note">${e.note}</div></div>`).join('')}
  `).join('');
}

    const pi = list.filter(i => i.platformIntegrity).length;

/* ============================================================
   Optical alignment — nudges large display type so visible ink,
   not the box edge, lands flush against the column margin.
   ============================================================ */

(function () {
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  function opticalNudge(el) {
    if (!el || !el.textContent) return;
    const cs = getComputedStyle(el);
    ctx.font = `${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
    const ch = el.textContent.trim().charAt(0);
    if (!ch) return;
    try {
      const m = ctx.measureText(ch);
      const bearing = m.actualBoundingBoxLeft || 0;
      el.style.marginLeft = bearing > 0.5 ? `-${Math.min(bearing, 6).toFixed(2)}px` : '0px';
    } catch (e) { /* canvas metrics unsupported — skip silently */ }
  }
  function align() {
    document.querySelectorAll('.client-header h2').forEach(opticalNudge);
    document.querySelectorAll('.stat-tile .value').forEach(opticalNudge);
  }
  window.__opticalAlign = align;
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(align);
  } else {
    setTimeout(align, 200);
  }
  let resizeT;
  window.addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(align, 120); });
})();
