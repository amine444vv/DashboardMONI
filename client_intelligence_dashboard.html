    { id: 124, date: '2026-08-26', reportedDate: '2026-08-27', category: 'Digital Regulation & Compliance', country: 'DR Congo', tier: 'confirmed', platformIntegrity: false,
      headline: "DRC orders Vodacom, Airtel, Orange and Africell to reimburse subscribers over poor telecom service quality",
      summary: "DRC's Minister of Posts and Telecommunications, José Mpanda Kabangu, met the country's four mobile operators on 26 August 2026 and ordered them to reimburse data/airtime consumed abnormally or unjustifiably, following widespread complaints about fast-draining data plans, unstable connections and quietly raised tariffs with shorter validity periods. Operators must also stand up dedicated complaint hotlines, with a parallel channel at regulator ARPTC for unresolved cases; ARPTC has separately acquired new equipment to monitor network performance, spectrum use and operator data directly.",

    { id: 125, date: '2026-08-27', category: 'Politics & Governance', country: 'DR Congo', tier: 'confirmed', platformIntegrity: false,
      headline: "Opposition figure Marley Vuvu released on provisional liberty after defamation confrontation hearing",
      summary: "Marley Vuvu, coordinator of the Mouvement révolutionnaire congolais and a member of the C64 coalition, was released on provisional liberty on the evening of 27 August 2026 after four days in custody. His release followed a confrontation hearing at the Kinshasa/Gombe tribunal de paix with Inspector General of Finances Christophe Bitasimwa, who accuses Vuvu of making defamatory remarks against him; his lawyer said the defense views the statements as non-criminal.",

    { id: 126, date: '2026-08-28', reportedDate: '2026-08-27', category: 'Politics & Governance', country: 'Togo', tier: 'reported', platformIntegrity: false,
      headline: "Togolese journalist Yves Galley summoned by gendarmerie criminal-investigation unit, no charges specified",
      summary: "La Symphonie publisher Yves Galley was summoned by the gendarmerie's Service central de recherches et d'investigations criminelles (SCRIC) to appear in Lomé on Friday 28 August 2026 as part of what authorities describe as a judicial investigation. As of the summons, no specific motive or charge had been communicated to the journalist, and Togolese press organizations are watching to see whether the case is handled as ordinary law or under the press code's specific framework (which decriminalizes press offenses).",

    { id: 127, date: '2026-08-27', category: 'Business & Economy', country: 'Senegal', tier: 'reported', platformIntegrity: false,
      headline: "IPRES retirees and unions accuse Labor Ministry of seeking power to appoint and remove pension-fund directors",
      summary: "Senegal's Front syndical, grouping 12 union confederations, accused the Ministry of Labour, Public Service and Public Service Reform (led by Mamadou Lamine Dianté) of unilaterally amending the unified social-security code to let the state appoint and revoke IPRES's directors-general, eroding the pension fund's management autonomy. The front also noted the state owes IPRES over 100 billion CFA francs in unmet obligations, including on the minimum pension, and said it is organizing a response.",

    { id: 128, date: '2026-08-26', category: 'Conflict & Security', country: 'Mali', tier: 'confirmed', platformIntegrity: false,
      headline: 'Two buses robbed on the Gao-Kobé axis near Ansongo',
      summary: "Four armed men on two motorcycles robbed two buses near Kobé, roughly 35km from Gao, on 26 August 2026, demanding 20,000 CFA francs from each passenger and assaulting several of them. Malian armed forces (FAMa) reportedly neutralized the four assailants afterward. Multi-sourced via Studio Tamani and Bamada.net.",

    { id: 129, date: '2026-08-29', category: 'Conflict & Security', country: 'Niger', tier: 'confirmed', platformIntegrity: false,
      headline: "Gunfire and explosions rock Niamey as attackers target airport, Base 101 and the presidential-palace perimeter",
      summary: "Sustained gunfire and explosions were heard across several areas of Niger's capital Niamey in the early hours of Saturday 29 August 2026. A security source told Reuters that assailants attacked Diori Hamani International Airport and attempted to breach the presidential-palace security perimeter, while attackers also targeted the nearby Base 101 military installation before security forces regained control. No group had claimed responsibility and no official casualty figures had been released as of publication.",

    { id: 130, date: '2026-08-28', category: 'Conflict & Security', country: 'Mali', tier: 'confirmed', platformIntegrity: false,
      headline: "Prisoner exchange frees ~62 Malian soldiers, plus Nigerien and Burkinabè troops, for a detained FLA leader",
      summary: "Malian security sources and the Front de Libération de l'Azawad (FLA) confirmed on Friday 28 August 2026 that around 62 Malian soldiers held by the rebel group were freed in exchange for FLA leader Inkinane Ag Attaher, who had been detained in Niger since 2025. Niger's President Abdourahamane Tiani personally facilitated the wider exchange, under which 12 Nigerien and 7 Burkinabè soldiers held by jihadist or rebel groups were also released, part of a broader wave that has freed roughly 110 regional soldiers over the past ten days.",
      whyItMatters: "A widening, junta-brokered prisoner-exchange track between Mali, Niger and Burkina Faso is a notable Sahel de-escalation signal for the Client's Mali security monitoring, even as it underscores how entangled Mali's conflict has become with cross-border AES coordination.",
      source: 'Saharamedias (also RFI)', url: 'https://fr.saharamedias.net/liberation-de-62-soldats-maliens-contre-celle-dun-dirigeant-du-fla-grace-a-une-mediation-nigerienne/' },
    { id: 131, date: '2026-08-28', category: 'Politics & Governance', country: 'Senegal', tier: 'confirmed', platformIntegrity: false,
      headline: "Senegal's National Assembly bureau reasserts control over PM Lô's general policy declaration timetable",
      summary: "Senegal's National Assembly bureau said on Friday 28 August 2026 that it, not the Prime Minister, controls the scheduling of PM Ahmadou Al Aminou Lô's long-pending General Policy Declaration (DPG). PM Lô's office had proposed presenting the DPG on 1 September, but the presidential decree convening that day's extraordinary session named the DPG as its sole agenda item without fixing a session date; the Assembly clarified that 1 September would cover only the session's formal opening, quorum and adjournment, leaving the actual DPG date still unset.",
      whyItMatters: "A procedural standoff over the DPG timetable between the Pastef-aligned Assembly bureau and PM Lô's office is a fresh, concrete marker of the open Sonko-Faye/Lô institutional rupture already tracked in this feed, relevant to the Client's governance-continuity monitoring in Senegal.",
      source: 'Dakaractu (also APS, Xalima, Senegal7)', url: 'https://www.dakaractu.com/Declaration-de-politique-generale-ce-1er-septembre-Couac-procedural-selon-l-Assemblee-qui-reprend-la-main-sur-le_a275439.html' },
    { id: 132, date: '2026-08-28', category: 'Politics & Governance', country: 'Niger', tier: 'confirmed', platformIntegrity: false,
      headline: "Niger frees journalist Ibro Chaibou after nearly ten months in pretrial detention on cybercrime charges",
      summary: "Nigerien journalist Ibro Chaibou, a newsroom manager at Radio Télévision Saraounia, was released on or around 28 August 2026 after nearly ten months in pretrial detention. He had been held since 30 October 2025 on cybercrime-law charges after allegedly forwarding a government press-conference invitation to an exile linked to ousted president Mohamed Bazoum; reporting on his release describes him as the last journalist still held pending trial from the wave of cybercrime-law cases opened since the 2023 coup.",
      whyItMatters: "Chaibou's release closes out the most prominent outstanding case in the cybercrime-law crackdown on journalists this feed has tracked in Niger (see item 3), a concrete if modest data point on the junta's handling of digital-speech prosecutions relevant to the Client's platform-risk monitoring there.",
      source: 'Les Echos du Niger', url: 'https://lesechosduniger.com/2026/08/28/media-apres-pres-de-dix-mois-de-detention-le-journaliste-ibro-chaibou-retrouve-la-liberte/' },
    { id: 133, date: '2026-08-27', reportedDate: '2026-08-28', category: 'Politics & Governance', country: 'DR Congo', tier: 'confirmed', platformIntegrity: false,
      headline: "Tshisekedi opens national dialogue process as opposition coalition C64 rejects the format",
      summary: "President Félix Tshisekedi announced the opening of an inclusive national political dialogue on Thursday 27 August 2026, prioritizing prior provincial consultations. C64 coalition figure Joseph Edeba immediately rejected the initiative as a 'consultation under tutelage,' and the PPRD said it did not recognize itself in the approach, while Washington voiced support for Tshisekedi's initiative. The divergence between the presidential approach and the C64's demand for an immediate consensual framework leaves the dialogue's legitimacy and participants still contested.",
      whyItMatters: "A contested national-dialogue process with a major opposition coalition opting out at the outset is a governance-continuity and political-stability signal for DR Congo worth tracking as the process develops, particularly given the country's fragile eastern-conflict backdrop.",
      source: "Oeil d'Afrique (also Mediacongo.net, Actualite.cd, Congo Quotidien)", url: 'https://oeildafrique.com/2026/08/28/dialogue-national-en-rdc-tshisekedi-ouvre-le-processus-lopposition-reclame-le-sien-et-se-divise/' },
    { id: 134, date: '2026-08-27', category: 'Business & Economy', country: 'Senegal', tier: 'confirmed', platformIntegrity: false,
      headline: "Jumia Senegal begins selling Starlink satellite-internet kits on its marketplace",
      summary: "Jumia Senegal announced on 27 August 2026 that it has begun selling the Starlink Standard Kit V4 (antenna and Wi-Fi router) directly on its e-commerce marketplace for 165,000 FCFA, with a cheaper Starlink Mini version said to be coming soon. The move puts satellite-internet hardware behind one of the market's largest e-commerce platforms rather than niche importers alone.",

    { id: 135, date: '2026-08-29', reportedDate: '2026-08-30', category: 'Conflict & Security', country: 'Niger', tier: 'confirmed', platformIntegrity: false,
      headline: "Niger's junta says Russian Africa Corps helped retake Base 101 from mutinous soldiers, dozens arrested",
      summary: "Niger's authorities said on the evening of Saturday 29 August 2026 that the Presidential Guard, loyal to junta leader Abdourahamane Tiani, retook Niamey's Base 101 air base from a group of mutinous officers who had entrenched themselves there overnight, with Russia's ambassador confirming the paramilitary Africa Corps assisted in suppressing the mutiny. Loyalist forces regained control of the capital's strategic sites and arrested dozens of soldiers involved in the unrest; as of Sunday 30 August no official casualty toll had been released. The episode resolves the immediate security question left open by the initial overnight attack on the airport, Base 101 and the presidential-palace perimeter (item 129), while confirming a direct Russian paramilitary role in the junta's internal security.",
      whyItMatters: "Confirmation that Niger's junta required Russian Africa Corps support to put down a mutiny by its own officers signals real internal-cohesion strain at the top of the regime, raising the odds of a reactive internet shutdown or tighter digital surveillance and underscoring Russia's deepening security foothold — both directly relevant to the Client's connectivity and platform-risk exposure in Niger.",
      source: 'Jeune Afrique (also Bénin Web TV, Nasuba Infos, Agence Nigérienne de Presse)', url: 'https://www.jeuneafrique.com/1838805/politique/tentative-de-coup-detat-au-niger-ce-que-lon-sait-de-la-situation-a-niamey/' },
    { id: 136, date: '2026-08-30', category: 'Conflict & Security', country: 'Guinea', tier: 'reported', platformIntegrity: false,
      headline: "20 African civil-society organizations demand independent probe into Forécariah mass grave, as Guinea's defense ministry breaks silence",
      summary: "Marking the International Day of the Victims of Enforced Disappearances, 20 African civil-society organizations issued a joint declaration from Brazzaville on 30 August 2026 demanding an independent, transparent investigation, forensic autopsies and DNA testing into the six bound and blindfolded bodies found in a mass grave near Forécariah on 24 August, and announced a joint filing with the sitting ECOWAS chair and the UN human-rights office seeking a fact-finding mission. Separately, Guinea's defense and security commission said no definitive conclusions could yet be drawn, and FNDC lawyers filed their own demand for independent autopsies and DNA comparisons. The victims remain unidentified nearly a week after discovery.",
      whyItMatters: "Escalating African and international civil-society pressure — now explicitly invoking ECOWAS and UN mechanisms — on an unresolved mass-killing case in a Simandou rail-corridor prefecture keeps Guinea's human-rights and security-governance record under sustained external scrutiny, a relevant country-risk marker for the Client's Guinea monitoring.",
      source: 'Le Révélateur224 (also Koumamedia, Africtelegraph)', url: 'https://www.lerevelateur224.com/2026/08/30/decouverte-de-six-corps-a-forecariah-20-organisations-de-la-societe-civile-africaine-exigent-justice-et-la-fin-de-limpunite-declaration/' },
    { id: 137, date: '2026-08-29', category: 'Conflict & Security', country: 'DR Congo', tier: 'confirmed', platformIntegrity: false,
      headline: "ADF fighters kill 21 civilians in twin attacks on Ituri's Mambasa territory",
      summary: "Suspected Allied Democratic Forces (ADF) fighters killed 21 civilians in two attacks on the villages of Mabakuha and Amani, in the Babila Teturi grouping of Mambasa territory, Ituri province, on Friday 28 and Saturday 29 August 2026, per the Nouvelle Société Civile Congolaise (NSCC). Ten people died at Mabakuha and eleven at Amani; a hospital, a church and several homes were burned. The attacks continue a wave of ADF violence in the same territory that has killed dozens of civilians since 21 August, with local civil-society leaders calling for reinforced military operations and for security services to investigate suspected Maï-Maï collaboration with the ADF.",
      whyItMatters: "A fresh, high-casualty wave of ADF violence in Ituri deepens DR Congo's eastern-conflict backdrop just as President Tshisekedi's contested national-dialogue process gets underway (item 133), reinforcing the country's fragile security climate as a relevant governance-continuity and country-risk signal for the Client.",
      source: 'MediaCongo Press (also Radio Okapi, Reporter.cd)', url: 'https://www.congo-press.com/provinces/ituri-une-vingtaine-de-civils-tues-dans-deux-attaque-des-adf-a-mambasa/' },
    { id: 138, date: '2026-08-28', category: 'Business & Economy', country: 'Senegal', tier: 'confirmed', platformIntegrity: false,
      headline: "Moody's downgrades Senegal's sovereign rating to Caa2, keeps negative outlook, as IMF talks continue",
      summary: "Moody's downgraded Senegal's sovereign credit rating from Caa1 to Caa2 on 28 August 2026, maintaining a negative outlook, citing rising refinancing pressure, weakening debt-service capacity and limited deleveraging prospects. The agency flagged the political rift between the executive and a Sonko-led legislature — after Sonko's move from the premiership to the National Assembly presidency — as a factor that could delay needed budget measures, alongside the prolonged absence of an IMF program (a mission was in Dakar 19 August-1 September negotiating a new one), youth unemployment and Sahel-linked security risk. Public debt is estimated near 108% of GDP.",
      whyItMatters: "A second sovereign downgrade tied explicitly to the Sonko-Faye institutional rupture reinforces the fiscal and governance-continuity risk already tracked in this feed (items 110, 131) and is a concrete data point on how the executive-legislature standoff is now feeding through to Senegal's international credit standing, relevant to the Client's country-risk monitoring.",
      source: 'PressAfrik (also Financial Afrik, Bloomberg, Rewmi, Xibaaru)', url: 'https://www.pressafrik.com/Moody-s-degrade-la-note-souveraine-du-Senegal-a-Caa2-et-maintient-une-perspective-negative_a310707.html' },
    { id: 139, date: '2026-08-30', category: 'Conflict & Security', country: 'Mali', tier: 'confirmed', platformIntegrity: false,
      headline: "Malian forces repel armed assault on Kignan police station in Sikasso region",
      summary: "Armed groups attempted to attack the police station (commissariat) in Kignan, Sikasso region, at around 6am on Sunday 30 August 2026; Mali's Defense and Security Forces repelled the assault and said the situation was under control, per a FAMa-sourced report. The incident is the latest in a string of attacks and repelled assaults reported around Sikasso and Kayes in recent days as JNIM's wider campaign against state and economic targets continues.",
      whyItMatters: "A repelled attack on a police station well outside Mali's traditional central/northern conflict zones shows JNIM-linked activity continuing to test targets further south, a relevant general security-backdrop data point for the Client's Mali footprint alongside the Kayes-region industrial-site campaign already tracked for B2Gold.",
      source: 'Bamada.net', url: 'https://bamada.net/region-de-sikasso-les-forces-de-defense-mettent-en-echec-un-assaut-arme-a-kignan' },
    { id: 140, date: '2026-08-30', category: 'Conflict & Security', country: 'Niger', tier: 'confirmed', platformIntegrity: false,
      headline: "AES bloc and Algeria rally behind Niger after Base 101 mutiny; Algiers delivers four Su-30 fighter jets",
      summary: "The Alliance of Sahel States (AES) confederation publicly denounced the 28-29 August Base 101 mutiny in Niamey (items 129, 135) as a \"betrayal\" and reaffirmed its solidarity with Niger's junta, while Algeria's foreign ministry became the first foreign government to react, expressing \"full solidarity\" with Niamey's authorities hours after the unrest. On Sunday 30 August, Niger's Prime Minister Ali Mahamane Lamine Zeine received four Algerian Sukhoi Su-30 fighter jets and an Il-78 refuelling aircraft at Niamey's Diori Hamani airport, which Algiers and Niamey both framed as continued \"strategic support\" for Niger's armed forces, following four helicopters Algeria delivered on 9 August. The Organisation of Islamic Cooperation separately voiced concern and solidarity with Niger over the mutiny.",
      whyItMatters: "External military and diplomatic backing for Niger's junta in the immediate aftermath of an internal mutiny at the same airport/Base 101 complex already on the Client's connectivity and platform-risk watch list (items 129, 135) — and which also hosts the Russian Africa Corps and the AES unified-force headquarters — shows Niamey's alliance network (AES, Algeria, Russia) closing ranks rather than fracturing, a relevant regime-continuity signal.",
      source: 'Agence Nigérienne de Presse (also ActuNiger, Kaweru, Al Akhbar Mauritanie)', url: 'https://anp.ne/le-niger-renforce-sa-flotte-aerienne-avec-quatre-avions-de-chasse-dans-le-cadre-de-sa-cooperation-avec-lalgerie/' },
    { id: 141, date: '2026-08-30', category: 'Platform Integrity', country: 'Mali', tier: 'confirmed', platformIntegrity: true,
      headline: "TikTok/Facebook/X pro-FGM campaign and cross-border feminist backlash play out across Mali, Guinea and the Malian diaspora in Europe",
      summary: "A video of a girl's genital mutilation, filmed in rural Mali and posted to TikTok on 9 August, triggered a three-week cross-border digital war: an AI-generated poster campaign by named pro-FGM men went viral on Facebook and TikTok, met by a coordinated feminist counter-campaign (#UneLoiUneFoiUnPeuple) from women across Senegal, Guinea, Côte d'Ivoire, Niger and Benin, who identified individual pro-FGM posters living in Spain, France and Belgium and got some to delete their accounts by reporting them to European police and immigration authorities. One Facebook account with over 100,000 followers that threatened to \"excise\" French First Lady Brigitte Macron remains online. Mali is the only country in the subregion where FGM is not explicitly illegal (89% prevalence per the latest demographic and health survey); Bamako responded by pressuring an anti-FGM NGO to remove a billboard and halting an official opinion survey rather than confronting the pro-FGM campaign, while Guinea's own Ministry of Women briefly posted, then deleted, a video seen as legitimizing the practice.",
      whyItMatters: "The Client's platforms (TikTok, Facebook, X) are the actual battlefield and enforcement gap in this story — a still-live Facebook account with six-figure followers making a public threat against a foreign head of state's spouse is a direct content-moderation failure with real diplomatic-sensitivity exposure, and both Malian and Guinean authorities are shown treating platform content as a political liability to manage quietly rather than escalating a formal takedown or data request to the Client, a pattern worth tracking for how these governments might approach the Client directly in future.",
      source: 'RFI', url: 'https://www.rfi.fr/fr/afrique/20260830-excision-guerre-num%C3%A9rique-entre-militants-pro-mgf-maliens-et-f%C3%A9ministes-ouest-africaines' },
    { id: 142, date: '2026-08-27', category: 'Business & Economy', country: 'Cameroon', tier: 'confirmed', platformIntegrity: false,
      headline: "US and Cameroon announce $7bn in investment and trade opportunities at inaugural Economic and Commercial Dialogue",
      summary: "On 27 August the United States and Cameroon concluded their first-ever Bilateral Economic and Commercial Dialogue, announcing roughly $7 billion (nearly 4 trillion FCFA) in new and expanding American investment and trade opportunities spanning infrastructure, technology, critical minerals, energy, forestry and logistics. Named projects include a proposed $2bn Douala-area airport and a $3.5bn, 1,040MW Grand Eweng hydropower project on the Sanaga River. Both governments agreed to institutionalize the dialogue through joint working groups, with a second round set for 2027 in Washington.",
      whyItMatters: "A major US-brokered investment pipeline touching Cameroon's technology and infrastructure sectors raises the country's overall commercial and digital-economy profile, relevant to the Client's competitive/business-landscape lens even without a direct platform angle.",
      source: 'U.S. Embassy in Cameroon', url: 'https://cm.usembassy.gov/united-states-and-cameroon-announce-7-billion-in-investment-and-trade-opportunities-at-inaugural-economic-and-commercial-dialogue/' },
    { id: 143, date: '2026-08-21', category: 'Platform Integrity', country: 'Côte d\'Ivoire', tier: 'reported', platformIntegrity: true,
      headline: "Abidjan police arrest suspect running fake-Facebook hotel-impersonation scheme funneled through WhatsApp",
      summary: "Ivorian cybercrime police (the Plateforme de Lutte Contre la Cybercriminalité) arrested a suspect identified as \"D.M.\" who created fake Facebook accounts copying the names, logos and photos of real hotels, then directed prospective guests to WhatsApp numbers to collect fraudulent booking deposits. The scheme was uncovered after a hotel director was alerted by a customer and filed a complaint with the PLCC. The suspect has been referred to prosecutors for fraudulent use of identity elements and fraud.",
      whyItMatters: "A concrete named-platform (Facebook plus WhatsApp) fraud prosecution in a market with otherwise thin dedicated source coverage — direct Platform Integrity relevance and a reminder that impersonation/booking-fraud schemes are an active abuse vector on the Client's platforms in Côte d'Ivoire.",
      source: 'KOACI', url: 'https://www.koaci.com/article/2026/08/21/cote-divoire/societe/cote-divoire-faux-comptes-facebook-un-escroc-se-faisait-passer-pour-des-hotels-pour-soutirer-des-acomptes-aux-clients_199768.html' },
    { id: 144, date: '2026-08-30', category: 'Digital Regulation & Compliance', country: 'Senegal', tier: 'reported', platformIntegrity: false,
      headline: "Amicale des Cadres statement fuels transparency concerns over stalled ARTP director-general selection",
      summary: "An OSIRIS opinion piece (citing Le Techobservateur) highlighted growing unease over the opacity of the process to select ARTP's next director-general: since applications closed, the Presidency has released no public information on candidate numbers, screening criteria, or timeline. The piece also flagged a 17 August 2026 communiqué from ARTP's internal staff association (Amicale des Cadres), which welcomed the open call for applications but asked authorities to give \"particular attention\" to internal candidates — a request commentators say sits awkwardly with the process's stated merit-based, open-competition framing.",
      whyItMatters: "Continued opacity and now an internal-candidate lobbying push around the ARTP director-general selection (an open question tracked since earlier this year) is a direct regulatory-continuity signal for the Client, since ARTP oversees licensing, shutdown orders and 5G/fibre-sharing rules that bear on the Client's Senegal operations.",
      source: 'OSIRIS (via Le Techobservateur)', url: 'https://www.osiris.sn/futur-dg-de-l-artp-pourquoi-autant-de-silence-sur-le-processus.html' },
    { id: 145, date: '2026-08-28', category: 'Politics & Governance', country: 'Senegal', tier: 'confirmed', platformIntegrity: false,
      headline: "National Assembly clarifies PM Al Aminou Lô's general policy declaration will not happen on 1 September as expected",
      summary: "Senegal's National Assembly Bureau clarified on 28 August 2026 that the 1 September extraordinary session will only formally open, confirm quorum and adjourn — not host PM Al Aminou Lô's long-awaited Déclaration de Politique Générale (DPG). Per Article 109 of the Assembly's rules, the actual DPG date must be set later by the Conference of Presidents, with at least eight days' notice running from the session's opening, not before — meaning the government's general policy statement remains unscheduled.",
      whyItMatters: "Extends the timeline uncertainty around a DPG the Client has been tracking as a marker of institutional friction between President Faye and Assembly president Sonko, adding to the broader pattern of fiscal/legislative gridlock (alongside the LFR return to government, tracked separately this run) that could affect the pace of Senegal's policy and regulatory agenda.",
      source: 'Pulse.sn (via Les Échos)', url: 'https://www.pulse.sn/article/al-amine-lo-ne-fera-pas-sa-dpg-le-1er-septembre-2026082812323493429' },
    { id: 146, date: '2026-08-31', category: 'Politics & Governance', country: 'Senegal', tier: 'confirmed', platformIntegrity: false,
      headline: "National Assembly returns first supplementary finance bill (LFR 1) to government over procedural defect",
      summary: "Senegal's National Assembly returned the government's first 2026 supplementary finance bill (LFR 1) — pending since June — after finding the accompanying presidential decree had been transmitted without the draft law text itself formally attached, a procedural requirement for the chamber to be validly seized. Les Échos reports the two sides differ on the episode's significance: the executive contests the relevance of the cited procedural grounds, while the Assembly says the bill must now be completed or resubmitted before any substantive examination can proceed; no new examination date is set.",
      whyItMatters: "Another concrete instance of Executive-Assembly friction slowing Senegal's fiscal legislative calendar, alongside the DPG postponement (this run) and the ongoing IMF program talks — relevant background for the Client's monitoring of Dakar's institutional capacity to act on regulatory and digital-economy matters requiring parliamentary action.",
      source: 'Dakaractu (via Les Échos)', url: 'https://www.dakaractu.com/Nouvelle-tension-Executif-Assemblee-la-premiere-loi-de-finances-rectificative-renvoyee-au-gouvernement-pour-un-probleme_a275507.html' },
    { id: 147, date: '2026-08-31', category: 'Digital Regulation & Compliance', country: 'Guinea', tier: 'confirmed', platformIntegrity: false,
      headline: "Guinea hosts 8-country UEMOA audiovisual-regulators summit themed on social-media regulation",
      summary: "Guinea's Justice Minister (Garde des Sceaux) Ibrahima Sory II Tounkara opened the 12th General Assembly of the Platform of Audiovisual Regulators of UEMOA Member States and Guinea (PRA-UEMOA-Guinée) in Conakry on 31 August 2026, themed on social-network regulation amid cybersecurity challenges and preservation of social cohesion. Tounkara called on regulators to \"protect without stifling, regulate without censoring, and punish abuse without weakening freedom of expression,\" warning that AI-generated deepfakes and disinformation can destabilize public trust and national stability. Delegations from eight UEMOA countries plus Guinea attended.",
      whyItMatters: "A ministerial-level push toward a harmonized social-media regulatory framework across UEMOA plus Guinea is a direct regulatory-exposure signal for the Client — any resulting common standards on content moderation or platform obligations could extend well beyond Guinea alone.",
      source: 'Africa Guinée (also Mediaguinée, Le Réniflleur224)', url: 'https://www.africaguinee.com/cyberespace-et-libertes-dexpression-le-garde-des-sceaux-appelle-a-reguler-sans-censurer-mais/' },
    { id: 148, date: '2026-08-31', category: 'Conflict & Security', country: 'Niger', tier: 'confirmed', platformIntegrity: false,
      headline: "Niger's Tiani reassures Algeria's Tebboune as new detail emerges on Russian and Algerian military role in quelling Base 101 mutiny",
      summary: "General Abdourahamane Tiani telephoned Algerian President Abdelmadjid Tebboune on 31 August 2026 to reassure him the situation in Niamey is \"totally under control,\" following the 28-29 August mutiny at Air Base 101. Fuller reporting since has detailed that Russian Africa Corps personnel (an estimated 200-300, with armoured vehicles and air support) deployed in direct combat alongside Niger's Presidential Guard to retake the base, that Algeria dispatched four Su-30 fighters plus support aircraft, and that the state broadcaster ORTN's headquarters was also attacked and briefly knocked off air; a separate 29 August explosive-device incident near the airport left one dead and two wounded. Some social-media accounts continue to describe the situation on the ground as unresolved, though this is not independently confirmed.",
      whyItMatters: "Confirms Niger's post-mutiny security posture now rests directly on Russian combat forces and Algerian air support rather than purely domestic capability, and the ORTN attack adds a state-media/connectivity dimension to a story the Client should track for further platform- or shutdown-relevant fallout.",
      source: 'Atalayar (also Agence Nigérienne de Presse, Sidwaya)', url: 'https://www.atalayar.com/en/articulo/politics/the-niamey-mutiny-rocks-niger-s-junta-and-intensifies-the-military-rivalry-between-russia-and-algeria-in-the-sahel/20260831122530228827.html' },
    { id: 149, date: '2026-08-31', category: 'Politics & Governance', country: 'DR Congo', tier: 'confirmed', platformIntegrity: false,
      headline: "DRC opposition and civil-society positions harden around Tshisekedi's national-dialogue format",
      summary: "As President Tshisekedi's national dialogue process moves forward (excluding AFC/M23 from direct participation, per item 133), positions among other stakeholders sharpened on 31 August 2026: Citizen Alliance for the Homeland co-founder Carbone Beni rejected any dialogue outcome that would let AFC/M23 share power in managing the DRC, the Observatory of Public Expenditure (ODEP) publicly urged Tshisekedi toward a more inclusive format that would associate M23/AFC representatives, and opposition figure Martin Fayulu contested the President's unilateral authority to set the dialogue's terms, calling instead for neutral AU/UN-backed mediation.",
      whyItMatters: "Widening daylight between the government's exclusionary dialogue format and both opposition and civil-society calls for inclusion or neutral mediation raises the risk of a contested or partial process, a governance-continuity factor worth tracking alongside item 133 for any read-through to the eastern security crisis and DRC's broader stability.",
      source: 'Congo-Press (also Africa Radio, Netic News)', url: 'https://www.congo-press.com/politique/dialogue-national-carbone-beni-rejette-tout-partage-du-pouvoir-avec-lafc-m23/' },
    { id: 150, date: '2026-08-31', category: 'Platform Integrity', country: 'Senegal', tier: 'confirmed', platformIntegrity: true,
      headline: "Dakar police refer TikTok-based delivery-fraud scammer to prosecutors",
      summary: "Police in Dakar's Parcelles Assainies arrondissement (Commissariat U15) referred a woman to the public prosecutor for fraud, swindling and theft after she used TikTok to place large orders with online sellers, then diverted delivery couriers to fake payment points, took the goods and vanished. She was caught in the Grand Médine neighborhood attempting to repeat the scheme with a seafood order; three phones and five SIM cards were seized, and she admitted consuming or reselling some of the stolen goods.",
      whyItMatters: "Another named-platform (TikTok) fraud case moving through Senegal's police-prosecutor pipeline reinforces the pattern of e-commerce-adjacent scams using the Client's platforms as the ordering/coordination layer — direct Platform Integrity relevance even though the specific scheme (delivery diversion) differs from prior WhatsApp money-transfer cases.",
      source: 'APAnews (Agence de Presse Africaine)', url: 'https://fr.apanews.net/society/senegal-arrestation-dune-femme-pour-arnaques-sur-tiktok/' },
    { id: 151, date: '2026-08-21', category: 'Platform Integrity', country: 'Burkina Faso', tier: 'confirmed', platformIntegrity: true,
      headline: "Burkina Faso's cybercrime brigade arrests suspect over WhatsApp-status motorcycle-sale fraud",
      summary: "Ouagadougou's Brigade Centrale de Lutte Contre la Cybercriminalité (BCLCC) announced on 21 August 2026 the arrest of a suspect ('K.I.') who used his WhatsApp status to repeatedly post fake motorcycle-sale offers. A victim ('S.B.'), who knew the suspect personally, paid 700,000 FCFA for a motorcycle that was never delivered. The suspect admitted the fraud under questioning and was referred to the public prosecutor at Ouaga I's High Court.",
      whyItMatters: "A named-platform (WhatsApp) fraud case moving through Burkina Faso's cybercrime-police-prosecutor pipeline extends the same acquaintance-based social-commerce fraud pattern the Client's platforms have been used for elsewhere in the region into a country with otherwise thin dedicated source coverage.",
      source: 'Wakat Séra (also Lebledparle)', url: 'https://www.wakatsera.com/burkina-un-presume-auteur-descroquerie-a-la-vente-de-motocyclette-en-ligne-interpelle/' },
    { id: 152, date: '2026-08-27', category: 'Platform Integrity', country: 'Burkina Faso', tier: 'confirmed', platformIntegrity: true,
      headline: "Burkina Faso's digital ministry warns public of WhatsApp/Messenger account-hijacking scam",
      summary: "Burkina Faso's Ministry of Digital Transition, Posts and Electronic Communications issued a public alert on 27 August 2026 warning that cybercriminals are hijacking WhatsApp and Messenger accounts and then using the compromised accounts to solicit money from the victim's own contacts, posing as the account owner. The ministry urged users to verify unusual money requests directly with the person by another channel before sending funds.",
      whyItMatters: "An official government warning naming WhatsApp and Messenger specifically as the vector for an active account-takeover fraud campaign is a direct Platform Integrity signal and a possible precursor to a future data-request or platform-cooperation ask from Burkinabè authorities.",
      source: 'Wakat Séra (also Minute.bf, Afrik Soir)', url: 'https://www.wakatsera.com/alerte-sur-une-arnaque-sur-whatsapp-et-messenger/' },
    { id: 153, date: '2026-08-29', category: 'Conflict & Security', country: 'Mali', tier: 'reported', platformIntegrity: false,
      headline: "Explosion from mishandled ordnance kills five in Gao's Anoura neighborhood",
      summary: "An explosion in the Bagoundié 2 area of Gao's Anoura district on Saturday 29 August 2026 killed five people and left two others with serious injuries. Local sources cited by Studio Tamani said the blast was caused by the handling of an artillery shell; the exact circumstances remain unconfirmed and no group has claimed responsibility.",
      whyItMatters: "An unexplained mass-casualty explosion involving war-remnant ordnance in Gao, a city already contending with JNIM's fuel-blockade campaign and periodic banditry, is a general security-backdrop data point worth tracking for the Client's Mali-market risk monitoring even absent a confirmed platform angle.",

    { id: 154, date: '2026-08-28', category: 'Digital Innovation & Connectivity', country: 'Cameroon', tier: 'confirmed', platformIntegrity: false,
      headline: "US firm Cybastion to invest $75M in AI-focused data center and dedicated power plant in Douala",
      summary: "The US Embassy in Cameroon announced on 28 August 2026 that American company Cybastion plans to invest $75 million in an AI-dedicated data center in Douala, paired with its own power plant, following the first US-Cameroon bilateral economic and trade dialogue held in Yaoundé. The project sits within a broader roughly $7 billion portfolio of investment and trade opportunities identified at that dialogue, spanning infrastructure, energy, critical minerals, logistics and technology.",
      whyItMatters: "A concrete US-backed AI data-center investment is a significant addition to Cameroon's digital infrastructure landscape, relevant to the Client's monitoring of connectivity investment and competitive digital-infrastructure players in a country with no dedicated Inoreader source and historically thin coverage.",
      source: 'We Are Tech Africa (also Africa Cybersecurity Mag, Afrique IT News)', url: 'https://www.wearetech.africa/fr/fils/actualites/tech/cameroun-l-americain-cybastion-prevoit-d-investir-75-millions-dans-un-data-center-dedie-a-l-ia' },
    { id: 155, date: '2026-08-31', category: 'Digital Innovation & Connectivity', country: 'Guinea', tier: 'confirmed', platformIntegrity: false,
      headline: "Starlink targets Guinea among 16 new African markets for launch by end of 2026",
      summary: "According to Starlink's own public availability map, SpaceX's satellite-internet arm plans to launch service in 16 additional African countries by the end of 2026, including Guinea alongside Mali, Burkina Faso, Togo, Cameroon, Mauritania, Gambia, Tunisia, Uganda, Tanzania and others — though the company cautions such target dates are not guaranteed given past delays. Starlink has been expanding across Africa since its January 2023 Nigeria launch and recently added Equatorial Guinea, bringing its active African footprint to 29 markets.",
      whyItMatters: "A confirmed Starlink expansion target spanning five of the Client's nine tracked countries (Guinea, Mali, Burkina Faso, Togo, Cameroon) is a major alternative-connectivity development to watch, given Starlink's growing role as both a competitive access point and, per prior items in this feed (DRC Starlink-kit seizures, Jumia Senegal's Starlink retail), a target of state security and regulatory attention.",
      source: 'Ecofin Agency / OSIRIS (also Guinée Matin, Bénin Web TV)', url: 'https://www.ecofinagency.com/news-digital/3108-58472-satellite-internet-starlink-targets-16-new-african-markets-by-end-2026' },
    { id: 156, date: '2026-09-01', category: 'Conflict & Security', country: 'Niger', tier: 'confirmed', platformIntegrity: false,
      headline: "Niger holds official funeral for three Presidential Guard soldiers killed in Base 101 mutiny, first named casualties",
      summary: "On 1 September 2026, Niger's Prime Minister Ali Mahamane Lamine Zeine presided over a state funeral at Base 101 in Niamey for three Presidential Guard soldiers killed during the 28-29 August mutiny attempt: adjutant Illo Maihatchi and privates Yahya Idrissa Zamnaou and Ousmane Haboulé Hamissou, who were posthumously decorated. State media separately reported one additional death and two injuries from an explosive-device incident near the airport on 29-30 August, plus one apparent suicide linked to psychological shock from witnessing that blast. No official overall casualty toll for the mutiny itself has been released.",
      whyItMatters: "Resolves part of the open casualty-toll question the Client has been tracking since the mutiny (ids 129/135/140/148): official confirmation of Presidential Guard fatalities, still without a full toll, keeps Niger's post-mutiny instability and its connectivity/platform-risk implications live for monitoring.",
      source: 'Bamada.net (also Le Sahel/ANP, Al Akhbar via Facebook)', url: 'https://bamada.net/niger-trois-soldats-loyalistes-inhumes-apres-la-mutinerie' },
    { id: 157, date: '2026-09-01', category: 'Politics & Governance', country: 'Senegal', tier: 'confirmed', platformIntegrity: false,
      headline: "Sonko denies institutional crisis as Assembly opens DPG session, but Prime Minister's policy declaration date still unset",
      summary: "At the 1 September 2026 opening of the National Assembly's second extraordinary session — convened by President Faye with the Prime Minister's long-delayed General Policy Declaration (DPG) as its sole agenda item — Assembly president Ousmane Sonko publicly rejected suggestions of an institutional crisis, stating \"il n'y a pas de tiraillement, il n'y a pas de tension, il y a le fonctionnement normal des institutions,\" and drew comparisons to French cohabitation periods (1986-88, 1993-95, 1997-2002). Despite the session opening, Sonko indicated the Assembly had still received no formal notification from the presidency fixing an actual date for PM Al Aminou Lô's DPG.",
      whyItMatters: "Extends the Client's tracked Faye-Sonko institutional-friction storyline (ids 30, 32-34, 38-39, 49, 64, 69, 88, 103, 131, 145): a direct, on-record denial from Sonko himself is new, but the DPG date remains unresolved months past its constitutional deadline, keeping Senegal's governance-continuity risk profile live for the Client's monitoring.",
      source: 'PressAfrik (also Xibaaru, DakarActu)', url: 'https://www.pressafrik.com/Senegal-Sonko-assure-qu-il-n-y-a-pas-de-tensions-et-de-tiraillements-avec-l-executif_a310837.html' },
    { id: 158, date: '2026-08-31', category: 'Business & Economy', country: 'Senegal', tier: 'confirmed', platformIntegrity: false,
      headline: "Senegal captures 29.7% of UEMOA's electronic-money float, region's largest share",
      summary: "UEMOA's Banking Commission 2025 annual report shows Senegal-based electronic-money institutions held 29.7% of the union's outstanding e-money float, ahead of Burkina Faso (25.9%), Côte d'Ivoire (23.5%) and Benin (10.2%). Coverage attributes the lead to an aggressive fee war between Wave, Orange Money and Free Money, a comparatively flexible BCEAO licensing regime, and strong diaspora remittance inflows converted into mobile wallets. Regional e-money accounts grew from 154.6 million to 172.9 million over 2025 (+11.9%).",
      whyItMatters: "Maps the competitive digital-economy landscape Meta's own platforms (WhatsApp/Instagram commerce, potential payment features) would enter in Senegal — Wave, Orange Money and Free Money's entrenched, fee-competitive user base is the incumbent ecosystem any platform-driven commerce or payments push would have to contend with.",
      source: 'Financial Afrik', url: 'https://www.financialafrik.com/2026/08/31/uemoa-le-senegal-concentre-297-de-lencours-de-monnaie-electronique-et-simpose-comme-leader-regional/' },
    { id: 159, date: '2026-09-01', category: 'Business & Economy', country: 'Senegal', tier: 'reported', platformIntegrity: false,
      headline: "IMF signals 'positive developments' as Senegal debt-relief mission concludes",
      summary: "An IMF spokesperson said talks with Senegalese authorities during a two-week staff mission (begun 19 August) were constructive, with \"positive developments\" expected as the mission concluded on 1 September. The visit is part of negotiations toward a replacement lending program after the IMF suspended Senegal's prior $1.8 billion arrangement in 2024 following the Faye government's disclosure of previously unreported debt.",
      whyItMatters: "Progress toward a restored IMF program bears on Senegal's fiscal and macro-stability outlook, which in turn shapes the continuity and predictability of the regulatory environment Meta operates under in the country.",
      source: 'CNBC Africa', url: 'https://www.cnbcafrica.com/2026/positive-developments-expected-after-imf-mission-to-senegal-source-says' },
    { id: 160, date: '2026-09-01', category: 'Politics & Governance', country: 'Togo', tier: 'reported', platformIntegrity: false,
      headline: "Belarusian fixer Zingman deepens access to Togo's Gnassingbé amid Moscow-Minsk push",
      summary: "Africa Intelligence reporting, relayed by Icilome, describes Belarusian businessman Alexander Zingman — a US-passport holder who has operated in Africa for roughly a decade via Dubai-based Aftrade DMCC — as having built substantial personal access to Togolese President Faure Gnassingbé since 2024. The reporting links Zingman to a Belarus Development Bank-BOAD financing arrangement, efforts to organize a Gnassingbé visit to Minsk and a Togolese embassy opening in Moscow, and to logistical groundwork reportedly helping turn the port of Lomé into a new corridor for Russian arms shipments to the Sahel in 2026.",
      whyItMatters: "A foreign fixer with a Moscow/Minsk-aligned track record gaining sustained access to Togo's head of state is a regime-influence and regional-diplomacy signal worth tracking for governance-continuity implications, which can in turn affect the predictability of Togo's digital-regulatory environment.",
      source: 'Icilome (citing Africa Intelligence)', url: 'https://icilome.com/2026/09/togo-alexander-zingman-lhomme-de-lombre-qui-gagne-du-terrain-aupres-de-faure-gnassingbe/' },
    { id: 161, date: '2026-09-01', category: 'Business & Economy', country: 'Senegal', tier: 'confirmed', platformIntegrity: false,
      headline: "RTS union coalition files first-ever strike notice over suspended labor agreement",
      summary: "On 1 September 2026, the SYNPICS-SYNPAP inter-union coalition at Senegal's state broadcaster RTS filed a strike notice with the General Labor Department, describing it as unprecedented in the company's history. The unions are protesting the unilateral suspension of RTS's company agreement and management's refusal to resume dialogue, in a standoff that has simmered for nearly three years.",
      whyItMatters: "A labor action at Senegal's state broadcaster is a media-sector governance-continuity signal the Client tracks alongside its other state-adjacent labor disputes (SN-HLM, SENELEC, SAED), and RTS's own stability shapes the broadcast/media environment adjacent to the Client's platforms.",
      source: 'PressAfrik (also Rewmi, Senegal7, Senegal24News)', url: 'https://www.pressafrik.com/RTS-l-intersyndicale-SYNPICS-SYNPAP-depose-un-preavis-de-greve-ce-mardi-1er-septembre_a310821.html' },
    { id: 162, date: '2026-09-01', category: 'Digital Regulation & Compliance', country: 'Senegal', tier: 'reported', platformIntegrity: false,
      headline: "Cybercrime unit chief 'commissaire hacker' Faye departs Senegal's DSC",
      summary: "Commissaire Pape Mamadou Djidjiack Faye, head of Senegal's Division spéciale de cybersécurité (DSC) since August 2024, is reportedly leaving his post this week for a foreign assignment, per Libération relayed by Senegal7. Faye's tenure was marked by high-profile cybercrime prosecutions, including the 2025 arrest of long-fugitive suspect \"Kocc,\" and his unit has handled many of the WhatsApp/social-media-enabled fraud and extortion cases the Client tracks under Platform Integrity.",
      whyItMatters: "A leadership change atop the police unit that handles the bulk of Senegal's WhatsApp/TikTok-enabled fraud and extortion prosecutions is a continuity signal worth watching for any shift in enforcement posture or case backlog.",
      source: 'Senegal7 (citing Libération)', url: 'https://senegal7.com/cybersecurite-le-commissaire-pape-mamadou-djidjiack-faye-quitte-la-dsc/' },
    { id: 163, date: '2026-09-01', category: 'Politics & Governance', country: 'Senegal', tier: 'confirmed', platformIntegrity: false,
      headline: "Senegal's Gen. Birame Diop installed as ECOWAS Commission President",
      summary: "Senegalese general Birame Diop officially took office as President of the ECOWAS Commission for a four-year term on 1 September 2026, in a handover ceremony with outgoing Gambian president Omar Alieu Touray at the organization's Abuja headquarters. His appointment, approved at the July 2026 Freetown summit, pairs with President Faye's own ECOWAS chairmanship to give Senegal an unusually central role in regional leadership.",
      whyItMatters: "A Senegalese national now heading both ECOWAS's political chairmanship (Faye) and its administrative commission (Diop) raises Senegal's weight in regional diplomacy and could shape how ECOWAS-level digital, security and economic policy affecting the Client's other eight tracked countries gets set.",
      source: 'RT en français (also Dakaractu, AIP)', url: 'https://francais.rt.com/news/137593-cedeao-general-birame-diop-prend-tete-commission' },
    { id: 164, date: '2026-08-28', category: 'Digital Innovation & Connectivity', country: 'Cameroon', tier: 'confirmed', platformIntegrity: false,
      headline: "US firm Cybastion to invest $75M in AI-focused data center in Cameroon",
      summary: "Virginia-based Cybastion plans to invest $75 million to build an AI-dedicated data center paired with its own power capacity in Douala, Cameroon, the US embassy announced 28 August 2026 following the first US-Cameroon bilateral Economic and Commercial Dialogue in Yaoundé. The project is part of a roughly $7 billion package of investment and trade opportunities identified at that dialogue.",
      whyItMatters: "A dedicated sovereign AI/data-center investment is a concrete connectivity and digital-infrastructure marker for Cameroon, one of the Client's 9 tracked countries with no dedicated local news source in this monitoring setup, and was surfaced only via the cross-country Numerique feed.",
      source: 'We Are Tech Africa (also Developing Telecoms, Agence Ecofin)', url: 'https://www.wearetech.africa/fr/fils/actualites/tech/cameroun-l-americain-cybastion-prevoit-d-investir-75-millions-dans-un-data-center-dedie-a-l-ia' },
    { id: 165, date: '2026-09-01', category: 'Conflict & Security', country: 'Mali', tier: 'confirmed', platformIntegrity: false,
      headline: "JNIM lifts nearly year-long blockade on Léré after a month of negotiations",
      summary: "RFI reported on 1 September 2026 that JNIM (Jama'at Nasr al-Islam wal Muslimin) has lifted its blockade of Léré, a town in the Tombouctou region near the Mauritanian border, ending an entry-and-exit siege that had run since roughly October 2025 and left residents short of food and other basic goods. The jihadist group agreed to end the blockade after approximately a month of negotiations.",
      whyItMatters: "A negotiated end to a near-year-long JNIM blockade in a different Mali corridor than the standing Bamako fuel siege (id 5) is a data point that the group's blockade tactics can be reversed through negotiation, a useful comparator when assessing security-risk trajectories in the Kayes region where B2Gold's Fekola Complex operates.",
      source: 'RFI', url: 'https://www.rfi.fr/fr/afrique/20260901-mali-les-jihadistes-du-jnim-l%C3%A8vent-leur-blocus-sur-la-ville-de-l%C3%A9r%C3%A9' },
    { id: 166, date: '2026-09-01', category: 'Business & Economy', country: 'Senegal', tier: 'confirmed', platformIntegrity: false,
      headline: "IMF and Senegal reach staff-level agreement for $2.2bn, 36-month financing program",
      summary: "Senegal and the IMF reached a staff-level agreement on 1 September 2026 for a new 36-month, roughly $2.2 billion program covering 2026-2029, following a mission led by Mercedes Vera Martin from 19 August to 1 September. The deal, still subject to IMF Executive Board approval and financing assurances from Senegal's partners, comes nearly three years after the prior $1.8bn program was suspended over the discovery of more than $9bn in previously undisclosed debt, and is aimed at restoring fiscal sustainability, boosting domestic revenue mobilization and protecting vulnerable households.",
      whyItMatters: "Concretizes item 159's earlier 'positive developments' signal into an actual staff-level agreement, a material step toward resolving the debt crisis and IMF-program suspension that has been a recurring fiscal-risk backdrop across this feed, including for BP and OCP's own Senegal host-government exposure.",
      source: 'SenePlus (also Rewmi, Senegal7, Dakaractu, Sunu Afrik Radio)', url: 'https://www.seneplus.com/article/le-senegal-et-le-fmi-saccordent-sur-un-nouveau-programme-de-22-milliards-de-dollars' },
    { id: 167, date: '2026-09-01', category: 'Digital Regulation & Compliance', country: 'Senegal', tier: 'confirmed', platformIntegrity: false,
      headline: "Senegal's data-protection authority reports 195 files handled in Q2 2026, including a rejected AI-platform application",
      summary: "The CDP (Commission de Protection des Données Personnelles) published its second-quarter 2026 activity report: 195 files processed, including 41 authorization requests (39 granted, covering web platforms and customer databases), 8 complaints (including one against Sonatel for unsolicited marketing and one alleging a data breach and harassment), and 5 control missions. The single rejection concerned an AI-driven financial-analysis platform's authorization request, cited for unclear data-subject categories, an unspecified retention period, missing consent for third-country data transfer, and unauthorized data access.",
      whyItMatters: "A concrete quarterly snapshot of the CDP's enforcement activity — including its willingness to reject a platform's authorization request outright — is a direct data point on the data-protection regulator's rigor and priorities, relevant to the Client's own data-flow compliance posture in Senegal.",
      source: 'DakarActu', url: 'https://www.dakaractu.com/Protection-des-Donnees-Personnelles-195-dossiers-traites1-refus-8-plaintes-et-5-missions-de-controle-effectuees-durant_a275563.html' },
    { id: 168, date: '2026-09-01', category: 'Politics & Governance', country: 'Senegal', tier: 'confirmed', platformIntegrity: false,
      headline: "Senegal's Assembly sets PM Al Amine Lô's long-delayed DPG for 8 September, still subject to presidential override",
      summary: "The National Assembly's Conference of Presidents, meeting 1 September 2026, scheduled Prime Minister Ahmadou Al Aminou Lô's General Policy Declaration (DPG) for Tuesday 8 September at 10h00. The date remains provisional: the President of the Republic retains an eight-day regulatory window to set a different date. The announcement follows the 1 September extraordinary session that formally opened but did not itself host the DPG.",
      whyItMatters: "Resolves, for now, the DPG-timing open question this feed has tracked since id 88 through id 157 — a concrete date is the clearest marker yet of whether the Faye-Sonko institutional friction is easing or will resurface once the DPG (and any censure-motion response) actually takes place on 8 September.",
      source: 'APS', url: 'https://aps.sn/la-date-de-la-dpg-fixee-au-mardi-8-septembre-par-lassemblee-nationale/' },
    { id: 169, date: '2026-09-01', category: 'Politics & Governance', country: 'Senegal', tier: 'confirmed', platformIntegrity: false,
      headline: "Pastef's Assembly leader Ayib Daffé says a censure motion against PM Lô is \"not on the agenda\"",
      summary: "At the opening of the National Assembly's second extraordinary session on 1 September 2026, Pastef parliamentary-group president Mohamed Ayib Daffé said a motion of censure against PM Al Amine Lô's government was not currently on the agenda, while separately criticizing what he called an opposition 'aborted censure attempt' built around an unrealistic three-bills-in-one-day schedule that he said violated the Assembly's own internal rules.",
      whyItMatters: "A direct, on-record statement from Sonko's own parliamentary-group leader tamping down near-term censure-motion risk is a relevant data point for the Client's tracking of the open Sonko/Lô rupture that has repeatedly named the GTA/Kosmos-BP and ICS phosphate dossiers as battlegrounds (BP id 6, OCP id 2) — though Sonko's own earlier threats keep the risk from being fully closed.",
      source: 'PressAfrik', url: 'https://www.pressafrik.com/Declaration-de-politique-generale-ce-qu-il-faut-retenir-des-premiers-mots-d-Ayib-Daffe_a310843.html' },
    { id: 170, date: '2026-09-01', category: 'Politics & Governance', country: 'Togo', tier: 'confirmed', platformIntegrity: false,
      headline: "Detained French filmmaker Gaël Mocaër and Togolese fixer also granted provisional release",
      summary: "Togolese judicial authorities granted provisional release on 1 September 2026 to French documentary filmmaker Gaël Mocaër and Togolese fixer Komi Mawufémo (Fred) Vedomey, extending the partial, health-driven release already granted to co-director Sebastian Perez Pezzani. All three were arrested 27 July 2026 in northern Togo while filming a France Télévisions documentary and remain charged with false declarations tied to alleged undeclared drone use.",
      whyItMatters: "Extends the Client's tracked Togo press-freedom/foreign-media-access storyline (since id 84): the full release of all three detainees eases, without fully resolving, a case that had become a diplomatic irritant between Paris and Lomé and a marker of Togo's posture toward foreign journalists.",
      source: 'Le Nouveau Reporter (also RSF)', url: 'https://lenouveaureporter.com/togo-les-2-journalistes-francais-inculpes-remis-en-liberte/' },
    { id: 171, date: '2026-09-01', category: 'Platform Integrity', country: 'Senegal', tier: 'confirmed', platformIntegrity: true,
      headline: "Kaspersky study: WhatsApp is the top messaging-scam vector in Senegal, 77% of victims lost money",
      summary: "A global Kaspersky-commissioned study (fielded by Censuswide, covering victims in Europe, North America and Africa including Morocco, Senegal and Côte d'Ivoire) found WhatsApp is the leading channel scammers use to target victims in Senegal (cited by 63% of Senegalese victims, versus 45% in Côte d'Ivoire), with SMS a major secondary vector (51% in Senegal). More than three-quarters (77%) of Senegalese victims suffered a direct financial loss, and over half of these scams worldwide are completed in under 30 minutes. In Senegal, 57% of victims reported AI-generated text and 60% reported synthetic or cloned voices used in the scam.",
      whyItMatters: "Independent, multi-country survey data naming WhatsApp as the dominant fraud vector in Senegal — with AI-generated content now a majority feature of these scams — sharpens the platform-risk case for Meta beyond individual prosecutions, and resolves an open verification item this feed has carried since mid-August.",
      source: 'Sud Quotidien (via OSIRIS/Kaspersky)', url: 'https://www.sikafinance.com/marches/arnaques-sur-whatsapp-des-senegalais-et-ivoiriens-depouilles-par-les-cartels-du-web-en-moins-de-30-minutes_62473' },
    { id: 172, date: '2026-09-01', category: 'Conflict & Security', country: 'Mali', tier: 'confirmed', platformIntegrity: false,
      headline: "Mali's army says it struck JNIM gathering points near Aguelhoc and Ménaka",
      summary: "Mali's General Staff (État-Major) announced a series of air and ground strikes between 30 August and 1 September 2026 on what it described as JNIM fighter gatherings and war-materiel stockpiles northwest of Aguelhoc (Kidal region) and roughly 35km southwest of Ménaka, following intelligence and surveillance detection of the positions. The claims, relayed by multiple Malian outlets (Bamada.net, Mali24, EchosMedias), had circulated in unverified form in prior days before this run located the underlying official communiqué.",
      whyItMatters: "An official army communiqué — rather than the previously unverified social-aggregator claims this feed flagged and excluded twice — is a more solid data point on the security operating environment in northern/eastern Mali; while distant from B2Gold's Kayes-region Fekola operations, it is relevant background for the Client's broader Mali security-risk monitoring.",
      source: 'Bamada.net (also Mali24, EchosMedias)', url: 'https://bamada.net/aguelhoc-et-menaka-larmee-malienne-pilonne-des-rassemblements-terroristes' },
    { id: 173, date: '2026-08-30', reportedDate: '2026-09-01', category: 'Politics & Governance', country: 'DR Congo', tier: 'confirmed', platformIntegrity: false,
      headline: "Pro-government influencer Denise Dusauchoy arrested in Tanzania, extradited to Kinshasa on outstanding warrant",
      summary: "Congolese social-media influencer and political figure Denise Mukendi Dusauchoy — founder of the Union Sacrée-aligned FDD party and a prominent online defender of President Tshisekedi's government — was arrested at Dar es Salaam's airport on 30 August 2026 under a Congolese arrest warrant and extradited to Kinshasa. DRC's Ministry of Justice confirmed the arrest on 1 September, citing judicial cooperation with Tanzania and referencing 2025 rogatory commissions to Belgian authorities tied to ongoing Kinshasa/Gombe prosecutor's-office investigations. Dusauchoy was already convicted in December 2024 on false-rumors/public-insult charges and was ousted from her own party's leadership in 2025 over an unrelated scandal.",
      whyItMatters: "A prominent, politically connected online influencer facing a fresh international arrest and extradition — layered on an existing conviction tied to online speech — is a useful data point on how DR Congo's justice system treats social-media-linked political figures, relevant to the Client's tracking of platform-linked prosecution patterns in one of its least-covered tracked countries.",
      source: 'Radio Okapi (also allAfrica, Mediacongo, Congo Synthèse, Kivu Morning Post)', url: 'https://www.radiookapi.net/2026/09/01/actualite/justice/linfluenceuse-denise-dusauchoy-arretee-en-tanzanie-sous-mandat-darret' },
    { id: 174, date: '2026-09-01', category: 'Politics & Governance', country: 'Mali', tier: 'confirmed', platformIntegrity: false,
      headline: "Mali's FM Abdoulaye Diop asks Non-Aligned Movement to back the AES confederation at Belgrade's 65th-anniversary summit",
      summary: "At the Non-Aligned Movement's 65th-anniversary commemorative meeting in Belgrade (31 Aug-1 Sept 2026), Mali's Foreign Minister Abdoulaye Diop, speaking for the transitional government, called on member states to support the Alliance of Sahel States (AES) confederation formed by Mali, Burkina Faso and Niger, arguing its objectives \"align perfectly\" with the Movement's own values. He also urged a broader restructuring of North-South relations with greater representation for African, Asian, Latin American and Caribbean states.",
      whyItMatters: "A formal appeal for international legitimacy and support for the AES bloc, made on a multilateral stage, is a governance-continuity and regional-alignment signal for Mali's transitional authorities, relevant to the Client's tracking of how the junta is positioning itself diplomatically beyond ECOWAS.",
      source: 'La Nouvelle Tribune (also Bamada.net, Reflet Info, AbidjanTV.net)', url: 'https://lanouvelletribune.info/2026/09/depuis-belgrade-le-mali-appelle-les-non-alignes-a-soutenir-les-pays-de-laes/' },
    { id: 175, date: '2026-08-31', reportedDate: '2026-09-02', category: 'Platform Integrity', country: 'Senegal', tier: 'confirmed', platformIntegrity: true,
      headline: "TikTok influencer Rox la Chancelière questioned twice by Senegal's cybercrime unit over multiple complaints",
      summary: "Senegalese TikTok influencer known as \"Rox la Chancelière,\" recently returned from an extended stay abroad, was questioned by the Division Spéciale de Cybersécurité (DSC) on 31 August 2026 over several complaints filed against her, then released on a summons rather than held in custody. She was expected to return for further questioning on 1 September before the DSC, headed by Commissaire PD Faye. The precise nature of the underlying complaints has not been detailed in current reporting.",
      whyItMatters: "Another named social-media personality drawn into a DSC cybercrime investigation, even absent a resolved charge, reinforces the pattern of Senegal's cyber-unit actively policing TikTok-linked disputes — a direct Platform Integrity data point for the Client to track through to any formal charge.",
      source: 'Seneweb', url: 'https://www.seneweb.com/en/news/Societe/fin-daudition-a-la-dsc-la-tiktokeuse-rox-la-chanceliere-liberee-sur-convocation_n_502964.html' },
    { id: 176, date: '2026-09-02', category: 'Business & Economy', country: "Côte d'Ivoire", tier: 'reported', platformIntegrity: false,
      headline: "BCEAO data: Côte d'Ivoire, Senegal and Togo lead UEMOA's 2025 business-climate rankings",
      summary: "Central bank BCEAO data reported by Agence Ecofin shows Côte d'Ivoire (102 points), Senegal (101.8) and Togo (101.2) posting the union's best business-climate scores in 2025, all above the eight-country UEMOA average, even as performance varies widely between member states. The same data separately underpins a World Bank Business Ready 2025 ranking placing Togo 4th in Africa and Senegal 9th.",
      whyItMatters: "A multi-country business-climate signal naming three of the Client's tracked markets as regional leaders is a useful commercial-environment baseline, relevant to the Business & Economy lens even absent a platform-specific angle.",
      source: 'Agence Ecofin', url: 'https://www.agenceecofin.com/actualites-finance/0209-141242-climat-des-affaires-la-cote-d-ivoire-le-senegal-et-le-togo-en-tete-dans-l-uemoa-en-2025' },
    { id: 177, date: '2026-08-29', reportedDate: '2026-09-02', category: 'Platform Integrity', country: 'Senegal', tier: 'reported', platformIntegrity: true,
      headline: "Yeumbeul sexual-harassment probe widens into four arrests via WhatsApp/Messenger phone extraction, two suspects HIV-positive",
      summary: "An investigation opened after a sexual-harassment complaint at Dakar's Yeumbeul-Comico police station has widened after phone extractions from four arrested men — Mamadou Mbaye, Madiaw Diop, Amath Fall and Samba Sow — surfaced WhatsApp and Messenger conversations pointing investigators to a wider network. Mbaye was first held on 29 August 2026 after allegedly contacting a complainant on WhatsApp posing as a prospective client before proposing sex; his questioning led to the other three arrests. Serology requisitions cited by Libération found two of the four HIV-positive, adding presumed voluntary HIV transmission and endangerment charges alongside criminal association and 'acts against nature.'",

    { id: 178, date: '2026-09-02', category: 'Platform Integrity', country: 'Senegal', tier: 'reported', platformIntegrity: true,
      headline: "TikTokeuses Rox, Jessica and Narou placed in custody after cross-complaints escalate at Cybersecurity Division",
      summary: "Senegal's Division Spéciale de Cybersécurité placed three TikTok personalities — Rokhaya Fall ('Rox'), Khadidiatou Kébé ('Jessica') and Nafi Fall ('Narou') — in garde à vue on 2 September 2026 after a confrontation at its Dakar offices. The case began when Kébé filed a complaint against Fall ('Rox') in August alleging death threats, public insults, defamation and unauthorized distribution of personal data; when 'Rox' arrived to file her own counter-complaint, she learned 'Jessica' and 'Narou' had separately filed against her too, and all three were detained following the confrontation.",

      source: 'Kewoulo (also Dakaractu, Dakarposte)', url: 'https://www.dakaractu.com/Affaire-Rox-Jessica-Narou-apres-des-accusations-croisees-sur-TikTok-les-trois-femmes-placees-en-garde-a-vue_a275582.html' },
    { id: 179, date: '2026-09-01', category: 'Business & Economy', country: 'Senegal', tier: 'confirmed', platformIntegrity: false,
      headline: "IMF and Senegal reach staff-level agreement on new $2.2bn, three-year financing program",
      summary: "The IMF announced on 1 September 2026 a staff-level agreement with Senegal on an Extended Credit Facility arrangement worth roughly $2.2bn (SDR 1,537.1m) over three years (2026-29), following a 19 August-1 September mission to Dakar. Mission chief Mercedes Vera-Martin said the deal requires \"decisive corrective actions\" tied to Senegal's request for a waiver over the 2019-2024 hidden-debt misreporting (~$7bn under former president Macky Sall), and notably involves no formal debt-restructuring operation, preserving market access; the Fund credited resilient 6.7% GDP growth in 2025 (aided by first-year oil production) and 1.4% inflation. Finance Minister Cheikh Diba said 25% of state revenue this year goes to debt-interest payments and outlined a gradual debt-treatment plan, while Pastef economist Malick Gakou separately warned the same day that a formal restructuring may still prove unavoidable given the scale of the fiscal adjustment required.",
      whyItMatters: "A confirmed, board-pending IMF program — replacing the $1.8bn arrangement frozen since the debt-concealment scandal and following the 28 August Moody's downgrade to Caa2 — is a material fiscal-continuity signal for the Client's Senegal monitoring, with the program's reliance on Grand Tortue Ahmeyim and Sangomar hydrocarbon revenue directly tying Dakar's fiscal trajectory to the energy sector.",
      source: 'France24 (also Bloomberg, IMF, Africtelegraph/Financial Afrik, alakhbar.info)', url: 'https://www.france24.com/en/live-news/20260901-imf-reaches-agreement-with-senegal-on-new-2-2-bn-loan-programme' },
    { id: 180, date: '2026-09-02', category: 'Politics & Governance', country: 'Senegal', tier: 'reported', platformIntegrity: false,
      headline: "Senegal's Council of Ministers resumes after month-long break, reshuffle speculation builds",
      summary: "Senegal's Council of Ministers reconvened on 2 September 2026 under President Bassirou Diomaye Faye, its first sitting since 29 July, resuming the day after the Senegal-IMF financing agreement (id 179). Speculation is building around a possible cabinet reshuffle after Armed Forces Minister Yankhoba Diémé's earlier remarks about a \"balai\" (broom) or \"râteau\" (rake) — commonly read as hints of upcoming dismissals or reassignments — though no specific names have been officially confirmed.",

    { id: 181, date: '2026-09-02', category: 'Digital Innovation & Connectivity', country: 'Senegal', tier: 'reported', platformIntegrity: false,
      headline: "Senegal's digital minister travels to Banjul to operationalize Senegal-Gambia connectivity and cybersecurity MoU",

    { id: 182, date: '2026-09-02', category: 'Politics & Governance', country: 'Niger', tier: 'confirmed', platformIntegrity: false,
      headline: "Thousands rally in Niamey to back junta chief Tiani after thwarted 28-29 August mutiny",
      summary: "Several thousand people, including government ministers and junta supporters, gathered at Niamey's Place de la Concertation on 2 September 2026 in a show of support for junta leader Abdourahamane Tiani, days after loyalist forces (with Russian Africa Corps assistance) put down a mutiny by Niger's own soldiers at the airport, Base 101 and the presidential-palace perimeter. Tiani's chief of staff alleged the mutiny's sponsors were based abroad; Tiani himself had not appeared publicly since the attack as of the rally.",

    { id: 183, date: '2026-09-02', reportedDate: '2026-09-03', category: 'Platform Integrity', country: 'DR Congo', tier: 'confirmed', platformIntegrity: true,
      headline: "Pro-M23 TikTok influencer Denise Dusauchoy placed under provisional arrest warrant in Kinshasa after Tanzania extradition",
      summary: "Congolese TikTok influencer and pro-M23/AFC propagandist Denise Dusauchoy (Denise Mukendi) was placed under a provisional arrest warrant in Kinshasa on 2 September 2026 after prosecutors said her interrogation turned up 'serious indicia of guilt.' She had been arrested in Tanzania on 30 August under a Congolese-issued international warrant and handed over via judicial cooperation between Kinshasa and Dodoma, following criminal cases opened by the Kinshasa/Gombe prosecutor's office and international rogatory commissions filed with Belgian authorities since late 2025.",
      whyItMatters: "A concrete cross-border arrest and provisional detention over TikTok-based content — following the Justice Ministry's mid-August order to prosecutors to pursue social-media offenses (id 45's broader crackdown context) — shows DRC authorities are now following through with custodial action rather than just takedown threats, a material escalation for the Client's Platform Integrity exposure in DR Congo.",
      source: 'Reporter.cd (also ACP, Radio Okapi)', url: 'https://www.reporter.cd/rdc-linfluenceuse-denise-dusauchoy-placee-sous-mandat-darret-provisoire/' },
    { id: 184, date: '2026-09-02', reportedDate: '2026-09-03', category: 'Conflict & Security', country: 'Niger', tier: 'reported', platformIntegrity: false,
      headline: "Niger state TV displays seized mutiny arsenal, airs officer's testimony citing foreign contacts including France",
      summary: "Niger's national broadcaster (Télé Sahel/ORTN) revealed on 2 September 2026 the scale of weapons recovered from the Special Reconnaissance Battalion behind the 28-29 August mutiny attempt against President Tiani: 34 armed pick-ups, two armored vehicles, dozens of motorcycles, 382 rifles, 36 rocket launchers, mortars, sniper rifles and communications equipment. The display followed a 1 September state-TV broadcast of testimony from Captain Roger Gabriel of the 1st Parachute Battalion, who said he received domestic calls urging him to join the mutiny and other calls or messages referencing Chad, Benin, Côte d'Ivoire and France as possibly ready to back the mutineers, which he said he did not act on. Niger's government has not formally accused any state, though state TV had directly implicated France the night the mutiny was put down.",
      whyItMatters: "A second consecutive state-media broadcast naming France (and, per some accounts, Belgium/UAE) in connection with the mutiny — via a single officer's unverified account — keeps Niger's information environment and anti-French diplomatic posture in the spotlight, relevant background for the Client's connectivity and platform-surveillance risk exposure there alongside the still-open casualty-toll question (ids 129/135/140/148/156).",
      source: 'Afriquinfos (also RT en français, citing ORTN)', url: 'https://afriquinfos.com/le-niger-leve-son-vaste-voile-sur-larsenal-capture-aupres-de-la-mutinerie-matee-du-29-aout/' },
    { id: 185, date: '2026-09-01', reportedDate: '2026-09-03', category: 'Platform Integrity', country: 'Senegal', tier: 'reported', platformIntegrity: true,
      headline: "Guinean national arrested in Kédougou after TikTok-live murder claim tied to Kaolack traced to a Bissau-based 'marabout' stream",
      summary: "A young Guinean national (~20, identified as Yaya/Yahya Sidibé) was arrested by the Section de Recherches in Kédougou on 1 September 2026 after a TikTok livestream — hosted by a self-styled spiritual guide broadcasting from Bissau — showed him, speaking in Pulaar, claiming to have killed someone in Kaolack in order to get rich and asking for enrichment-ritual advice. He was transferred to Kaolack's Section de Recherches for further investigation; at his preliminary hearing he said the claim was only a 'chauffe' (stunt) to hype the livestream, and authorities have not confirmed an actual killing took place.",
      whyItMatters: "Even as an apparent hoax, a cross-border TikTok livestream prompting a real criminal investigation and arrest is a fresh, concrete Platform Integrity case for Senegal, and the Bissau-based streamer angle adds a regional-platform-moderation dimension worth flagging for any follow-on TikTok response.",
