    { id: 39, date: '2026-09-11', country: 'Mauritania', category: 'Business & Economy', tier: 'confirmed', headline: "Mauritania and Morocco announce a joint 800-hectare industrial zone, with Moroccan firms given priority and full national-investor rights", summary: "Speaking at the 14th SISTEP IMME industrial trade fair in Casablanca, held 9-12 September 2026 with Mauritania as guest of honour, the director general of industry at Mauritania's Ministry of Mines and Industry, Cheikh Sidi Mohamed Ahmedoua, said the two countries are working to create a shared industrial zone of 800 hectares, presented as the largest on the continent. Moroccan companies would have priority for installation and the same investment rights as Mauritanian firms, without foreign-investor status, and the zone is pitched as a direct gateway to the European market through Morocco. No site, timetable or financing structure has been made public.", whyItMatters: "Nouakchott is positioning its industrial strategy around a Moroccan corridor to Europe at the same time as it negotiates the domestic-gas and cost-audit questions around GTA, and an industrial zone of this scale would create a large new domestic gas and power customer — making it worth tracking for how Mauritania frames the offtake it expects from the project.", source: 'Saharamedias (also Cridem, EcoActu, Industrie du Maroc)', url: 'https://fr.saharamedias.net/la-mauritanie-et-la-maroc-travaillent-a-la-creation-dune-zone-industrielle-commune-de-800-ha/' },
    { id: 40, date: '2026-09-11', country: 'Senegal', category: 'Business & Economy', tier: 'confirmed', headline: "Dakar raises 101.3bn FCFA on the UMOA market days before the supplementary budget is tabled", summary: "Senegal's Direction generale des financements et de la dette mobilised 101.339 billion FCFA, roughly 182 million dollars, from UEMOA regional-market investors on Friday 11 September 2026 through a treasury-bond issue to cover state budget needs, as reported by Financial Afrik and Lejecos on 12 September. The raise lands between the 11 September report that the IMF considers the new 36-month Extended Credit Facility able to proceed before creditor talks conclude (item 37) and the 15 September deadline the Prime Minister set for tabling the 2026 supplementary budget (item 35).", whyItMatters: "Dakar is still meeting its financing needs at regional-market cost while the IMF programme is unapproved, which keeps pressure on the hydrocarbon-revenue line in the supplementary budget — the same line where the state's assumptions about GTA receipts and any Petrosen or domestic-gas provision will first be written down.", source: 'Financial Afrik (also Lejecos)', url: 'https://www.financialafrik.com/2026/09/12/le-senegal-leve-101339-milliards-de-fcfa-sur-le-marche-financier-de-lumoa/' },
    { id: 41, date: '2026-09-08', country: 'Senegal', category: 'Energy', tier: 'confirmed', headline: "Senegal's PM asks for an agreement with Mauritania and bp to divert part of GTA gas to Senelec, with domestic supply targeted from January 2027", summary: "In his general policy declaration to the National Assembly on Tuesday 8 September 2026, Prime Minister Ahmadou Lamine Lo called for the conclusion of an agreement with Mauritania and bp allowing Senegal to use part of the gas produced at Grand Tortue Ahmeyim, on terms he described as consistent with the agreements already concluded between the parties. He said supply of liquefied natural gas to the national electricity utility Senelec should begin from January 2027, framing it as part of converting the country's oil and gas resources into cheaper electricity and industrial capacity. In the same declaration he announced a 'progressive, predictable and differentiated' reduction of subsidies toward 1% of GDP by 2029, roughly 250 billion FCFA, with support redirected to the most vulnerable rather than to product subsidies. Reported by Saharamedias; Mauritanian commentary the same week framed the question as whether Nouakchott will side with Dakar on pricing, noting the gap between spot LNG values and what each cargo returns to the states.", whyItMatters: "A head of government publicly setting a date for domestic GTA gas deliveries turns what had been a negotiating position into a schedule the operator will be measured against, and pairing it with an explicit call for a joint Senegal-Mauritania front on terms raises the prospect of the two host states coordinating rather than negotiating separately with bp and Kosmos.", source: 'Saharamedias', url: 'https://fr.saharamedias.net/le-premier-ministre-senegalais-appelle-a-la-conclusion-dun-accord-avec-la-mauritanie-sur-le-projet-gazier-gta/' },
    { id: 42, date: '2026-09-08', country: 'Senegal', category: 'Business & Economy', tier: 'confirmed', headline: "DPG fiscal disclosures: consolidated public-sector debt near 132% of GDP, 2024 deficit revised to 13.7%, domestic revenue at 56.9% of target", summary: "A press review of the Prime Minister's 8 September general policy declaration, published on 12 September, sets out the fiscal picture behind the government's programme: consolidated public-sector debt of about 132% of GDP at end-2024, more than 23,500 billion FCFA (25,583 billion and 128.6% of GDP on another perimeter); parastatal debt up from 816 billion FCFA in 2019 to 1,917 billion in 2024; the 2024 deficit revised to 13.7% of GDP; non-hydrocarbon growth of 2.2% in 2025 against a 6.4% deficit. Domestic revenue to end-August 2026 reached 172.5 billion FCFA against a 303.3 billion target, a 56.9% realisation rate, while state arrears stood at 1,956 billion FCFA across 5,425 files at end-March 2025. The declaration also confirmed proven reserves of 960 million barrels of oil and 560 billion cubic metres of gas across Sangomar and Grand Tortue Ahmeyim, and a choice to reschedule debt through longer maturities and renegotiated rates rather than pursue a deeper restructuring.", whyItMatters: "The state's own numbers show revenue running well behind target while debt sits near 132% of GDP, which sharpens Dakar's incentive to accelerate hydrocarbon receipts — the pressure now visible in the PM's push for domestic GTA gas from January 2027 (item 41) and in what the supplementary budget due 15 September assumes about GTA revenue.", source: 'Senego (press review of APS-received dailies; also Saharamedias)', url: 'https://senego.com/dpg-dette-autour-de-132-du-pib-pres-a-6-166-milliards-et-recettes-a-569_2001968.html' },
    { id: 43, date: '2026-09-11', country: 'Senegal', category: 'Politics & Governance', tier: 'confirmed', headline: "Sonko calls for 'loyal dialogue' with Faye as the extraordinary session closes, stepping back from institutional confrontation", summary: "Closing the National Assembly's extraordinary session after the Prime Minister's general policy declaration, Speaker Ousmane Sonko set aside the prospect of a durable clash between institutions and called for loyal dialogue with President Bassirou Diomaye Faye, while defending parliament's autonomy and its scrutiny role over government measures. Social affairs minister Maimouna Dieye separately urged cohesion around the Sonko-Faye 'tandem'. No confidence vote was sought after the 8 September declaration, though Pastef deputies have voiced reservations on debt management and on relations with the IMF. The Council of Ministers of 10 September confirmed continuity of the Senegal 2050 framework and instructed the Prime Minister to follow implementation on purchasing power, public finances and state-service efficiency.", whyItMatters: "A de-escalation signal from the Pastef rift that has run through the Kosmos and ICS dossiers since July lowers the near-term risk that the supplementary budget — where GTA revenue assumptions are written down — becomes a casualty of the presidency-legislature conflict, without resolving the underlying disagreement over debt and the IMF programme.", source: 'Senego', url: 'https://senego.com/ousmane-sonko-appelle-a-un-dialogue-loyal-avec-bassirou-diomaye-faye_2002008.html' },
    { id: 44, date: '2026-09-12', country: 'Regional (Mauritania/Senegal)', category: 'Energy', tier: 'confirmed', headline: "Saudi Arabia shuts its East-West crude pipeline after drone strikes from Iraq as the Houthis complete their takeover of Bab el-Mandeb and ban Saudi shipping", summary: "Saudi Arabia closed the 1,200 km East-West pipeline — the route that had been carrying 4-5 million barrels a day from the Gulf fields to the Red Sea coast, bypassing the near-closed Strait of Hormuz — after drones launched from Iraqi territory struck the line and its operating equipment, with the shutdown reported on Friday 11 September 2026; Riyadh said it would hold off retaliation to give Baghdad time to act, and no group has claimed the attack (Al Jazeera, CNBC, AGBI). On 12 September Houthi forces reached Perim Island, the volcanic island that splits the Bab el-Mandeb strait into two shipping lanes, after Yemeni government forces withdrew, completing a week-long push along the Red Sea coast; a politburo member first said navigation remained safe, then military spokesman Yahya Saree stated it was safe for all companies except Saudi ships, which are banned (Euronews, NBC, Times of Israel). Mauritania's foreign ministry condemned the attacks on Saudi installations the same day (Saharamedias).", whyItMatters: "With Hormuz throttled, the Red Sea leg closed to Saudi tankers and Saudi Arabia's overland bypass now shut, the supply shock that took Brent above $108 (item 36) has hardened from a risk into a physical constraint — which lifts the value of every GTA cargo and of Atlantic-basin LNG generally and strengthens the fiscal case Dakar and Nouakchott are building around gas revenue, but also raises war-risk insurance and routing costs for any GTA volumes sold eastward, and draws Mauritania diplomatically into the Gulf conflict on Riyadh's side.", source: 'Al Jazeera (pipeline; also CNBC, AGBI) / Euronews (Bab el-Mandeb; also NBC, Times of Israel) / Saharamedias (Mauritania)', url: 'https://www.aljazeera.com/news/2026/9/12/saudi-arabia-shuts-critical-oil-pipeline-after-drone-attack-what-happened' },
    { id: 45, date: '2026-09-12', country: 'Mauritania', category: 'Politics & Governance', tier: 'reported', headline: "Ruling-party officials in M'Bagne openly campaign for a Ghazouani third term, moving the constitutional question the opposition warned of into the open", summary: "Elected officials, cadres and activists of the M'Bagne department (Brakna) called on President Mohamed Ould Cheikh El Ghazouani to seek a third term, during a party-structure revitalisation visit by Ahmed Salem El Arby, executive secretary of the ruling INSAF party for Brakna, Cridem reported on 12 September 2026 under the headline 'Chacun son tour'. Afrik Soir describes repeated statements of this kind from local elected officials as having put the third-term question at the centre of Mauritanian politics, while the opposition rejects any such move as a challenge to constitutional principles; the constitution limits presidents to two terms and Ghazouani himself has made no public request. Columnists in Rapide Info and Cridem framed the question this weekend as a choice between 'national dialogue and renunciation' and called a third term 'a betrayal of the oath and the constitution'.", whyItMatters: "This is the clearest ruling-party-side signal yet in this feed of the third-term push the opposition has been denouncing (items 23, 28), moving the constitutional-revision scenario from suspicion toward an organised political programme — the central medium-term political-risk variable for BP's Mauritanian host state and for the continuity of the SMH and fiscal arrangements around GTA.", source: 'Cridem (also Afrik Soir, Rapide Info)', url: 'http://www.cridem.org/C_Info.php?article=796422' },
    { id: 46, date: '2026-09-12', country: 'Senegal', category: 'Business & Economy', tier: 'confirmed', headline: "Mid-year budget execution: tax revenue 2,458.7bn FCFA (45.7% of target, +17.6% y/y), spending at 40.1% — the base for the 15 September supplementary budget", summary: "Senegal's second-quarter 2026 budget-execution report, relayed by Le Soleil and Seneweb on 12 September, shows tax revenue of 2,458.7 billion FCFA at end-June — 45.7% of the 5,384.8 billion annual target and 97.9% of the half-year target — up 368.2 billion (17.6%) year on year on stronger direct taxes; non-tax revenue of 124.2 billion (112.9% of its half-year target of 110 billion); and general-budget spending of 2,874.7 billion, a 40.1% execution rate against the initial 2026 budget law.", whyItMatters: "These are the numbers the supplementary budget due at the National Assembly by 15 September (item 35) must reconcile with the IMF programme's revenue path (items 16, 42), and they set how much weight the government has to put on hydrocarbon receipts from GTA and Sangomar — and on the domestic-gas terms it is pressing on Mauritania and bp (item 41) — to close the gap.", source: 'Le Soleil (also Seneweb, Sanslimitesn)', url: 'https://lesoleil.sn/actualites/economie/execution-budgetaire-2e-trimestre-2026-les-recettes-fiscales-ont-atteint-2-458-milliards-de-fcfa/' },
    { id: 47, date: '2026-09-12', country: 'Mauritania', category: 'Politics & Governance', tier: 'confirmed', headline: "Gen. Ould Maayouf's imprisonment moves to the street: simultaneous solidarity protests in Nouakchott and Zouerate, parties demand his release", summary: "Supporters of the Mauritanie en avant party and relatives of retired General Lebatt Ould Maayouf held simultaneous protest gatherings on Saturday 12 September 2026 in southern Nouakchott and in Zouerate, the northern iron-ore mining town, demanding his immediate release and denouncing restrictions on freedoms (Alakhbar, Mauritania 13, Meyadin). The gatherings follow the prosecution's decision, after about two weeks in custody, to charge him with weakening the morale of the armed forces, disclosing military information and undermining the dignity of the state, and to remand him to the civil prison — the step that triggered his party's boycott of the national dialogue (item 23); he had been arrested by the cybercrime unit over online interviews and audio recordings criticising the ruling system (Alakhbar, Asharq Al-Awsat). Earlier in the week activists in Nouadhibou staged a symbolic funeral for freedom of expression, and several parties have called for his release (Alakhbar, Tawassoul).", whyItMatters: "What began as a party boycott of the national dialogue is now producing street mobilisation in the capital and in the SNIM mining town, and charges built on a retired general's criticism of the army hand the opposition a freedom-of-expression cause at the very moment ruling-party figures are floating a Ghazouani third term (item 45) — so the dialogue meant to settle Mauritania's constitutional trajectory is starting to look like the flashpoint that could unsettle it, the central political-risk variable for BP's Mauritanian host state.", source: 'Alakhbar (also Mauritania 13, Meyadin, Tawassoul)', url: 'https://www.alakhbar.info/6aa68ece7d4c2b0001d53024/' },
    { id: 48, date: '2026-09-13', country: 'Mauritania', category: 'Politics & Governance', tier: 'reported', headline: "Gendarmes arrest three men in a Trarza village after they hosted the Iranian ambassador, officially over celebratory gunfire", summary: "Alakhbar reported on 13 September 2026 that the gendarmerie detained three people in the village of Bousdeira, in Boutilimit department (Trarza): Mohamed Ould Hamed, who had received the Iranian ambassador at his home, Mokhtar Mbarek, a retired hakem (district prefect), and El Mokhtar Kahouk. The ambassador had travelled to the village at Ould Hamed's invitation; the gendarmerie gave as grounds the gunfire let off during the reception to celebrate his arrival. This is a single-source report with no further official statement. The Iranian ambassador has been an unusually public voice in Mauritanian media during the Gulf conflict, publishing his own commentary on the war and thanking Mauritanians for their support (Alakhbar, Al-Quds Al-Arabi).", whyItMatters: "Nouakchott condemned the attacks on Saudi installations over the same weekend (item 44) while Iranian diplomacy courts sympathy in the Mauritanian interior — and the state's response, detaining the hosts of an ambassador's visit on a public-order pretext, shows how tightly the government intends to police its Gulf-conflict balancing act at home, a small but telling read on the political-control reflexes of BP's Mauritanian host state.", source: 'Alakhbar', url: 'https://www.alakhbar.info/6aa68ac77d4c2b0001d53013/' }

  riotinto: [
    { id: 1, date: '2026-07-28', country: 'Guinea', category: 'Operations & Production', tier: 'confirmed', headline: 'First vessel in dedicated Simandou transhipment fleet completed', summary: 'Shipping group CSL announced completion of the first vessel in a purpose-built transhipment fleet intended to move iron ore from the Morebaya port to deep water for onward export. A corporate/logistics milestone, cross-published by multiple outlets.', whyItMatters: "Confirms the dedicated transhipment logistics chain needed to move Simandou ore to deep water is coming online on schedule, removing a key bottleneck to the project's export ramp-up.", source: 'GlobeNewswire / Manila Times', url: 'https://www.globenewswire.com/news-release/2026/07/28/3334114/0/en/CSL-Marks-the-Completion-of-the-First-Vessel-in-World-Leading-Transhipment-Fleet-for-Simandou-Project.html' },
    { id: 2, date: '2026-07-24', country: 'Guinea', category: 'Operations & Production', tier: 'confirmed', headline: 'Simandou construction reaches 74% (mine) / 78% (port) completion', summary: "Simfer's Q1 2026 update shows the mine 74% complete and the Morebaya port 78% complete as of end-March 2026, with 600,000 tonnes shipped in Q1 and first sales into China in April 2026.", whyItMatters: "Steady construction progress and the April first sales into China indicate the project remains on its ramp-up trajectory, relevant to assessing execution risk on Rio Tinto's Simfer stake.", source: 'Mining Weekly', url: 'https://www.miningweekly.com/article/guinea-iron-ore-development-reaches-74-completion-2026-07-24' },
    { id: 3, date: '2026-06-03', country: 'Guinea', category: 'Operations & Production', tier: 'confirmed', headline: 'Simandou exports surge to 2.2Mt in May, six months after first ore', summary: 'Iron ore exports from Simandou rose to 2.2 million tonnes in May 2026, up from 1.3Mt in April, six months after the December 2025 first shipment. The report notes a February 2026 worker fatality and the May 2026 strike as recent headwinds to the ramp-up.', whyItMatters: "Rising export volumes six months after first ore show the ramp-up progressing despite the February fatality and May strike, though both remain relevant risk markers to watch.", source: 'Bloomberg via Mining.com', url: 'https://www.mining.com/web/guineas-simandou-iron-exports-surge-six-months-after-first-ore/' },
    { id: 4, date: '2026-05-07', country: 'Guinea', category: 'Labor Relations', tier: 'confirmed', headline: 'Strike at Baowu-led WCS site ends after tripartite pay accord', summary: "~3,000 unionized workers at the Winning Consortium Simandou (WCS/BWCS) site struck April 28–May 7, 2026 over pay disparity with Simfer workers. The strike ended after a government-mediated tripartite accord between the consortium, workers and the state. Multi-sourced (Kitco/MarketScreener/Miningmx), though one corroborating outlet, CGTN, is Chinese state media.", whyItMatters: "A government-mediated resolution to a pay-disparity strike at the neighboring WCS site is a relevant precedent for labor-relations risk at Rio Tinto's own Simfer operation.", source: 'Kitco / MarketScreener / CGTN / Miningmx', url: 'https://www.kitco.com/news/off-the-wire/2026-05-07/mining-resumes-baowu-led-simandou-site-workers-end-strike' },
    { id: 5, date: '2026-04-15', country: 'Guinea', category: 'Community, Environmental & NGO Scrutiny', tier: 'reported', headline: "NGO briefing flags land, water and worker-safety risks at Simandou", summary: "BankTrack and Advocates for Community Alternatives published a risk briefing for Rio Tinto's financiers citing unresolved land and water-contamination concerns and worker safety issues (18+ deaths reported since 2023), alongside biodiversity threats to chimpanzees and forest elephants along the corridor. An advocacy-NGO output presenting a one-sided critical counter-narrative, not independently verified by Rio Tinto or the Guinean government.", whyItMatters: "Financier-facing NGO briefings like this one can influence project financing terms and ESG scrutiny even without independent verification, making them worth tracking regardless of tier.", source: 'BankTrack', url: 'https://www.banktrack.org/download/project_impact_briefing_risks_to_rio_tinto_financiers_from_the_simandou_iron_ore_project_in_guinea/simandou_briefing_apr_2026_v5_2.pdf' },
    { id: 6, date: '2026-01-04', country: 'Guinea', category: 'Fiscal, Regulatory & Government Relations', tier: 'confirmed', headline: "Guinea's Supreme Court confirms Doumbouya's election win; mines minister retained", summary: "Guinea's Supreme Court confirmed Mamady Doumbouya as winner of the December 2025 presidential election. The post-election government retained the sitting mines minister, signaling policy continuity for Simandou. Included here for political-continuity context rather than as a new in-window development.", whyItMatters: "Retaining the sitting mines minister after a contested transition is a positive continuity signal for Simandou's regulatory environment and reduces near-term policy-reversal risk.", source: 'France24 / Al Jazeera / Africanews / CNBC Africa', url: 'https://www.france24.com/en/africa/20260104-guinea-s-supreme-court-confirms-mamady-doumbouya-as-election-winner' },
    { id: 7, date: '2026-08-22', country: 'Guinea', category: 'Operations & Production', tier: 'confirmed', headline: "Rio Tinto halts Simandou work after contractor fatality at SimFer site", summary: "A contract worker died following an incident at the SimFer site (Blocks 3 & 4) near Nzérékoré on Friday 22 August 2026. Rio Tinto halted work at the site and opened an investigation with relevant authorities; incoming CEO Simon Trott commented on the death on 23 August, and the company declined on 25 August to say when work would resume. Multi-sourced (Argus Media, Mining.com, Mining Journal, The Nightly, Business & Human Rights Centre).", whyItMatters: "A second reported fatality at Simandou this year (after February) and an open-ended work stoppage is a direct operational and execution-risk marker for Rio Tinto's Simfer stake, and likely to draw renewed NGO/financier safety scrutiny alongside the April BankTrack briefing (id 5).", source: 'Argus Media (also Mining.com, Mining Journal, The Nightly)', url: 'https://www.argusmedia.com/en/news-and-insights/latest-market-news/2724464-rio-tinto-stops-work-on-guinean-simandou-iron-ore-mine' },
    { id: 8, date: '2026-08-24', country: 'Guinea', category: 'Fiscal, Regulatory & Government Relations', tier: 'confirmed', headline: "Guinea launches tender for 170km Coyah-Kindia-Mamou highway under Simandou 2040 plan", summary: "Guinea's infrastructure ministry issued an expression-of-interest call on 24 August 2026 for a 2×2-lane, 170km highway on the Coyah-Kindia-Mamou corridor (part of the RN1), to be financed through public-private partnerships including toll systems and EPC+Finance contracts rather than public debt. The project sits under Pillar 3 (transport) of President Doumbouya's 'Simandou 2040' development program and is framed as strategic for national/regional integration and for the country's mining and agricultural corridors. Multi-sourced (Ecofin Agency, Africa Guinée, Mediaguinée, Guineematin).", whyItMatters: "A concrete, government-backed transport-corridor investment under the same 'Simandou 2040' program that frames Rio Tinto's own project signals continued state commitment to the broader logistics environment Simfer depends on, and is a useful government-relations/continuity data point distinct from Simfer's own rail/port build-out.", source: 'Agence Ecofin', url: 'https://www.agenceecofin.com/actualites-infrastructures/2508-141000-la-guinee-lance-la-construction-de-lautoroute-coyah-kindia-mamou-sur-170-km' },
    { id: 9, date: '2026-08-24', reportedDate: '2026-08-25', country: 'Guinea', category: 'Security & Conflict', tier: 'reported', headline: "Mass grave found in Forécariah, a rail-corridor prefecture, underscores Guinea's wider security backdrop", summary: "Guinean authorities are investigating a mass grave containing six bound and blindfolded bodies discovered near Sabakhouré village in Forécariah prefecture's Allassoyah sub-prefecture on 24 August. Forécariah is one of the communities Rio Tinto's own stakeholder mapping flags for land and rail-corridor grievances, though no source has linked the killings to Simandou or its operations, and the victims' identities and motive remain unknown.", whyItMatters: "An unresolved, high-profile violent-crime case in a prefecture already on Rio Tinto's own corridor-community watch list is a useful general security-backdrop data point for Simfer's community-relations risk, even absent any confirmed project connection.", source: 'AGP Guinée (also Guinée7, Dakaractu, Mediaguinée)', url: 'https://agpguinee.com/forecariah-six-corps-non-identifies-decouverts-enfouis-dans-une-fosse-commune-a-allassoyah/' },
    { id: 10, date: '2026-08-27', country: 'Guinea', category: 'Security & Conflict', tier: 'reported', headline: "France calls for independent investigation into Forécariah mass grave", summary: "France publicly requested on 27 August 2026 that Guinean authorities carry out an independent, transparent investigation into the six bound bodies found near Forécariah on 24 August, per reporting relayed via Sudouest.fr. Guinean opposition figures separately renewed calls the same day for an independent inquiry, while the victims' identities and motive remain unknown.", whyItMatters: "A foreign government weighing in on an unresolved violent-crime case in a rail-corridor prefecture already on Rio Tinto's own community-risk watch list (item 9) raises the international profile of Guinea's handling of the investigation and is worth tracking for any read-through to corridor security perceptions.", source: 'Mosaïqueguinée (via Sudouest.fr)', url: 'https://www.mosaiqueguinee.com/six-corps-decouverts-dans-une-fosse-commune-la-france-appelle-a-une-enquete-independante-et-transparente-sudouest-fr/' },
    { id: 11, date: '2026-08-30', country: 'Guinea', category: 'Community, Environmental & NGO Scrutiny', tier: 'reported', headline: "African civil-society coalition and FNDC lawyers escalate demands for independent probe into Forécariah mass grave", summary: "Twenty African civil-society organizations issued a joint declaration from Brazzaville on 30 August 2026 demanding an independent, transparent investigation, autopsies and DNA testing into the six bound bodies found near Forécariah on 24 August, and said they would jointly petition the sitting ECOWAS chair and the UN human-rights office for a fact-finding mission. FNDC lawyers separately filed their own formal demand for independent autopsies and DNA comparisons. Guinea's defense and security commission said no definitive conclusions could yet be drawn; the victims remain unidentified.", whyItMatters: "Continued, now internationally amplified civil-society pressure over an unresolved mass-killing in a prefecture already on Rio Tinto's own corridor-community watch list (items 9-10) keeps Forécariah's security and human-rights profile elevated, worth monitoring for any read-through to corridor-community relations or financier/NGO scrutiny of Simfer.", source: 'Le Révélateur224', url: 'https://www.lerevelateur224.com/2026/08/30/decouverte-de-six-corps-a-forecariah-20-organisations-de-la-societe-civile-africaine-exigent-justice-et-la-fin-de-limpunite-declaration/' },
    { id: 12, date: '2026-08-31', country: 'Guinea', category: 'Corporate & Financial', tier: 'confirmed', headline: "BMI names Simandou a key driver of accelerating global iron-ore output, flags Guinea delay risk", summary: "BMI (a Fitch Solutions unit) forecasts global iron-ore production growth accelerating to an average 2.2%/year from 2026-2030 (versus 1.2% over the prior five years), reaching 3.04 billion tonnes by 2030, and names Guinea's Simandou project coming online as a major driver of that acceleration. BMI expects mainland Chinese firms to prioritize investment in overseas iron-ore mines like Simandou, but flags political and social instability and resource nationalism as risks that could delay the project's ramp-up, and separately projects industry-wide production stagnation and decline from 2032-2034 as prices soften.", whyItMatters: "An independent industry forecaster naming Simandou as central to the next five years of global iron-ore supply growth is useful external validation of the project's market significance, while its explicit delay-risk framing (political instability, resource nationalism) tracks directly onto the same Guinea governance-continuity risk factors — Doumbouya, FNDC, the Forécariah fallout — already on Rio Tinto's watch list.", source: 'Mining Weekly (BMI/Fitch Solutions)', url: 'https://www.miningweekly.com/article/iron-ore-production-set-for-further-growth-to-2030-bmi-2026-08-31' },
    { id: 13, date: '2026-09-01', country: 'Guinea', category: 'Fiscal, Regulatory & Government Relations', tier: 'confirmed', headline: "PM Bah Oury restructures Guinean ministries into four blocs to ready state administration for Simandou 2040", summary: "Prime Minister Bah Oury announced a reorganization of Guinea's ministerial structures into four coordinated blocs, saying the real test for President Doumbouya's Simandou 2040 program is whether the state's administration and methodology are capable of following through on implementation. Bah Oury warned that without disciplined governance and updated working methods, Guinea risks squandering what he called a rare, historic opportunity to convert Simandou's coming revenues into durable national investment.", whyItMatters: "A sitting PM publicly tying a government-wide administrative reorganization to Simandou execution capacity is a direct governance-continuity signal for the project — both a sign the state is trying to get ahead of implementation risk and an acknowledgment, from Guinea's own leadership, that the administrative apparatus is not yet fully ready.", source: 'Africa Guinée', url: 'https://www.africaguinee.com/guinee-pourquoi-bah-oury-impose-un-changement-de-cap/' },
    { id: 14, date: '2026-09-01', country: 'Guinea', category: 'Operations & Production', tier: 'confirmed', headline: "Forécariah préfet's site visit confirms Moribayah port security calm, first ore-transport operations due in October", summary: "Forécariah's préfet, Colonel Mamadou Lamarana Diallo, led a security and administrative delegation on a field visit to the Moribayah port site on 1 September 2026, meeting Rio Tinto Simfer officials and defense/security personnel stationed there. He said the site is visited every two months, praised the visible progress of works, and reported no major security incidents or friction between mining companies and local communities. Rio Tinto Simfer's port director, Gabriel Ramirez, confirmed the quay's equipment is ready to receive iron ore, with the site's first ore-transport operations expected to begin in October 2026.", whyItMatters: "An on-record security 'all clear' from Forécariah's own préfet — the same prefecture at the center of the unresolved August mass-grave case (ids 9-11) — alongside a concrete October start date for first ore-transport operations at Moribayah, is a useful operational-readiness and community-security data point for Rio Tinto's Simfer stake ahead of the project's export ramp-up.", source: 'Guineematin.com', url: 'https://guineematin.com/2026/09/02/forecariah-le-prefet-mamadou-lamarana-diallo-visite-le-port-de-moribayah/' },
    { id: 15, date: '2026-09-02', country: 'Guinea', category: 'Corporate & Financial', tier: 'confirmed', headline: "SimFer names Kox Gomba as new Managing Director as outgoing MD Chris Aitchison moves up to lead Rio Tinto Group Projects", summary: "Rio Tinto's Simandou operator SimFer announced on 2 September 2026 that Chris Aitchison, its Managing Director, is leaving Guinea to become Rio Tinto Group's Head of Projects, and will be replaced by Kox Gomba, SimFer's current Chief Operating Officer. Gomba, who joined SimFer in 2026 after roughly 20 years in mining operations and nearly eight years at Rio Tinto (most recently as COO at Richards Bay Minerals in South Africa), was brought in specifically to help steer the project from construction into the operations phase.", whyItMatters: "A planned, internally-sourced leadership handover — with the outgoing MD promoted to a group-level Rio Tinto role rather than departing the company — is a continuity-positive governance signal for Simfer heading into the operations phase, and Gomba's operations-focused background matches the project's current construction-to-production transition.", source: 'Financial Afrik (also Mediaguinee.com, Africa Guinée, Avenirguinee.org, Le Révélateur224)', url: 'https://www.financialafrik.com/2026/09/02/guinee-kox-gomba-remplace-chris-aitchison-a-la-tete-de-rio-tinto-simandou/' },
    { id: 16, date: '2026-09-03', country: 'Guinea', category: 'Community, Environmental & NGO Scrutiny', tier: 'reported', headline: "UFDG opposition leader Cellou Dalein Diallo publicly doubts credibility of Forécariah mass-grave investigation", summary: "In an RFI interview on 3 September 2026, former PM and UFDG leader Cellou Dalein Diallo said the six bodies found near Forécariah on 24 August had been 'reburied without autopsy and without any attempt at identification,' expressing doubt that the official investigation announced by authorities will be credible. The case remains unresolved, with victims still unidentified (items 9-11).", whyItMatters: "A leading opposition figure publicly challenging the state's handling of an unresolved rights case in the Simandou rail corridor keeps the story alive as a political flashpoint and regime-stability signal ahead of any resolution.", source: 'Guinee360 (also afrik.com, RFI, Le Révélateur224)', url: 'https://www.guinee360.com/03/09/2026/les-corps-ont-ete-enterres-sans-autopsie-cellou-dalein-doute-de-lenquete-sur-la-fosse-commune-a-forecariah' },
    { id: 17, date: '2026-09-02', country: 'Guinea', category: 'Fiscal, Regulatory & Government Relations', tier: 'confirmed', headline: "Doumbouya announces birth of a daughter, moving past weeks of health-rumor speculation", summary: "President Mamadi Doumbouya announced on the night of 2 September 2026 that First Lady Laurianne Doumbouya had given birth to a daughter, saying both mother and child were healthy and thanking medical staff and the Guinean public. Multiple Guinean and regional outlets carried the president's own statement. The announcement follows an August 2026 wave of unconfirmed rumors about Doumbouya's health, including claims of a secret hospitalization abroad.", whyItMatters: "A direct, personally-voiced public appearance runs counter to the prior month's health-rumor cycle around Doumbouya and offers a data point of presidential continuity relevant to Simandou's governance backdrop, though the underlying health rumors remain neither confirmed nor formally addressed.", source: 'Guinée360 (also AfrikSoir, Ecofinance Guinée, Courrier Régional, GuinéeSouverain)', url: 'https://www.guinee360.com/02/09/2026/notre-foyer-sest-rempli-de-joie-mamadi-doumbouya-annonce-la-naissance-de-sa-fille' },
    { id: 18, date: '2026-09-03', country: 'Guinea', category: 'Fiscal, Regulatory & Government Relations', tier: 'confirmed', headline: "Doumbouya sets five 'non-negotiable' governance requirements for the Simandou 2040 program", summary: "At the 3 September 2026 Council of Ministers, President Doumbouya laid out five conditions he called non-negotiable for how the Simandou 2040 program is run: strict, non-indicative milestones with monthly physical and financial execution dashboards sent to the General Secretariat of Government and the Simandou Strategic Committee; a ban on wasteful or 'prestige' spending and on procurement outside normal channels; and a requirement that partner investment demonstrably train and employ Guinean workers via the Simandou Academy, with quarterly local-content reports from each partner. He framed the program as 'a contract with the sovereign people of Guinea.'", whyItMatters: "A presidentially-mandated tightening of spending, procurement and local-content oversight — with monthly reporting into a strategic committee he chairs — raises the compliance and reporting bar Simfer and its partners will be held to, a direct fiscal/regulatory-continuity signal for the project.", source: 'Présidence de la République de Guinée (also Guinee360, Africa Guinée)', url: 'https://presidence.gov.gn/mise-en-oeuvre-du-programme-simandou-2040-le-president-de-la-republique-s-e-mamadi-doumbouya-2/' },
    { id: 19, date: '2026-09-05', country: 'Guinea', category: 'Fiscal, Regulatory & Government Relations', tier: 'confirmed',
      headline: "Five-year retrospectives mark Doumbouya coup anniversary with a 'contrasted' record: mining-led growth against a shrinking political space",
      summary: "Guinean and international outlets (Guineematin, RFI/AllAfrica) marked the 5 September 2021-2026 anniversary of Doumbouya's coup with retrospectives on his record. Guinea posted 7.4% growth in 2025 (World Bank forecasting 8.8% for 2026) on the back of mining, drawing the country's largest-ever FDI inflows in sub-Saharan Africa, with Simandou's first ore shipments beginning late 2025 under a new 122-project 'Simandou 2040' program. Against this, rights groups and opposition figures cite roughly 30 documented forced disappearances, an unexplained mass grave discovered in Forécariah about 10 days ago with no announced investigative progress, the March 2026 dissolution of 40 political parties (including Cellou Dalein Diallo's UFDG), a fall to 111th of 180 in RSF's 2026 press-freedom ranking, and the recent suspension and detention of judge Algassimou Diallo, who had presided over the landmark 28 September 2009 stadium-massacre trial.",
      whyItMatters: "A five-year record combining Simandou-driven growth with a shrinking political space and unresolved rights cases is the same governance-continuity picture this client already tracks (items 17-18) — the fresh Forécariah mass-grave find and a sitting judge's detention are concrete new data points worth watching for spillover into project-level stability risk.",
      source: 'RFI (via AllAfrica; also Guineematin.com)', url: 'https://fr.allafrica.com/stories/202609050113.html' },
    { id: 20, date: '2026-09-03', country: 'Guinea', category: 'Fiscal, Regulatory & Government Relations', tier: 'reported',
      headline: "Guinea pitches 'Simandou 2040' framework to Canadian investors at Montreal's Africa Expansion Forum",
      summary: "Guinea was the featured country at the 10th Africa Expansion Forum in Montreal (31 Aug-1 Sept 2026), where a government delegation led by Planning Minister Ismaël Nabé and Infrastructure Minister Facinet Sylla pitched the 'Simandou 2040' national transformation framework to Canadian investors, with a dedicated session on financing the program's non-mining pillars (agritech, infrastructure, innovation). Nabé framed the pitch as seeking 'transformation partners' rather than simple investors, across mining, engineering, clean tech, finance and skills development.",
      whyItMatters: "A government-led international investment pitch built explicitly around the same 'Simandou 2040' framework that anchors Rio Tinto's own project signals continued state effort to diversify the program's partner base and financing beyond the mine itself — a government-relations and program-continuity data point, though sourced here to a single ministry-affiliated press release rather than independent reporting.",
      source: 'Mosaiqueguinee.com (Ministère du Plan press release)', url: 'https://mosaiqueguinee.com/2026/09/la-guinee-change-dechelle-a-montreal-quand-lambition-de-simandou-2040-rencontre-le-capital-la-technologie-et-le-savoir-faire-canadien/' },
    { id: 21, date: '2026-09-06', country: 'Guinea', category: 'Fiscal, Regulatory & Government Relations', tier: 'confirmed',
      headline: "Ex-prosecutor Algassimou Diallo's Macenta transfer confirmed, sharpening rule-of-law concerns flagged in item 19",
      summary: "Guinea's prison administration confirmed on 6 September 2026 that judge Algassimou Diallo — whose detention was already cited in this client's five-year coup-anniversary retrospective (item 19) — was transferred on 5 September from Coyah prison to Macenta, some 700km from Conakry, after his defense had alleged an unexplained 'forced disappearance.' His lawyers say they received no formal notice of the transfer and are demanding his return to Conakry before an 8 September Supreme Court hearing.",
      whyItMatters: "An opaque transfer of a former state prosecutor, without notice to counsel, is a fresh data point in the same shrinking-political-space picture flagged for Guinea's governance-continuity risk around Simandou 2040 — worth watching for whether it draws international or investor attention ahead of the 8 September hearing.",
      source: 'Guinee360', url: 'https://www.guinee360.com/06/09/2026/apres-lalerte-de-ses-avocats-algassimou-diallo-retrouve-a-la-prison-de-macenta' },
    { id: 22, date: '2026-09-05', country: 'Guinea', category: 'Fiscal, Regulatory & Government Relations', tier: 'confirmed',
      headline: "Finance ministry names 36 new financial-affairs division heads (DAF) government-wide, part of a broader administrative reform push",
      summary: "Guinea's Minister of Economy, Finance and Budget, Mariama Ciré Sylla, named 36 new heads of Financial and Administrative Affairs Divisions across the Presidency, Prime Minister's Office, ministries and constitutional institutions (National Assembly, Supreme Court, Court of Accounts, HAC), announced overnight 4-5 September. The move was reported the same week as separate coverage of PM Bah Oury pushing to 'shake up the machine' of government administration.",
      whyItMatters: "A government-wide reshuffle of financial-administration gatekeepers is a governance-continuity signal worth tracking under this client's regime-stability lens — new appointees control budget execution across state bodies, with indirect relevance to how the state manages its financial obligations and disbursements tied to Simandou.",
      source: 'Africa Guinée', url: 'https://www.africaguinee.com/guinee-presidence-primature-ministeresvoici-les-36-daf-nommes-par-la-ministre-mariama-cire-sylla/' },
    { id: 23, date: '2026-09-03', country: 'Guinea', category: 'Fiscal, Regulatory & Government Relations', tier: 'confirmed', headline: "Doumbouya orders stricter project-execution discipline government-wide, explicitly framed around Simandou 2040 delivery", summary: "President Doumbouya gave ministers five binding requirements on 3 September 2026: monthly project-tracking against milestones, a bar on financing any project lacking a completed feasibility study, zero tolerance for off-procedure or wasteful spending, quarterly local-content reporting (jobs, training, skills transfer), and mandatory field visits to construction sites. Several Guinean outlets tied the directive explicitly to delivery of the state's 'Simandou 2040' program built around the mine, rail and port project.", whyItMatters: "A presidential mandate for tighter financial and execution discipline — tied explicitly to Simandou 2040 — signals the government is under pressure to show credible delivery on its side of the megaproject (feasibility vetting, local-content commitments, field oversight), which bears directly on the pace and governance quality of state-side infrastructure work feeding into Simfer/WCS operations.", source: 'Guinee360.com', url: 'https://www.guinee360.com/05/09/2026/chaque-franc-guineen-engage-doit-produire-un-resultat-visible-les-cinq-exigences-non-negociables-de-mamadi-doumbouya' },
    { id: 24, date: '2026-09-07', country: 'Guinea', category: 'Fiscal, Regulatory & Government Relations', tier: 'reported', headline: "Algassimou Diallo's defense seeks October trial postponement, citing harsh Macenta transfer conditions", summary: "Ex-prosecutor Algassimou Diallo, already the subject of item 21's Macenta-transfer report, told lawyers he was moved blindfolded and denied his glasses and medication during the overnight transfer; his expanded eight-lawyer defense team is asking Guinea's Supreme Court to postpone the 8 September hearing to October and says it has no assurance he will be produced in court, which is legally mandatory in criminal matters.", whyItMatters: "Continuing due-process irregularities around a high-profile political prisoner reinforce the rule-of-law concerns already flagged as a governance-continuity risk factor for the Simandou program's institutional environment.", source: 'RFI', url: 'https://www.rfi.fr/fr/afrique/20260907-guin%C3%A9e-vers-un-report-du-proc%C3%A8s-de-l-ex-magistrat-algassimou-diallo' },
    { id: 25, date: '2026-09-07', country: 'Guinea', category: 'Labor Relations', tier: 'confirmed', headline: "Central bank (BCRG) labor crisis escalates: governor suspends 12 union delegates, unions threaten banking-sector strike", summary: "Guinea's central bank (BCRG) governor Karamo Kaba banned all union activity at the institution for two months in late August/early September and formally suspended 12 USTG/FESABAG union delegates from 2 September to 1 November, following an August dispute over a stalled 2026 labor agreement and an earlier strike notice. The unions have filed appeals with the Labor Court, the National Council for Social Dialogue (CNDS) and the Prime Minister's office, and are maintaining the threat of a wider banking-sector strike; multiple independent Guinean outlets (Guineenews, Guinee360, Mediaguinee, AfricaGuinee) corroborate the suspensions and escalation. This resolves an item flagged as an unreached lead in the prior run's open questions.", whyItMatters: "A sustained institutional standoff at Guinea's central bank, on top of Doumbouya's own project-execution directives (item 23) and the Diallo due-process concerns (item 24), adds to the broader pattern of governance/institutional friction under the current government that 14N tracks as a regime-stability signal for Simandou's operating environment.", source: 'Guineenews.org', url: 'https://guineenews.org/2026/09/07/mise-a-pied-de-12-syndicalistes-de-la-bcrg-lustg-lance-une-vaste-controffensive/' },
    { id: 26, date: '2026-09-08', country: 'Guinea', category: 'Fiscal, Regulatory & Government Relations', tier: 'reported', headline: "Algassimou Diallo trial postponed to 15 October, resolving item 24's open question on his 8 September hearing", summary: "Guinea's Supreme Court postponed ex-prosecutor Algassimou Diallo's trial to 15 October 2026 after he did not appear for the scheduled 8 September hearing, following his defense's request for more time to prepare in the wake of his contested transfer to Macenta prison.", whyItMatters: "Resolves the near-term uncertainty flagged in item 24 and keeps the due-process/regime-stability thread live as a governance-continuity signal for Guinea, relevant to assessing decision-making stability around Simandou.", source: 'Mosaiqueguinee.com', url: 'https://mosaiqueguinee.com/2026/09/cour-supreme-laffaire-algassimou-diallo-renvoyee-au-15-octobre/' },
    { id: 27, date: '2026-09-08', country: 'Guinea', category: 'Operations & Production', tier: 'confirmed', headline: "SimFer begins phased commissioning of key Morebaya port infrastructure", summary: "SimFer, the joint venture between the Guinean state, Rio Tinto and the Chinalco-led CIOH consortium, began progressive commissioning of key storage and export equipment at its Morebaya port facility, including stockyard systems, stacker-reclaimers and shiploaders. SimFer said its port and marine infrastructure was 85% complete at end-H1 2026, with full port commissioning still targeted for Q1 2027; ore continues to move via rail from the mine and ship via the separate WCS port in the interim.", whyItMatters: "Commissioning of SimFer's own port infrastructure is a concrete operational milestone toward the project's 120-million-tonnes-per-year export target, and a data point for judging whether the Q1 2027 full-commissioning timeline is on track.", source: 'Africa Guinee', url: 'https://www.africaguinee.com/simfer-commence-la-mise-en-service-progressive-dinfrastructures-cles-au-port-de-morebaya/' },
    { id: 28, date: '2026-09-08', country: 'Guinea', category: 'Fiscal, Regulatory & Government Relations', tier: 'confirmed', headline: "Public Administration Minister names new senior leadership across reform, ENA and digitalization bodies, framed around Simandou 2040", summary: "Minister of Public Administration Modernization Faya François Bourouno announced a coordinated wave of senior appointments: a new head of the Directorate-General for Reform Monitoring and Public Service Quality, a four-person leadership team for the newly restructured National School of Administration (ENA), and a two-person leadership team for the new National Agency for State Digitalization (ANDE). The article explicitly frames the appointments as central to the 'refondation de l'État' pillar of the Simandou 2040 program and notes the choices were endorsed by President Doumbouya.", whyItMatters: "Consistent with the pattern already tracked for Guinea's coordinated appointment waves (item 22's DAF reshuffle), a government-wide leadership renewal explicitly tied to Simandou 2040 delivery is a governance-continuity signal worth tracking alongside the project's own operational milestones.", source: 'Mediaguinee.com', url: 'https://mediaguinee.com/2026/09/administration-publique-faya-francois-bourouno-mise-sur-une-equipe-de-haut-niveau-pour-accelerer-la-refondation-de-letat' },
    { id: 29, date: '2026-09-08', country: 'Guinea', category: 'Fiscal, Regulatory & Government Relations', tier: 'confirmed', headline: "Morocco and Guinea sign 25 cooperation agreements, Rabat explicitly endorses Simandou 2040 vision", summary: "Guinea's Foreign Minister Morissanda Kouyaté and Morocco's Nasser Bourita co-chaired the 8th Morocco-Guinea Joint Commission in Conakry on 8 September 2026, concluding 25 cooperation agreements across agriculture, energy, transport, port infrastructure and other sectors. Morocco formally recognized Guinea's Simandou 2040 program as the strategic framework guiding the country's economic transformation.", whyItMatters: "External diplomatic validation of the Simandou 2040 framework broadens the coalition of foreign partners invested in Guinea's post-coup development narrative, reinforcing the political-stability premium the project's own timeline depends on.", source: 'Africa Guinée', url: 'https://www.africaguinee.com/guinee-maroc-25-accords-strategiques-signes-a-conakry-pour-dynamiser-la-cooperation-bilaterale/' },
    { id: 30, date: '2026-09-09', country: 'Guinea', category: 'Fiscal, Regulatory & Government Relations', tier: 'confirmed', headline: "Government unveils sovereign wealth fund plans explicitly tied to Simandou 2040, targeting $4bn by 2029-2035", summary: "Prime Minister Amadou Oury Bah and Finance Minister Mariama Ciré Sylla presented the strategic guidelines for a future Guinean Sovereign Fund (FSG) on 9 September 2026, designed as a wholly state-owned public company to bank part of Simandou's mining revenue for infrastructure, education, health and regional-development spending, citing Norway and Botswana as models and targeting roughly $4bn in accumulated capital between 2029 and 2035. Bah stressed that Simandou revenue 'must never be absorbed by short-term urgencies.'", whyItMatters: "A concrete, dated framework for ring-fencing Simandou's fiscal windfall is a direct signal of how disciplined (or not) Guinea's revenue-management institutions will be once first ore-export income starts flowing, a core fiscal-regulatory question for the project's long-run political sustainability.", source: 'GuinéeNews', url: 'https://guineenews.org/2026/09/09/mines-la-guinee-pose-les-bases-dun-fonds-souverain-dote-de-4-milliards-usd-entre-2029-et-2035/' },
    { id: 31, date: '2026-09-09', country: 'Guinea', category: 'Fiscal, Regulatory & Government Relations', tier: 'confirmed', headline: "Guinea unveils new non-alignment foreign policy doctrine (cross-client with Meta item 260)", summary: "Guinea's government formally presented a new foreign-policy framework on 9 September 2026, delivered by Foreign Minister Morissanda Kouyaté, built around eleven strategic axes and a principle of remaining 'open to all, aligned with no one,' prioritizing sovereignty and resource-competition readiness alongside economic, security and climate objectives.", whyItMatters: "A codified non-alignment posture signals how Doumbouya's government intends to balance Simandou's Chinese-led CIOH consortium against Western and Gulf partners going forward, a regime-positioning signal for the project's international-backing mix.", source: 'Guinée360', url: 'https://www.guinee360.com/09/09/2026/souverainete-non-alignement-diplomatie-economique-la-guinee-devoile-sa-nouvelle-doctrine-de-politique-etrangere' },
    { id: 32, date: '2026-09-09', country: 'Guinea', category: 'Security & Conflict', tier: 'reported', headline: "Two men on trial in Conakry for relaying a taxi rumor of an October-November 'confrontation' tied to an airborne battalion contact", summary: "Seydouba Soumah and Ibrahima Camara went on trial before Kaloum's tribunal on 9 September 2026 for 'attempted disturbance of public order' after a gendarme riding in a shared taxi overheard the driver say a contact in the BATA airborne battalion had told him there would be an 'affrontement' in Guinea between October and November, with Soumah reportedly saying he'd heard the same. Both defendants contested the facts at the opening hearing; Camara was granted provisional release while Soumah remains detained (held since 1 September), and the prosecutor asked for a judicial investigation to trace the driver and the alleged BATA source. The case was adjourned to 16 September for closing arguments.", whyItMatters: "State prosecution of ordinary citizens over a secondhand rumor of a military-linked 'confrontation' — with the prosecutor explicitly framing it as a matter of state and public security — signals just how sensitive Guinea's authorities currently are to any talk of internal armed unrest, a regime-stability data point worth watching alongside this client's other governance-continuity coverage; outcome unresolved, worth a follow-up after the 16 September hearing.", source: 'Guineematin.com', url: 'https://guineematin.com/2026/09/09/une-conversation-dans-un-taxi-conduit-deux-hommes-devant-la-justice-cela-concerne-letat-ca-concerne-la-securite-de-la-population/' },
    { id: 33, date: '2026-09-10', country: 'Guinea', category: 'Fiscal, Regulatory & Government Relations', tier: 'confirmed', headline: "CRIEF prosecutor lifts travel bans on Condé-era figures Kassory Fofana and Damaro Camara for medical care abroad (cross-client with Meta item 270)", summary: "Special prosecutor Alphonse Charles Wright of Guinea's economic and financial crimes court (CRIEF) on 10 September 2026 lifted the exit bans on former prime minister Ibrahima Kassory Fofana (convicted of illicit enrichment and money laundering) and former National Assembly president Amadou Damaro Camara (convicted of embezzlement and corruption), both of whom have served their sentences, authorizing them to travel for medical treatment while stressing that appeal proceedings before the higher court are unaffected. Kassory Fofana is judged to present 'all guarantees of representation' through his lawyers' address; Damaro Camara's request is granted 'in the interest of respect for his fundamental rights'. Corroborated across Africa Guinee, Guinee360, Guinee7, Guineelive, Mosaiqueguinee and Mediaguinee.", whyItMatters: "How Doumbouya's judiciary handles the most prominent Condé-era defendants is a regime-stability and rule-of-law indicator this program reads for Simandou's governance-continuity risk; a measured easing here contrasts with the hard line in the Algassimou Diallo case (items 24, 26) and hints at selective political de-escalation rather than a general thaw.", source: 'Africa Guinee (also Guinee360, Guinee7, Guineelive, Mosaiqueguinee, Mediaguinee)', url: 'https://www.africaguinee.com/interdiction-de-sortie-du-territoire-charles-wrigt-leve-les-restrictions-ciblant-damaro-et-kassory/' },
    { id: 34, date: '2026-09-07', country: 'Guinea', category: 'Security & Conflict', tier: 'confirmed', headline: "Nationwide transporters' strike over checkpoint 'racket' paralyzes road links to Conakry, Kankan and Nzérékoré", summary: "A wildcat strike launched on 7 September 2026 by transport operators in the Labé region, protesting what they call systematic extortion by customs and gendarmerie at road checkpoints, spread on 9 September to routes serving Conakry, Kankan and Nzérékoré after talks in Labé failed; a union leader told RFI the network was 'paralyzed', with negotiations moving to Conakry. Transport Minister Ousmane Gaoual Diallo denounced a movement 'launched on social networks without union notice', pledged to investigate the racket and illegal-roadblock allegations, and said overload and highway-code controls would henceforth be enforced firmly. Mediaguinee separately reported the Labé authorities' response.", whyItMatters: "Simandou's ore moves on its own rail-and-port system, but the project's inbound logistics, workforce mobility and supplier base rely on Guinea's road network — a nationwide transport shutdown driven by grievances against state security forces, and the minister's framing of it as social-media-driven, are both operating-environment and social-stability signals worth tracking for the rail corridor and the wider Simandou 2040 delivery agenda.", source: 'RFI (also Mediaguinee)', url: 'https://www.rfi.fr/fr/afrique/20260910-guin%C3%A9e-des-transporteurs-d%C3%A9clenchent-une-gr%C3%A8ve-pour-d%C3%A9noncer-le-racket-lors-de-contr%C3%B4les-routiers' },
    { id: 35, date: '2026-09-10', country: 'Guinea', category: 'Fiscal, Regulatory & Government Relations', tier: 'confirmed', headline: "State bauxite miner NMC secures $300M-plus Glencore prefinancing and a five-year offtake — a template for Conakry's resource-monetization strategy", summary: "Guinea's government announced on 10 September 2026, via national television and the Minister of Mines and Geology, a commercial agreement concluded with Glencore on 7 September — reported by Africa Guinee as signed in Paris — providing more than $300 million of prefinancing (some reports: $350 million) and the marketing of Nimba Mining Company's bauxite for five years at 10-12 million tonnes a year (50-60 million tonnes overall), as the state-owned miner ramps from 4 million toward 12 million tonnes by 2027; Bloomberg had reported Glencore's selection as offtaker on 7 August. Separately the same day, Guinea signed a €269 million loan with the ECOWAS development bank BIDC for 84 km of roads on the Cissela-Banko-N'Dèma and Banko-Saraya axes (€143.06 million), a 200-bed regional hospital in Siguiri (€65.87 million) and the 11 MW Tinkisso II hydro plant (€60.62 million) (Guineenews).", whyItMatters: "The NMC deal shows the junta building a state-owned mining champion financed by trader prepayments — the same resource-nationalist logic behind the state's 15% stake in the CTG rail-and-port company and the Simandou-linked sovereign fund (item 30) — and signals what Conakry may seek from Simandou's partners in future negotiations (marketing roles, prefinanced state volumes); the BIDC package funds Upper Guinea infrastructure outside the Simandou corridor, easing competition for state co-financing. Cross-client with Meta item 285.", source: 'Guineenews (also Africa Guinee, Bloomberg)', url: 'https://guineenews.org/2026/09/10/bauxite-la-guinee-decroche-plus-de-300-millions-de-dollars-de-prefinancement-avec-glencore/' },
    { id: 36, date: '2026-09-11', country: 'Guinea', category: 'Fiscal, Regulatory & Government Relations', tier: 'confirmed', headline: "Doumbouya makes a state visit to Côte d'Ivoire on 11 September (cross-client with Meta item 283)", summary: "President Mamadi Doumbouya travels to Abidjan on Friday 11 September 2026 for a state visit at the invitation of President Alassane Ouattara, departing Conakry at 15:00, per the presidential agenda relayed by Guineenews, Guineematin and Africa Guinee and confirmed by Côte d'Ivoire's state agency AIP; the stated aim is to consolidate fraternal ties and cooperation around 'unity, peace and pan-Africanism'. It follows the 8 September Morocco-Guinea joint commission (item 29) and the regime's new non-alignment doctrine (item 31).", whyItMatters: "Abidjan's posture matters twice over for Simandou: Côte d'Ivoire is the commercial and logistics hinterland for Guinea's Forest region around the mine, and Ouattara's reception bolsters the regime's regional legitimacy that underpins the Simandou 2040 governance narrative — watch the joint communiqué for border-security and infrastructure cooperation relevant to the south-east.", source: 'AIP — Agence Ivoirienne de Presse (also Guineenews, Guineematin, Africa Guinee)', url: 'https://www.aip.ci/aip-cooperation-cote-divoire-guinee-mamadi-doumbouya-attendu-a-abidjan-pour-une-visite-detat/' },
    { id: 37, date: '2026-09-10', country: 'Guinea', category: 'Fiscal, Regulatory & Government Relations', tier: 'confirmed', headline: "Government review rates 91 of 119 public establishments 'high risk' after a nine-year gap (cross-client with Meta item 284)", summary: "The 2026 annual review of Guinea's administrative and health public establishments (EPA/EPS), opened on 10 September 2026 in Conakry under the Prime Minister and relaunched after a nine-year interruption, assessed 119 establishments on governance, finances and performance over 2023-2025: 91 (about 76.5%) were classified high-risk; they absorb roughly half of state budget transfers (about GNF 3,000 billion); only 32 have functioning boards against 83 without; average compliance was 42.2% (Guinee360, Guineenews, AGP Guinée).", whyItMatters: "The agencies that administer land, environment, transport and local development along the rail corridor sit among the EPAs now officially flagged as poorly governed — a capacity risk for the state's side of Simandou 2040 implementation and a likely prelude to the kind of restructuring and leadership turnover already seen in the DAF and public-administration reshuffles tracked earlier this month.", source: 'Guinee360 (also Guineenews, AGP Guinée)', url: 'https://www.guinee360.com/10/09/2026/guinee-91-epa-sur-119-evalues-classes-a-risque-la-gouvernance-publique-face-a-un-constat-alarmant' },
    { id: 38, date: '2026-09-01', country: 'Guinea', category: 'Community, Environmental & NGO Scrutiny', tier: 'confirmed', headline: "Guinea's environment minister confronts RUSAL over chemical spillage after the Kagbelen rail derailment, with fears resurfacing in the regional press", summary: "Environment Minister Fassou Théa travelled to Kagbelen, in the Dubréka prefecture, on 1 September 2026 to assess the environmental damage and health risks left by the derailment of a RUSAL alumina train on the night of 13 August, which injured four people and suspended rail traffic. He reported accidental spillage at several points and called on the company to take the steps needed to protect nearby communities and watercourses; alumina exports from RUSAL's Friguia refinery had already been halted because the same line carries fuel and caustic soda between the port and the plant. Regional outlets were still relaying the pollution fears on 11 September (Guineenews, Mediaguinee, 24 Heures au Bénin; operational detail from Reuters via Mining.com and AlCircle).", whyItMatters: "A minister publicly holding a foreign mining operator to account for spillage from its own rail line sets the template Simfer and CTG should expect on the Simandou corridor, where a far longer trans-Guinean railway runs through populated country — and it shows Conakry is prepared to treat rail incidents as environmental-liability events, not merely logistics failures.", source: 'Guineenews (also Mediaguinee, 24 Heures au Bénin)', url: 'https://guineenews.org/2026/09/01/deraillement-de-rusal-a-dubreka-fassou-thea-tape-du-poing-sur-la-table-face-au-peril-ecologique/' },
    { id: 39, date: '2026-11-11', country: 'Guinea', category: 'Fiscal, Regulatory & Government Relations', tier: 'confirmed', headline: "Guinea confirms the inaugural Simandou Mining Summit for 11-14 November in Conakry, opening on Kassa Island under the theme 'Mining Industry as a Catalyst for Economic Sovereignty'", summary: "The Presidency and the Ministry of Mines and Geology have both published announcements for the first Simandou Mining Summit, to run 11-14 November 2026 in Conakry: an opening ceremony on Kassa Island, off the capital, on 11 November, followed by ministerial dialogues, roundtables, an investor forum, technical sessions and structured business meetings at the Radisson Blu on 12-13 November. The government frames the event as establishing Guinea as a strategic hub of the global mining industry and is convening political decision-makers, international investors, mining companies, financial institutions and technical partners; the summit carries the theme 'Mining Industry as a Catalyst for Economic Sovereignty'. The event was first trailed in December 2025 and now has a dedicated organizer site alongside the two government announcements.", whyItMatters: "Conakry is building an investment-promotion showcase around the Simandou name itself, which puts Rio Tinto and Simfer in the position of implicit exhibit rather than host — and the 'economic sovereignty' framing signals the government intends to use the platform to restate its equity, local-content and infrastructure expectations in front of an international investor audience, making the November dates a moment to prepare positioning for rather than simply attend.", source: 'Présidence de la République de Guinée / Ministère des Mines et de la Géologie', url: 'https://presidence.gov.gn/simandou-mining-summit-sms-2026-la-guinee-simpose-comme-un-nouveau-hub-strategique-de-lindustrie-miniere-mondiale/' },
    { id: 40, date: '2026-09-11', country: 'Guinea', category: 'Operations & Production', tier: 'confirmed', headline: "Guinea's Q2 2026 iron ore exports reach 6.04 million tonnes, a more than fivefold rise attributed to the Simandou ramp-up", summary: "Quarterly export figures relayed on 11 September put Guinea's iron ore shipments at 6,040,481 tonnes in the second quarter of 2026, against 1,057,524 tonnes a year earlier — an increase of around 415% that the reporting attributes directly to Simandou coming into operation and to the rail and port infrastructure built to serve it. Bauxite exports over the same quarter were 53.9 million tonnes, up 8% year on year, with Société minière de Boké at roughly 31% of national volumes (16,950,071 t, down 16%), Chalco at 7,732,539 t (up 38%) and CBG third at 4,134,084 t (down 7.3%). The iron ore figure is the first quarterly dataset showing Simandou's contribution at national-accounts scale.", whyItMatters: "This is the first public, government-scale confirmation that the corridor is moving ore in the volumes the project was built for, which matters less as an operational milestone than as the number Conakry will now anchor its revenue expectations to — and against which any future shortfall, stoppage or renegotiation of fiscal terms will be measured.", source: 'Mosaiqueguinee.com (also EcoFinance Guinée)', url: 'https://mosaiqueguinee.com/2026/09/guinee-pres-de-54-millions-de-tonnes-de-bauxite-et-plus-de-6-millions-de-tonnes-de-fer-exportees-au-2e-trimestre-2026/' },
    { id: 41, date: '2026-09-07', country: 'Guinea', category: 'Fiscal, Regulatory & Government Relations', tier: 'confirmed', headline: "State-owned Nimba Mining Company secures a $300m-plus prefinancing and five-year offtake deal with Glencore for its bauxite", summary: "Guinea concluded an agreement in Paris on 7 September 2026 under which Glencore provides more than $300 million in prefinancing and takes the marketing of bauxite produced by Nimba Mining Company, a vehicle wholly owned by the Guinean state, over five years. The arrangement covers 10 to 12 million tonnes a year, or a potential 50 to 60 million tonnes across the term, giving NMC a secured commercial outlet. NMC is the entity that took over operation of the Guinea Alumina Corporation bauxite mine, and had earlier in the year launched its own exploration programme.", whyItMatters: "Conakry has now demonstrated it can take over a foreign-operated mine, place the output through a major trader and raise several hundred million dollars against it without a Western mining partner — a working template for the state-operator model that the 'economic sovereignty' framing of November's Simandou summit points toward, and a reference point for the leverage the government believes it holds in any future discussion of Simandou's terms.", source: 'Financial Afrik (also Guineenews, Africa Guinee, AlCircle)', url: 'https://www.financialafrik.com/2026/09/11/guinee-nimba-mining-company-obtient-un-prefinancement-de-plus-de-300-millions-de-dollars-de-glencore/' }
  ],
  ocp: [
    { id: 1, date: '2026-08-18', country: 'Morocco', category: 'Corporate & Financial', tier: 'confirmed', headline: "OCP North America lands first US phosphate shipment under Trump's temporary tariff relief", summary: "OCP North America announced the arrival at the Port of New Orleans of the first Moroccan phosphate-fertilizer shipment to the US (roughly 54,000 metric tons of triple superphosphate) since President Trump's 29 June 2026 proclamation temporarily suspended antidumping/countervailing duties on Moroccan phosphate fertilizer for eight months, invoking a Depression-era emergency-supply provision (Tariff Act Section 318). USDA officials had said in July the duty suspension could cut US phosphate fertilizer costs by up to 22%, saving an estimated $1.82bn annually for roughly 100,000 farmers. This is OCP's seed item for the Client's new fifth program, added as part of this run's 14-day catch-up window.", whyItMatters: "Confirms OCP has moved from a five-year, ~20%-then-2.11% countervailing-duty regime back into the US market at volume, a material commercial and regulatory-continuity development for OCP's US business and a first entity/news baseline for this newly added Client program.", source: 'American Ag Network (also Morocco World News, USDA/DTN)', url: 'https://www.americanagnetwork.com/2026/08/18/ocp-north-america-announces-arrival-of-first-moroccan-phosphate-fertilizer-shipment-to-u-s-following-temporary-cvd-relief/' },
    { id: 2, date: '2026-08-28', country: 'Senegal', category: 'Fiscal, Regulatory & Government Relations', tier: 'confirmed', headline: "Moody's downgrades Senegal's sovereign rating to Caa2, keeps negative outlook, as IMF talks continue", summary: "Moody's downgraded Senegal's sovereign credit rating from Caa1 to Caa2 on 28 August 2026, maintaining a negative outlook, citing rising refinancing pressure, weakening debt-service capacity and limited deleveraging prospects. The agency flagged the political rift between the executive and a Sonko-led legislature as a factor that could delay needed budget measures, alongside the prolonged absence of an IMF program (a mission was in Dakar 19 August-1 September negotiating a new one), youth unemployment and Sahel-linked security risk. Public debt is estimated near 108% of GDP.", whyItMatters: "A sovereign downgrade of the Senegalese state — OCP's counterparty on the ICS phosphates dossier and a government already flagged elsewhere in this program (BP item 6, item 10) as under fiscal and political strain — is a relevant host-government fiscal-capacity signal for OCP's West Africa investment plans in Senegal, worth watching for any read-through to ICS-related negotiations or state financial support.", source: 'PressAfrik (also Financial Afrik, Bloomberg, Rewmi, Xibaaru)', url: 'https://www.pressafrik.com/Moody-s-degrade-la-note-souveraine-du-Senegal-a-Caa2-et-maintient-une-perspective-negative_a310707.html' },
    { id: 3, date: '2026-08-26', country: 'United States', category: 'Corporate & Financial', tier: 'confirmed', headline: "OCP and CHS break ground on $450M US phosphate fertilizer plant — first new US facility in 40 years", summary: "OCP North America and CHS Inc. (the largest US farmer-owned cooperative) held a groundbreaking ceremony on 26 August 2026 for a joint-venture phosphate fertilizer plant at the Cornerstone Energy Park industrial site in Waggaman, Louisiana — the first new US phosphate fertilizer plant built since 1984. The $450 million facility is planned to have capacity above 1 million tonnes/year, targeting construction completion around late 2028/early 2029, and the partners have applied for USDA FIELDS-program funding aimed at expanding domestic fertilizer capacity; officials project the plant could cut US phosphate-fertilizer import dependency by more than 48%.", whyItMatters: "A direct US manufacturing foothold — rather than just import volume — locks OCP into the domestic-production side of Washington's fertilizer-reshoring push (already benefiting from the temporary countervailing/antidumping-duty relief tracked in item 1), giving OCP a longer-term US political and commercial anchor that is harder to unwind via a future tariff or trade-policy reversal than the shipment-based relief alone.", source: 'CHS Inc. (also Morocco World News, Agri-Pulse, Red River Farm Network, World Fertilizer)', url: 'https://www.chsinc.com/news-and-stories/2026/08/26/chs-ocp-domestic-fertilizer-production-announcement' },
    { id: 4, date: '2026-08-31', country: "Côte d'Ivoire", category: 'Market & Competitive Dynamics', tier: 'confirmed', headline: "Côte d'Ivoire's fertilizer imports hit record 789,500 tonnes in 2025 on cocoa and cotton demand — World Bank flags 2026 price shock", summary: "An IFDC report (published 14 August 2026, picked up by Agence Ecofin on 31 August) found Côte d'Ivoire's chemical fertilizer imports rose 38% year-on-year to a record 789,500 tonnes in 2025, driven mainly by domestic demand: cocoa and cotton alone absorbed over 287,250 tonnes, nearly half of the country's 593,107-tonne apparent consumption, aided by cocoa's guaranteed price rising to 2,800 FCFA/kg in October 2025 from 1,800 in 2024. The World Bank separately forecasts a 2026 headwind: urea prices could rise roughly 60% to about $675/tonne on Middle East shipping disruption tied to the ongoing US-Israel-Iran conflict, a risk to import volumes going forward given Côte d'Ivoire has no domestic fertilizer production.", whyItMatters: "A record and still-growing fertilizer-import market in a major West African cash-crop economy with no domestic producer is a direct competitive-opportunity signal for OCP, while the flagged 2026 urea price shock — tied to the same Middle East shipping disruption already benefiting OCP's own market position elsewhere — is exactly the kind of Global Supply & Macro Shock OCP's cost and competitive positioning should be assessed against.", source: 'Agence Ecofin', url: 'https://www.agenceecofin.com/actualites-agro/3108-141167-cote-d-ivoire-les-importations-d-engrais-ont-atteint-un-niveau-record-en-2025' },
    { id: 5, date: '2026-09-02', country: 'Togo', category: 'Market & Competitive Dynamics', tier: 'confirmed', headline: "Togo's phosphate exports drive a 29.5% Q2 2026 export surge, remaining the country's top export product", summary: "Togolese customs data reported by Agence Ecofin show Togo's total exports rose 29.5% year-on-year in Q2 2026, led by phosphate sales of 46.7 billion FCFA (15.8% of quarterly exports) — the country's single largest export line, ahead of clinker (23.3bn FCFA) and refined petroleum products (21.7bn FCFA). India absorbed 40.6% of Togolese exports in the quarter, ahead of Burkina Faso (17.7%) and Ghana (7.8%), with the top ten markets concentrating 87.8% of external sales.", whyItMatters: "As a smaller West African phosphate producer/exporter, Togo's growing phosphate trade volumes and customer concentration (India, regional ECOWAS/UEMOA buyers) are a useful regional competitive-dynamics data point for OCP, particularly given India's own status as a major destination for OCP's own phosphate and fertilizer exports.", source: 'Agence Ecofin', url: 'https://www.agenceecofin.com/actualites/0209-141241-les-exportations-togolaises-en-hausse-de-29-5-au-2e-trimestre-portees-par-les-phosphates' },
    { id: 6, date: '2026-09-02', country: 'Morocco', category: 'Diplomatic & Reputational', tier: 'confirmed', headline: "MINURSO reshuffles military and civilian leadership as UN Security Council prepares October Western Sahara mandate review", summary: "The UN's Western Sahara mission (MINURSO) has begun restructuring its leadership: the UN appointed Pakistani Major General Jawad Ahmed as new force commander (replacing Bangladeshi Gen. Fakhrul Mohammad Ihsan), while Malawian official Ron Misty Kamwendo takes over the civilian component in Laâyoune, alongside recent cuts (roughly 20 medical staff, four section/department heads, and one of the mission's two aircraft). The changes, reported by Hespress on 2 September 2026, come weeks before the Security Council's annual MINURSO mandate review in October, and follow UN Secretary-General António Guterres's broader push to link peacekeeping-mission continuity to viable political tracks, amid the Polisario's unilateral breach of the 2020 ceasefire.", whyItMatters: "A leadership reshuffle and resource cuts inside MINURSO ahead of an October Security Council mandate debate is an early signal of how the UN's wider peacekeeping-reform push may reshape the international framework around Western Sahara — the same diplomatic terrain where OCP's market access and reputation face third-country political exposure under this program's Diplomatic & Reputational lens.", source: 'Hespress', url: 'https://www.hespress.com/%D8%A7%D9%84%D9%85%D9%8A%D9%86%D9%88%D8%B1%D8%B3%D9%88-%D8%B9%D9%84%D9%89-%D8%A3%D8%A8%D9%88%D8%A7%D8%A8-%D8%A7%D9%84%D8%AA%D8%AD%D9%88%D9%84-%D8%AA%D8%BA%D9%8A%D9%8A%D8%B1%D8%A7%D8%AA-%D8%AA-1800296.html' },
