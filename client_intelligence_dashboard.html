<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Client Intelligence Monitor — 14 North</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --cols: 12;
  --bl: 8px;
  --lh: 24px;
  --gutter: 24px;
  --margin: 48px;
  --maxw: 1320px;

  --paper: #ffffff;
  --ink: #111315;
  --ink-soft: #5b6066;
  --ink-faint: #94989c;
  --hair: rgba(17,19,21,0.14);
  --hair-strong: rgba(17,19,21,0.34);
  --accent: #e4002b;
  --accent-wash: rgba(228,0,43,0.07);

  --g-col: rgba(228,0,43,0.055);
  --g-edge: rgba(228,0,43,0.38);
  --g-base: rgba(17,19,21,0.15);
  --g-base-min: rgba(17,19,21,0.06);

  --sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Space Mono", "SF Mono", "Consolas", monospace;
}
*{ box-sizing:border-box; }
html{ -webkit-text-size-adjust:100%; }
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--sans); font-size:15px; line-height:var(--lh);
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
}
a{ color:inherit; }
button{ font:inherit; }

/* ---------------- grid scaffold ---------------- */
.wrap{ position:relative; max-width:var(--maxw); margin:0 auto; padding:48px var(--margin) 96px; }
.grid{ display:grid; grid-template-columns:repeat(var(--cols),1fr); column-gap:var(--gutter); row-gap:var(--lh); }
.band{ grid-column:1/-1; display:grid; grid-template-columns:subgrid; column-gap:var(--gutter); align-items:start; }
@supports not (grid-template-columns:subgrid){
  .band{ grid-template-columns:repeat(var(--cols),1fr); }
}

/* ---------------- status line ---------------- */
.status-line{ font-family:var(--mono); font-size:11px; color:var(--ink-soft); display:flex; align-items:center; gap:8px; padding-bottom:16px; border-bottom:2px solid var(--ink); margin-bottom:32px; }
.status-dot{ width:7px; height:7px; border-radius:50%; background:var(--accent); flex:none; }

/* ---------------- nav (client list) ---------------- */
.nav-label{ font-family:var(--mono); font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-faint); padding-bottom:8px; border-bottom:1px solid var(--ink); margin-bottom:0; }
.client-btn{
  display:flex; align-items:baseline; justify-content:space-between; gap:8px; width:100%; text-align:left;
  background:none; border:none; border-top:1px solid var(--hair); padding:14px 0; cursor:pointer;
  font-family:var(--sans); font-size:14px; color:var(--ink-soft);
}
.client-btn:hover{ color:var(--ink); }
.client-btn .name{ font-weight:500; }
.client-btn.active{ color:var(--ink); }
.client-btn.active .name{ font-weight:700; }
.client-btn.active .name::before{ content:"— "; color:var(--accent); font-weight:700; }
.client-btn .count{ font-family:var(--mono); font-size:11px; color:var(--ink-faint); }
.client-btn.active .count{ color:var(--accent); }
.client-swatch{ display:none; }

@media (max-width:900px){
  .layout-band{ grid-template-columns:1fr !important; }
  .sidebar{ border-bottom:1px solid var(--hair-strong); padding-bottom:16px; margin-bottom:8px; }
}

/* ---------------- client header ---------------- */
.client-header{ padding-bottom:16px; border-bottom:2px solid var(--ink); margin-bottom:24px; }
.client-header h2{ margin:0 0 6px; font-size:27px; font-weight:800; letter-spacing:-.01em; }
.client-header .scope{ color:var(--ink-soft); font-size:13.5px; max-width:74ch; line-height:22px; }
.country-chips{ display:flex; flex-wrap:wrap; gap:6px; margin-top:14px; }
.chip{ font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); border:1px solid var(--hair-strong); padding:3px 8px; background:transparent; cursor:default; }
.country-chip{ cursor:pointer; transition:background .12s ease, color .12s ease, border-color .12s ease; }
.country-chip:hover{ color:var(--ink); border-color:var(--ink); }
.country-chip.active{ background:var(--ink); color:#fff; border-color:var(--ink); font-weight:700; }

/* ---------------- stat tiles ---------------- */
.stat-row{ display:grid; grid-template-columns:repeat(4,1fr); column-gap:var(--gutter); margin-bottom:32px; }
.stat-tile{ border-top:2px solid var(--ink); padding-top:8px; }
.stat-tile .value{ font-size:38px; font-weight:800; line-height:40px; font-variant-numeric:tabular-nums; letter-spacing:-0.01em; }
.stat-tile .label{ font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); margin-top:6px; }
@media (max-width:640px){ .stat-row{ grid-template-columns:repeat(2,1fr); row-gap:20px; } }

/* ---------------- two column content ---------------- */
.content-grid{ display:grid; grid-template-columns:1fr 1.5fr; column-gap:var(--gutter); align-items:start; margin-bottom:8px; }
@media (max-width:900px){ .content-grid{ grid-template-columns:1fr; } }

.panel{ border:1px solid var(--hair-strong); }
.panel-head{ padding:12px 16px; border-bottom:1px solid var(--hair-strong); display:flex; align-items:center; justify-content:space-between; }
.panel-head h3{ margin:0; font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:.09em; color:var(--ink); font-weight:700; }
.panel-body{ padding:0; max-height:900px; overflow-y:auto; }
.section-spacer{ margin-top:32px; }

/* stakeholders */
.stake-group-title{ font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:.07em; color:var(--ink-faint); padding:14px 16px 6px; }
.stake-item{ padding:12px 16px; border-bottom:1px solid var(--hair); }
.stake-item:last-child{ border-bottom:none; }
.stake-item .top{ display:flex; align-items:baseline; justify-content:space-between; gap:8px; }
.stake-item .stake-name{ font-weight:700; font-size:13.5px; }
.stake-item .stake-type{ font-family:var(--mono); font-size:10px; color:var(--ink-faint); white-space:nowrap; text-transform:uppercase; }
.stake-item .stake-note{ color:var(--ink-soft); font-size:12.5px; margin-top:3px; line-height:19px; }
.stake-item em{ color:var(--accent); font-style:normal; font-family:var(--mono); font-size:11px; }

/* news feed (b2gold / bp / riotinto) */
.news-toolbar{ padding:12px 16px; border-bottom:1px solid var(--hair-strong); }
.news-toolbar input{ width:100%; background:var(--paper); border:1px solid var(--hair-strong); color:var(--ink); padding:8px 10px; font-family:var(--sans); font-size:12.5px; }
.news-toolbar input:focus{ outline:2px solid var(--accent); outline-offset:-1px; }
.news-toolbar input::placeholder{ color:var(--ink-faint); }
.news-toolbar select{ background:var(--paper); border:1px solid var(--hair-strong); color:var(--ink); padding:6px 8px; font-family:var(--mono); font-size:11px; margin-top:8px; text-transform:uppercase; }

.date-range-filter{ display:flex; align-items:center; flex-wrap:wrap; gap:8px; margin-top:10px; padding-top:10px; border-top:1px solid var(--hair); }
.date-range-label{ font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-faint); white-space:nowrap; }
.date-range-filter input[type="date"]{ width:auto; background:var(--paper); border:1px solid var(--hair-strong); color:var(--ink); padding:6px 8px; font-family:var(--mono); font-size:11.5px; }
.date-range-filter input[type="date"]:focus{ outline:2px solid var(--accent); outline-offset:-1px; }
.date-range-sep{ color:var(--ink-faint); font-family:var(--mono); font-size:11px; }
.date-range-presets{ display:flex; gap:4px; margin-left:4px; }
.date-preset-btn{ font-family:var(--mono); font-size:9.5px; text-transform:uppercase; letter-spacing:.04em; padding:4px 8px; background:var(--paper); border:1px solid var(--hair-strong); color:var(--ink-soft); cursor:pointer; }
.date-preset-btn:hover{ color:var(--ink); border-color:var(--ink); }
.date-preset-btn.active{ background:var(--ink); color:#fff; border-color:var(--ink); font-weight:700; }

.news-item{ padding:14px 16px; border-bottom:1px solid var(--hair); }
.news-item:last-child{ border-bottom:none; }
.news-meta{ display:flex; align-items:center; gap:8px; margin-bottom:5px; flex-wrap:wrap; }
.news-date{ font-family:var(--mono); font-size:10.5px; color:var(--ink-faint); }
.news-country{ font-family:var(--mono); font-size:9.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); border:1px solid var(--hair-strong); padding:2px 6px; }
.news-headline{ font-weight:700; font-size:14px; margin:0 0 5px; line-height:20px; }
.news-summary{ color:var(--ink-soft); font-size:12.5px; margin:0 0 8px; line-height:19px; }
.news-footer{ display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
.news-source a{ color:var(--accent); text-decoration:none; font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:.03em; }
.news-source a:hover{ text-decoration:underline; }
.flag-badge{ display:inline-flex; align-items:center; gap:5px; font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:.03em; color:var(--ink); background:var(--accent-wash); border:1px solid var(--accent); padding:2px 8px; }

.notes-list{ margin:0; padding:14px 16px 16px 32px; color:var(--ink-soft); font-size:12.5px; line-height:20px; }
.notes-list li{ margin-bottom:8px; }

.empty-state{ padding:32px 16px; color:var(--ink-faint); font-size:12px; text-align:center; font-family:var(--mono); text-transform:uppercase; letter-spacing:.06em; }

/* ---------------- Client monitoring feed ---------------- */
.tier-pill{ display:inline-flex; align-items:center; font-family:var(--mono); font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; padding:2px 7px; margin-left:6px; white-space:nowrap; border:1px solid; }
.tier-pill.confirmed{ color:#fff; background:var(--ink); border-color:var(--ink); }
.tier-pill.reported{ color:var(--ink-soft); border-color:var(--hair-strong); background:transparent; }
.tier-pill.assessment{ color:var(--ink-soft); border-color:var(--ink-soft); border-style:dashed; background:transparent; }

.category-filters{ display:flex; flex-wrap:wrap; gap:6px; margin-top:14px; }
.cat-btn{ font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:.04em; padding:5px 10px; background:var(--paper); border:1px solid var(--hair-strong); color:var(--ink-soft); cursor:pointer; }
.cat-btn:hover{ color:var(--ink); border-color:var(--ink); }
.cat-btn.active{ background:var(--ink); color:#fff; border-color:var(--ink); font-weight:700; }
.cat-btn.active[data-cat="Platform Integrity"]{ background:var(--accent); border-color:var(--accent); }

.feed-item{ padding:16px; border-bottom:1px solid var(--hair); }
.feed-item:last-child{ border-bottom:none; }
.feed-item.pi-flag{ border-left:3px solid var(--accent); padding-left:13px; }

.feed-grid{ display:grid; grid-template-columns:1fr 1fr; }
.feed-grid .feed-item{ min-width:0; }
.feed-grid .feed-item:nth-child(odd){ border-right:1px solid var(--hair); }
.feed-grid .feed-item.pi-flag:nth-child(odd){ padding-left:13px; }
.feed-grid .feed-item:nth-last-child(-n+2){ border-bottom:none; }
@media (max-width:760px){
  .feed-grid{ grid-template-columns:1fr; }
  .feed-grid .feed-item:nth-child(odd){ border-right:none; }
  .feed-grid .feed-item:nth-last-child(-n+2){ border-bottom:1px solid var(--hair); }
  .feed-grid .feed-item:last-child{ border-bottom:none; }
}
.feed-meta{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:6px; }
.feed-date{ font-family:var(--mono); font-size:10.5px; color:var(--ink-faint); }
.feed-date-reported{ font-family:var(--mono); font-size:9.5px; color:var(--ink-faint); opacity:.75; }
.feed-country{ font-family:var(--mono); font-size:9.5px; text-transform:uppercase; letter-spacing:.04em; border:1px solid var(--hair-strong); color:var(--ink-soft); padding:2px 6px; }
.feed-category{ font-family:var(--mono); font-size:9.5px; text-transform:uppercase; letter-spacing:.04em; border:1px solid var(--ink); color:var(--ink); padding:2px 6px; }
.feed-category.pi{ border-color:var(--accent); color:var(--accent); }
.feed-headline{ font-weight:700; font-size:14.5px; margin:0 0 6px; line-height:21px; }
.feed-summary{ font-size:12.5px; color:var(--ink-soft); margin:0 0 8px; line-height:19px; }
.feed-why{ font-size:12px; color:var(--ink-soft); background:#f6f6f5; border-left:2px solid var(--ink); padding:9px 12px; line-height:18px; }
.feed-why strong{ color:var(--ink); }

.tier-legend{ display:flex; gap:20px; flex-wrap:wrap; padding:14px 16px; font-size:11px; color:var(--ink-soft); }
.tier-legend .item{ display:flex; align-items:center; gap:6px; }
.tier-legend .tier-def{ color:var(--ink-faint); font-size:11px; }

.entity-group-title{ font-family:var(--mono); font-size:10px; text-transform:uppercase; letter-spacing:.07em; color:var(--ink-faint); padding:14px 16px 6px; }
.entity-item{ padding:9px 16px; border-bottom:1px solid var(--hair); }
.entity-item:last-child{ border-bottom:none; }
.entity-item .entity-name{ font-weight:700; font-size:12.5px; }
.entity-item .entity-note{ color:var(--ink-soft); font-size:12px; margin-top:2px; line-height:18px; }

::-webkit-scrollbar{ width:9px; }
::-webkit-scrollbar-track{ background:transparent; }
::-webkit-scrollbar-thumb{ background:var(--hair-strong); }
</style>
</head>
<body>

<div class="wrap">
  <div class="grid">
    <header class="band" style="grid-column:1/-1;">
      <div class="status-line" style="grid-column:1/-1;"><span class="status-dot"></span><span id="lastUpdated">last updated —</span></div>
    </header>

    <div class="band layout-band" style="grid-column:1/-1; grid-template-columns:subgrid;">
      <nav class="sidebar" style="grid-column:1/4;">
        <div class="nav-label">Clients</div>
        <div id="clientList"></div>
      </nav>
      <main id="main" style="grid-column:4/13;"></main>
    </div>
  </div>
</div>

    { id: 4, date: '2025-11-03', country: 'Mali', category: 'Fiscal, Regulatory & Government Relations', tier: 'reported', headline: "B2Gold: Fekola operations \"continue unimpeded,\" permits in good standing", summary: "B2Gold stated that operations at the Fekola Complex continued without disruption and that its permits remained in good standing, contrasting its position with other foreign miners who faced 2025 permit actions under Mali's revised Mining Code. A company self-report, not independently corroborated, and included as historical context rather than an in-window development.", whyItMatters: "B2Gold's contrast with peers who faced permit actions suggests Fekola's relationship with the state was comparatively favorable heading into the 2026 equity-stake changes — a useful baseline for judging regulatory continuity.", source: 'B2Gold / Barchart', url: 'https://www.barchart.com/story/news/35867829/b2golds-operations-at-the-fekola-complex-in-mali-continue-unimpeded' },
    { id: 5, date: '2026-08-07', country: 'Mali', category: 'Fiscal, Regulatory & Government Relations', tier: 'confirmed', headline: "B2Gold granted Fekola Regional exploitation permit at Menankoto-Sud, raising Mali's equity stake to 35%", summary: "Mali's Council of Ministers approved, on Friday 7 August 2026, a large-mine exploitation permit for B2Gold Mali Resources at Menankoto-Sud (Kéniéba Circle, Kayes region), valid up to 12 years. The site sits roughly 20km from the existing Fekola mine and forms Fekola Regional together with the Dandoko exploration permit — a new production-growth driver expected to ramp up through end-2027 and produce 150,000+ oz/year from 2028. Unlike the existing Fekola Mine (80% B2Gold / 20% State), Fekola Regional gives the Malian state a larger 35% equity stake (65% B2Gold), reflecting Bamako's push for greater state participation in mining projects. First flagged via the Client's own human-intelligence source (WKABI), then independently confirmed by B2Gold's own press release, the Mali Council of Ministers' 7 Aug communiqué, and Malijet/Maliweb/Seneweb/Mali24 coverage — high-confidence, multi-sourced.", whyItMatters: "Confirms the state's push for larger equity stakes is extending to B2Gold's newest permit, a template likely to apply to future Malian mining approvals and a data point on the direction of host-government terms industry-wide.", source: 'B2Gold Corp. (GlobeNewswire)', url: 'https://www.globenewswire.com/news-release/2026/08/07/3341245/0/en/b2gold-granted-fekola-regional-exploitation-permit-by-the-state-of-mali.html' },
    { id: 6, date: '2026-08-29', country: 'Mali', category: 'Fiscal, Regulatory & Government Relations', tier: 'confirmed', headline: "Mali finalizes 35% state-equity structure for Toubani Resources' Kobada gold project, mirroring Fekola Regional template", summary: "Malian authorities set out the modalities of the state's 35% combined stake in Mines de Kobada S.A. on 29 August 2026: a free, non-dilutable 10% state stake, an additional paid 20% state stake, and 5% reserved for national investors, alongside Canadian developer Toubani Resources' Kobada gold project in southern Mali. The structure mirrors the 35% state-equity split (65% B2Gold) that Mali's Council of Ministers applied to B2Gold's own Fekola Regional permit on 7 August (item 5), confirming this as the government's standard template for new large-mine permits under the 2023 Mining Code.", whyItMatters: "A second, independently confirmed application of the same 35%-state-equity template just weeks after Fekola Regional shows Mali is now applying this structure consistently across new gold permits rather than case-by-case, a useful regulatory-continuity and precedent signal for how Bamako may treat any future B2Gold permit or renegotiation.", source: 'Bamada.net (also Afrikinfos-Mali)', url: 'https://bamada.net/kobada-letat-malien-fixe-les-modalites-de-sa-participation-de-35-au-capital-de-la-societe-mines-de-kobada-s-a' },
    { id: 7, date: '2026-08-25', country: 'Mali', category: 'Security & Conflict', tier: 'confirmed', headline: "Armed attack on Chinese-run gold site near Kéniéba leaves one dead, two wounded", summary: "Armed gunmen attacked a clandestine gold-panning site overnight on 24-25 August 2026 in Kéniéba — the Kayes-region town/area that also hosts B2Gold's Fekola Complex — wounding three Chinese nationals working for a Chinese mining operator; one outlet identifies the site as belonging to 'Agro Business' in the Dioubéba forest and describes six masked assailants stealing roughly 40 million FCFA and phones before fleeing. Facing a choice between a shorter but militia-exposed route to Bamako or a longer, safer route to Dakar, rescuers chose the 13+ hour drive to Senegal; one victim, named Lin Li (also reported as Peilin Li), died in surgery at Dakar's Hôpital Principal on 31 August. Note: one source places the attack site within Mali's Kéniéba near the Senegal border, while another places it in a similarly-named village within Senegal's own Bakel department — the exact jurisdiction needs independent confirmation.", whyItMatters: "A fatal armed attack on a foreign-operated mining site in or immediately around Kéniéba — the same town hosting Fekola — is a direct escalation of the security climate B2Gold operates in, even though the target was an artisanal/clandestine site rather than Fekola itself; worth tracking closely alongside the standing JNIM Kayes-region threat watch (item 2) for any read-through to Fekola's own security posture.", source: 'Kewoulo (also Dakaractu, Xibaaru, Pulse.sn, Sans Limite, Tambacounda.info)', url: 'https://kewoulo.info/attaque-armee-a-kenieba-un-ressortissant-chinois-tue-deux-autres-blesses-les-secouristes-face-a-un-choix-difficile/' },
    { id: 8, date: '2026-09-06', country: 'Mali', category: 'Fiscal, Regulatory & Government Relations', tier: 'confirmed', headline: "Anti-corruption civil society network demands audit of Mali's transition-era public contracts, naming mining and energy deals", summary: "Mali's Réseau des associations de lutte contre la corruption et la fraude publicly demanded a full audit of public contracts awarded since the 2020-2021 transition began, specifically flagging defense, infrastructure, energy and hydrocarbons contracts allegedly awarded via non-competitive procedures, and questioning the opacity of the renegotiated mining code and gold-sector conventions with foreign operators.", whyItMatters: "A public civil-society push for an audit of exactly the kind of state contracting and mining-code renegotiation processes that shape B2Gold's own equity-stake and permitting arrangements in Mali adds a transparency-accountability data point worth monitoring alongside Fekola's own permit and equity-stake history (items 5-6).", source: 'Africtelegraph (via PressAfrik)', url: 'https://africtelegraph.com/blog/mali-la-societe-civile-reclame-un-audit-des-marches-de-la-transition/' },
    { id: 9, date: '2026-09-03', country: 'Mali', category: 'Security & Conflict', tier: 'reported', headline: "FAMa maintains heavy military escort on Kayes economic corridor amid nationwide counter-terrorism offensive", summary: "A roundup of the Malian armed forces' (FAMa) early-September operations describes the Groupement Tactique Interarmes 'Sabouciré' running daily armed escorts for 200+ freight trucks on the Diéma-Kayes axis, alongside a wider offensive (Operation Dougoukoloko, with Africa Corps support) that reports 45+ militants killed near Kidal on 3 September and 60+ near Douentza/Bandiagara, plus a nighttime curfew in San and a river-navigation suspension at Mopti aimed at cutting militant supply lines.", whyItMatters: "The sustained, large-scale military escort of the exact Kayes-region freight corridor serving Fekola's logistics is a reassuring near-term signal for B2Gold's supply-chain security, but the scale and geographic spread of the underlying offensive (Kidal, Gao, Ménaka, Douentza, Bandiagara, Sikasso) confirms the security environment around the mine remains active rather than resolved.", source: 'Bamada.net (via L\'Aube)', url: 'https://bamada.net/defense-et-securite-les-fama-en-posture-operationnelle' },
    { id: 10, date: '2026-09-10', country: 'Mali', category: 'Security & Conflict', tier: 'confirmed', headline: "JNIM overruns the Dioura garrison in Mopti region, killing dozens of soldiers, in a third camp assault in days", summary: "JNIM fighters attacked the Malian army camp at Dioura, in the Mopti region, early on 10 September 2026 and claimed to have taken control of it before withdrawing, releasing video showing fighters moving through the camp amid smoke, soldiers' bodies and burning motorcycle stocks. Several dozen soldiers are reported killed, though RFI noted that more precise tolls from local sources and analysts could not be corroborated at that stage. The army acknowledged the attack and said it had conducted combined air-land operations, claiming several dozen assailants neutralised. Dioura, one of central Mali's larger camps, was overrun once before in May 2025 with around forty dead; this assault follows recent JNIM attacks at Sikasso and Sofara.", whyItMatters: "Dioura sits in Mopti, far from Kayes and Fekola, but a third garrison overrun in days — including one at Sikasso, much closer to the country's industrial mining belt — shows JNIM able to mass against fixed army positions at will, which is the same capability that would be required to move against a protected industrial site, and it stretches the FAMa units that currently escort freight on the Diéma-Kayes corridor (item 9).", source: 'RFI (via Dakaractu; also La Nouvelle Tribune)', url: 'https://www.dakaractu.com/Mali-des-dizaines-de-soldats-tues-dans-l-attaque-du-camp-de-Dioura-par-les-jihadistes-du-Jnim_a275916.html' },
    { id: 11, date: '2026-09-12', country: 'Mali', category: 'Security & Conflict', tier: 'reported', headline: "Timbuktu Institute study frames JNIM's Kayes and Nioro blockade as a deliberate campaign against Mali's economy", summary: "In a study published on 12 September 2026, the Dakar-based Timbuktu Institute characterises JNIM's activity in south-western Mali as an 'economic jihad' aimed at strangling supply chains rather than seizing ground. The group has enforced a blockade of Kayes and Nioro du Sahel since 3 September, halting and burning goods and fuel vehicles and abducting passengers. The institute calls the Kayes region a 'major strategic target', noting that roughly 80% of Malian gold output originates there and that about 30% of the country's overland imports move along National Road 1 from the port of Dakar through Kayes to Bamako.", whyItMatters: "An analytical case that Kayes is being targeted precisely because it carries Mali's gold production and its main import corridor moves the regional threat picture closer to Fekola's own operating and logistics footprint, and gives a framework for reading the Diéma-Kayes escort operations already tracked in item 9 as a contested rather than settled corridor.", source: 'AllAfrica (RFI syndication; also AbidjanTV)', url: 'https://fr.allafrica.com/stories/202509120138.html' },
    { id: 12, date: '2026-09-10', country: 'Mali', category: 'Security & Conflict', tier: 'reported', headline: "Army's August bulletin claims 214 air strikes and about 1,000 militants killed, with 3,681 fuel tankers escorted and a jihadist-run artisanal gold site destroyed", summary: "Mali's armed-forces information directorate (DIRPA) presented its operational report for August 2026 on Wednesday 10 September: 214 air interventions across the three theatres of Operation Dugu Koloko, about 1,000 fighters claimed killed, 50 bases and an artisanal gold mine exploited by jihadists destroyed, along with 564 motorcycles, 129 pick-ups and 230 barrels of fuel, and several dozen captured soldiers freed. On logistics, the army says it escorted 3,681 tanker trucks, 3,312 passengers and more than 126 tonnes of freight during the month (Guinee360, Seneweb, Senego, Alwihda Info). These are single-source government claims that cannot be independently verified.", whyItMatters: "The tanker-escort figure is the most useful number for Fekola: it quantifies how completely fuel movement on the corridors serving western Mali now depends on military convoys, and the destruction of a jihadist-run gold site confirms that artisanal gold in insurgent areas is itself a target — both inputs into B2Gold's supply-chain and site-security planning even though the mine has not been named as a target.", source: 'Guinee360 (also Seneweb, Senego, Alwihda Info)', url: 'https://www.guinee360.com/10/09/2026/mali-les-fama-revendiquent-214-frappes-et-pres-de-1-000-terroristes-neutralises-en-aout' }
  ],
  bp: [
    { id: 1, date: '2026-08-03', country: 'Regional (Mauritania/Senegal)', category: 'Business & Economy', tier: 'confirmed', headline: 'Kosmos Energy Q2 2026 results: GTA output slightly down, guidance reaffirmed', summary: 'Kosmos Energy reported GTA Phase 1 production averaging ~15,700 boepd net in Q2 2026, slightly below Q1 due to seasonal demand; 9 cargoes were lifted in the quarter (18.5 in H1) with full-year guidance reaffirmed at 32–36 cargoes. The release also noted progress on domestic "Phase 1+" gas deals in both host countries.', whyItMatters: "Reaffirmed guidance signals the JV partners see no material operational disruption at GTA despite the seasonal dip, and progress on domestic 'Phase 1+' gas deals is an early marker of how host-government revenue-sharing may evolve.", source: 'GlobeNewswire (Kosmos Energy)', url: 'https://www.globenewswire.com/news-release/2026/08/03/3337226/0/en/Kosmos-Energy-Announces-Second-Quarter-2026-Results.html' },
    { id: 2, date: '2026-07-24', country: 'Senegal', category: 'Energy', tier: 'reported', headline: 'Investigation: Saint-Louis artisanal fishers pushed out by GTA exclusion zone', summary: "An investigative report found that artisanal fishers around Saint-Louis have been pushed well beyond the legal 500m exclusion zone (in some cases several kilometers), with claims of lost livelihoods and damaged gear. The piece cites Greenpeace Africa and NRGI and echoes a 2024 OECD Watch complaint against BP and Kosmos. Sourced from an investigative/advocacy outlet — corroborates the 2024 complaint but is not independently confirmed by BP or the government.", whyItMatters: "A recurring livelihood/exclusion-zone grievance that echoes a standing OECD Watch complaint keeps community-relations risk live for the JV, regardless of whether the specific figures here are independently verified.", source: 'DeSmog', url: 'https://www.desmog.com/2026/07/24/they-want-us-gone-bp-gas-field-forces-out-senegals-fishers/' },
    { id: 3, date: '2026-07-16', country: 'Mauritania', category: 'Politics & Governance', tier: 'reported', headline: 'SMH and BP hold working session on GTA operations', summary: "Mauritania's national oil company SMH said its CEO met BP SVP Dave Campbell to review GTA development and operations, describing the talks as constructive. The release is vague on substance — could reflect routine JV governance or underlying friction — and is a single-source, uncorroborated NOC release.", whyItMatters: "Routine-sounding JV governance meetings are worth tracking for tone shifts — vague, adjective-heavy releases like this one are sometimes the first public signal of friction between partners.", source: 'SMH.mr', url: 'https://smh.mr/smh-and-bp-hold-working-session-to-align-on-gta-gas-field-operations/' },
    { id: 4, date: '2026-04-23', country: 'Senegal', category: 'Business & Economy', tier: 'confirmed', headline: "Senegal retakes Yakaar-Teranga gas block from Kosmos Energy without compensation, four years after BP's own exit", summary: "Senegal's government announced a joint withdrawal agreement under which Kosmos Energy (which held 90% of the offshore Cayar/Yakaar-Teranga gas block) and Petrosen relinquished the license back to the state at no cost, with a new license to be granted exclusively to Petrosen. The move follows BP's own 2023 exit from this same block over a strategy disagreement with the government, which favored prioritizing gas for the domestic market over export.", whyItMatters: "A same-government precedent for reclaiming a gas asset from a foreign partner without compensation is a direct data point for BP on how Dakar might treat future disputes over GTA, especially given the domestic-market-first posture that originally drove BP's own 2023 withdrawal from this same block.", source: 'Financial Afrik (also Senego, Pulse.sn, Cridem)', url: 'https://www.financialafrik.com/2026/04/24/senegal-petrosen-va-recuperer-en-exclusivite-la-licence-du-bloc-gazier-yakaar-teranga/' },
    { id: 5, date: '2026-05-26', country: 'Senegal', category: 'Business & Economy', tier: 'reported', headline: "Woodside and Petrosen continue quiet Sangomar Phase 2 talks as Senegal tax arbitration proceeds", summary: "Despite a tax dispute serious enough that Woodside Energy initiated investor-state arbitration against Dakar at the ICSID, the Australian operator is reportedly continuing discreet talks with state oil company Petrosen on a roughly 150,000 bpd second-development phase for the Sangomar offshore oil field, Senegal's main oil project (Sangomar produced 17.9 million barrels in H1 2026). A separate, distinct project from GTA, but the clearest live example of how Dakar's fiscal disputes with foreign operators are actually playing out.", whyItMatters: "Shows Senegal's fiscal disputes with foreign energy operators can run in parallel with continued expansion talks rather than freezing them outright — a useful comparison point for how a future GTA-related dispute, if any, might actually play out in practice.", source: 'The Africa Report', url: 'https://www.theafricareport.com/419781/senegal-and-woodside-push-ahead-with-sangomar-oil-expansion-despite-tax-dispute/' },
    { id: 6, date: '2026-07-12', country: 'Senegal', category: 'Politics & Governance', tier: 'confirmed', headline: "Sonko threatens to repeatedly topple PM Al Amine Lô's government over the GTA/Kosmos-BP and phosphate dossiers", summary: "National Assembly president and former PM Ousmane Sonko warned publicly in Touba that he would file a motion of censure to bring down PM Al Amine Lô's government 'as many times as necessary' if Senegal's oil, gas and phosphate interests were not preserved — naming the Yakaar-Teranga renegotiation, the ICS phosphates file, and ongoing discussions with Kosmos Energy and BP over the Grand Tortue Ahmeyim project. He also announced a forthcoming bill requiring National Assembly pre-approval of any future oil or gas block attribution, removing that authority from the executive alone.", whyItMatters: "Direct evidence that GTA/BP is itself named as one of the battlegrounds in an open rupture between Sonko and the Faye government, with a censure threat and a proposed law that would add a legislative veto over future energy-contract decisions — both material political-risk and governance-continuity signals for the JV.", source: 'La Nouvelle Tribune (also Seneweb, Senego, Dakarposte, SenePlus, Dakarmatin)', url: 'https://lanouvelletribune.info/2026/07/sonko-contre-diomaye-faye-la-rupture-sinstalle-autour-du-petrole-senegalais/' },
    { id: 7, date: '2026-07-01', country: 'Mauritania', category: 'Energy', tier: 'confirmed', headline: "ACWA Power signs Mauritania's first gas IPP — 230MW N'Diago plant to run on GTA gas", summary: "Mauritania and Saudi-based ACWA Power signed agreements for the country's first independent power producer (IPP) gas plant: a 230MW combined-cycle facility at N'Diago, fed by gas from the Greater Tortue Ahmeyim field, under a 25-year deal. It's the first of two planned GTA-fed IPPs expected to add a combined 550MW to Mauritania's grid.", whyItMatters: "Confirms the first concrete, signed downstream customer for GTA's domestic gas allocation is moving forward, de-risking the 'Phase 1+' domestic-supply plans BP/Kosmos have been counting on to diversify GTA's offtake beyond LNG export.", source: 'Financial Afrik (also La Nouvelle Tribune, APAnews, Cridem)', url: 'https://www.financialafrik.com/2026/07/04/mauritanie-la-premiere-centrale-a-gaz-de-230-mw-confiee-a-acwa-power/' },
    { id: 8, date: '2026-06-24', country: 'Mauritania', category: 'Business & Economy', tier: 'confirmed', headline: "IMF approves new $95.8M, 42-month financing program for Mauritania", summary: "The IMF Executive Board approved a new 42-month arrangement (Extended Credit Facility and Extended Fund Facility) worth $95.8M for Mauritania, aimed at preserving macroeconomic stability, strengthening governance and state-enterprise reform, and supporting more inclusive growth. The Fund credited the prior 2022-2026 program with strong non-extractive-sector growth, lower inflation, a narrower current-account deficit and comfortable reserves, and projects 4.7% growth for Mauritania in 2026.", whyItMatters: "A clean IMF program renewal signals continued macro-fiscal stability and reform credibility in the host government BP/Kosmos rely on for GTA's Mauritanian side — a positive baseline indicator, though the IMF's own call for continued public-revenue and state-enterprise reforms is worth watching for any read-through to future energy-sector fiscal terms.", source: 'IMF (also Ecofin Agency, Saharamedias)', url: 'https://www.imf.org/en/news/articles/2026/06/24/pr26223-mauritania-imf-exec-approves-42mo-arr-ecf-eff-completes-5th-rev-rsf-arr' },
    { id: 9, date: '2026-03-30', country: 'Mauritania', category: 'Conflict & Security', tier: 'reported', headline: "Mauritania-Mali border tensions escalate after deadly Yakna incident and a Malian patrol's Gogui incursion", summary: "An analysis piece described the Mauritania-Mali border as a growing Sahel flashpoint as of late March 2026: the deaths of two Mauritanian herders at Yakna, a Malian military patrol's incursion at Gogui (without clashes), and cross-accusations (Bamako alleging Malian soldiers were held on Mauritanian territory) all fed rising diplomatic friction, alongside a parallel disinformation/social-media dimension. Both governments publicly favored restraint and dialogue over escalation. Included here as regional security background rather than an in-window event.", whyItMatters: "General Sahel border-security deterioration in Mauritania is a background country-risk factor for BP's Mauritanian operations even without a direct GTA connection, and worth periodic re-checking given the region's volatility.", source: 'Rapide Info (Mauritania) — single-outlet analysis piece', url: 'https://rapideinfo.mr/mauritanie-mali-tensions-frontaliere-mars-2026/' },
    { id: 10, date: '2026-08-28', country: 'Senegal', category: 'Business & Economy', tier: 'confirmed', headline: "Moody's downgrades Senegal's sovereign rating to Caa2, keeps negative outlook, as IMF talks continue", summary: "Moody's downgraded Senegal's sovereign credit rating from Caa1 to Caa2 on 28 August 2026, maintaining a negative outlook, citing rising refinancing pressure, weakening debt-service capacity and limited deleveraging prospects. The agency flagged the political rift between the executive and a Sonko-led legislature as a factor that could delay needed budget measures, alongside the prolonged absence of an IMF program (a mission was in Dakar 19 August-1 September negotiating a new one), youth unemployment and Sahel-linked security risk. Public debt is estimated near 108% of GDP.", whyItMatters: "A second Moody's downgrade of the Senegalese side of the GTA host-government pairing — following item 8's IMF program renewal on the Mauritanian side — sharpens the asymmetry between the JV's two host governments' fiscal positions, relevant to the Client's monitoring of Dakar's capacity and appetite to hold its energy-sector commitments (including GTA revenue-sharing and the Sonko-flagged renegotiation risk at item 6) steady under mounting debt pressure.", source: 'PressAfrik (also Financial Afrik, Bloomberg, Rewmi, Xibaaru)', url: 'https://www.pressafrik.com/Moody-s-degrade-la-note-souveraine-du-Senegal-a-Caa2-et-maintient-une-perspective-negative_a310707.html' },
    { id: 11, date: '2026-09-01', country: 'Senegal', category: 'Business & Economy', tier: 'confirmed', headline: "IMF-Senegal $2.2bn financing deal explicitly counts GTA and Sangomar hydrocarbon revenue as a fiscal pillar", summary: "The IMF's 1 September 2026 staff-level agreement with Senegal on a new ~$2.2bn, three-year Extended Credit Facility program (replacing the $1.8bn arrangement frozen since the 2024 hidden-debt scandal) explicitly names revenue from the Grand Tortue Ahmeyim and Sangomar hydrocarbon projects as a pillar of the program's own revenue projections, even as the Fund cautions for prudent, ring-fenced management of extractive-sector proceeds. The deal notably excludes formal debt restructuring, and Senegal's GDP grew 6.7% in 2025 partly on first-year oil production.", whyItMatters: "Senegal's own IMF program now formally leans on GTA revenue to help meet its fiscal targets, directly tying Dakar's program compliance and market-access credibility to the JV's production performance — a fiscal read-through for BP distinct from, but reinforcing, the 28 August Moody's downgrade (item 10).", source: 'France24 (also Bloomberg, IMF, alakhbar.info)', url: 'https://www.france24.com/en/live-news/20260901-imf-reaches-agreement-with-senegal-on-new-2-2-bn-loan-programme' },
    { id: 12, date: '2026-09-01', country: 'Senegal', category: 'Business & Economy', tier: 'confirmed', headline: "Senegal's $5bn Eurobond restructuring opens formal default countdown, days after IMF program tied GTA revenue to fiscal targets", summary: "Bloomberg reported that Senegal's 1 September announcement of an IMF-backed rescue program effectively opens a restructuring of roughly $5bn in outstanding Eurobonds, with a payment moratorium now near-inevitable per market analysts; a 13 September interest payment is the first concrete test. The restructuring's treatment of controversial total-return-swap debt (held by First Abu Dhabi Bank and Africa Finance Corp) remains unresolved, and Senegal cannot devalue its way out of the adjustment since it does not control its own currency.", whyItMatters: "This is the direct follow-through on the same IMF program (item 11) that formally counts GTA and Sangomar hydrocarbon revenue as a fiscal pillar — a Eurobond restructuring with a hard 13 September test date sharpens the urgency of Dakar's fiscal position and keeps the GTA/Kosmos-BP revenue-dependency question live for the JV's host-government risk assessment.", source: 'Bloomberg (via Dakaractu)', url: 'https://www.dakaractu.com/Une-restructuration-de-2830-milliards-de-FCFA-declenche-le-compte-a-rebours-du-defaut-au-Senegal-Bloomberg_a275617.html' },
    { id: 13, date: '2026-09-04', country: 'Senegal', category: 'Business & Economy', tier: 'confirmed', headline: "Senegal's public debt director pledges to honor the 13 September Eurobond coupon despite entering restructuring", summary: "Following the 1 September IMF staff-level agreement, Senegal's director of public debt, Alioune Diouf, said at a press briefing that Dakar will still honor the roughly $5bn Eurobond restructuring's imminent 13 September coupon payment 'for the moment,' explicitly distinguishing Senegal's approach from countries (Zambia, Ghana, Ethiopia) that suspended debt service mid-negotiation.", whyItMatters: "GTA and Sangomar revenue are named fiscal pillars in the IMF program (item 11); an on-record commitment to keep servicing debt through the 13 September test reduces near-term default/payment-disruption risk to the sovereign counterparties (SMH, Petrosen) that sit alongside BP/Kosmos in the GTA JV, though the 'for the moment' qualifier keeps this a live watch item through the coupon date.", source: 'Ecofin Agency', url: 'https://www.ecofinagency.com/news-finances/0409-58619-senegal-to-honor-sept-13-eurobond-coupon-despite-debt-restructuring' },
    { id: 14, date: '2026-09-04', country: 'Senegal', category: 'Politics & Governance', tier: 'confirmed', headline: "PM Al Amine Lô's General Policy Declaration rescheduled to 8 September — the forum where Sonko has threatened censure motions over GTA/ICS/Yakaar-Teranga", summary: "The Prime Minister's office confirmed on 4 September that Al Amine Lô's General Policy Declaration before the National Assembly — originally slated for 1 September but postponed over a procedural dispute about the Assembly's required notice period — is now fixed for Tuesday, 8 September 2026. This is the same forum tied to Sonko's already-tracked 12 July threat to file censure motions against Lô specifically over the Yakaar-Teranga renegotiation, the ICS phosphate dossier, and 'discussions with Kosmos Energy and BP' on GTA.", whyItMatters: "Sets a concrete, near-term date on which the already-tracked PASTEF/Sonko pressure campaign over the GTA dossier (item 6) will either escalate into a formal censure motion or de-escalate — a direct governance-continuity signal for the JV's host-government relationship; outcome unresolved, worth a follow-up next run.", source: 'APS', url: 'https://aps.sn/le-pm-al-aminou-lo-fera-sa-declaration-de-politique-generale-le-8-septembre-confirment-ses-services/' },
    { id: 15, date: '2026-09-04', country: 'Senegal', category: 'Business & Economy', tier: 'confirmed', headline: "S&P downgrades Senegal to CC as debt restructuring raises default risk on foreign-currency debt", summary: "S&P Global Ratings downgraded Senegal's long-term foreign-currency sovereign rating from CCC+ to CC (negative outlook) on 4 September, citing the 1 September debt-restructuring plan (PTDS) covering roughly $5bn in foreign-currency commercial debt (117% of GDP at end-2025). S&P termed the looming restructuring a distressed debt exchange and judged default on that debt extremely probable, while flagging that some creditors could contest the exclusion of CFA-denominated debt from the process.", whyItMatters: "Petrosen, BP's Senegalese state JV counterparty on GTA, sits inside a sovereign balance sheet S&P now judges extremely likely to default on foreign-currency debt, sharpening the open question around the 13 September Eurobond coupon (items 13-14).", source: 'S&P Global Ratings (via 24heureinfo, also africaintel/African Business)', url: 'https://24heureinfo.com/afrique/lagence-sp-degrade-la-note-du-senegal-a-cc-en-raison-du-plan-de-traitement-de-la-dette/' },
    { id: 16, date: '2026-09-01', country: 'Senegal', category: 'Business & Economy', tier: 'confirmed',
      headline: "IMF reaches staff-level agreement with Senegal on $2.2bn Extended Credit Facility program",
      summary: "Following talks in Dakar from 19 August to 1 September, the IMF and Senegalese authorities reached a staff-level agreement on a 36-month Extended Credit Facility arrangement worth about $2.2bn (SDR 1,537.1m, 475% of quota) to support a 2026-29 reform program targeting macroeconomic stability, debt sustainability and reduced fiscal/external vulnerabilities. The deal still needs IMF Executive Board approval plus a waiver tied to Senegal's prior debt-misreporting case and financing assurances from partners; local commentary cautioned the figure is a multi-year ceiling, not an immediate disbursement.",
      whyItMatters: "A pending $2.2bn IMF program is a material new input into the same Senegalese fiscal-continuity backdrop already tracked via the Eurobond coupon pledge and S&P downgrade (items 13-15) — its approval or collapse will shape the government's fiscal room to manage GTA-related revenue and host-government obligations to the JV.",
      source: 'IMF', url: 'https://www.imf.org/en/news/articles/2026/09/01/pr26282-senegal-imf-reaches-sla-ecf-arrangement' },
    { id: 17, date: '2026-09-08', country: 'Senegal', category: 'Energy', tier: 'confirmed', headline: "PM's General Policy Declaration devotes major section to gas sovereignty, acknowledges GTA financing required international borrowing", summary: "In his 8 September Declaration de Politique Generale, PM Ahmadou Al Aminou Lo dedicated a substantial portion of his address to energy sovereignty, reaffirming that gas must remain 'at the heart of' Senegal's energy strategy to enable lower-cost local power generation, and called for an ambitious national oil-and-gas strategy with stronger local content. He also acknowledged that financing GTA-related infrastructure required Senegal to borrow from major international financial institutions, given insufficient domestic capacity.", whyItMatters: "A prime-ministerial reaffirmation of gas's centrality to national energy strategy, paired with an admission that GTA-linked financing depends on external borrowing, underscores both the project's political importance and Senegal's continued fiscal dependence on it amid the wider debt-restructuring backdrop already tracked here.", source: 'Dakaractu', url: 'https://www.dakaractu.com/Al-Aminou-Lo-sur-la-souverainete-energetique-Le-gaz-doit-rester-au-coeur-de-la-strategie_a275763.html' },
    { id: 18, date: '2026-09-08', country: 'Senegal', category: 'Business & Economy', tier: 'confirmed',
      headline: "PM quantifies Yakaar-Teranga withdrawal loss at $55M during DPG, triggering blame dispute with predecessor Sonko",
      summary: "During the same 8 September General Policy Declaration, PM Al Aminou Lo said Senegal lost roughly $55M (about 33bn FCFA) because the prior government withdrew the Yakaar-Teranga gas permit from Kosmos Energy too hastily (the withdrawal itself already tracked as item 4), arguing the state could have obtained penalties/fines had it waited three more months. Opposition deputy Thierno Alassane Sall publicly demanded clarification on whether this was incompetence or a deliberate arrangement, escalating a direct dispute with former PM Ousmane Sonko's camp. Corroborated across Dakaractu (two articles) and Seneweb.",
      whyItMatters: "A quantified, on-record $55M fiscal-loss figure attached to a host-government gas-block decision — and the political blame fight it has triggered — sharpens the same Senegal/host-government political-risk backdrop this program already tracks around GTA (items 4, 6, 14), even though Yakaar-Teranga itself is a separate block from GTA.",
      source: 'Dakaractu', url: 'https://www.dakaractu.com/Yakaar-Teranga-perte-de-55-millions-de-dollars-Thierno-Alassane-Sall-decele-une-grave-accusation-du-PM-contre-son_a275804.html' },
    { id: 19, date: '2026-09-08', country: 'Senegal', category: 'Energy', tier: 'reported', headline: "PM calls for Senegal-Mauritania-BP accord on domestic GTA gas use, targets Sénélec LNG supply from January 2027", summary: "Presenting his General Policy Declaration to the National Assembly, PM Ahmadou Al Aminou Lô called for concluding an agreement with Mauritania and BP allowing Senegal to draw part of GTA's gas output under terms consistent with existing project agreements, saying supply of liquefied natural gas to state utility Sénélec should begin from January 2027 as part of a push to convert oil/gas resources into lower-cost electricity and industrial capacity.", whyItMatters: "A specific January 2027 target date for domestic Sénélec gas supply gives a concrete near-term milestone against which to judge whether Senegal's 'gas sovereignty' push (already tracked in item 17) translates into an actual host-government agreement with BP and Mauritania, or becomes another point of friction on the GTA dossier.", source: 'Saharamedias', url: 'https://fr.saharamedias.net/le-premier-ministre-senegalais-appelle-a-la-conclusion-dun-accord-avec-la-mauritanie-sur-le-projet-gazier-gta/' },
    { id: 20, date: '2026-09-08', country: 'Senegal', category: 'Business & Economy', tier: 'reported', headline: "New reporting deepens Yakaar-Teranga $55M dispute: PM alleges unauthorized waiver of state claim, cites contested 1 June letter", summary: "Follow-up reporting on the same 8 September DPG remarks already tracked (item 18) added detail on the legal and institutional mechanics of the $55M Yakaar-Teranga dispute: PM Al Aminou Lô cited Article 19 of the Petroleum Code as the basis for the claim and alleged that an unnamed party — with reporting pointing toward Petrosen and/or Kosmos — decided to waive the sum without authority to do so. He referenced a 1 June letter from the outgoing energy minister to Petrosen's director-general contesting that waiver.", whyItMatters: "Directly implicates the Petrosen-Kosmos withdrawal transaction underlying GTA's neighboring Yakaar-Teranga block in an unresolved allegation of unauthorized state-asset waiver, adding an accountability dimension to the political-risk backdrop the JV already tracks around Senegal's gas-sector governance (items 4, 6, 14, 18).", source: 'Dakaractu', url: 'https://www.dakaractu.com/Yaakaar-Teranga-Sonko-annoncait-le-retrait-de-Kosmos-Al-Aminou-Lo-revele-un-contentieux-—-qu-est-il-reellement-advenu_a275805.html' },
    { id: 21, date: '2026-09-09', country: 'Senegal', category: 'Politics & Governance', tier: 'confirmed', headline: "Civil-society coalition demands OFNAC self-referral over $55M Yakaar-Teranga shortfall already flagged by PM (items 18, 20)", summary: "Three civil-society organizations (OSIDEA, ONG 3D and Forum du Justiciable) issued a joint communiqué on 9 September 2026 calling on Senegal's anti-corruption body OFNAC to open its own investigation (autosaisine) into the roughly $55M/30bn FCFA the state says it lost when the prior government waived its claim on Kosmos Energy's Yakaar-Teranga withdrawal — the same dispute PM Al Aminou Lô quantified and Thierno Alassane Sall contested during the 8 September DPG (items 18, 20).", whyItMatters: "Civil-society pressure to escalate the Yakaar-Teranga shortfall into a formal OFNAC anti-corruption inquiry broadens the accountability fight beyond a political dispute between Lô and Sonko's camp into an institutional/prosecutorial track, keeping Kosmos Energy's broader relationship with the Senegalese state — BP's GTA JV partner — under sustained scrutiny.", source: 'SenePlus', url: 'https://www.seneplus.com/article/yakaar-teranga-trois-organisations-demandent-des-comptes-sur-55-millions-de-dollars' },
    { id: 22, date: '2026-09-09', country: 'Senegal', category: 'Energy', tier: 'confirmed', headline: "Greenpeace Africa advocacy tour stop in Saint-Louis: fishing-council deputy says GTA ESIA recommendations 'not respected' by BP and Kosmos", summary: "At a Greenpeace Africa 'Advocacy Tour' workshop in Saint-Louis on 9 September 2026 (part of a swing through Saint-Louis, Lompoul, Kayar and Djiffer), Fama Sarr, deputy secretary of the Local Artisanal Fishing Council, said many recommendations from the GTA project's own environmental and social impact studies — covering coastal erosion, the river mouth and fishmeal factories — have not been respected by BP and Kosmos Energy. The workshop aimed to help fishers and fish-processors document impacts and build a common advocacy platform.", whyItMatters: "A named local fishing-council official publicly accusing the JV of non-compliance with its own ESIA commitments, at a Greenpeace-organized event explicitly building a community advocacy platform, sustains and organizes the same Saint-Louis exclusion-zone grievance this program already tracks (item 2) — relevant to community-relations and ESG scrutiny risk.", source: 'Senego (also Seneweb, Ndarinfo, APS)', url: 'https://senego.com/fama-sarr-beaucoup-de-recommandations-issues-des-etudes-dimpact-environnemental-et-social-du-projet-gta-nont-pas-ete-respectees-par-les-multinationales_2001294.html' },
    { id: 23, date: '2026-09-09', country: 'Mauritania', category: 'Politics & Governance', tier: 'confirmed', headline: "Retired General Ould Maayouf's detention prompts opposition party to boycott Mauritania's national dialogue", summary: "Mauritanie en avant, headed by retired General Lebatt Ould Maayouf, withdrew from the presidency of the Democratic Opposition Coalition Pole and suspended participation in preparations for the government's planned national dialogue after Ould Maayouf — an executive-bureau member and, before his arrest, a vocal critic warning the dialogue risked being used to push through constitutional amendments — was placed in provisional detention on accusations of threatening state security and disclosing secrets, following circulation of audio recordings critical of the government.", whyItMatters: "A prominent opposition figure's detention triggering a party boycott of the government's own flagship national-dialogue process is a direct political-risk signal for Mauritania, one of BP's two GTA host governments, worth watching for whether the dialogue's legitimacy or the wider opposition's participation erodes further.", source: 'Saharamedias', url: 'https://fr.saharamedias.net/le-parti-mauritanie-en-avant-decide-de-boycotter-le-dialogue-national-pour-protester-contre-lemprisonnement-de-lun-des-membres-de-son-bureau-executif/' },
    { id: 24, date: '2026-09-10', country: 'Senegal', category: 'Politics & Governance', tier: 'reported', headline: "Faye refers the $55M Yakaar-Teranga/Kosmos shortfall to the IGE; ex-Petrosen chief denies any debt exists, ex-minister demands parliamentary inquiry", summary: "According to L'Observateur (relayed by Dakaractu and Senego on 10 September 2026), President Bassirou Diomaye Faye instructed the Inspection générale d'État to investigate the circumstances of Kosmos Energy's withdrawal from Yakaar-Teranga and the fate of the roughly $55M the PM raised in his DPG (items 18, 20, 21); Energy and Petroleum Minister Abdourahmane Diouf is reported to have formally seized the IGE by confidential letter, and Petrosen and ministry services are to hand over the relevant documents. Former Petrosen director-general Alioune Guèye countered that 'nobody owes $55M to the State': the figure was a minimum spending commitment for the extension period's development studies under decree 2024-713 of 13 March 2024, not an enforceable claim, Kosmos had already invested more than $300M, and the negotiated exit secured data, tapes and assets for the state — adding that if a claim existed the government could simply pursue Kosmos directly today. Former energy minister Birame Souleye Diop, on Xalaat TV, produced documents he called confidential, said the sum reflected unmet Kosmos investment commitments rather than money owed, and called for a parliamentary inquiry.", whyItMatters: "The Yakaar-Teranga shortfall has moved from a political blame fight into a formal state audit with a competing on-record legal reading from the officials who ran the Petrosen-Kosmos exit — directly implicating how Dakar interprets petroleum-code obligations toward departing operators, a precedent question of obvious relevance to BP and Kosmos's own GTA dealings with the same government; IGE findings pending, follow up.", source: "Dakaractu (citing L'Observateur; also Senego, sanslimitesn)", url: 'https://www.dakaractu.com/Yaakaar-Teranga-Diomaye-saisit-l-IGE-sur-les-55-millions-de-dollars-l-ex-DG-de-Petrosen-conteste-toute-creance_a275841.html' },
    { id: 25, date: '2026-09-10', country: 'Senegal', category: 'Politics & Governance', tier: 'reported', headline: "No censure motion after the DPG: Pastef opts for 'loyal dialogue' with Faye as Presidency adviser attacks Sonko over the 'Kosmos affair'", summary: "Resolving the open question in item 14, the 8 September General Policy Declaration passed without a confidence vote or censure motion; National Assembly president Ousmane Sonko rejected 'permanent hostility' and called for a 'loyal dialogue' between Pastef and President Faye ('standing institutions, not aligned ones'). The truce is uneasy: Presidency Minister-Counselor Aldiouma Sow publicly attacked Sonko's camp on Facebook over the 'Kosmos affair' and the Casamance peace fund's 'Jaam' account, promising 'other scandals' to come. Senego identifies the 2026 rectifying finance law, which must carry Senegal's commitments under the pending $2.2bn IMF program, as the next test between the Pastef majority and the government.", whyItMatters: "The censure threat that hung over the GTA/Kosmos-BP dossier since July has not materialized, but the executive-legislature rupture is now being fought through the Kosmos affair itself and will next surface in the budget vote that embeds IMF conditionality — the political-risk backdrop for BP's Senegalese host government remains unsettled rather than resolved.", source: 'Senego (also Dakaractu)', url: 'https://senego.com/pastef-demande-un-dialogue-loyal-a-bassirou-diomaye-faye_2001467.html' },
    { id: 26, date: '2026-09-10', country: 'Senegal', category: 'Business & Economy', tier: 'reported', headline: "Senegal Eurobond holders form a creditor group and hire White & Case ahead of restructuring", summary: "Reuters, cited by Dakaractu on 10 September 2026, reported that a group of at least eight fund managers holding Senegalese sovereign bonds has organized and retained White & Case — a firm with sovereign-restructuring experience on both the government side (Ethiopia, Ukraine) and the creditor side (Lebanon, Sri Lanka) — as legal adviser; the firm declined to comment. The step follows the 1 September IMF staff-level agreement (item 16) and the economy ministry's announcement of an 'enhanced Common Framework' treatment, with misreported debt now estimated above $13bn, about a quarter of GDP.", whyItMatters: "Creditor organization opens the adversarial phase of the restructuring in which GTA and Sangomar revenue are already named fiscal pillars (item 11) — how bondholders treat hydrocarbon receipts, and whether Dakar ring-fences them, now becomes a live negotiation variable for BP's Senegalese counterparty Petrosen.", source: 'Dakaractu (citing Reuters)', url: 'https://www.dakaractu.com/Dette-du-Senegal-accord-avec-le-FMI-des-detenteurs-d-obligations-s-organisent-et-recrutent-White-Case-les-creanciers-du_a275860.html' },
    { id: 27, date: '2026-09-04', country: 'Mauritania', category: 'Conflict & Security', tier: 'confirmed', headline: "Mauritanian army arrests 17 for arms trafficking at Bassiknou, including former Ansar Dine spokesman Sanda Ould Bouamama", summary: "On 4 September 2026 Mauritanian forces intercepted two pickup trucks carrying weapons and ammunition at Bassiknou (Hodh Ech Chargui, near the Malian border) and arrested 17 people, among them Sidi Mohamed Ould Mohamed Ould Bouamama, alias Sanda Ould Bouamama, the 2012-13 media spokesman of the jihadist group Ansar Dine; the suspects were transferred to Néma for questioning, and investigators are trying to establish the weapons' origin (northern Mali not excluded) and any links to armed groups. Bouamama, a dual Mauritanian-Malian national wanted by Mali on war-crimes and terrorism charges, surrendered to Mauritania in 2013 and was freed in 2015, so his possible transfer to Bamako is uncertain. Reported by Maliweb on 10 September and corroborated by Kassataya, Lefaso.net, Emedia and others.", whyItMatters: "A confirmed arms-smuggling network on Mauritania's Malian frontier led by a known jihadist figure is a direct security-environment data point for BP's Mauritanian host state, and the Bamako-Nouakchott extradition question it raises could strain the bilateral relationship that GTA's cross-border political stability partly depends on.", source: 'Maliweb.net (also Kassataya, Lefaso.net, Emedia)', url: 'https://www.maliweb.net/insecurite/mauritanie-17-personnes-dont-un-ancien-porte-parole-dansar-dine-arretees-pour-trafic-darmes-a-la-frontiere-malienne-3119803.html' },
    { id: 28, date: '2026-09-10', country: 'Mauritania', category: 'Politics & Governance', tier: 'reported', headline: "Biram Dah Abeid urges the entire opposition to quit Mauritania's national dialogue, alleging a third-term agenda", summary: "Opposition MP Biram Dah Abeid issued a statement on 10 September 2026, reported by Alakhbar, praising Mauritanie en avant's withdrawal (item 23) and calling on the whole opposition to leave the national-dialogue process, arguing that dialogue is meaningless while freedoms of opinion, assembly and expression are repressed and the regime runs 'an organized campaign' to prepare public opinion for violating the constitution and imposing a third presidential term. He cited the Interior Ministry's refusal to let the opposition hold receptions during a march in Nouadhibou while ruling-party Insaf delegations were allowed, and called for genuine consultations to forge a unified opposition position.", whyItMatters: "A second major opposition figure walking away from the dialogue over the same third-term suspicion turns item 23's party-level boycott into a potential opposition-wide legitimacy crisis for the government's flagship political process — a sharpening political-risk signal for BP's Mauritanian host state ahead of any constitutional-revision push.", source: 'Alakhbar', url: 'https://www.alakhbar.info/6aa292c27d4c2b0001d52ce0/' },
    { id: 29, date: '2026-09-10', country: 'Mauritania', category: 'Energy', tier: 'reported', headline: "Mauritania restructures its fuel-import tender for H1 2027: cabotage split from supply, DAP delivery allowed, security stock nationalized, six-month contracts", summary: "In an analysis published by Financial Afrik on 10 September 2026, Mohamed Nafa El Fadel El Jeilany — an independent consultant and former economic and financial adviser to the energy and petroleum minister — sets out the changes in the renewed tender dossier (DAO) for supplying Mauritania's domestic market with liquid hydrocarbons over December 2026-June 2027: the cabotage contract is separated from the supply contract so large international traders can bid directly; a DAP (delivered-at-place) option replaces the previous in-tank-transfer-only requirement that forced the trader to hold stock in-country; the security stock becomes a national stock under state responsibility; imported products move to standard specifications; and the contract term is cut to six months, explicitly to accommodate the phased commissioning of new storage capacity in Nouakchott and hedge against Middle East geopolitical disruption. He presents the DAO as a test of a new supply model before possible consolidation in future tenders.", whyItMatters: "A deliberate liberalization of Mauritania's downstream fuel-supply framework — widening the bidder pool, taking strategic stocks in-house and shortening contracts to ride out Middle East volatility — is a data point on how SMH's parent ministry manages energy-security and state-versus-operator roles, the same policy culture that shapes its posture toward the GTA partners; single-source and author-affiliated, so treat as a reported reading of the tender rather than official policy.", source: 'Financial Afrik (analysis by a former energy-ministry adviser)', url: 'https://www.financialafrik.com/2026/09/10/hydrocarbures-la-mauritanie-ouvre-une-nouvelle-ere-de-concurrence-dans-lapprovisionnement-national/' },
    { id: 30, date: '2026-09-09', country: 'Senegal', category: 'Energy', tier: 'confirmed', headline: "Senegal puts 109 of its 113 oil and gas blocks on offer after the contract audit, promising a role for local firms", summary: "Energy and Petroleum Minister El Hadji Abdourahmane Diouf announced on 9 September 2026, at an investor roadshow, that Senegal is opening 109 oil and gas blocks to local and foreign investors — of the country's 113 blocks only four are currently under contract — as a follow-on to the audit of mining, oil and gas contracts the government announced in 2024 to test existing agreements against the 'national interest'. The authorities say development of the blocks should favor the emergence of local leaders in the energy, oil and gas sectors (Agence Ecofin, CNBC Africa, OilPrice.com, Senego).", whyItMatters: "A near-total re-offer of the acreage portfolio, explicitly sequenced after the contract review, will set the terms — local-content expectations, state participation, fiscal take — that frame Dakar's posture toward existing operators too, including the GTA partners; who bids, and on what model contract, will show whether the Yakaar-Teranga episode (items 18-24) has chilled or merely repriced investor appetite for Senegalese acreage.", source: 'Agence Ecofin (also CNBC Africa, OilPrice.com, Senego)', url: 'https://www.agenceecofin.com/actualites/1009-141477-petrole-et-gaz-le-senegal-ouvre-109-blocs-aux-investisseurs-apres-la-remise-en-cause-des-anciens-contrats' },
    { id: 31, date: '2026-09-10', country: 'Senegal', category: 'Energy', tier: 'confirmed', headline: "August production data: GTA ships three LNG cargoes (0.49 million m³) despite liquefaction-train maintenance; Sangomar exports 2.97 million barrels", summary: "Monthly figures from the Ministry of Energy and Petroleum for August 2026, reported on 10 September by Leral, RTS and Seneweb: GTA exported three LNG cargoes totaling about 0.49 million cubic metres of LNG, with production described as stable despite maintenance work on one liquefaction train; Sangomar shipped three crude cargoes totaling 2.97 million barrels, with the production plateau stable and a slight decline in daily output, for cumulative production of 77.17 million barrels at 31 August (76.43 million barrels sold across 79 cargoes).", whyItMatters: "Three cargoes a month keeps GTA on the pace implied by Kosmos's 32-36 cargo guidance for 2026 (item 1), and the disclosed train maintenance is the first official acknowledgment this month of an operational constraint at the FLNG — worth reconciling with Kosmos's Q3 report — while Dakar's monthly publication of volumes reflects the hydrocarbon-revenue transparency the IMF program expects (item 11).", source: 'Leral (Ministry of Energy and Petroleum data; also RTS, Seneweb)', url: 'https://www.leral.net/Hydrocarbures-Sangomar-et-GTA-maintiennent-le-rythme-des-exportations-en-aout-2026_a405892.html' },
    { id: 32, date: '2026-09-10', country: 'Senegal', category: 'Energy', tier: 'confirmed', headline: "First pipe laid on the 85 km northern segment of Senegal's gas network that will carry GTA gas to the Gandon power plant", summary: "On Thursday 10 September 2026 Energy Minister Abdourahmane Diouf presided at Gandon (Saint-Louis department) over the laying of the first pipe of the Réseau Gazier du Sénégal's northern segment: roughly 85 km — 45 km offshore to the Léona landing point in the Louga region and 40 km onshore to Gandon — with a capacity of up to 300 million cubic feet a day, linking the GTA field to the Gandon power plant. The works are executed by the Sicilsaldo-Enereco-Micoperi grouping under a contract awarded in 2025, within a planned 400 km national network costed at about 650 billion FCFA; the minister tied the project to the 'gas-to-power' strategy of replacing costlier fuels in electricity generation (Ndarinfo, Seneweb, Senego).", whyItMatters: "This is the physical start of the domestic-gas offtake route that the PM's proposed Senegal-Mauritania-BP domestic-gas accord and the Sénélec supply plan (item 19) presuppose — progress here determines when, and how much, GTA gas is diverted from LNG exports to the Senegalese grid, a commercial variable for BP and Kosmos and a political test of Dakar's gas-to-power promise.", source: 'Ndarinfo (also Seneweb, Senego)', url: 'https://www.ndarinfo.com/Gandon-pose-de-la-premiere-canalisation-du-segment-Nord-du-Reseau-Gazier-du-Senegal_a46579.html' },
    { id: 33, date: '2026-09-10', country: 'Senegal', category: 'Politics & Governance', tier: 'confirmed', headline: "Faye purges Pastef-aligned agency chiefs in an 87-appointment Council of Ministers; ARTP, ASER, CDC and Dakar Dem Dikk among the posts changed", summary: "The 10 September 2026 Council of Ministers — the first after the DPG — approved 87 appointments and removals of directors-general, board chairs and supervisory-board chairs across public bodies, which Senegalese outlets describe as a methodical removal of Pastef figures from the executive (Xibaaru: 'la grande purge'; Senegal7: 'presque tous les DG de Pastef'); Pastef communications chief Amadou Ba said beforehand that any dismissed DGs would be those who refused to rally to the presidential camp. Posts changed include Dakar Dem Dikk, ASER, DGPU, SONAGED and the FERA board chair, with the CDC director-general's replacement launched via an open call; the ARTP got a new director-general through the July competitive process. The same Council announced Faye's 14-15 September Washington and 16-17 September Abu Dhabi visits (APS). In the appointment lists relayed by Senego and Dakaractu this run, no Petrosen or energy-ministry post appears.", whyItMatters: "The post-DPG truce (item 25) is being tested by a wholesale personnel purge rather than a censure motion — hardening the Faye-Sonko conflict that already runs through the Kosmos/Yakaar-Teranga affair (items 20-24) and raising the odds of confrontation over the LFR 2026 budget that must carry the IMF program's conditions; for BP the practical question is whether Petrosen's and the ministry's leadership stay outside the purge.", source: 'Senego (also Pulse Sénégal, Xibaaru, Senegal7, Le Soleil)', url: 'https://senego.com/bassirou-diomaye-faye-acte-87-nominations-dans-ladministration_2001748.html' },
    { id: 34, date: '2026-09-10', country: 'Mauritania', category: 'Business & Economy', tier: 'confirmed', headline: "AfDB 2026 Country Report projects Mauritanian growth of 4.4% in 2026 and 4.7% in 2027 on GTA gas, after a slowdown to 4.0% in 2025", summary: "The African Development Bank's 2026 Country Report on Mauritania, relayed by Alakhbar and Cridem on 10 September 2026, projects growth of 4.4% in 2026 and 4.7% in 2027, driven by gas entering production together with agriculture, fisheries, construction and services; growth slowed to 4.0% in 2025 from 6.3% in 2024 on a contraction of the extractive sector. The report expects GTA LNG — first gas on 31 December 2024, first cargo in April 2025 — to generate additional fiscal revenue, strengthen foreign-exchange reserves and improve the current account. Resolves the lead carried from the 10 September 16:34 UTC run; the report's own publication date was not established this run.", whyItMatters: "The multilateral baseline for Mauritania's economy now rests explicitly on GTA revenue — reinforcing the state's and SMH's incentive to keep the project stable, but also raising expectations of fiscal receipts that Nouakchott will want to see in its budget, a pressure point in any future revenue-sharing or domestic-gas discussion with the operators.", source: 'African Development Bank, Rapport Pays 2026 Mauritanie (relayed by Alakhbar, Cridem)', url: 'https://www.afdb.org/fr/documents/rapport-pays-2026-mauritanie-mobiliser-des-ressources-grande-echelle-pour-le-financement-du-developpement-de-la-mauritanie-dans-un-monde-fragmente' },
    { id: 35, date: '2026-09-10', country: 'Senegal', category: 'Business & Economy', tier: 'confirmed', headline: "PM sets the fiscal calendar behind the DPG: 2026 supplementary budget to the National Assembly by 15 September, 2027 budget bill to the Council of Ministers by 30 September", summary: "Prime Minister Ahmadou Al Aminou Lô followed his 8 September General Policy Declaration (items 17, 19-20) with a first implementation calendar, reported by Le Soleil and Senego on 10-11 September: the 2026 supplementary budget bill (LFR) must be tabled in the National Assembly by 15 September, the 2027 budget bill (PLF) submitted to the Council of Ministers on 30 September, draft orders creating ministerial project groups delivered by 24 September, family-security-allowance arrears settled by end-September, and the first meeting of the interministerial monitoring committee held in the first half of October — all organized around five commitments led by public-accounts recovery and the restoration of the rule of law.", whyItMatters: "The LFR and PLF are where the IMF program's fiscal targets (items 11-13, 26) and the state's hydrocarbon-revenue assumptions — GTA LNG and Sangomar receipts — will be written down for the first time under the new government, so 15 and 30 September are the next concrete checkpoints for how Dakar prices its share of GTA and whether a domestic-gas or Petrosen provision appears in the text.", source: 'Le Soleil (also Senego, Teranga Times, Sans Limites)', url: 'https://lesoleil.sn/actualites/gouvernement-le-premier-ministre-fixe-les-premieres-echeances-pour-la-mise-en-oeuvre-de-la-dpg/' },
    { id: 36, date: '2026-09-11', country: 'Regional (Mauritania/Senegal)', category: 'Energy', tier: 'confirmed', headline: "Brent tops $108, its highest since May, as US–Iran escalation and a Houthi push toward Bab el-Mandeb add a second chokepoint to the Hormuz shock", summary: "Brent for November delivery rose to $108.68 a barrel on Friday 11 September (WTI $103.45), above $108 for the first time since 21 May, with both benchmarks up close to 13% on the week and heading for a first weekly finish above $100 since mid-May, on reciprocal US and Iranian strikes that threaten Middle East supply (Beninwebtv, DIA, L'Économiste Maghrébin). In parallel, Yemen's Houthis seized the Red Sea port of Mocha on 10 September and were advancing on Dhubab and Perim Island at the mouth of the Bab el-Mandeb strait, having reached the Hanish islands — a move analysts read as a bid for leverage over Red Sea shipping (Euronews, Times of Israel, Foreign Policy).", whyItMatters: "Higher crude and LNG realizations lift the hydrocarbon revenue Senegal and Mauritania are counting on (items 11, 31, 34) and strengthen the case for a GTA Phase 2 decision, while a contested Bab el-Mandeb on top of a near-closed Hormuz makes Atlantic-basin LNG such as GTA's relatively more attractive to European buyers — but also raises freight, insurance and force-majeure risk for any cargoes routed to Asia via Suez.", source: 'Beninwebtv (Brent; also DIA, L\'Économiste Maghrébin) / Euronews (Bab el-Mandeb)', url: 'https://beninwebtv.com/petrole-le-brent-depasse-108-dollars-au-plus-haut-depuis-mai/' },
    { id: 37, date: '2026-09-11', country: 'Senegal', category: 'Business & Economy', tier: 'reported', headline: "IMF says Senegal's new program can proceed before creditor talks conclude (Dakaractu)", summary: "Dakaractu reported on 11 September 2026 that the IMF has given assurances that the new 36-month, roughly $2.2 billion Extended Credit Facility agreed at staff level on 1 September can move forward before Senegal's discussions with its creditors are completed — the sequencing question opened when bondholders organized and retained White & Case (item 26) and Dakar launched its debt-treatment plan under the G20 enhanced Common Framework. Only the report's headline could be seen this run; the IMF's exact wording on board timing and financing assurances has not been read and should be confirmed.", whyItMatters: "Decoupling board approval from the pace of the bondholder negotiation would bring forward the budget support and program conditionality that frame Dakar's treatment of hydrocarbon revenue (items 11, 31, 35) — including how GTA and Sangomar receipts are counted in the fiscal framework — while leaving the harder question of what the restructuring asks of private creditors for later.", source: 'Dakaractu', url: 'https://www.dakaractu.com/Dette-du-Senegal-le-FMI-assure-que-le-nouveau-programme-peut-avancer-avant-la-fin-des-discussions-avec-les-creanciers_a275906.html' },
    { id: 38, date: '2026-09-11', country: 'Senegal', category: 'Business & Economy', tier: 'confirmed', headline: "July trade data: crude oil lifts Senegal's exports 27.3% to 668.2bn FCFA, but LNG export value falls by a third to 29.3bn", summary: "ANSD's July 2026 foreign-trade note, relayed on 11 September, puts exports at 668.2 billion FCFA against 524.7 billion in June, a 27.3% rise driven mainly by crude oil shipments worth 273.4 billion FCFA versus 87.7 billion the previous month; refined products (73.0 billion against 57.2 billion) and phosphoric acid (19.7 billion against 7.3 billion) also contributed. Liquefied natural gas moved the other way, falling to 29.3 billion FCFA from 45.0 billion, as did hydraulic cement and fresh fish. Imports were 606.0 billion FCFA, leaving a monthly surplus; cumulative exports to end-July reached 3,822.5 billion FCFA against 3,272.2 billion a year earlier, up 16.8% (Le Soleil, PressAfrik, Seneweb, EmediaSN).", whyItMatters: "This is the first monthly dataset showing GTA's contribution to Senegal's external accounts shrinking in value terms while Sangomar crude carries the headline — a gap the government will notice as it writes hydrocarbon-revenue assumptions into the LFR due by 15 September (item 35), and a reminder that the three-cargo monthly cadence reported for August (item 31) translates into a receipt line that moves with cargo timing and price, not production alone.", source: 'Le Soleil (ANSD data; also PressAfrik, Seneweb, EmediaSN)', url: 'https://lesoleil.sn/actualites/economie/commerce-exterieur-senegal-6682-milliards-de-fcfa-dexportations-realises-en-juillet-dernier/' },
