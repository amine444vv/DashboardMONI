    { id: 64, date: '2026-08-17', reportedDate: '2026-08-18', category: 'Politics & Governance', country: 'Senegal', tier: 'confirmed', platformIntegrity: false,
      headline: "National Assembly adopts Article 37 asset-declaration reform 133-2; Faye opts to submit it to referendum",
      summary: "The National Assembly voted 133-2, no abstentions, to adopt the bill amending Article 37 of the Constitution, which would require the President, National Assembly President and Prime Minister to publicly declare their assets at the start and end of their terms and make the declaration a mandatory part of presidential candidacy files. Rather than promulgate the law directly, President Faye announced (via Justice Minister spokesperson Me Moussa Sarr) that he will submit the reform to a referendum under Article 103, folding it into a broader constitutional package.",
      whyItMatters: "Escalates the Faye-Sonko transparency/asset-declaration thread already tracked (ids 30, 33-34, 38-39, 49) from a parliamentary bill into a constitutional referendum question — extends the period of regulatory-continuity uncertainty the Client should watch around ARTP leadership and platform-oversight policy while the political system's attention stays fixed on this reform.",
      source: 'Senegal7', url: 'https://senegal7.com/revision-de-larticle-37-le-president-bassirou-diomaye-faye-decide-dun-referendum/' },
    { id: 65, date: '2026-08-14', category: 'Politics & Governance', country: 'Burkina Faso', tier: 'confirmed', platformIntegrity: false,
      headline: "Burkina Faso makes military 'patriotic immersion' training compulsory for journalists",
      summary: "Forty-four Burkinabè media professionals underwent five days of military training (soldier drills, tactical first aid, weapons familiarization) at the Pabré police academy near Ouagadougou, 9-14 August, under a scheme the Security Ministry has now made an annual obligation for public and private media. RSF's Sub-Saharan Africa director Sadibou Marong told AFP the move is 'a very worrying new signal for press freedom' under Capt. Ibrahim Traoré's junta.",
      whyItMatters: "A widening-state-control-of-media signal from a government that has already restricted platforms and outlets over 'false news' — relevant context for assessing how far Burkina Faso's authorities might extend similar pressure onto digital-platform content and journalists' online activity.",
      source: 'AFP (via La Nouvelle Tribune)', url: 'https://lanouvelletribune.info/2026/08/burkina-faso-une-formation-militaire-desormais-obligatoire-pour-les-journalistes/' },
    { id: 66, date: '2026-08-17', category: 'Network Disruption & Cybersecurity', country: 'DR Congo', tier: 'confirmed', platformIntegrity: false,
      headline: "CPJ presses DRC to restore month-long internet/mobile shutdown in Fizi Territory, South Kivu",
      summary: "The Committee to Protect Journalists said mobile and internet service has been cut in Fizi Territory (including the city of Baraka) since 3 July, amid intensified fighting in the Minembwe highlands between government forces and Twirwaneho rebels allied with M23/the Congo River Alliance. Local journalists who fled to Uganda and Burundi told CPJ that soldiers also seized Starlink satellite kits from several community radio stations on 8 July, with the military reportedly saying equipment would only be returned once the war ends. CPJ said its calls to Communications Minister Patrick Muyaya went unanswered.",
      whyItMatters: "A month-long, security-justified blackout that also targets alternative connectivity (Starlink seizures) shows DRC authorities are willing to sever connectivity entirely rather than restrict specific platforms — a precedent worth watching given the country's separate, ongoing TikTok-shutdown threat (ids 45, 64) and its bearing on service continuity and content-access risk for the Client's products.",
      source: 'Committee to Protect Journalists', url: 'https://cpj.org/2026/08/drc-shutdown-of-internet-mobile-networks-in-east-extends-for-over-a-month-amid-war/' },
    { id: 67, date: '2026-08-17', category: 'Politics & Governance', country: 'Mali', tier: 'confirmed', platformIntegrity: false,
      headline: "Bamako appeals court jails chronicler Ras Bath and influencer 'Rose Vie Chère' for 7 years over broadcast remarks",
      summary: "Mali's Court of Appeal in Bamako sentenced radio/TV host Mohamed Youssouf Bathily (\"Ras Bath\") and social-media activist Rokia Doumbia (\"Rose Vie Chère\") to 10 years each (3 suspended, so 7 years to serve) plus a 240,000-FCFA fine, convicting them of criminal association and damaging state credit \"via information and communication technologies.\" The charges centered on Doumbia's remarks on Ras Bath's program \"Le Grand Dossier\" criticizing the cost of living and power cuts, which prosecutors framed as coordinated action to discredit the transitional authorities. Ras Bath, a prominent civil-society figure, has been detained since March 2023 on separate proceedings.",
      whyItMatters: "Confirms Mali's junta will jail influential broadcast and social-media voices over economic-hardship criticism framed as an ICT-enabled offense against the state — a signal of continued shrinking space for platform-based commentary and dissent in Mali.",
      source: 'KOACI', url: 'https://www.koaci.com/article/2026/08/17/afrique/politique/mali-ras-bath-et-rose-vie-chere-condamnes-a-sept-ans-de-prison-ferme_199628.html' },
    { id: 68, date: '2026-08-17', reportedDate: '2026-08-18', category: 'Platform Integrity', country: 'DR Congo', tier: 'confirmed', platformIntegrity: true,
      headline: "DRC prosecutor-general orders police to actively pursue TikTok and social-media offenses without waiting for complaints",
      summary: "Prosecutor-general Firmin Mvonde instructed judicial police officers on 17 August to open investigations on their own initiative, rather than waiting for a complaint, into offenses committed on social media, declaring \"trop, c'est trop\" against what he called a digital \"drift.\" He specifically named TikTok users among likely targets alongside authors of false-rumor content, invoked the 2023 Digital Code's penalties (1-6 months' imprisonment, fines) for spreading false information via social networks, and warned of disciplinary action against police who fail to comply.",
      whyItMatters: "Shifts DRC's TikTok pressure from CSAC's regulatory shutdown threats (ids 45, 57) into an active law-enforcement posture — judicial police now empowered to self-initiate prosecutions against platform users raises the near-term likelihood of content-related arrests and platform data-request activity for the Client to track.",
      source: 'Radio Okapi', url: 'https://www.radiookapi.net/2026/08/18/actualite/justice/le-procureur-general-firmin-mvonde-ordonne-la-traque-des-auteurs' },
    { id: 69, date: '2026-08-16', reportedDate: '2026-08-18', category: 'Politics & Governance', country: 'Senegal', tier: 'reported', platformIntegrity: false,
      headline: "Industry Minister predicts National Assembly dissolution by 2 December",
      summary: "Speaking at a Kiiraay party political meeting in Fatick on 16 August, Industry and Commerce Minister Serigne Guèye Diop said the National Assembly 'will be dissolved, one way or another,' naming 2 December 2026 as the date, and accused unnamed majority MPs of blocking President Faye's bills while advancing measures he called contrary to government interests. He also referenced local and legislative elections in 2027 and urged Kiiraay supporters to organize at the grassroots ahead of the vote.",
      whyItMatters: "A sitting minister publicly naming a specific dissolution date is the most concrete marker yet of how the tracked Faye-Sonko institutional rupture (ids 30, 32-34, 38-39, 49, 64) could resolve — a dissolution and snap elections would reset the political landscape the Client's regulatory relationships (ARTP, CDP) currently depend on, though this remains one official's own prediction, not a confirmed decision, and is worth a direct follow-up.",
      source: 'Leral.net (also SeneNews)', url: 'https://www.leral.net/Assemblee-nationale-Serigne-Gueye-Diop-annonce-une-dissolution-le-2-decembre_a404335.html' },
    { id: 70, date: '2026-08-18', category: 'Politics & Governance', country: 'Senegal', tier: 'confirmed', platformIntegrity: false,
      headline: "Government asks Constitutional Council to block special-funds transparency bill; Assembly suspends its own vote in protest",
      summary: "PM Mohamed Al Aminou Lo's government formally asked the Constitutional Council on 18 August to declare inadmissible the special-funds (crédits spéciaux) bill the Assembly had scheduled for a same-week vote, arguing it encroaches on matters reserved to executive regulatory power under Articles 67 and 76. The National Assembly responded the same evening, denouncing 'systematic obstruction' of a transparency measure and voluntarily suspending Wednesday's plenary vote pending the Council's ruling (due within 8 days), while confirming Thursday's session — including the already-tracked critical-infrastructure/cybersecurity bill (id 44) — goes ahead as planned.",
      whyItMatters: "The clearest executive-legislative flashpoint yet in the tracked asset-declaration/secret-funds transparency drive (ids 30, 33-34, 38-39, 49, 64) — a Constitutional Council ruling due within days will show whether Faye's government can use procedural tools to blunt Sonko-aligned transparency legislation, a signal for how other contested digital/regulatory bills moving through the same Assembly might fare.",
      source: 'APS (also Senego)', url: 'https://aps.sn/le-gouvernement-saisit-le-conseil-constitutionnel-et-suspend-la-procedure-parlementaire-sur-les-credits-speciaux/' },
    { id: 71, date: '2026-08-18', category: 'Digital Innovation & Connectivity', country: 'Cameroon', tier: 'confirmed', platformIntegrity: false,
      headline: "Cameroon tasks state operator CAMTEL with delivering national digital-interoperability backbone",
      summary: "At the 18 August opening of Cameroon's Internet Governance Forum (id 63), Posts and Telecommunications Minister Minette Libom Li Likeng formally directed CAMTEL director-general Judith Yah Sunday to lead national data and infrastructure interoperability, tasking the state operator with the fibre backbone, transmission infrastructure, international capacity and hosting needed to let government platforms and services exchange data securely. The forum highlighted parallel interoperability efforts already underway, including a CEMAC-wide interoperable QR-code payment system and Finance Ministry budget/customs system integration.",
      whyItMatters: "A concrete government mandate — not just forum discussion — puts Cameroon's dominant state telecom operator at the center of the country's data-interoperability push, worth tracking for how CAMTEL's expanded infrastructure role could shape future data-localization, hosting or platform-interconnection requirements relevant to the Client's services in Cameroon.",
      source: 'Digital Business Africa', url: 'https://www.digitalbusiness.africa/fgi-cameroun-camtel-mandatee-de-faciliter-linteroperabilite-nationale/' },
    { id: 72, date: '2026-08-19', category: 'Platform Integrity', country: 'Guinea', tier: 'confirmed', platformIntegrity: true,
      headline: "Guinean court convicts activist Bella Bah over online insult/defamation case, orders his Facebook account deleted",
      summary: "Conakry's Dixinn Court of First Instance ruled on 19 August in the case against activist Abdourahmane Bella Bah, prosecuted for insults and defamation \"by means of a computer system\" against Conakry's Grand Imam Elhadj Mamadou Saliou Camara. The court found Bah guilty and sentenced him to six months in prison (five suspended) plus a 40-million-GNF fine — lighter than the one-year term prosecutors had sought — and separately ordered Facebook to remove the account named \"Bella Bah.\" The alleged victim had said he did not wish to press the matter and had forgiven Bah, but the prosecution proceeded regardless.",
      whyItMatters: "The account-deletion order is a concrete instance of a Guinean court directing removal of content/an account on a Meta platform via a generic ICT-defamation statute rather than a platform-specific law — relevant precedent for how Meta may be asked to action similar court-ordered takedowns in Guinea going forward, and confirms the pattern flagged alongside Mali's Ras Bath case (id 67) of criminal ICT statutes being used against online speech.",
      source: 'Guinée360', url: 'https://www.guinee360.com/19/08/2026/injures-et-diffamation-lactiviste-bella-bah-condamne-a-six-mois-de-prison-dont-cinq-avec-sursis' },
    { id: 73, date: '2026-08-17', reportedDate: '2026-08-18', category: 'Platform Integrity', country: 'Senegal', tier: 'confirmed', platformIntegrity: true,
      headline: "Keur Massar man arrested for WhatsApp-enabled blackmail and rape of sister-in-law using hidden-camera videos; second suspect and a threat against a 14-year-old emerge",
      summary: "A 39-year-old married father of six, identified as B. Thiam, was arrested on 17 August in Keur Massar and is being prosecuted for illegal collection of personal data, blackmail, extortion and rape against his sister-in-law. He allegedly lured her from Saint-Louis under the pretext of financial help, secretly filmed forced sexual encounters, then sent her the footage over WhatsApp in \"view once\" mode and used the threat of publishing it to coerce her into repeated compliance between 2025 and 2026. A second suspect, D. Diagne (40, driver), was separately arrested in Diamniadio on suspicion of complicity, with investigators finding intimate photos/videos/audio of several women on his phone; his sister-in-law's own mother-in-law was allegedly subjected to the same scheme in the past. Independent follow-up reporting (Leral, 19-20 Aug) adds that Thiam allegedly demanded the victim bring her 14-year-old daughter as a substitute, threatening to publish the videos if she refused, with a deadline set for 16 August — which is what prompted the victim's husband to alert the Brigade de Recherches de Keur Massar.",
      whyItMatters: "Another case in the recurring pattern (alongside ids 26/59) of WhatsApp's disappearing-media features being exploited as the delivery and coercion mechanism in Senegalese blackmail/extortion cases, now independently corroborated by a second outlet (upgraded reported → confirmed) with an escalating detail (a threat involving a minor) that raises the profile of the case and the likelihood of continued press and law-enforcement attention naming WhatsApp specifically; worth watching for a court outcome or additional victims coming forward.",
      source: 'Leral (also FratMat/Senenews)', url: 'https://www.leral.net/Keur-Massar-deux-hommes-interpelles-dans-une-affaire-presumee-de-viols-chantage-et-diffusion-de-contenus-intimes_a404381.html' },
    { id: 74, date: '2026-08-20', category: 'Digital Regulation & Compliance', country: 'Senegal', tier: 'confirmed', platformIntegrity: false,
      headline: "Senegal's National Assembly examines new critical-infrastructure and digital-security bill (nº25/2026)",
      summary: "Deputies on a joint Culture/Communication and Laws/Decentralization committee began examining bill nº25/2026 on 20 August, covering protection of Critical Information Infrastructure (IIC) and digital security. Telecommunications and Digital Affairs Minister Samba Diouf told the committee the bill aims to build a comprehensive legal framework for network and information-system security, citing exposure to cyberterrorism, espionage, hacking and human-negligence risks, and said it would close gaps in Senegal's existing legal architecture (digital trust, cryptography oversight, protection of sensitive state data, e-communications, e-transactions, cybercrime) to bring the country up to international standards.",
      whyItMatters: "A new statutory framework for critical digital infrastructure and cybersecurity — once passed, likely to shape obligations and oversight for major platforms and network operators in Senegal, including data-security and incident-related requirements the Client should track as the bill moves through committee and, eventually, a floor vote.",
      source: 'APS', url: 'https://aps.sn/les-deputes-planchent-sur-un-projet-de-loi-pour-la-protection-des-infrastructures-critiques-et-a-la-securite-numerique/' },
    { id: 75, date: '2026-08-13', category: 'Digital Regulation & Compliance', country: 'Guinea', tier: 'confirmed', platformIntegrity: false,
      headline: "Guinea's ANSSI opens national consultation to overhaul its 2016 cybersecurity and cybercrime law",
      summary: "Guinea's national information-systems security agency (ANSSI), acting on instruction from the Ministry of Communication, Digital Economy and Innovation, held a national consultation workshop in Conakry on 13 August with regulators, telecom operators, media and NGO representatives to review draft legal texts overhauling the country's 2016 cybersecurity and personal-data-protection law. Officials said the decade-old law remains skewed toward cybercrime and has not kept pace with technologies like AI, quantum computing and cryptography, and that the new framework aims to raise accountability for large digital companies operating in Guinea's cyberspace.",
      whyItMatters: "A ground-up rewrite of Guinea's cybersecurity/data-protection statute — still at the consultation stage but worth tracking as it develops, since new accountability obligations aimed at \"large\" digital companies could directly reshape compliance and data-request expectations for major platforms operating in-country.",
      source: 'Agence Guinéenne de Presse (AGP)', url: 'https://agpguinee.com/guinee-lanssi-ouvre-les-consultations-sur-la-revision-du-cadre-juridique-de-la-cybersecurite/' },
    { id: 76, date: '2026-08-13', category: 'Digital Regulation & Compliance', country: "Côte d'Ivoire", tier: 'confirmed', platformIntegrity: false,
      headline: "ARTCI and telecom/ISP operators adopt a harmonized consumer-complaint-handling procedure for electronic communications services",
      summary: "Côte d'Ivoire's telecom/ICT regulator ARTCI held a two-day workshop (13-14 August) in Assinie with mobile operators, internet service providers and consumer associations, validating a single, simplified procedure for handling consumer complaints about electronic communications services. The move implements ARTCI's consumer-protection mandate under the June 2024 electronic-communications law and is meant to serve as the common reference framework for the whole sector going forward.",
      whyItMatters: "A more structured, harmonized complaints regime signals ARTCI is professionalizing consumer-protection enforcement across telecom/ISP services — a regulatory posture worth tracking since it could extend to connectivity or data-service complaints touching the Client's own platform users and operator partners in Côte d'Ivoire.",
      source: 'Fraternité Matin', url: 'https://www.fratmat.info/article/2643946/economie/protection-des-consommateurs-lartci-harmonise-la-procedure-de-traitement-des-plaintes' },
    { id: 77, date: '2026-08-19', category: 'Digital Regulation & Compliance', country: 'Guinea', tier: 'confirmed', platformIntegrity: false,
      headline: "Guinea's President Doumbouya formalizes legal framework for electronic signatures",
      summary: "President Mamadi Doumbouya signed a decree implementing Article 1003 of Guinea's Civil Code, setting out the legal value of electronic signatures and the approval, supervision and security obligations for certification service providers, with the National Agency for State Digitalization (ANDE) named as the approving authority. A companion decree the same week (D-2026/159/PRG/SGG) tasks telecom regulator ARPT with auditing and certifying the compliance of digital-sector information systems handling electronic transactions.",
      whyItMatters: "Formalizing e-signature validity and standing up ANDE/ARPT oversight of digital-transaction systems builds out the compliance infrastructure Guinea will lean on for future data-handling and platform-oversight requirements — worth tracking alongside the ANSSI cybersecurity-law overhaul (id 75) as part of the same broader legal-modernization push relevant to the Client's compliance posture in-country.",
      source: 'Guinée360', url: 'https://www.guinee360.com/19/08/2026/guinee-mamadi-doumbouya-officialise-la-signature-electronique' },
    { id: 78, date: '2026-08-12', category: 'Digital Innovation & Connectivity', country: 'Burkina Faso', tier: 'confirmed', platformIntegrity: false,
      headline: "Burkina Faso and Nigeria launch bilateral digital-sovereignty cooperation on connectivity, AI and cybersecurity",
      summary: "Burkina Faso's Digital Transition Minister Aminata Zerbo/Sabané hosted Nigeria's Communications, Innovation and Digital Economy Minister Bosun Tijani in Ouagadougou on 12 August, agreeing to deepen cooperation on sub-regional connectivity, artificial intelligence, digital public infrastructure, cybersecurity and tech-talent/startup development. The meeting built on discussions the two ministers held in Abuja during the African Union telecom-regulators' conference in July, and both sides framed it as moving from talk toward a concrete roadmap and implementation schedule, with Burkina Faso voicing interest in Nigeria as a route for international internet connectivity.",
      whyItMatters: "A new Burkina Faso-Nigeria digital axis centered partly on connectivity and cybersecurity signals Ouagadougou diversifying its international bandwidth routes and regulatory partnerships — worth tracking for how it could reshape connectivity infrastructure or data-governance/platform-oversight cooperation relevant to the Client's services in Burkina Faso.",
      source: 'Sidwaya', url: 'https://www.sidwaya.info/cooperation-numerique-le-burkina-et-le-nigeria-renforcent-leur-connexion/' },
    { id: 79, date: '2026-08-20', category: 'Politics & Governance', country: 'Cameroon', tier: 'reported', platformIntegrity: false,
      headline: "Paul Biya announced returning to Yaoundé after a record 73-74 day absence abroad",
      summary: "RFI journalist Polycarpe Essomba reported that 92-year-old President Paul Biya, away on a private stay in Europe since 7 June, was due to fly back to Yaoundé on 20 August after roughly 73-74 days — the longest absence of his 43-year presidency. Numerous Cameroonian outlets (237Actu, Camer.be, PanoramaPapers, 237online) republished the RFI report, citing a Boeing 767 departing Geneva; officials framed the return around welcoming home the Lionnes Indomptables, Cameroon's newly-crowned African women's football champions. As of this run the return rests on RFI/press sourcing rather than an official presidency communiqué confirming Biya has landed — worth a direct follow-up next run.",
      whyItMatters: "A record-length presidential absence reviving succession and governance-continuity questions, arriving as voter registration for upcoming elections nears its 30 August close and post-October-2025-election detentions/prosecutions remain unresolved — a governance-stability signal worth monitoring for regulatory-continuity and platform-continuity implications in Cameroon.",
      source: '237Actu (also RFI via republication)', url: 'https://237actu.com/cameroun-le-retour-du-president-paul-biya-annonce-a-yaounde-pour-ce-jeudi/' },
    { id: 80, date: '2026-08-10', reportedDate: '2026-08-21', category: 'Network Disruption & Cybersecurity', country: 'Togo', tier: 'confirmed', platformIntegrity: false,
      headline: "Togo's national CERT warns of ongoing wave of WhatsApp and Facebook account takeovers",
      summary: "CERT.tg (Togo's national cybersecurity incident-response center) issued a high-level alert on 10 August, republished by Icilome on 21 August, describing a months-long surge in hijackings of WhatsApp, Facebook and other online accounts that has continued since a first warning in April. Attackers typically use prior phishing/social-engineering campaigns to obtain credentials, then exploit accounts lacking two-factor authentication to lock out the legitimate owner, swap the linked phone number or email, and enable their own two-factor protection to block recovery. CERT.tg recommends enabling two-step verification, reporting suspicious access to Meta support, checking active sessions, and adding a recovery email.",
      whyItMatters: "A sustained, official-source-documented wave of WhatsApp/Facebook account takeovers is a direct account-security and support-abuse signal for the Client's own platforms in a market with no prior dedicated feed item — worth tracking for volume trends and whether Togolese authorities move from advisory guidance toward a more formal regulatory or law-enforcement response.",
      source: 'Icilome', url: 'https://icilome.com/2026/08/togo-comment-se-proteger-du-piratage-de-comptes-selon-le-cert-tg/' },
    { id: 81, date: '2026-08-20', category: 'Politics & Governance', country: 'Cameroon', tier: 'confirmed', platformIntegrity: false,
      headline: "Paul Biya's return to Yaoundé confirmed after record 73-day absence, resolving prior uncertainty",
      summary: "AFP journalists confirmed President Paul Biya, 93, landed in Yaoundé around 16:00 GMT on 20 August after a 73-day stay in Geneva, ending the longest absence of his 43-year presidency and resolving the still-unconfirmed status flagged in the prior item (id 79). He waved to supporters from his car at the airport, where several dozen ruling-party militants gathered. Opposition figures continued to describe the government as running on \"autopilot,\" citing the still-pending appointment of a new government and vice-president.",
      whyItMatters: "Confirms the head of state is physically back in the country, easing near-term succession-uncertainty risk, but the unresolved government reshuffle and vice-presidential vacancy the absence spotlighted remain open governance-continuity questions relevant to regulatory stability in Cameroon.",
      source: 'France 24 (AFP)', url: 'https://www.france24.com/fr/afrique/20260820-cameroun-le-pr%C3%A9sident-paul-biya-de-retour-apr%C3%A8s-plus-de-deux-mois-d-absence' },
    { id: 82, date: '2026-08-21', category: 'Politics & Governance', country: 'Guinea', tier: 'confirmed', platformIntegrity: false,
      headline: "Guinea's President Doumbouya dismisses Communication/Digital Economy Minister and Labor Minister in anti-corruption purge",
      summary: "President Mamadi Doumbouya signed decrees on 21 August dismissing Mourana Soumah, Minister of Communication, Digital Economy and Innovation, and Mory Condé, Minister of Labor, Employment and Social Protection, along with a presidential culture/tourism advisor, Mahamadou Abdoulaye Diallo. The decrees gave no stated reason, but Doumbouya posted on his official Facebook page that the moves reflect an anti-corruption drive reaching into his own circle, saying \"contre la corruption, ma main ne tremblera pas\" (against corruption, my hand will not shake) and that no rank or proximity to him offers protection. Interim duties pass to each ministry's secretary-general; trade press (Digital Business Africa) has speculated, without confirmation, that ARPT (postal/telecom regulator) Director-General Mamady Doumbouya could be a candidate to fill the vacated digital-economy portfolio.",
      whyItMatters: "Removes the Client's direct ministerial counterpart on communication/digital-economy policy in Guinea with no successor yet named, creating near-term uncertainty over who leads platform- and data-related regulatory engagement in-country — worth a direct follow-up once a replacement is announced.",
      source: 'Guinée360 (also Africactu.net)', url: 'https://www.guinee360.com/21/08/2026/decret-mory-conde-et-mourana-soumah-limoges-par-mamadi-doumbouya' },
    { id: 83, date: '2026-08-20', category: 'Digital Regulation & Compliance', country: 'Senegal', tier: 'confirmed', platformIntegrity: false,
      headline: "Senegal's National Assembly unanimously adopts critical-infrastructure and digital-security law, advancing the bill tracked in committee stage",
      summary: "The National Assembly voted unanimously (127 votes) on 20 August to adopt bill nº25/2026 on protection of Critical Information Infrastructure (IIC) and digital security — the same bill whose committee-stage review on 20 August is already tracked as item 74, now carried through to final floor passage the same day. The Assembly's own statement frames the law as a response to a string of 2025-2026 cyberattacks on state bodies (the tax authority DGID in October 2025, the file-automation directorate DAF in February 2026, the Treasury in May 2026, and the Cour des Comptes in June 2026), and the law covers digital-trust obligations, cryptography oversight, protection of sensitive state data, e-communications, e-transactions and cybercrime.",
      whyItMatters: "Final passage (not just committee review) of a binding legal framework for critical digital infrastructure means the risk-tiered security obligations, incident-notification duties and potential national CERT/SOC oversight described under item 74 are now law rather than pending legislation — a concrete new compliance backdrop for the Client's network and data-security posture in Senegal once implementing decrees follow.",
      source: 'Digital Business Africa', url: 'https://www.digitalbusiness.africa/senegal-adoption-dun-cadre-legal-robuste-contre-la-cybercriminalite/' },
    { id: 84, date: '2026-08-22', category: 'Politics & Governance', country: 'Togo', tier: 'confirmed', platformIntegrity: false,
      headline: "Togo's government issues first public explanation for the month-long detention of two French filmmakers, confirms formal indictment",
      summary: "Interior Minister Calixte Batossie Madjoulba and Justice Minister Pacôme Yawovi Adjourouvi issued a joint communiqué on 22 August giving the government's first detailed public account of the case of two French filmmakers (working for Tony Comiti Productions on the documentary 'Les Routes de l'impossible') and their Togolese collaborator, arrested 27 July in the Binah prefecture. The ministries say the trio's tournage authorization did not cover the localities where they were filming (including Matchatom, where they used an undeclared drone), some of which fall under Togo's security-sensitive state-of-emergency zone in the Savanes region. On 17 August a magistrate opened a judicial inquiry and indicted all three for 'fausses déclarations' (false declarations) under the penal code, issuing detention orders; the government stresses the case concerns administrative/security compliance, not the documentary's editorial content or press freedom.",
      whyItMatters: "A prolonged detention and formal indictment of foreign journalists over a security-zone filming permit dispute signals Togo's government is willing to escalate legally against foreign media even while publicly disclaiming any press-freedom angle — a reputational and diplomatic (France-Togo) watchpoint relevant to how the Client's platforms may carry the resulting coverage and advocacy; still pending before the investigating judge, worth a follow-up as the case proceeds.",
      source: 'Icilome (also Africa Radio)', url: 'https://icilome.com/2026/08/togo-des-indices-graves-et-concordants-selon-le-gouvernement-dans-laffaire-des-journalistes-francais-detenus-et-de-leur-collaborateur-togolais/' },
    { id: 85, date: '2026-08-21', reportedDate: '2026-08-22', category: 'Politics & Governance', country: 'Senegal', tier: 'confirmed', platformIntegrity: false,
      headline: "Opposition coalition FDR files Supreme Court challenge over government's missed deadline to set local-election deposit/date",
      summary: "The Front pour la défense de la démocratie et de la République (FDR), led by new coordinator Modou Diagne Fada, announced at a 21 August press conference that it filed a référé with the Cour suprême that morning, seeking to sanction the government's failure to apply electoral rules. The FDR says the Interior Ministry missed its own regulatory deadline (20 August) to set the candidate-deposit amount for territorial elections after consultation with political actors — a step the coalition first flagged in a March 2026 letter that went unanswered — and calls the resulting inaction a 'de facto postponement' of a vote the FDR calculates must occur by 17 January 2027.",
      whyItMatters: "A court challenge over stalled local-election machinery adds a fresh, concrete flashpoint to the Faye-Sonko era's recurring institutional friction already tracked in this feed, with potential to drive opposition mobilization and grievance content on the Client's platforms as the Cour suprême case and the 17 January 2027 deadline approach — worth a follow-up once the Court rules or the government responds.",
      source: 'Le Quotidien (also Senenews)', url: 'https://lequotidien.sn/date-des-elections-locales-le-fdr-se-refere-a-la-cour-supreme/' },
    { id: 86, date: '2026-08-20', reportedDate: '2026-08-24', category: 'Network Disruption & Cybersecurity', country: 'Cameroon', tier: 'confirmed', platformIntegrity: false,
      headline: "Cameroon confirms 1 September shutdown of non-customs-cleared phones from MTN, Orange and Camtel networks",
      summary: "In a communiqué signed 20 August, Finance Minister Louis Paul Motaze confirmed the final phase of Cameroon's customs-collection reform: from Tuesday 1 September 2026, any phone not cleared through customs will be blocked from the MTN, Orange and Camtel networks. The measure targets devices connecting to a Cameroonian network for the first time after 1 September, devices connected after 1 April 2026 that ignored prior alert messages, and bulk-activated SIM/device pairs not used continuously since April. Trade press Digital Business Africa reported 24 August that mobile operators, telecom regulator ART and Customs have now reached a consensus on enforcement, moving toward the repressive phase.",
      whyItMatters: "A nationwide, government-mandated cutoff of non-cleared devices from all three mobile networks — even though aimed at customs enforcement rather than platform content — will disconnect an unknown volume of subscribers from WhatsApp, Facebook and other Meta services starting 1 September, worth tracking for user-reach and support-volume impact in Cameroon.",
      source: 'Cameroun Actuel (also Digital Business Africa)', url: 'https://camerounactuel.com/cameroun-des-le-1er-septembre-les-telephones-non-dedouanes-seront-coupes-des-reseaux/' },
    { id: 87, date: '2026-08-22', category: 'Digital Regulation & Compliance', country: 'Guinea', tier: 'confirmed', platformIntegrity: false,
      headline: "Guinea's HAC orders private broadcaster Télé 24 to pull a report across all its channels, threatens suspension",
      summary: "Guinea's Haute Autorité de la Communication (HAC) issued a formal mise en demeure to private channel Télé 24 over its 22 August 20h newscast segment covering an official ceremony led by Mory Condé — one of the ministers President Doumbouya dismissed the day before (21 August, tracked as item 82). The HAC said airing the item without accounting for Condé's changed status breached fact-checking and professional-responsibility obligations, ordered the report removed from all of Télé 24's distribution channels immediately upon notification, and warned that non-compliance or repetition could bring an immediate suspension of the channel's programming.",
      whyItMatters: "A binding order to pull content \"across all channels\" under threat of suspension, issued by the same regulator (HAC) that oversees broadcast and digital-communication compliance in Guinea, is a directly relevant precedent for how forcefully HAC is willing to act on takedown demands — worth watching if similar removal requests are ever directed at the Client's platforms.",
      source: 'Guinée360 (also Avenirguinee, Guinée114, Investigatorguinee)', url: 'https://www.guinee360.com/22/08/2026/diffusion-dun-reportage-sur-un-ministre-limoge-tele-24-mise-en-demeure-par-la-hac' },
    { id: 88, date: '2026-08-25', reportedDate: '2026-08-22', category: 'Politics & Governance', country: 'Senegal', tier: 'reported', platformIntegrity: false,
      headline: "Senegal's PM Al Aminou Lô faces Tuesday constitutional deadline for his general policy declaration, still unscheduled",
      summary: "Prime Minister Ahmadou Al Aminou Mohamed Lô, appointed 25 May 2026, faces the Article 55 constitutional deadline of 25 August to deliver his Déclaration de politique générale (DPG) before the National Assembly, and as of 22-24 August press coverage no session had been scheduled — even though Assembly rules require eight days' notice, making an on-time DPG increasingly tight. Commentary (Le Quotidien/Tambacounda.info) drew an explicit parallel to the 2024 standoff when Ousmane Sonko, then PM, delayed his own DPG for months amid a hostile Assembly, resolved only after new legislative elections.",
      whyItMatters: "A missed or contested DPG deadline would be a fresh, concrete flashpoint in the Faye government's recurring institutional friction already tracked in this feed (items 30/32/69/85), with potential to drive political mobilization and grievance content on the Client's platforms; outcome not yet known as of this run — worth a direct follow-up once the Assembly convenes or the deadline passes.",
      source: 'Tambacounda.info (Le Quotidien)', url: 'https://www.tambacounda.info/2026/08/22/dpg-du-premier-ministre-lo-en-ebullition-le-delai-de-3-mois-expire-le-25-aout/' },
    { id: 89, date: '2026-08-20', reportedDate: '2026-08-22', category: 'Digital Innovation & Connectivity', country: 'Burkina Faso', tier: 'confirmed', platformIntegrity: false,
      headline: "Burkina Faso launches three digital platforms to modernize diplomatic and consular services",
      summary: "Burkina Faso's Ministry of Foreign Affairs officially launched three digital platforms on 20 August: a \"Portail de la diaspora burkinabè\" for consular registration and online appointment booking, an \"E-Protocole\" platform for diplomatic-card and airport-lounge access requests by accredited embassies and international organizations, and a centralized web presence unifying the ministry's site with 52 diplomatic-mission and consular-post websites. The launch ceremony was led by Foreign Affairs Minister Karamoko Jean Marie Traoré alongside Digital Transition Minister Aminata Zerbo/Sabane. First Digital Innovation & Connectivity item tracked for Burkina Faso.",
      whyItMatters: "A state push to centralize citizen- and diplomat-facing services into a handful of official digital platforms signals growing government capacity and appetite for digital-services infrastructure in Burkina Faso, a market where the Client's own connectivity and platform footprint could be affected by future data-localization or interoperability requirements modeled on this rollout.",
      source: 'Digital Business Africa', url: 'https://www.digitalbusiness.africa/burkina-faso-3-plateformes-numeriques-lancees-pour-moderniser-les-services-diplomatiques-et-consulaires/' },
    { id: 90, date: '2026-08-23', category: 'Conflict & Security', country: 'DR Congo', tier: 'confirmed', platformIntegrity: false,
      headline: "DRC and AFC/M23 agree a roadmap for Doha peace talks; first ceasefire-verification mission heads to Minembwe",
      summary: "Following talks held 17-21 August in Switzerland with Qatar, the US, Togo (as African Union mediator), the AU Commission and the Swiss government, the DRC government and the AFC/M23 rebel alliance agreed a roadmap and calendar for continuing negotiations under the Doha framework agreement, announced in a joint communiqué on 23 August. The parties also agreed to set up a mechanism to track implementation of their commitments, and a first ceasefire-verification mission was dispatched on 24 August to Minembwe in South Kivu — the same highlands area where fighting has driven the month-long mobile/internet blackout and Starlink-kit seizures already tracked in this feed (id 66).",
      whyItMatters: "A formal roadmap plus an active verification mission into the Minembwe conflict zone is the first concrete de-escalation step in an area where the Client's connectivity and service continuity have already been directly disrupted by fighting; sustained progress could ease the security-driven blackout risk tracked under id 66, while a breakdown would likely extend it.",
      source: 'La Libre (also 7sur7.cd, La DH/Les Sports+, Wakat Séra, KOACI, Congoquotidien)', url: 'https://www.lalibre.be/international/afrique/2026/08/23/la-rdc-et-le-m23-saccordent-sur-une-feuille-de-route-pour-les-negociations-de-paix-HTTLMF26RNFK7K4VU2YSA334GQ/' },
    { id: 91, date: '2026-08-25', category: 'Politics & Governance', country: 'Senegal', tier: 'confirmed', platformIntegrity: false,
      headline: "PM Al Aminou Lô's general policy declaration finally dated for 1 September, past the constitutional three-month deadline",
      summary: "Multiple concordant Senegalese outlets reported on 25 August — the day the Article 55/109 three-month deadline itself expired with no date yet set (id 88) — that PM Ahmadou Al Aminou Lô will now deliver his general policy declaration (DPG) before the National Assembly on 1 September 2026. National Assembly president Ousmane Sonko had renewed his warning at a Touba rally that a censure motion remains on the table against Lô's government if the DPG kept slipping.",
      whyItMatters: "Resolves the open question carried since id 88: a concrete date finally emerges, but only after the constitutional deadline itself lapsed, and with Sonko's censure threat still explicitly attached — keeps the Faye-Sonko institutional rupture (ids 30, 32-34, 38-39, 49, 64, 69) live and worth a direct check once the DPG actually takes place.",
      source: 'Senegal7 (also Senego, Pulse.sn, EnQuête+)', url: 'https://senegal7.com/dpg-al-aminou-lo-face-aux-deputes-ce-1er-septembre-2026/' },
    { id: 92, date: '2026-08-25', category: 'Politics & Governance', country: 'Senegal', tier: 'confirmed', platformIntegrity: false,
      headline: "Constitutional Council rules against the Assembly, declares the crédits spéciaux transparency bill inadmissible",
      summary: "The Constitutional Council ruled on 25 August that the special-funds (crédits spéciaux) transparency bill is inadmissible, siding with PM Al Aminou Lô's government in the dispute flagged when the bill was referred on 18 August (id 70). The Council found the text encroached on matters reserved to executive regulatory power under Articles 67 and 76 of the Constitution, ending the parliamentary procedure before floor debate ever began.",
      whyItMatters: "Resolves the open question carried since id 70: the government's procedural tool worked, blunting a Sonko-aligned transparency measure and confirming the executive's ability to use the Council to head off contested legislation moving through the same Assembly — a precedent worth watching if it recurs against other digital/regulatory bills.",
      source: 'Senego (citing e-media)', url: 'https://senego.com/credits-speciaux-le-conseil-constitutionnel-inflige-un-revers-a-lassemblee-et-donne-raison-au-gouvernement_1996944.html' },
    { id: 93, date: '2026-08-25', category: 'Politics & Governance', country: 'Senegal', tier: 'reported', platformIntegrity: false,
      headline: "Second opposition coalition, Noo Lank, takes local-election date dispute to the Supreme Court; hearing set for 27 August",
      summary: "Distinct from the FDR coalition's own référé already tracked (id 85), the Noo Lank collective separately petitioned the Cour suprême's Chambre administrative for 'mesures utiles' to force the government to fix a date for the long-overdue municipal and departmental elections (last held January 2022). The administrative chamber has docketed a public hearing for Thursday, 27 August at noon; the Interior Minister maintains the President remains within his legal deadline to set the date, so the outcome is unresolved as of this run and worth a direct follow-up after the hearing.",
      whyItMatters: "A second, independent opposition coalition escalating the same unset-local-election-date dispute broadens political pressure on the Faye/Sonko government over electoral-calendar compliance, feeding the same institutional-continuity uncertainty (ids 2, 85) that keeps individual ministries' digital-policy positions provisional for the Client.",
      source: 'EnQuête+', url: 'https://www.enqueteplus.com/content/locales-2027-la-cour-supr%C3%AAme-examine-jeudi-le-recours-de-noo-lank' },
    { id: 94, date: '2026-08-24', category: 'Politics & Governance', country: 'Niger', tier: 'confirmed', platformIntegrity: false,
      headline: "AES confederal parliament formally installed in Niamey, 45 deputies seated for inaugural session",
      summary: "Niger's Prime Minister Ali Mahamane Lamine Zeine presided over the 24 August opening of the Alliance of Sahel States (AES) confederal parliament's inaugural session in Niamey, seating 45 deputies (15 each from Burkina Faso, Mali and Niger). Zeine framed the parliament as the latest institution-building step for the confederation, alongside its unified roughly 5,000-strong security force and the newly capitalized BCID-AES development bank, and noted a confederal TV/radio/news-agency network already taking shape across the three capitals. The session runs in two phases: deputies were installed 24-25 August, with internal rules and confederal business on the agenda 26-29 August.",
      whyItMatters: "A functioning AES legislature is a concrete step toward the bloc treating Mali, Niger and Burkina Faso — all three tracked markets — as a single regulatory and media space, which over time could mean coordinated rather than country-by-country digital-policy or platform-oversight decisions the Client would need to track as one bloc rather than three separate governments.",
      source: 'Maliweb (citing APA)', url: 'https://www.maliweb.net/economie/cooperation/aes-45-deputes-confederaux-installes-a-niamey-3119414.html' },
    { id: 95, date: '2026-08-24', category: 'Politics & Governance', country: 'Mali', tier: 'confirmed', platformIntegrity: false,
      headline: "Mali PM Abdoulaye Maïga received by Algeria's Tebboune, advancing post-crisis diplomatic thaw",
      summary: "Malian Prime Minister Abdoulaye Maïga was received in Algiers on 24 August by Algerian President Abdelmadjid Tebboune during a two-day working visit made at the invitation of Algeria's government chief Sifi Ghrieb, carrying a message from transition President Assimi Goïta that reportedly signaled Goïta's own openness to a future official visit to Algeria. The trip continues a normalization launched since July between Bamako and Algiers following roughly 15 months of severe diplomatic tension, with both sides emphasizing renewed high-level dialogue and security/economic cooperation.",
      whyItMatters: "A thaw with a major regional neighbor removes one source of diplomatic instability around Mali's transition government, a relevant background signal for the operating and regulatory environment the Client navigates in Mali alongside the AMRTP/HAC digital-oversight bodies already tracked here.",
      source: 'Maliweb', url: 'https://www.maliweb.net/politique/mali-algerie-abdoulaye-maiga-recu-par-abdelmadjid-tebboune-vers-une-nouvelle-etape-des-relations-bilaterales-3119420.html' },
    { id: 96, date: '2026-08-24', reportedDate: '2026-08-25', category: 'Conflict & Security', country: 'Mali', tier: 'confirmed', platformIntegrity: false,
      headline: "Region-wide nighttime curfew imposed in Mali's San region after JNIM/FLA attack on army camp",
      summary: "San's regional governor, Col.-Maj. Ousmane Sangaré, imposed a curfew (22:30-06:00, until further notice) across the entire San region — seven cercles and 42 communes near the Burkina Faso border — citing a 'worrying deterioration' in the security situation. The order follows a 9 August JNIM/FLA-claimed assault on the camp of San's 23rd Infantry Regiment (repulsed, according to the army) and coincides with ongoing 'Opération Dougoukoloko' strikes against armed groups southwest of the town.",
      whyItMatters: "A region-wide curfew astride the strategic Bamako-Ségou-Mopti-Burkina Faso corridor confirms the Sahel insurgency's continued reach into central Mali, a relevant country-risk and connectivity-disruption backdrop for the Client's Mali footprint even without a direct platform angle.",
      source: 'La Nouvelle Tribune (also APAnews, Bamako Matin, RFI)', url: 'https://lanouvelletribune.info/2026/08/mali-apres-lattaque-du-9-aout-la-region-de-san-sous-couvre-feu/' },
    { id: 97, date: '2026-08-25', category: 'Platform Integrity', country: 'Senegal', tier: 'confirmed', platformIntegrity: true,
      headline: "Senegalese police announce prosecution over AI-generated fake photo of Tivaouane murder suspect spread on social media",
      summary: "After an AI-generated image purporting to show the suspect in the Tivaouane murder of Ndèye Bigué Sène circulated widely on social media, Senegal's national police issued a formal denial — via a note transmitted to Seneweb — stating no such photo had been released and that legal action would be pursued against those responsible for fabricating and spreading it.",
      whyItMatters: "A prosecution threat over AI-fabricated content spreading through social platforms is a live example of Senegalese authorities treating platform-carried disinformation as a prosecutable offense, relevant to the Client's exposure on content-moderation and takedown-request expectations.",
      source: 'Seneweb', url: 'https://www.seneweb.com/en/news/8/ndeye-bigue-tuee-a-tivaouane-la-police-annonce-des-poursuites-apres-la-diffusion-dune-photo-du-suspect-truquee-avec-lia_n_502467.html' },
    { id: 98, date: '2026-08-22', reportedDate: '2026-08-25', category: 'Conflict & Security', country: 'Mali', tier: 'confirmed', platformIntegrity: false,
      headline: "New armed attacks near Bandiagara empty villages in Mali's Kendé commune",
      summary: "Unidentified armed men attacked Dogani village in the Kendé commune (Bandiagara region, central Mali) on Saturday 22 August, causing casualties and significant property damage; residents said gunmen were present simultaneously in three other villages, forcing people to flee between roughly 17:30 and 19:00. The attacks continue a pattern from the same commune, where four localities were first hit on 28 July, and are steadily emptying villages and hamlets as displaced residents seek refuge in Bandiagara and Ningari towns and, per a separate report, in local schools.",
      whyItMatters: "A worsening, sustained displacement crisis in central Mali's Bandiagara region reinforces the broader Sahel-insurgency backdrop already tracked for Mali (alongside the San curfew, id 96) and is a relevant country-risk and connectivity-disruption signal for the Client's Mali footprint even without a direct platform angle.",
      source: 'Studio Tamani (also Sahelien.com, Afrikinfos-Mali)', url: 'https://www.studiotamani.org/206893-bandiagara-de-nouvelles-attaques-poussent-des-habitants-a-fuir' },
    { id: 99, date: '2026-08-24', category: 'Politics & Governance', country: 'Guinea', tier: 'confirmed', platformIntegrity: false,
      headline: "Doumbouya promulgates law authorizing him to legislate by ordinance through 5 October",
      summary: "Guinean President Mamady Doumbouya promulgated, on Monday 24 August, the law authorizing him to legislate by ordinance on matters normally reserved to parliament, following a Supreme Court opinion issued 20 August and the National Assembly's unanimous 3 August vote in extraordinary session. The authorization runs until 5 October 2026, covering the parliamentary recess, and lets the president take measures by decree that would otherwise require a full legislative debate. Multi-sourced (Africa Guinée, Guinée360, Guinée7, Guinée114, Le Révélateur224).",
      whyItMatters: "Ordinance powers let Doumbouya bypass parliamentary debate on any matter through early October, including telecom/digital-oversight questions that would normally go through the National Assembly — a regulatory-continuity and predictability factor worth watching for any digital-regulation or platform-oversight action taken by decree during this window.",
      source: 'Africa Guinée', url: 'https://www.africaguinee.com/guinee-mamadi-doumbouya-promulgue-la-loi-lhabilitant-a-legiferer-par-ordonnance/' },
    { id: 100, date: '2026-08-25', category: 'Politics & Governance', country: 'Niger', tier: 'confirmed', platformIntegrity: false,
      headline: "AES confederal parliament adopts rules of procedure, creates defense/security, diplomacy and development commissions",
      summary: "Meeting in Niamey on 25 August, a day after its inaugural session (id 94), the AES confederal parliament adopted the internal rules of procedure governing its confederal sessions and formally installed three standing commissions covering defense and security, diplomacy, and development. The rules will govern the parliament's ordinary session running 26-29 August.",
      whyItMatters: "A working committee structure and adopted rules of procedure, one day after the parliament's own installation, shows the AES bloc moving quickly from symbolic institution-building to functioning governance — reinforcing the case (flagged at id 94) that Mali, Niger and Burkina Faso may increasingly act as a single regulatory and media space the Client needs to track collectively.",
      source: 'Agence Nigérienne de Presse', url: 'https://anp.ne/session-du-parlement-confederal-aes-le-reglement-interieur-de-linstitution-adopte-et-les-differentes-commissions-installees/' },
    { id: 101, date: '2026-08-23', category: 'Conflict & Security', country: 'Mali', tier: 'confirmed', platformIntegrity: false,
      headline: "FLA frees 22 Malian soldiers in prisoner exchange near Anéfis, continuing August release pattern",
      summary: "Twenty-two Malian soldiers held by Tuareg rebels of the Front de Libération de l'Azawad (FLA) were freed on Sunday 23 August at Anéfis in northern Mali, in exchange for nine fighters linked to the movement. The exchange brings the total number of Malian soldiers released since 13 August to roughly 110, continuing a run of prisoner releases distinct from the JNIM/FLA jihadist violence tracked elsewhere in Mali (ids 96, 98). Multi-sourced (KOACI, Maliweb, TRT Afrika, Africa Radio).",
      whyItMatters: "A sustained, multi-week prisoner-exchange track with the FLA is a modest de-escalation signal in the separate northern Tuareg/Azawad conflict track, a relevant country-risk and security backdrop for the Client's Mali footprint even without a direct platform angle.",
      source: 'KOACI', url: 'https://www.koaci.com/article/2026/08/24/mali/politique/mali-22-militaires-liberes-par-le-fla-lors-dun-echange-de-prisonniers_199819.html' },
    { id: 102, date: '2026-08-24', category: 'Politics & Governance', country: 'DR Congo', tier: 'confirmed', platformIntegrity: false,
      headline: "Kinshasa arrest of pro-democracy activist Marley Vuvu draws opposition backlash",
      summary: "Marley Vuvu, coordinator of the Mouvement Révolutionnaire Congolais and a member of the C64 opposition platform, was arrested at his home in Kinshasa on Monday 24 August and taken into custody, with no official grounds given as of this run. Opposition figures — including former National Assembly president Olivier Kamitatu and Ensemble pour la République's Salomon Idi Kalonda Dela — publicly condemned the arrest as a troubling signal for civic space in DRC's already-fragile political climate. Multi-sourced (Actualite.cd, Mediacongo.net); motives and any charges remain unconfirmed as of this run.",
      whyItMatters: "An unexplained arrest of a pro-democracy activist that immediately draws cross-opposition condemnation is a fresh test of DRC's civic-space climate, worth watching for any social-media-organizing or platform-takedown dimension as the case develops.",
      source: 'Actualite.cd (also Mediacongo.net)', url: 'https://actualite.cd/2026/08/25/kinshasa-lopposant-marley-vuvu-arrete-kamitatu-et-salomon-sindignent' },
    { id: 103, date: '2026-08-25', category: 'Politics & Governance', country: 'Senegal', tier: 'confirmed', platformIntegrity: false,
      headline: "PM Al Amine Lô's general policy statement finally dated for 1 September, after deadline lapsed with no date set",
      summary: "Prime Minister Ahmadou Al Amine Lô will deliver his long-awaited Déclaration de Politique Générale before the National Assembly on Tuesday 1 September 2026 at 9am, per multiple outlets citing the Assembly's own communication. The address — his first major appearance before deputies since taking office on 25 May — will lay out his government's economic priorities and policy roadmap, and comes about a week after the self-imposed 25 August deadline (tracked at id 88) passed without any date being announced.",
      whyItMatters: "Resolves a carried-forward open question and puts a concrete date on the institutional moment that will publicly test PM Lô's standing amid the ongoing Sonko-Faye rupture — any signal on digital-economy or platform-oversight priorities in the address is worth a direct follow-up after 1 September.",
      source: 'Dakaractu (also Rewmi, Xibaaru, Pulse.sn)', url: 'https://www.dakaractu.com/Declaration-de-Politique-Generale-Le-premier-ministre-Al-Aminou-Lo-face-aux-deputes-le-1er-septembre-2026_a275371.html' },
    { id: 104, date: '2026-08-24', reportedDate: '2026-08-25', category: 'Conflict & Security', country: 'Guinea', tier: 'confirmed', platformIntegrity: false,
      headline: "Six bound, blindfolded bodies found in mass grave near Forécariah, Guinea",
      summary: "Young people gathering firewood near Sabakhouré village in Forécariah prefecture's Allassoyah sub-prefecture discovered a mass grave containing six unidentified male bodies, all blindfolded and with hands bound, on 24 August. Local authorities and the Forécariah prosecutor's office exhumed the remains for examination at Forécariah hospital; as of this run the victims' identities, the circumstances of death and any suspects remain unknown, and multiple outlets noted the government's official silence on the case.",
      whyItMatters: "An unresolved multiple-killing this close to Forécariah — a prefecture already flagged for land and livelihood grievances along the Simandou rail corridor — is a fresh country-risk data point for Guinea worth monitoring for any escalation or platform-related angle (viral speculation, online rumor) as the investigation develops.",
      source: 'AGP Guinée (also Guinée7, Dakaractu, Mediaguinée)', url: 'https://agpguinee.com/forecariah-six-corps-non-identifies-decouverts-enfouis-dans-une-fosse-commune-a-allassoyah/' },
    { id: 105, date: '2026-08-25', category: 'Politics & Governance', country: 'Togo', tier: 'confirmed', platformIntegrity: false,
      headline: "One of two detained French filmmakers released from Togolese custody on medical grounds",
      summary: "Sebastian Perez Pezzani, one of two French documentary filmmakers arrested in northern Togo on 27 July while shooting an episode of France Télévisions' 'Les Routes de l'impossible,' was released under judicial supervision and hospitalized after his lawyer argued his health required care unavailable in Togo; his passport was confiscated and the false-declaration charges tied to alleged undeclared drone use remain in place. Co-director Gaël Mocaër and their Togolese fixer Fred Vedomey remain in pre-trial detention.",
      whyItMatters: "A partial, health-driven release eases but doesn't resolve the diplomatic irritant this case has become between Paris and Lomé (tracked since id 84) — worth watching for whether Mocaër and Vedomey see similar movement, and for any spillover into Togo's broader posture on foreign press access.",
      source: 'Africa Radio (also Bénin Web TV)', url: 'https://www.africaradio.com/actualite-116096-togo-un-des-realisateurs-francais-arretes-libere-sous-controle-judiciaire' },
    { id: 106, date: '2026-08-21', reportedDate: '2026-08-22', category: 'Business & Economy', country: 'Niger', tier: 'confirmed', platformIntegrity: false,
      headline: "Niger hands former Orano uranium permit to new state company amid mounting foreign-operator disputes",
      summary: "Niger's Council of Ministers awarded the In Azaoua uranium permit near Arlit to a newly created state company, Tsumco, formalizing state control over ground previously mined by Orano-linked Société des Mines de l'Aïr (SOMAÏR). The move extends Niamey's push to nationalize its uranium sector, which has already produced international arbitration claims from both Orano and Canadian miner GoviEx over earlier licence revocations.",
      whyItMatters: "Confirms a hardening, assertive pattern of Nigerien resource-sector state control that echoes similar equity/permit moves already tracked in Mali's mining sector — a useful comparative data point on how AES-bloc governments are treating foreign extractive operators generally, relevant background for the Client's own regulatory-continuity assessments in the region.",
      source: 'Mining.com (also Bloomberg, Ecofin Agency)', url: 'https://www.mining.com/web/niger-awards-former-orano-operated-uranium-mine-to-state-company/' },
    { id: 107, date: '2026-08-24', category: 'Conflict & Security', country: 'Guinea', tier: 'confirmed', platformIntegrity: false,
      headline: "Doumbouya orders dismissal of 173 soldiers for desertion, including a former coup-unit officer",
      summary: "Guinean President Mamadi Doumbouya ordered the discharge of 173 military and gendarmerie personnel for desertion in a decree announced on state television on 24 August, citing Articles 24-25 of the military's general statute. The list spans several units, including the Special Forces Grouping (GFS) that helped Doumbouya overthrow President Alpha Condé in September 2021 — among those cut is GFS commander Michel Lamah.",
      whyItMatters: "A mass dismissal reaching into the same special-forces unit that brought Doumbouya to power reads as a loyalty-consolidation move inside the security apparatus underpinning his rule — a political-continuity signal worth tracking alongside his other recent moves (the ordinance-power law, id 99) as Guinea heads deeper into the post-transition period.",
      source: "Guinée360 (also L'Indépendant, Burkina24, Xalaat TV)", url: 'https://www.guinee360.com/24/08/2026/armee-guineenne-la-liste-des-173-militaires-radies-pour-desertion/' },
    { id: 108, date: '2026-08-24', category: 'Digital Innovation & Connectivity', country: "Côte d'Ivoire", tier: 'confirmed', platformIntegrity: false,
      headline: "Côte d'Ivoire advances $68M rural-connectivity push covering 575 localities",
      summary: "Ivorian authorities highlighted continued progress on the National Rural Connectivity Program (PNCR), a roughly 38 billion FCFA (~$68M) initiative deploying radio sites to bring mobile and internet access to 575 underserved localities, with an earlier 175-locality phase already completed. The program sits inside a broader 2026-2030 national development plan targeting 100% 4G territorial coverage and lifting internet penetration from 40.7% to 60% by 2030.",

    { id: 109, date: '2026-08-26', category: 'Politics & Governance', country: 'Senegal', tier: 'confirmed', platformIntegrity: false,
      headline: "PASTEF formally petitions Interior Minister and CENA over stalled territorial-election calendar",
      summary: "PASTEF-Les Patriotes' Bureau Politique National asked Senegal's Interior Minister to trigger the territorial (departmental/municipal) election process, copying President Faye and the CENA, in a communiqué dated 26 August 2026. The party said the election-date decree and the candidacy-deposit order (legally due by 26 August under Electoral Code articles L.247/L.282) have both been missed, and that the last legally possible date for the vote is 17 January 2027. It warned it would use 'all republican and judicial channels' to enforce the calendar.",

    { id: 110, date: '2026-08-25', reportedDate: '2026-08-26', category: 'Politics & Governance', country: 'Senegal', tier: 'confirmed', platformIntegrity: false,
      headline: "Constitutional Council strikes down parliamentary majority's bill regulating Senegal's special funds",
      summary: "Senegal's Conseil constitutionnel (Decision no. 7/C/2026, 25 August 2026) declared inadmissible a parliamentary-majority bill (no. 36/26) that would have set a legal regime for government 'special funds' (fonds speciaux/credits speciaux), ruling that parts of it encroached on regulatory power reserved to the executive and on matters reserved to organic law under Article 67. The government itself had challenged the bill's admissibility on 18 August, after it passed committee but before a plenary vote.",
      whyItMatters: "Blocks, at least in its current form, the special-funds oversight push tied to the Assembly's own extraordinary session (id 103) — a concrete setback for parliamentary transparency measures and a fresh sign the Faye government is using constitutional review to contain legislative initiatives it opposes, worth tracking alongside the still-pending patrimoine-declaration bill.",

    { id: 111, date: '2026-08-27', category: 'Business & Economy', country: 'Senegal', tier: 'confirmed', platformIntegrity: false,
      headline: "Wärtsilä to supply 14MW captive power plant for Fortuna Mining's $1bn Diamba Sud gold project",
      summary: "Technology group Wärtsilä will supply five Wärtsilä 32 engines for a 14MW captive power plant at Canadian miner Fortuna Mining's Diamba Sud Gold Project in Senegal, needed to ensure reliable electricity supply given the mine's remote location. Fortuna's own project studies put Diamba Sud's total investment near US$1 billion, with the company expecting a final permit within weeks.",
      whyItMatters: "A roughly $1bn foreign-backed gold project reaching the power-infrastructure buildout stage is a concrete data point on Senegal's mining-investment climate and the kind of major-investment activity the Client tracks for competitive/business-landscape context, independent of any platform-policy angle.",

    { id: 112, date: '2026-08-26', category: 'Network Disruption & Cybersecurity', country: "Côte d'Ivoire", tier: 'confirmed', platformIntegrity: false,
      headline: "Côte d'Ivoire's ANSSI/CI-CERT takes part in APCERT Cyber Drill 2026 incident-response exercise",
      summary: "Côte d'Ivoire's national cybersecurity agency (ANSSI), through CI-CERT, took part on 26 August 2026 in the APCERT Cyber Drill 2026, a five-hour online international exercise themed 'Incident Response: RMM-related Compromise' that brought together 23 CSIRTs from 18 APCERT member economies plus external participants including CI-CERT (via AfricaCERT/OIC-CERT cooperation). Teams worked through simulated scenarios including SQL injection attacks.",

    { id: 113, date: '2026-08-25', category: 'Politics & Governance', country: "Côte d'Ivoire", tier: 'confirmed', platformIntegrity: false,
      headline: "Côte d'Ivoire and Mali adopt definitive border tracé after week-long expert talks in Bamako",
      summary: "Ivorian and Malian border experts, meeting in Bamako from 21-25 August 2026, adopted by mutual agreement the definitive tracé of their shared border along with a draft delimitation treaty and the reference framework for future demarcation and boundary-marker installation. The talks followed an April 2026 technical reconnaissance mission in the Pogo (Côte d'Ivoire) and Zégoua (Mali) border zone, where some sections had been subject to diverging interpretations. Official signature of the delimitation treaty by both governments is the next step.",
      whyItMatters: "Resolving a previously ambiguous shared border reduces a latent source of local friction and is a positive regional-diplomacy signal for both Meta-tracked countries, relevant to Politics & Governance continuity and cross-border security context.",
      source: 'AIP (Agence Ivoirienne de Presse, also Mali Actu, Africtelegraph)', url: 'https://www.aip.ci/cote-divoire-aip-frontiere-cote-divoire-mali-le-trace-definitif-adopte-avant-la-signature-dun-traite-de-delimitation/' },
    { id: 114, date: '2026-08-24', category: 'Politics & Governance', country: 'Mali', tier: 'confirmed', platformIntegrity: false,
      headline: "Mali PM Abdoulaye Maïga visits Algiers, meets Tebboune, sealing Mali-Algeria reconciliation",
      summary: "Malian Prime Minister Abdoulaye Maïga was received by Algerian President Abdelmadjid Tebboune in Algiers on 24 August 2026, carrying a message from President Assimi Goïta, in what multiple outlets described as sealing a reconciliation after roughly three years of diplomatic tension. Maïga said the two countries were \"condemned to walk together, condemned to work toward prosperity for both peoples.\" This is the actual visit following the announced invitation tracked at id 95.",

    { id: 115, date: '2026-08-26', category: 'Politics & Governance', country: 'Senegal', tier: 'reported', platformIntegrity: false,
      headline: "Government dismisses PASTEF's electoral-calendar petition, points to likely December Assembly dissolution",
      summary: "Responding to PASTEF's formal petition to the Interior Minister and CENA (tracked at id 109) demanding the electoral process be triggered on schedule, SN HLM director-general Abdourahmane Dabo said the move would \"change absolutely nothing\" about the legality of the ongoing process. Dabo placed the dispute in the context of what he described as a very high probability that the National Assembly will be dissolved on 2 December, which would trigger early legislative elections within 66 days (around February), while still expecting the 17 January territorial elections to proceed.",
      whyItMatters: "The first substantive government-side response to id 109's petition, and a notable public forecast of an Assembly dissolution and early legislative elections — a governance-continuity signal worth tracking through year-end.",
      source: 'Dakaractu', url: 'https://www.dakaractu.com/Saisine-de-Pastef-sur-le-calendrier-electoral-ca-ne-changera-strictement-rien--selon-Abdourahmane-Dabo-DG-de-SN-HLM_a275392.html' },
    { id: 116, date: '2026-08-26', category: 'Conflict & Security', country: 'Guinea', tier: 'reported', platformIntegrity: false,
      headline: "TLP-Guinée coalition demands independent, UN-backed probe into Forécariah mass grave",
      summary: "Civil-society coalition TLP-Guinée called for an independent, transparent and forensically-supported investigation into the six bound bodies found in a mass grave near Forécariah on 24 August 2026 (tracked at id 104/Rio Tinto id 9), and appealed to the UN, Amnesty International, Human Rights Watch and FIDH to help ensure accountability. Local sources noted a separate mass grave with four bodies was found in the same prefecture in October of the prior year, suggesting a recurring pattern rather than an isolated incident.",

      source: 'Avenir Guinée (also allAfrica, AGP Guinée)', url: 'https://www.avenirguinee.org/2026/08/26/forecariah-decouverte-de-six-corps-ligotes-tlp-guinee-exige-une-enquete-independante/' },
    { id: 117, date: '2026-08-20', reportedDate: '2026-08-24', category: 'Digital Regulation & Compliance', country: 'Cameroon', tier: 'confirmed', platformIntegrity: false,
      headline: "Cameroon to block uncustomed phones from networks starting 1 September",
      summary: "Cameroon's Finance Ministry confirmed that mobile phones and other devices not cleared through customs will be blocked from connecting to local telecom networks starting 1 September 2026, enforcing an IMEI-based device-registration mechanism tied to the 2023 finance law's import duties on mobile terminals. The measure follows an earlier, unenforced May 2026 ultimatum to MTN, Orange and Camtel to begin blocking devices, and authorities say roughly 700,000 unregistered devices have already been flagged. Multi-sourced across Cameroonian and regional business press.",
      whyItMatters: "A mass, government-mandated blocking of hundreds of thousands of devices from network access is a significant connectivity-disruption event even though it is customs- rather than security-driven, and is worth monitoring for enforcement slippage given the May 2026 ultimatum's earlier failure to materialize.",
      source: 'Agence Ecofin (also Investir au Cameroun, allAfrica, Burkina24)', url: 'https://www.agenceecofin.com/actualites-numerique/2608-141030-cameroun-les-telephones-non-dedouanes-bloques-des-le-1er-septembre-ministre' },
    { id: 118, date: '2026-08-24', category: 'Digital Innovation & Connectivity', country: "Côte d'Ivoire", tier: 'confirmed', platformIntegrity: false,
      headline: "Côte d'Ivoire advances $68M rural connectivity program, 575 localities targeted",
      summary: "Côte d'Ivoire's government detailed progress on its National Rural Connectivity Program (PNCR), a roughly 38bn-FCFA (~$68M) initiative to bring mobile and internet access to 575 underserved localities via new radio sites. A first phase (10bn FCFA) completed in 2024 covered 175 localities and about 221,000 residents; the program's second and third phases (28bn FCFA combined) are underway, part of a broader 2026-2030 plan targeting 100% 4G coverage and 60% internet penetration by 2030.",
      whyItMatters: "A concrete, funded rural-connectivity build-out is a positive Digital Innovation & Connectivity signal for the Client's West African footprint, expanding the addressable user base and infrastructure baseline in a country without its own dedicated monitoring feed.",

    { id: 119, date: '2026-08-25', reportedDate: '2026-08-27', category: 'Platform Integrity', country: 'Senegal', tier: 'confirmed', platformIntegrity: true,
      headline: "Keur Massar gang leader who taunted security forces on TikTok arrested",
      summary: "Senegal's gendarmerie Brigade de Recherches arrested a gang leader on 25 August 2026 accused of a string of assaults around wrestling matches in the Keur Massar area, after he had posted TikTok videos directly threatening the officers pursuing him. Investigators traced him following a 24-25 August assault near a Keur Massar filling station; machetes and drug residue were reportedly found at his home during the arrest. Multi-sourced across Senegalese outlets.",
      whyItMatters: "A named-platform case where TikTok content was itself part of a criminal investigation and public taunting of security forces is a direct Platform Integrity data point, illustrating how platforms are used both to evade and provoke law enforcement in Senegal.",

    { id: 120, date: '2026-08-26', category: 'Business & Economy', country: 'Togo', tier: 'confirmed', platformIntegrity: false,
      headline: "Togo dissolves free-zone authority SAZOF, transfers functions to API-ZF",
      summary: "Togo's Council of Ministers approved a 26 August 2026 decree dissolving the Société d'Administration de la Zone Franche (SAZOF, created in 1994) and transferring its functions, staff, assets and liabilities to the Agence de Promotion des Investissements et de la Zone Franche (API-ZF), alongside a reform of the investment-approval committee under the 2019 Investment Code. The government frames the merger as simplifying procedures and strengthening a single institution to drive investment promotion; SAZOF had approved 141 free-zone enterprises (91 still active), representing roughly 7% of GDP in 2024.",
      whyItMatters: "An institutional consolidation of Togo's investment-approval and free-zone apparatus is a Business & Economy signal worth tracking for how it reshapes the regulatory path for foreign investors and platform-adjacent business licensing going forward.",
      source: 'Togo First (also La Cinquième, Icilome, Togoactualité)', url: 'https://www.togofirst.com/fr/gouvernance-economique/1203-18447-zone-franche-au-togo-le-gouvernement-acte-la-dissolution-de-la-sazof-au-profit-de-l-api-zf' },
    { id: 121, date: '2026-08-27', category: 'Politics & Governance', country: 'Senegal', tier: 'confirmed', platformIntegrity: false,
      headline: "Cour suprême rejects Ñoo Lank's bid to force an immediate electoral-calendar decree",
      summary: "Senegal's Cour suprême rejected, on 27 August 2026, the 'référé mesures utiles' filed by Ñoo Lank collective secretary-general Seydina Mouhamadou Malal Diallo, which had asked the court to order the presidency to fix by decree a departmental/municipal election date before 25 August 2026. The court found the urgency condition unmet and held that the fifth year of councillors' mandates need not run strictly from 23 January 2026 to 23 January 2027, leaving the government free to set the date later within that fifth year. Ñoo Lank's leadership said afterward that the legal battle is lost but the political one continues.",
      whyItMatters: "Resolves the pending outcome flagged under item 93: the ruling removes the near-term legal pressure on Faye/Lô to fix a local-election date immediately, but the collective's vow to keep contesting the calendar politically keeps this an active governance-continuity watch item.",
      source: 'Xibaaru (also Seneweb, DakarActu)', url: 'https://xibaaru.sn/elections-territoriales-la-cour-supreme-rejette-la-requete-du-collectif-noo-lank/' },
    { id: 122, date: '2026-08-27', category: 'Politics & Governance', country: 'Mali', tier: 'confirmed', platformIntegrity: false,
      headline: "Mali and Côte d'Ivoire agree on definitive common border line, move to physical demarcation",

    { id: 123, date: '2026-08-27', category: 'Conflict & Security', country: 'Guinea', tier: 'confirmed', platformIntegrity: false,
      headline: "France calls for independent, transparent probe into Forécariah mass grave",
      summary: "France publicly requested on 27 August 2026 that Guinean authorities conduct an independent and transparent investigation into the six bound bodies found in a mass grave near Forécariah on 24 August, per reporting picked up from Sudouest.fr. Guinean opposition figures (Faya Millimono, deputy Abdoulaye Kourouma) separately renewed their own calls the same day for an independent inquiry and for the Justice Minister to be questioned. The victims' identities and motive remain unknown.",
      whyItMatters: "A foreign government now publicly weighing in alongside domestic opposition figures escalates international attention on an unresolved case in a rail-corridor prefecture already on Rio Tinto's own community-risk watch list (see items 104/116), raising the profile of Guinea's handling of the investigation.",
